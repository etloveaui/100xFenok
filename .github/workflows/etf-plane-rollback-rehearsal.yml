# Manual-only rehearsal of the stockanalysis-etf-detail pointer rollback.
#
# It exists because the rollback path had no hosted entry point: the offline
# contract covers refuse-before-write and zero object writes, but nothing had
# exercised the transaction against the live coordinator. Pre-cutover the Cloud
# pointer is shadow and static is authority, so this is inert to serving — which
# is exactly why it is worth proving now rather than when it is load-bearing.
#
# Rollback is pointer-authority only: it validates the previous manifest and
# every payload that manifest names, then moves the coordinator ledger and
# pointer. Zero object writes, zero deletes, and it refuses with
# ROLLBACK_TARGET_MISSING before any write when there is no previous generation.

name: ETF Plane Rollback Rehearsal

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'INSPECT reads the pointer and writes nothing. ROLLBACK moves it.'
        required: true
        type: choice
        default: INSPECT
        options:
          - INSPECT
          - ROLLBACK
      confirm:
        description: 'Required for ROLLBACK only: type ROLLBACK to confirm.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Read-only pointer inspection through the existing live-route reader, which
  # asks the coordinator for the pointer and nothing else.
  inspect:
    if: github.event.inputs.operation == 'INSPECT'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read the live pointer
        env:
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/dev-cloud-data-plane-route-live.mjs --family stockanalysis-etf-detail

  rollback:
    # Both the operation and a typed confirmation. A typo cannot move a
    # production pointer.
    if: github.event.inputs.operation == 'ROLLBACK' && github.event.inputs.confirm == 'ROLLBACK'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The publisher's own group, so this queues behind a publish instead of
    # racing or cancelling one.
    concurrency:
      group: stockanalysis-etf-detail-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Roll the stockanalysis-etf-detail pointer back one generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/publish-cloud-data-generation.mjs --family=stockanalysis-etf-detail --rollback --json
