# FENO RIM v2 reconstruction suites.
#
# Why this exists as its own lane: the v2 suites had no CI coverage at all,
# and three of their test files went missing from the repo for a week without
# anything failing - the lane that referenced them was never run by any
# workflow. Local-only green is not evidence.
#
# Why it is not inside the deploy build: these are research suites for an
# engine whose public surface is quarantined (DEC-289). A research failure
# must not block a production deploy today. Owner ruling 2026-08-06: promote
# this to a required check only before RIM publication resumes.
#
# Data-only bot commits DO trigger this on purpose. The suites read committed
# data - panels, trackers, payout history, rates, ERP snapshots - so a fetch
# lane changing that data can break them, and that is exactly the signal this
# workflow exists to deliver.
#
# The pre-quarantine engine's suites (yoo-panel-engine, rule-calibration,
# calibration-receipt, identification-protocol, sustainable-index-ranges) are
# NOT included: they are 6.3s of the 7s full lane and answer a different
# question. Run them locally via qa:rim-sustainable-research.
name: QA RIM v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/feno-rim-v2/**'
      - 'scripts/test-feno-rim-v2-*.mjs'
      - 'scripts/fetch-yf-finance.py'
      - 'data/computed/feno-rim-v2/**'
      - 'data/computed/fenok-rim/payout-history.json'
      - 'data/yf/finance/*.unadjusted.json'
      - 'data/damodaran/**'
      - 'data/benchmarks/**'
      - 'data/macro/fred-banking-daily.json'
      - 'docs/planning/CONTRACT_fenok_rim_core_erp_*.md'
      - '100xfenok-next/package.json'
      - '.github/workflows/qa-rim-v2.yml'
  pull_request:
    paths:
      - 'scripts/feno-rim-v2/**'
      - 'scripts/test-feno-rim-v2-*.mjs'
      - 'scripts/fetch-yf-finance.py'
      - 'data/computed/feno-rim-v2/**'
      - 'data/computed/fenok-rim/payout-history.json'
      - 'data/yf/finance/*.unadjusted.json'
      - 'data/damodaran/**'
      - 'data/benchmarks/**'
      - 'data/macro/fred-banking-daily.json'
      - 'docs/planning/CONTRACT_fenok_rim_core_erp_*.md'
      - '100xfenok-next/package.json'
      - '.github/workflows/qa-rim-v2.yml'
  # Fallback so a week of bot commits that never touch the paths above still
  # proves the suites run against current data.
  schedule:
    # UTC 20:40 = KST 05:40, after the overnight fetch lanes settle.
    - cron: '40 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-rim-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-rim-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: every v2 suite runs on Node built-ins only. If that
      # ever stops being true this step fails loudly rather than silently
      # picking up a stale node_modules.
      - name: Run the v2 suites
        run: npm --prefix 100xfenok-next run qa:rim-v2

      # The suites are read-only by contract. A dirty tree here means one of
      # them wrote an artifact, which would make CI green depend on committing
      # its own output.
      - name: Prove the suites wrote nothing
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL the v2 suites modified the working tree:" >&2
            git status --porcelain >&2
            exit 1
          fi
          echo "PASS the v2 suites left the tree clean"
