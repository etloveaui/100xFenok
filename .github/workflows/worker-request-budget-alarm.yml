name: Worker Request Budget Alarm
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 worker-request-budget-alarm.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '17 2,14 * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write
  # Liveness asks GitHub whether the alarm ran, rather than trusting a stamp
  # the alarm only advances when the incident changes.
  actions: read

concurrency:
  group: worker-request-budget-alarm
  cancel-in-progress: false

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs worker-request-budget-alarm.yml

  check:
    needs: clock-admission
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Who observes the observer. The pipeline alarm excludes itself from its
      # own watch list to avoid recursion, so if it stops running nothing says
      # so and every other detector's silence goes with it. Hosted here because
      # this workflow is hourly, independent of the alarm, and already owns an
      # issue-reporting path.
      #
      # This first read the generated_at stamp the alarm persists, on the stated
      # premise that every run writes it. Measured, that was false: the emitter
      # writes the prior document back unchanged when no significant key moved,
      # so 51 of 299 gaps (17.1%) exceeded the old 3h ceiling and the worst ran
      # 23.8h while the alarm succeeded 21 times inside it. It now counts the
      # alarm's own missed scheduled slots instead - the same rule the alarm
      # applies to the detectors it watches.
      #
      # Limitation, stated rather than hidden: if BOTH hourly schedules are
      # dropped at once, as happened on 2026-08-21, this is silent too.
      - name: Check pipeline alarm liveness
        id: alarm_liveness
        continue-on-error: true
        env:
          # Required. GITHUB_TOKEN is not a default runner variable, and without
          # it the check cannot read the alarm's run history, returns
          # "unreadable", and exits 1 - which would fire the surfacing step below
          # with a message that is false.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ops/check-alarm-liveness.mjs

      # A tolerated check whose failure reaches nothing is the exact shape that
      # hid the SEC 13F smoke for four days, so this one surfaces itself.
      #
      # Stale and unreadable are surfaced separately on purpose. Collapsing them
      # is the same defect this program keeps finding - one signal covering two
      # fault classes - and here the wrong half would assert the alarm is dead
      # when in fact this check could not measure it. Exit 2 is stale, exit 1 is
      # unreadable; the step outcome alone cannot tell them apart, so the state
      # is re-read from the JSON the check printed.
      - name: Surface a stale or unmeasurable pipeline alarm
        if: steps.alarm_liveness.outcome == 'failure'
        run: |
          set -euo pipefail
          state="$(node scripts/ops/check-alarm-liveness.mjs 2>/dev/null | tail -1 || true)"
          case "$state" in
            *'"status":"stale"'*)
              echo "::error::the pipeline alarm has not run recently; every other detector's silence is currently invisible: ${state}" >&2
              ;;
            *)
              echo "::error::pipeline alarm liveness could not be measured, which is a fault in this check rather than evidence about the alarm: ${state:-no output}" >&2
              ;;
          esac
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check Worker request budget
        id: budget
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_NAME: ${{ vars.CLOUDFLARE_ACCOUNT_NAME }}
          DAILY_REQUEST_THRESHOLD: '50000'
          HOURLY_REQUEST_THRESHOLD: '20000'
          WORKER_REQUEST_BUDGET_RESULT: worker-request-budget-result.json
          WORKER_SCRIPT_NAME: 100xfenok
        run: node scripts/ops/check-worker-request-budget.mjs

      - name: Synchronize budget incident and recovery
        if: ${{ !cancelled() && (steps.budget.outcome == 'success' || steps.budget.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/sync-budget-issue.mjs worker-request-budget-result.json

  data-supply-analytics:
    needs: clock-admission
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' && ((github.event_name == 'workflow_dispatch' && inputs.external_clock == '') || github.event.schedule == '17 2,14 * * *') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check ETF typed-unavailable telemetry budget
        id: telemetry
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_NAME: ${{ vars.CLOUDFLARE_ACCOUNT_NAME }}
          DATA_SUPPLY_ANALYTICS_DAILY_THRESHOLD: '80000'
          DATA_SUPPLY_ANALYTICS_DATASET: fenok_data_supply_unavailable
          DATA_SUPPLY_ANALYTICS_RESULT: data-supply-analytics-result.json
        run: node scripts/ops/check-data-supply-etf-telemetry-budget.mjs

      - name: Synchronize telemetry incident and recovery
        if: ${{ !cancelled() && (steps.telemetry.outcome == 'success' || steps.telemetry.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/sync-budget-issue.mjs data-supply-analytics-result.json

      # The run's conclusion is alarm-machinery health, not incident state: an
      # exceeded budget is reported through the OPS issues above, and this run
      # stays green as long as that reporting succeeded. Red is reserved for a
      # genuine issue preparation/API failure — the synchronization steps are NOT
      # continue-on-error. No deliberate exit 1 here.
