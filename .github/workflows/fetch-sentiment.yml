name: Fetch Sentiment Data
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-sentiment.yml {0}', inputs.external_clock_slot) || github.workflow }}

# Refreshes the dashboard and macro-monitor sentiment series that were
# previously split across manual commits / Google Apps Scripts. Merge-by-date:
# today's point is updated in place or appended; history is never overwritten.
# Per-source resilient: one source failing does not block the others.

on:
  schedule:
    # 22:00 UTC Mon-Fri = ~after US cash close (17:00/18:00 ET). CNN F&G,
    # put/call and VIX settle for the session by then; crypto updates daily.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string
      controlled_failure_source:
        description: 'Dispatch-only LKG chaos source (cnn, cftc, crypto, vix, move)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sentiment-publish
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-sentiment.yml

  fetch-sentiment:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/sentiment
            data/sentiment

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Hydrate active sentiment histories
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --family sentiment --manifest-prefix public/data --private-manifest-prefix data --privacy-class public --output-root "$RUNNER_TEMP/sentiment-active")"
          cp -R "$RUNNER_TEMP/sentiment-active/." data/
          echo "generation=$(jq -r .generation_id <<< "$basis")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifest_sha256 <<< "$basis")" >> "$GITHUB_OUTPUT"
      - name: Fetch sentiment series
        id: fetch_sentiment
        env:
          INPUT_CONTROLLED_FAILURE_SOURCE: ${{ github.event.inputs.controlled_failure_source || '' }}
        run: node scripts/fetch-sentiment.mjs

      - name: Verify output
        if: ${{ steps.fetch_sentiment.outcome == 'success' }}
        run: |
          echo "=== Latest points (data/sentiment) ==="
          for f in cnn-fear-greed cnn-components cnn-put-call cnn-momentum cnn-strength cnn-breadth cnn-junk-bond cnn-safe-haven vix move cftc-sp500 crypto-fear-greed; do
            echo "--- $f.json ---"
            node -e "const d=require('./data/sentiment/$f.json');console.log('len',d.length,'last',JSON.stringify(d[d.length-1]))"
          done

      - name: Publish sentiment generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ steps.fetch_sentiment.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_EXPECTED_ACTIVE_GENERATION_ID: ${{ steps.baseline.outputs.generation }}
          PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256: ${{ steps.baseline.outputs.manifest }}
        run: node scripts/publish-cloud-data-generation.mjs --family=sentiment --json
