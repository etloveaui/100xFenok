# Feno Yardeni weekly valuation model.
# Builds public-safe Yardeni fields from FRED WAAA/WBAA plus 100x benchmark
# S&P 500 price/EPS. Raw FRED bond-yield components stay under _private/.

name: Fetch FRED Yardeni Data
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-fred-yardeni.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    # FRED posts a Friday WAAA/WBAA observation only after the Monday H.15
    # release (Tuesday when Monday is a holiday), and the owner's weekly
    # benchmark file lands Monday KST. A Saturday-only run therefore served a
    # Friday that was already 8 days old and aged to 14-15 days before the next
    # run, past the 13-day owner-weekly bound every Friday. Wednesday 10:00 UTC
    # is the first run after both inputs exist, holiday weeks included; Saturday
    # stays as the retry. A run with no strictly newer Friday is a no-op.
    - cron: '0 10 * * 3'
    - cron: '0 10 * * 6'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Existing A1 clock marker'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Bound UTC schedule slot'
        required: false
        default: ''
        type: string
      controlled_failure_key:
        description: 'Dispatch-only chaos key (yardney_model)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

concurrency:
  group: fred-yardeni-publish
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-fred-yardeni.yml

  fetch-fred-yardeni:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            data/benchmarks
            data/computed
            100xfenok-next/public/data/computed/data-supply/etf-detail
            100xfenok-next/scripts
            100xfenok-next/src/lib

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Hydrate active Yardeni model and recovery state
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --family fred-yardeni --manifest-prefix public/data --private-manifest-prefix data --privacy-class public --output-root "$RUNNER_TEMP/yardeni-active")"
          mkdir -p data
          cp -R "$RUNNER_TEMP/yardeni-active/." data/
          echo "generation=$(jq -r .generation_id <<< "$basis")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifest_sha256 <<< "$basis")" >> "$GITHUB_OUTPUT"

      - name: Build Feno Yardeni model from FRED
        id: fetch_yardeni
        env:
          INPUT_CONTROLLED_FAILURE_KEY: ${{ github.event.inputs.controlled_failure_key || '' }}
        run: node scripts/build-feno-yardeni-model.mjs --fetch

      - name: Validate public payload
        if: ${{ steps.fetch_yardeni.outcome == 'success' }}
        run: node 100xfenok-next/scripts/check-fenok-public-mirror-guard.mjs

      - name: Publish fred-yardeni generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ steps.fetch_yardeni.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_EXPECTED_ACTIVE_GENERATION_ID: ${{ steps.baseline.outputs.generation }}
          PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256: ${{ steps.baseline.outputs.manifest }}
        run: node scripts/publish-cloud-data-generation.mjs --family=fred-yardeni --json
