# Dedicated manual publisher for the owner-run Global Scouter shadow family.
# It publishes the owner-run export bundle to the cloud data plane and
# nothing else: no acquisition, no Worker enrolment, no public-surface
# cutover. The existing Git/public mirror remains authoritative until a
# separate promotion decision.

name: Global Scouter Shadow Publish

on:
  # Source-change driven, deliberately NOT scheduled: the export is owner-run, so
  # the push that moves the canonical tree IS the event.
  push:
    branches:
      - main
    paths:
      - 'data/global-scouter/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH-SHADOW to confirm a real cloud publication'
        required: true
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    # One constant family group deliberately does not use github.ref. Two
    # shadow publications must never overlap across refs because they contend
    # for the same R2 keyspace and pointer. This is separate from the global
    # Git writer queue because this job performs no Git write.
    concurrency:
      group: global-scouter-shadow-publish
      cancel-in-progress: false
      queue: max
    steps:
      # Only a manual run needs the typed confirmation; a push is confirmed by
      # the commit that moved the tree.
      - name: Refuse an unconfirmed dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PUBLISH-SHADOW" ]; then
            echo "::error::confirm must be exactly PUBLISH-SHADOW; refusing to publish" >&2
            exit 2
          fi

      - uses: actions/checkout@v4

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      # Bind the generation to the exact clean checkout it will publish. Do
      # not use github.sha here: a queued job deliberately refreshes to latest
      # main above, so ambient event metadata can name an older tree.
      - name: Capture exact published checkout
        id: source_identity
        run: echo "git_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Strict by design: no --tolerate-gate-block. An explicitly requested
      # shadow run that publishes nothing must be red.
      - name: Publish global-scouter generation to the cloud data plane
        id: publish_cloud_generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_BINDING_GIT_COMMIT: ${{ steps.source_identity.outputs.git_commit }}
        run: node scripts/publish-cloud-data-generation.mjs --family=global-scouter --json
