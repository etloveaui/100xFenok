name: Weekly Health Inventory

on:
  schedule:
    - cron: '15 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-health-inventory
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            scripts
            ops/a1-lanes
            100xfenok-next/src/lib
            100xfenok-next/scripts/cloud-data-plane
            data
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Hydrate published inventory and source health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { cp, mkdir } from 'node:fs/promises';
          import path from 'node:path';
          import { createDefaultMaterializePlane, materializeCloudDataPlaneFamily } from './scripts/materialize-cloud-data-plane-family.mjs';
          const env = process.env, repoRoot = process.cwd(), family = 'platform-projections';
          const wanted = new Set(['public/data/admin/fenok-data-health-kpi.json', 'public/data/admin/lane-registry-projection.json', 'public/data/admin/product-surface-coverage.json', 'public/data/admin/data-usage-manifest.json']);
          const plane = createDefaultMaterializePlane({ accountId: env.CLOUDFLARE_ACCOUNT_ID,
            token: env.CLOUDFLARE_API_TOKEN, endpoint: env.DATA_PLANE_ENDPOINT,
            writeKey: env.DATA_PLANE_WRITE_KEY, family });
          const receipt = await materializeCloudDataPlaneFamily({ plane, family, repoRoot, env,
            manifestPrefix: 'public/data', privateManifestPrefix: 'data', privacyClass: 'public',
            outputRoot: path.join(env.RUNNER_TEMP, 'weekly-inventory-inputs'), canonicalReuseRoot: repoRoot,
            includeAsset: asset => wanted.has(asset.path) });
          for (const assetPath of wanted) {
            const relative = assetPath.replace(/^(public\/)?data\//, '');
            const target = path.join(repoRoot, 'data', relative);
            await mkdir(path.dirname(target), { recursive: true });
            await cp(path.join(receipt.output_root, relative), target);
          }
          const { hydratePublicCloudData } = await import('./scripts/materialize-cloud-data-plane-family.mjs');
          await hydratePublicCloudData({ family: 'pipeline-alarm-state', relative: 'admin/alarm-state.json' });
          JS

      - name: Read the four inventories and report changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/weekly-health-inventory.mjs --publish
