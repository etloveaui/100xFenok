# Owner-approved one-off recovery lane for an already-uploaded StockAnalysis artifact.
# This lane never calls a provider; remove it after the recovery closeout.
name: Publish StockAnalysis Artifact Recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Retained acquire workflow run ID'
        required: true
      source_artifact_name:
        description: 'Exact retained immutable artifact name'
        required: true
      source_artifact_digest:
        description: 'Exact retained GitHub artifact digest'
        required: true

concurrency:
  group: fenok-data-writer-refs/heads/main
  cancel-in-progress: false
  queue: max

jobs:
  publish-stockanalysis-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Recovery validates the artifact's acquisition base against current
          # main, so the ancestor commit must be available locally.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download retained immutable candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stockanalysis-artifact

      - name: Publish retained candidate to latest main
        id: publish
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ARTIFACT_ROOT="$RUNNER_TEMP/stockanalysis-artifact"
          test -f "$ARTIFACT_ROOT/manifest.json" || { echo "recovery artifact manifest is missing" >&2; exit 64; }
          APPLY_RUN_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["run_id"])' "$ARTIFACT_ROOT/manifest.json")"
          APPLY_RUN_NUMBER="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["run_number"])' "$ARTIFACT_ROOT/manifest.json")"
          APPLY_RUN_ATTEMPT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["run_attempt"])' "$ARTIFACT_ROOT/manifest.json")"
          APPLY_ARTIFACT_NAME="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["artifact_name"])' "$ARTIFACT_ROOT/manifest.json")"
          test "$APPLY_RUN_ID" = "$SOURCE_RUN_ID" || { echo "recovery artifact run ID does not match manifest" >&2; exit 64; }
          test "$APPLY_ARTIFACT_NAME" = "$SOURCE_ARTIFACT_NAME" || { echo "recovery artifact name does not match manifest" >&2; exit 64; }
          for attempt in $(seq 1 5); do
            git fetch origin main
            git checkout -f -B main origin/main
            git clean -fd -- \
              data/stockanalysis \
              data/yf/finance \
              data/yf/etf-details \
              data/admin/data-supply-state \
              data/admin/stockanalysis-recovery \
              data/admin/yahoo_etf_fallback

            APPLY_JSON="$(
              python3 scripts/stockanalysis_artifact.py apply \
                --artifact-root "$ARTIFACT_ROOT" \
                --run-id "$APPLY_RUN_ID" \
                --run-number "$APPLY_RUN_NUMBER" \
                --run-attempt "$APPLY_RUN_ATTEMPT" \
                --artifact-name "$APPLY_ARTIFACT_NAME" \
                --artifact-digest "$SOURCE_ARTIFACT_DIGEST" \
                --github-output "$RUNNER_TEMP/stockanalysis-apply-output"
            )"
            APPLY_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$APPLY_JSON")"
            if [ "$APPLY_STATUS" = "stale" ]; then
              echo "status=stale" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            PROJECTION_ORACLE_ROOT="$RUNNER_TEMP/stockanalysis-projection-oracle"
            PROJECTION_ORACLE="$PROJECTION_ORACLE_ROOT/surfaces"
            rm -rf "$PROJECTION_ORACLE_ROOT"
            mkdir -p "$PROJECTION_ORACLE"
            rsync -a --checksum --delete data/stockanalysis/surfaces/ "$PROJECTION_ORACLE/"
            python3 scripts/test_stockanalysis_recovery_state.py
            node scripts/test-yahoo-etf-fallback-recovery.mjs
            node scripts/test-stockanalysis-attempt-emitter.mjs
            STOCKANALYSIS_SOURCE_SURFACE_DIR="data/stockanalysis/surfaces" \
              STOCKANALYSIS_PROJECTION_ORACLE_DIR="$PROJECTION_ORACLE" \
              python3 -m unittest scripts/test_stockanalysis_surface_contract.py
            python3 -m unittest scripts/test_stockanalysis_workflow_contract.py
            python3 -m unittest scripts/test_resolve_etf_detail_candidates.py
            python3 -m unittest scripts/test_stockanalysis_artifact.py
            python3 scripts/test-stockanalysis-financials-fixtures.py
            python3 -m unittest scripts/test_audit_market_data.py
            node scripts/test-select-stockanalysis-daily1y-offset.mjs
            node scripts/test-write-fenok-etf-daily1y-readiness.mjs
            node scripts/test-build-fenok-etf-core-daily-basket.mjs

            scripts/stage-lane-manifest.sh \
              --workflow .github/workflows/fetch-stockanalysis.yml \
              --stage always_if_exists
            python3 scripts/stockanalysis_artifact.py audit-stage \
              --artifact-root "$ARTIFACT_ROOT"
            python3 scripts/resolve_etf_detail_candidates.py \
              --artifact-manifest "$ARTIFACT_ROOT/manifest.json"
            scripts/stage-lane-manifest.sh \
              --workflow .github/workflows/fetch-stockanalysis.yml \
              --stage always_if_exists
            (
              cd 100xfenok-next
              npm run build:data-supply-public
              node scripts/sync-public-data.mjs --write
            )
            scripts/stage-lane-manifest.sh \
              --workflow .github/workflows/fetch-stockanalysis.yml \
              --stage always_if_exists
            git add -- data/computed/data-supply/etf-detail
            if git diff --staged --quiet; then
              COMMIT_ARGS=(--allow-empty)
              COMMIT_SUBJECT="chore: record stockanalysis artifact recovery"
              ACCEPTED_STATUS="accepted_no_changes"
            else
              COMMIT_ARGS=()
              COMMIT_SUBJECT="chore: publish stockanalysis artifact recovery"
              ACCEPTED_STATUS="published"
            fi
            git commit "${COMMIT_ARGS[@]}" \
              -m "$COMMIT_SUBJECT" \
              -m "StockAnalysis-Run-Number: ${{ github.run_number }}" \
              -m "StockAnalysis-Run-Attempt: ${{ github.run_attempt }}" \
              -m "StockAnalysis-Run-ID: ${{ github.run_id }}" \
              -m "StockAnalysis-Recovery-Source-Run-ID: $SOURCE_RUN_ID" \
              -m "StockAnalysis-Recovery-Artifact: $SOURCE_ARTIFACT_NAME" \
              -m "StockAnalysis-Artifact-Digest: $SOURCE_ARTIFACT_DIGEST"
            if git push origin HEAD:main; then
              echo "status=$ACCEPTED_STATUS" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "git push race on attempt ${attempt}; restarting from fresh origin/main"
            sleep 3
          done
          echo "git push failed after retrying concurrent main updates"
          exit 1

      - name: Dispatch shared projection rebuild
        if: ${{ steps.publish.outputs.status == 'published' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-manifest.yml --ref main
