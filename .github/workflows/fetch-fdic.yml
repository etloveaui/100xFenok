# FDIC Tier1 Capital Ratio collection with LKG recovery state.

name: Fetch FDIC Tier1 Data

on:
  push:
    branches: [main]
    paths:
      - 'data/macro/fdic-tier1.json'
      - 'ops/a1-lanes/fdic_tier1.json'
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 4'
  workflow_dispatch:
    inputs:
      publish_existing:
        description: 'Publish the checked-out FDIC data to the cloud plane without collecting'
        required: false
        default: false
        type: boolean
      persistence_migration_only:
        description: 'Metadata-only bounded-persistence migration; preserves data and recovery state'
        required: false
        default: false
        type: boolean
      controlled_failure_key:
        description: 'Dispatch-only chaos key (latest or an owned quarter)'
        required: false
        default: ''
        type: string
      owner_approved_recovery:
        description: 'Explicit owner approval for one provider-advancing manual recovery; never grants natural-run credit'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fenok-data-writer-refs/heads/main
  cancel-in-progress: false
  queue: max

jobs:
  fetch-fdic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/fdic_tier1
            data/macro
            ops/a1-lanes

      - name: Start publish-only from latest main
        if: ${{ github.event_name == 'push' || inputs.publish_existing == true }}
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require successful A1 push receipt
        if: ${{ github.event_name == 'push' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('ops/a1-lanes/fdic_tier1.json').read_text())
          if (state.get('schema_version') != 'a1-lane-status/v1'
                  or state.get('lane_id') != 'fdic_tier1'
                  or not state.get('last_success_at')
                  or state.get('last_success_at') != state.get('updated_at')
                  or state.get('consecutive_failures') != 0):
              raise SystemExit('A1 FDIC push has no successful collection receipt')
          PY

      - name: Test FDIC Tier1 producer contracts
        if: ${{ github.event_name != 'push' && inputs.publish_existing != true }}
        run: node scripts/test-fetch-fdic-tier1.mjs

      - name: Fetch FDIC Tier1 data
        id: fetch_fdic
        if: ${{ github.event_name != 'push' && inputs.publish_existing != true }}
        env:
          INPUT_PERSISTENCE_MIGRATION_ONLY: ${{ github.event.inputs.persistence_migration_only || 'false' }}
          INPUT_CONTROLLED_FAILURE_KEY: ${{ github.event.inputs.controlled_failure_key || '' }}
          INPUT_OWNER_APPROVED_RECOVERY: ${{ github.event.inputs.owner_approved_recovery || 'false' }}
        run: node scripts/fetch-fdic-tier1.mjs

      - name: Verify output
        if: ${{ github.event_name != 'push' && inputs.publish_existing != true && steps.fetch_fdic.outcome == 'success' && steps.fetch_fdic.outputs.updated == 'true' }}
        run: |
          head -20 data/macro/fdic-tier1.json
          echo "Total lines: $(wc -l < data/macro/fdic-tier1.json)"

      - name: Commit and push
        if: ${{ always() && github.event_name != 'push' && inputs.publish_existing != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_OUTCOME: ${{ steps.fetch_fdic.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/fetch-fdic.yml \
            --stage always_if_exists
          if [[ "$FETCH_OUTCOME" == "success" ]]; then
            scripts/stage-lane-manifest.sh \
              --workflow .github/workflows/fetch-fdic.yml \
              --stage success_if_exists
          fi
          if git diff --staged --quiet; then
            echo "No FDIC Tier1 changes to publish"
            exit 0
          fi
          git commit -m "chore: update FDIC Tier1 data"
          for attempt in $(seq 1 5); do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
              continue
            fi
            if git push; then
              # Decoupled: a successful completion of this workflow runs the
              # coordinate-computed-signals workflow_run (serialized rebuild +
              # plane publish); the scheduled update-manifest.yml remains the
              # reconciliation fallback for shared projections.
              exit 0
            fi
            sleep 3
          done
          echo "git push failed after retrying concurrent main updates"
          exit 1
      - name: Publish fdic-tier1 generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ (github.event_name == 'push' || inputs.publish_existing == true) || (steps.fetch_fdic.outcome == 'success' && steps.fetch_fdic.outputs.updated == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_ONLY: ${{ github.event_name == 'push' || inputs.publish_existing == true }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_ONLY" == "true" ]]; then
            git fetch --depth=1 origin +main:refs/remotes/origin/main
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
              echo "main advanced after checkout; refusing stale FDIC publication" >&2
              exit 1
            fi
          fi
          node scripts/publish-cloud-data-generation.mjs --family=fdic-tier1 --json
