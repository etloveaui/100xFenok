# yf Finance Engine v2 — bounded Yahoo Finance depth for the stock lens.
# Daily measured-stock refresh + bounded current-catalogue ETF acquisition/refresh.
# Output: owned canonical Yahoo data. Update Manifest owns shared/public projections.

name: Fetch YF Finance Data
run-name: ${{ github.event.client_payload.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-yf-finance.yml {0}', github.event.client_payload.external_clock_slot) || github.workflow }}

on:
  repository_dispatch:
    types: [external-clock-yf-finance]
  schedule:
    # Weekday measured-stock refresh after US close (KST Tue-Sat 08:20).
    - cron: '20 23 * * 1-5'
    # Seven minutes past, not on the hour: GitHub warns that hour-start
    # schedules may be delayed or dropped under load, and three consecutive
    # :00 slots did not fire at all.
    # Sunday-Friday, one ETF slot a day at 00:07 UTC: six runs a week on a
    # six-shard cycle. The scheduled ETF lane combines the configured core
    # union with current-catalogue retained ETFs and verified pending ETF
    # acquisitions; unbound broad-universe entries are not admitted.
    # The weekday is read from the clock and maps directly to the shard index
    # of that cycle, so a slot delayed past midnight lands in the next day's
    # cycle and self-corrects on the next pass.
    - cron: '7 0 * * 0-5'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Ticker limit (empty = full universe)'
        required: false
        default: ''
      shard:
        description: 'Shard i/n (e.g. 0/4, empty = no shard)'
        required: false
        default: ''
      daily_all_shards:
        description: 'Run every daily stock shard in one dispatch'
        required: false
        default: 'false'
      daily_stock_shards:
        description: 'Daily stock shard count when daily_all_shards=true'
        required: false
        default: '5'
      tickers:
        description: 'Comma-separated ticker override (e.g. TQQQ,SOXL,NVDL)'
        required: false
        default: ''
      controlled_failure_tickers:
        description: 'Owner-approved failure proof; must be a subset of tickers and is rejected on schedules'
        required: false
        default: ''
      sleep:
        description: 'Seconds between tickers'
        required: false
        default: '0.8'
      ticker_timeout:
        description: 'Seconds per ticker attempt before retry/skip (0 = disabled)'
        required: false
        default: '90'
      retries:
        description: 'Retry attempts per ticker after the first attempt'
        required: false
        default: '2'
      merge_existing:
        description: 'Merge fetched non-null fields into existing payloads'
        required: false
        default: 'false'
      profile:
        description: 'Fetch profile: daily, core, full, etf, history-daily, or history-backfill (private lifetime prices only)'
        required: false
        default: 'full'
      max_age_hours:
        description: 'Skip usable local payloads newer than N hours (0 = disabled)'
        required: false
        default: '0'
      include_shares_full:
        description: 'Fetch share-count history sample'
        required: false
        default: 'false'
      stockanalysis_etfs:
        description: 'Include full StockAnalysis ETF universe in the candidate set'
        required: false
        default: 'false'
      stocks_only:
        description: 'Use only the measured stock universe, excluding ETF candidates'
        required: false
        default: 'false'
      history_gaps_only:
        description: 'Fetch only tickers missing enough local 1Y history rows'
        required: false
        default: 'false'
      history_min_rows:
        description: 'Minimum local history_1y rows before a ticker is skipped'
        required: false
        default: '200'
      plan_only:
        description: 'Resolve and print the candidate plan without Yahoo calls or data writes'
        required: false
        default: 'false'
      untracked_only:
        description: 'Bounded recovery: select pending-acquisition names before maintenance'
        required: false
        default: 'false'
      retry_limit:
        description: 'Natural retry budget for a bounded recovery dispatch'
        required: false
        default: ''
      regular_limit:
        description: 'Regular candidate budget per stable shard cycle'
        required: false
        default: ''
      untracked_limit:
        description: 'Pending-acquisition budget within the regular candidate budget'
        required: false
        default: ''
      shard_cycle_index:
        description: 'Stable shard cycle index (required for untracked recovery)'
        required: false
        default: ''
      scheduled_weekday:
        description: 'Scheduled weekday 0-5 matching the selected ETF shard'
        required: false
        default: ''
      stable_shards:
        description: 'Use deterministic hash shards (required for untracked recovery)'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: write

# Serialize Yahoo runs against each other so an older artifact cannot publish
# after a newer acquisition. This private group does not occupy the global Git
# writer queue; publication uses the existing family coordinator.
concurrency:
  group: yf-finance-pipeline-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
      automatic: ${{ steps.slot.outputs.automatic }}
      event_name: ${{ steps.slot.outputs.event_name }}
      mode: ${{ steps.slot.outputs.mode }}
      schedule: ${{ steps.slot.outputs.schedule }}
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-yf-finance.yml

  acquire-yf-finance:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' && github.event.inputs.profile != 'history-backfill' && github.event.inputs.profile != 'history-daily' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      YF_PLAN_ONLY: ${{ github.event.inputs.plan_only || 'false' }}
    # Acquisition cannot commit or push: read-only token, enforced structurally
    # rather than by convention. The workflow-level write permission is retained
    # for the publish job, which inherits it.
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_name: ${{ steps.artifact_identity.outputs.name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_ready: ${{ steps.pack.outputs.ready }}
      base_sha: ${{ steps.artifact_identity.outputs.base_sha }}
      active_generation: ${{ steps.cloud_basis.outputs.generation }}
      active_manifest: ${{ steps.cloud_basis.outputs.manifest }}
      plan_only: ${{ steps.artifact_identity.outputs.plan_only }}
      fetch_outcome: ${{ steps.fetch_batch.outcome }}
      quarter_closes_outcome: ${{ steps.quarter_closes.outcome }}
    steps:
      - uses: actions/checkout@v7

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Expose immutable artifact identity
        id: artifact_identity
        run: |
          echo "name=yf-finance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "plan_only=$YF_PLAN_ONLY" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Install yfinance
        run: pip install yfinance

      - name: Hydrate active Global Scouter universe indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/materialize-cloud-data-plane-family.mjs --hydrate-global-scouter-universe

      - name: Hydrate active Yahoo generation and derive runtime state
        id: cloud_basis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --hydrate-yahoo-finance)"
          echo "generation=$(jq -r '.generation_id' <<< "$basis")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r '.manifest_sha256' <<< "$basis")" >> "$GITHUB_OUTPUT"
          export YF_ACTIVE_GENERATION_ROOT="$(jq -r '.output_root' <<< "$basis")"
          export YAHOO_BATCH_STATE_ROOT="$RUNNER_TEMP/yahoo-state"
          echo "YF_ACTIVE_GENERATION_ROOT=$YF_ACTIVE_GENERATION_ROOT" >> "$GITHUB_ENV"
          echo "YAHOO_BATCH_STATE_ROOT=$YAHOO_BATCH_STATE_ROOT" >> "$GITHUB_ENV"
          # One transition only: the pre-migration generation has no lifecycle
          # metadata. Retain actual observations from its existing writer state.
          if [ ! -f data/yf/_acquisition-state.json ]; then
            python3 scripts/yahoo_batch_state.py export-generation --state-root data/admin/yahoo-batch-quote-history
          fi
          python3 scripts/yahoo_batch_state.py hydrate-generation --state-root "$YAHOO_BATCH_STATE_ROOT"
          node --input-type=module <<'JS'
          import { cp, mkdir } from 'node:fs/promises';
          import path from 'node:path';
          import { createDefaultMaterializePlane, materializeCloudDataPlaneFamily } from './scripts/materialize-cloud-data-plane-family.mjs';
          const env = process.env, repoRoot = process.cwd(), family = 'platform-projections';
          const wanted = new Set(['data/admin/fenok-etf-core-daily-basket.json', 'data/admin/fenok-s1-stock-public-promotion-dry-run.json', 'public/data/computed/market_facts/index.json']);
          const plane = createDefaultMaterializePlane({ accountId: env.CLOUDFLARE_ACCOUNT_ID,
            token: env.CLOUDFLARE_API_TOKEN, endpoint: env.DATA_PLANE_ENDPOINT,
            writeKey: env.DATA_PLANE_WRITE_KEY, family });
          const receipt = await materializeCloudDataPlaneFamily({ plane, family, repoRoot, env,
            manifestPrefix: 'public/data', privateManifestPrefix: 'data', privacyClass: 'public',
            outputRoot: path.join(env.RUNNER_TEMP, 'yahoo-universe-inputs'), canonicalReuseRoot: repoRoot,
            includeAsset: asset => wanted.has(asset.path) });
          for (const assetPath of wanted) {
            const relative = assetPath.replace(/^(public\/)?data\//, '');
            const target = path.join(repoRoot, 'data', relative);
            await mkdir(path.dirname(target), { recursive: true });
            await cp(path.join(receipt.output_root, relative), target);
          }
          const { hydratePublicCloudData } = await import('./scripts/materialize-cloud-data-plane-family.mjs');
          for (const [inputFamily, relative] of [
            ['stockanalysis-catalogue', 'stockanalysis/etf_universe.json'],
            ['stockanalysis-catalogue', 'stockanalysis/surfaces/etf_screener.json'],
            ['nasdaq-giw-sox', 'indices/nasdaq-giw-sox-constituents.json'],
          ]) await hydratePublicCloudData({ family: inputFamily, relative });
          JS

      - name: Run batch fetch
        id: fetch_batch
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit || '' }}
          INPUT_SHARD: ${{ github.event.inputs.shard || '' }}
          INPUT_DAILY_ALL_SHARDS: ${{ github.event.inputs.daily_all_shards || 'false' }}
          INPUT_DAILY_STOCK_SHARDS: ${{ github.event.inputs.daily_stock_shards || '5' }}
          INPUT_TICKERS: ${{ github.event.inputs.tickers || '' }}
          INPUT_CONTROLLED_FAILURE_TICKERS: ${{ github.event.inputs.controlled_failure_tickers || '' }}
          INPUT_SLEEP: ${{ github.event.inputs.sleep || '0.8' }}
          INPUT_TICKER_TIMEOUT: ${{ github.event.inputs.ticker_timeout || '90' }}
          INPUT_RETRIES: ${{ github.event.inputs.retries || '2' }}
          INPUT_MERGE_EXISTING: ${{ github.event.inputs.merge_existing || 'false' }}
          INPUT_PROFILE: ${{ github.event.inputs.profile || 'full' }}
          INPUT_MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '0' }}
          INPUT_INCLUDE_SHARES_FULL: ${{ github.event.inputs.include_shares_full || 'false' }}
          INPUT_CORE_DAILY_BASKET: 'false'
          INPUT_STOCKANALYSIS_ETFS: ${{ github.event.inputs.stockanalysis_etfs || 'false' }}
          INPUT_STOCKS_ONLY: ${{ github.event.inputs.stocks_only || 'false' }}
          INPUT_HISTORY_GAPS_ONLY: ${{ github.event.inputs.history_gaps_only || 'false' }}
          INPUT_HISTORY_MIN_ROWS: ${{ github.event.inputs.history_min_rows || '200' }}
          INPUT_UNTRACKED_ONLY: ${{ github.event.inputs.untracked_only || 'false' }}
          INPUT_PLAN_ONLY: ${{ github.event.inputs.plan_only || 'false' }}
          INPUT_RETRY_LIMIT: ${{ github.event.inputs.retry_limit || '' }}
          INPUT_REGULAR_LIMIT: ${{ github.event.inputs.regular_limit || '' }}
          INPUT_UNTRACKED_LIMIT: ${{ github.event.inputs.untracked_limit || '' }}
          INPUT_SHARD_CYCLE_INDEX: ${{ github.event.inputs.shard_cycle_index || '' }}
          INPUT_SCHEDULED_WEEKDAY: ${{ github.event.inputs.scheduled_weekday || '' }}
          INPUT_STABLE_SHARDS: ${{ github.event.inputs.stable_shards || 'false' }}
          EVENT_NAME: ${{ needs.clock-admission.outputs.event_name }}
          EVENT_SCHEDULE: ${{ needs.clock-admission.outputs.schedule }}
          CLOCK_MODE: ${{ needs.clock-admission.outputs.mode }}
          CLOCK_SLOT: ${{ needs.clock-admission.outputs.slot }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_UNTRACKED_ONLY" = "true" ]; then
            if [ "$INPUT_STABLE_SHARDS" != "true" ] || [ -z "$INPUT_SHARD" ] || [ -z "$INPUT_SHARD_CYCLE_INDEX" ] || [ -z "$INPUT_SCHEDULED_WEEKDAY" ]; then
              echo "::error::bounded untracked recovery requires stable_shards=true, shard=i/6, shard_cycle_index, and scheduled_weekday" >&2
              exit 2
            fi
            case "$INPUT_SHARD" in
              [0-5]/6) ;;
              *) echo "::error::bounded untracked recovery requires shard i/6 with i in 0..5" >&2; exit 2 ;;
            esac
            case "$INPUT_SCHEDULED_WEEKDAY" in
              0|1|2|3|4|5) ;;
              *) echo "::error::scheduled_weekday must be 0..5" >&2; exit 2 ;;
            esac
            if [ -z "$INPUT_LIMIT" ] || [ -z "$INPUT_RETRY_LIMIT" ] || [ -z "$INPUT_REGULAR_LIMIT" ] || [ -z "$INPUT_UNTRACKED_LIMIT" ]; then
              echo "::error::bounded untracked recovery requires limit, retry_limit, regular_limit, and untracked_limit" >&2
              exit 2
            fi
            # Bounded recovery is the same deterministic lane as the scheduled
            # ETF/core slot: bind to the core daily basket union and never
            # expand to the broad StockAnalysis ETF universe, so the fetch
            # cannot fall into the all_sources state branch.
            INPUT_CORE_DAILY_BASKET="true"
            INPUT_STOCKANALYSIS_ETFS="false"
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$CLOCK_MODE" = "stocks" ]; then
              INPUT_DAILY_STOCK_SHARDS="${YF_DAILY_STOCK_SHARDS:-5}"
              INPUT_DAILY_ALL_SHARDS="${YF_DAILY_STOCK_ALL_SHARDS:-true}"
              # Default to full coverage across all daily stock shards. A cap
              # must be an explicit operator override so a larger future active
              # universe cannot silently fall outside daily freshness.
              INPUT_LIMIT="${YF_DAILY_STOCK_LIMIT:-}"
              INPUT_RETRY_LIMIT="${YF_DAILY_STOCK_RETRY_LIMIT:-40}"
              INPUT_SHARD="${YF_DAILY_STOCK_SHARD:-}"
              INPUT_SLEEP="${YF_DAILY_STOCK_SLEEP:-0.35}"
              INPUT_TICKER_TIMEOUT="${YF_DAILY_STOCK_TICKER_TIMEOUT:-45}"
              INPUT_RETRIES="${YF_DAILY_STOCK_RETRIES:-1}"
              INPUT_MERGE_EXISTING="${YF_DAILY_STOCK_MERGE_EXISTING:-true}"
              INPUT_PROFILE="${YF_DAILY_STOCK_PROFILE:-daily}"
              INPUT_MAX_AGE_HOURS="${YF_DAILY_STOCK_MAX_AGE_HOURS:-18}"
              INPUT_HISTORY_GAPS_ONLY="false"
              INPUT_HISTORY_MIN_ROWS="${YF_DAILY_STOCK_HISTORY_MIN_ROWS:-200}"
              INPUT_STOCKANALYSIS_ETFS="false"
              INPUT_STOCKS_ONLY="true"
            else
              case "$CLOCK_MODE" in
                etfs) : ;;
                *) echo "::error::unrecognized scheduled ETF slot: $EVENT_SCHEDULE" >&2; exit 2 ;;
              esac
              if [ -n "$CLOCK_SLOT" ]; then
                SLOT_WEEKDAY="$(date -u -d "$CLOCK_SLOT" +%w)"
              else
                SLOT_WEEKDAY="$(date -u +%w)"
              fi
              if [ "$SLOT_WEEKDAY" -gt 5 ]; then SLOT_WEEKDAY=5; fi
              # One slot a day, Sunday-Friday: the weekday is the shard index
              # of the six-shard weekly cycle, so no hour or slot arithmetic
              # is needed and the scheduled slot stays coherent with the
              # shard.
              DAILY_INDEX="$SLOT_WEEKDAY"
              DAILY_SHARDS=6
              echo "ETF slot: weekday=$SLOT_WEEKDAY shard=$DAILY_INDEX/$DAILY_SHARDS"
              # Regular candidates are the configured core union plus current
              # catalogue ETFs with canonical state or verified pending records.
              # Six stable shards cover that bounded union; the broad
              # StockAnalysis universe is not admitted as candidates.
              # The outer limit covers retry plus one regular shard. The fetcher
              # reads committed completion state and may add one oldest missed
              # regular shard (up to 2240 total), sharing these same 40 retries.
              INPUT_LIMIT="${YF_WEEKLY_ETF_LIMIT:-1140}"
              INPUT_RETRY_LIMIT="${YF_WEEKLY_ETF_RETRY_LIMIT:-40}"
              INPUT_REGULAR_LIMIT="${YF_WEEKLY_ETF_REGULAR_LIMIT:-1100}"
              INPUT_UNTRACKED_LIMIT="${YF_WEEKLY_ETF_UNTRACKED_LIMIT:-80}"
              INPUT_SHARD_CYCLE_INDEX="${YF_WEEKLY_ETF_SHARD_CYCLE_INDEX:-}"
              if [ -z "$INPUT_SHARD_CYCLE_INDEX" ] && [ -n "$CLOCK_SLOT" ]; then
                INPUT_SHARD_CYCLE_INDEX="$(python3 -c 'import sys; from datetime import datetime; d=datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")); y,w,_=d.isocalendar(); print(datetime.fromisocalendar(y,w,1).toordinal()//7)' "$CLOCK_SLOT")"
              fi
              # The weekday stays the real weekday, because the weekly cycle
              # index is derived from the calendar occurrence. With one slot
              # a day the slot index is the weekday itself.
              INPUT_SCHEDULED_WEEKDAY="$SLOT_WEEKDAY"
              INPUT_SCHEDULED_SLOT="$DAILY_INDEX"
              INPUT_STABLE_SHARDS="true"
              INPUT_SHARD="${DAILY_INDEX}/${DAILY_SHARDS}"
              INPUT_SLEEP="${YF_WEEKLY_ETF_SLEEP:-1.0}"
              INPUT_TICKER_TIMEOUT="${YF_WEEKLY_ETF_TICKER_TIMEOUT:-90}"
              INPUT_RETRIES="${YF_WEEKLY_ETF_RETRIES:-1}"
              INPUT_MERGE_EXISTING="${YF_WEEKLY_ETF_MERGE_EXISTING:-false}"
              INPUT_PROFILE="${YF_WEEKLY_ETF_PROFILE:-etf}"
              INPUT_MAX_AGE_HOURS="${YF_WEEKLY_ETF_MAX_AGE_HOURS:-18}"
              # A refresh pass, not an acquisition pass. history-gaps-only
              # skipped every ticker whose 1Y history was already complete, and
              # untracked-only skipped every ticker already being tracked;
              # together they meant an established ETF was never fetched again.
              INPUT_HISTORY_GAPS_ONLY="${YF_WEEKLY_ETF_HISTORY_GAPS_ONLY:-false}"
              INPUT_HISTORY_MIN_ROWS="${YF_WEEKLY_ETF_HISTORY_MIN_ROWS:-200}"
              INPUT_UNTRACKED_ONLY="${YF_WEEKLY_ETF_UNTRACKED_ONLY:-false}"
              # The scheduled lane is bounded to configured and verified
              # current-catalogue ETFs; broad acquisition remains manual opt-in.
              INPUT_STOCKANALYSIS_ETFS="false"
              INPUT_CORE_DAILY_BASKET="true"
              INPUT_STOCKS_ONLY="false"
            fi
            INPUT_INCLUDE_SHARES_FULL="false"
            INPUT_PLAN_ONLY="false"
          fi
          # workflow_dispatch is capped at 25 inputs, so the slot is not one of
          # them. A manual run of a multi-slot shard derives it from the shard
          # itself; the scheduled branch has already set it explicitly.
          if [ -z "${INPUT_SCHEDULED_SLOT:-}" ] && [ -n "$INPUT_SHARD" ]; then
            SHARD_COUNT="${INPUT_SHARD#*/}"
            if [ "$SHARD_COUNT" != "6" ]; then INPUT_SCHEDULED_SLOT="${INPUT_SHARD%%/*}"; fi
          fi
          echo "YF_PLAN_ONLY=${INPUT_PLAN_ONLY:-false}" >> "$GITHUB_ENV"
          echo "YF_LANE=$([ "${INPUT_STOCKS_ONLY:-false}" = "true" ] && echo stock || echo etf)" >> "$GITHUB_ENV"
          # The publish job is a separate runner, so the plan-only decision has
          # to cross the job boundary as an output; GITHUB_ENV does not.
          # Written before the provider call so a failed fetch still carries it.
          echo "plan_only=${INPUT_PLAN_ONLY:-false}" >> "$GITHUB_OUTPUT"
          ARGS="--profile ${INPUT_PROFILE:-full} --max-age-hours ${INPUT_MAX_AGE_HOURS:-0} --record-batch-state --event-name $EVENT_NAME"
          # This flag selects the bounded retry/shard lane; valid acquisition
          # and recovery do not depend on invocation identity.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_UNTRACKED_ONLY" = "true" ]; then ARGS="$ARGS --natural-run"; fi
          if [ -n "$INPUT_LIMIT" ]; then ARGS="$ARGS --limit $INPUT_LIMIT"; fi
          if [ -n "$INPUT_RETRY_LIMIT" ]; then ARGS="$ARGS --retry-limit $INPUT_RETRY_LIMIT"; fi
          if [ -n "$INPUT_REGULAR_LIMIT" ]; then ARGS="$ARGS --regular-limit $INPUT_REGULAR_LIMIT"; fi
          if [ -n "$INPUT_UNTRACKED_LIMIT" ]; then ARGS="$ARGS --untracked-limit $INPUT_UNTRACKED_LIMIT"; fi
          if [ -n "$INPUT_SHARD_CYCLE_INDEX" ]; then ARGS="$ARGS --shard-cycle-index $INPUT_SHARD_CYCLE_INDEX"; fi
          if [ -n "$INPUT_SCHEDULED_WEEKDAY" ]; then ARGS="$ARGS --scheduled-weekday $INPUT_SCHEDULED_WEEKDAY"; fi
          if [ -n "$INPUT_SCHEDULED_SLOT" ]; then ARGS="$ARGS --scheduled-slot $INPUT_SCHEDULED_SLOT"; fi
          if [ "$INPUT_STABLE_SHARDS" = "true" ]; then ARGS="$ARGS --stable-shards"; fi
          if [ -n "$INPUT_SHARD" ]; then ARGS="$ARGS --shard $INPUT_SHARD"; fi
          if [ -n "$INPUT_TICKERS" ]; then ARGS="$ARGS --tickers $INPUT_TICKERS"; fi
          if [ -n "$INPUT_CONTROLLED_FAILURE_TICKERS" ]; then ARGS="$ARGS --controlled-failure-tickers $INPUT_CONTROLLED_FAILURE_TICKERS"; fi
          if [ "$INPUT_STOCKS_ONLY" = "true" ]; then ARGS="$ARGS --stocks-only"; fi
          if [ "$INPUT_INCLUDE_SHARES_FULL" = "true" ]; then ARGS="$ARGS --include-shares-full"; fi
          if [ "$INPUT_CORE_DAILY_BASKET" = "true" ]; then ARGS="$ARGS --core-daily-basket"; fi
          if [ "$INPUT_STOCKANALYSIS_ETFS" = "true" ]; then ARGS="$ARGS --stockanalysis-etfs"; fi
          if [ "$INPUT_HISTORY_GAPS_ONLY" = "true" ]; then ARGS="$ARGS --history-gaps-only --history-min-rows ${INPUT_HISTORY_MIN_ROWS:-200}"; fi
          if [ "$INPUT_UNTRACKED_ONLY" = "true" ]; then ARGS="$ARGS --untracked-only"; fi
          if [ "$INPUT_MERGE_EXISTING" = "true" ]; then ARGS="$ARGS --merge-existing"; fi
          if [ "$INPUT_PLAN_ONLY" = "true" ]; then ARGS="$ARGS --plan-only"; fi
          if [ "${INPUT_DAILY_ALL_SHARDS:-false}" = "true" ] && [ -z "$INPUT_SHARD" ]; then
            DAILY_STOCK_SHARDS="${INPUT_DAILY_STOCK_SHARDS:-5}"
            case "$DAILY_STOCK_SHARDS" in
              ''|*[!0-9]*) echo "::error::daily stock shard count must be a positive integer" >&2; exit 2 ;;
            esac
            if [ "$DAILY_STOCK_SHARDS" -lt 1 ]; then
              echo "::error::daily stock shard count must be positive" >&2
              exit 2
            fi
            SHARD_RESULTS_DIR="$(mktemp -d "$RUNNER_TEMP/yf-shards.XXXXXX")"
            BATCH_EXIT=0
            echo "Running all daily stock shards: ${DAILY_STOCK_SHARDS}"
            for shard_index in $(seq 0 $((DAILY_STOCK_SHARDS - 1))); do
              echo "::group::YF daily stock shard ${shard_index}/${DAILY_STOCK_SHARDS}"
              if [ "$INPUT_PLAN_ONLY" != "true" ]; then rm -f data/yf/finance/_summary.json; fi
              # Exit 1 is a rejected ticker candidate with preserved state;
              # exit 2 is systemic provider/storage failure. An explicit branch
              # keeps bash -e from cancelling the remaining isolated shards.
              if python3 scripts/fetch-yf-finance.py $ARGS --all-shards-run --all-shards-plan-dir "$SHARD_RESULTS_DIR" --shard "${shard_index}/${DAILY_STOCK_SHARDS}" --sleep "${INPUT_SLEEP:-0.8}" --ticker-timeout "${INPUT_TICKER_TIMEOUT:-90}" --retries "${INPUT_RETRIES:-2}"; then
                SHARD_EXIT=0
              else
                SHARD_EXIT=$?
              fi
              printf '%s\n' "$SHARD_EXIT" > "$SHARD_RESULTS_DIR/${shard_index}.exit"
              if [ "$INPUT_PLAN_ONLY" != "true" ]; then
                if [ -f data/yf/finance/_summary.json ]; then
                  cp data/yf/finance/_summary.json "$SHARD_RESULTS_DIR/${shard_index}.json"
                else
                  echo "::error::shard ${shard_index}/${DAILY_STOCK_SHARDS} did not produce completion evidence" >&2
                  SHARD_EXIT=2
                fi
              fi
              if [ "$SHARD_EXIT" -gt "$BATCH_EXIT" ]; then BATCH_EXIT="$SHARD_EXIT"; fi
              echo "::endgroup::"
              if [ "$SHARD_EXIT" -ge 2 ]; then
                echo "::error::systemic Yahoo failure; stopping subsequent shards" >&2
                break
              fi
            done
            if [ "$INPUT_PLAN_ONLY" != "true" ]; then
              if python3 scripts/rebuild-yf-finance-summary.py --shard-results-dir "$SHARD_RESULTS_DIR" --expected-shards "$DAILY_STOCK_SHARDS"; then
                AGGREGATE_EXIT=0
              else
                AGGREGATE_EXIT=$?
              fi
              # Complete invocation evidence owns the final refusal budget.
              BATCH_EXIT="$AGGREGATE_EXIT"
            fi
            echo "exit_code=$BATCH_EXIT" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit "$BATCH_EXIT"
          else
            if [ -n "$INPUT_SHARD" ]; then ARGS="$ARGS --shard $INPUT_SHARD"; fi
            if python3 scripts/fetch-yf-finance.py $ARGS --sleep "${INPUT_SLEEP:-0.8}" --ticker-timeout "${INPUT_TICKER_TIMEOUT:-90}" --retries "${INPUT_RETRIES:-2}"; then
              BATCH_EXIT=0
            else
              BATCH_EXIT=$?
            fi
            echo "exit_code=$BATCH_EXIT" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit "$BATCH_EXIT"
          fi

      # Quarter-close calls a ~1,400-ticker universe of its own. Running it
      # after every ETF slot is what produced the repeated YFRateLimitError in
      # run 30711922590, after the fetch itself had completed cleanly. It
      # belongs to the stock lane, which owns that universe. A batch that ends
      # with exit 1 (member refusals over budget) still refreshes quarter
      # closes; only a systemic exit 2 or an earlier failure skips them.
      - name: Refresh owned Yahoo quarter-close source
        id: quarter_closes
        if: ${{ !cancelled() && env.YF_PLAN_ONLY != 'true' && env.YF_LANE != 'etf' && (steps.fetch_batch.outcome == 'success' || steps.fetch_batch.outputs.exit_code == '1') }}
        # The 13F investor files left Git on 2026-10-17; the universe comes
        # from the active sec-13f generation. Packing reads data/yf only.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          node scripts/materialize-cloud-data-plane-family.mjs --hydrate-sec-13f
          python3 scripts/build-quarter-closes.py

      # -------------------------------------------------------------------
      # Artifact boundary. Everything above this line ran without the global
      # writer lock. Nothing above commits or pushes.
      # -------------------------------------------------------------------

      - name: Pack immutable Yahoo candidate
        id: pack
        if: ${{ always() && steps.cloud_basis.outcome == 'success' && env.YF_PLAN_ONLY != 'true' }}
        env:
          ARTIFACT_NAME: ${{ steps.artifact_identity.outputs.name }}
          BASE_SHA: ${{ steps.artifact_identity.outputs.base_sha }}
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/yf-artifact"
          rm -rf "$ART"
          mkdir -p "$ART"
          python3 scripts/yahoo_batch_state.py export-generation --state-root "$YAHOO_BATCH_STATE_ROOT"
          # Compare against the verified active tree, not Git's index. Ignored
          # generated files still participate, and unchanged bytes are not packed.
          python3 - "$ART/candidate-paths.z" <<'PYEOF'
          import hashlib, os, pathlib, sys
          current = pathlib.Path('data/yf')
          baseline = pathlib.Path(os.environ['YF_ACTIVE_GENERATION_ROOT'])
          def inventory(root):
              files = set()
              for directory in ('finance', 'estimates-archive'):
                  files.update(p.relative_to(root).as_posix() for p in (root/directory).rglob('*')
                               if p.is_file() and p.name != '_summary.json')
              files.update(name for name in ('quarter_closes.json', '_acquisition-state.json') if (root/name).is_file())
              return files
          def digest(path):
              return hashlib.sha256(path.read_bytes()).digest() if path.is_file() else None
          changed = ['data/yf/' + name for name in sorted(inventory(current) | inventory(baseline))
                     if digest(current/name) != digest(baseline/name)]
          pathlib.Path(sys.argv[1]).write_bytes(b''.join(path.encode() + b'\0' for path in changed))
          PYEOF
          : > "$ART/candidate-present.z"
          : > "$ART/candidate-deleted.txt"
          : > "$ART/candidate-digests.txt"
          present=0
          deleted=0
          while IFS= read -r -d '' candidate; do
            if [ -e "$candidate" ]; then
              [ -f "$candidate" ] && [ ! -L "$candidate" ] \
                || { echo "::error::Yahoo candidate is not a regular file: $candidate" >&2; exit 1; }
              printf '%s\0' "$candidate" >> "$ART/candidate-present.z"
              sha256sum "$candidate" >> "$ART/candidate-digests.txt"
              present=$((present + 1))
            else
              printf '%s\n' "$candidate" >> "$ART/candidate-deleted.txt"
              deleted=$((deleted + 1))
            fi
          done < "$ART/candidate-paths.z"
          if [ "$present" -eq 0 ] && [ "$deleted" -eq 0 ]; then
            echo "No fetched Yahoo candidate changes to pack"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar --null -c -T "$ART/candidate-present.z" -f "$ART/candidate.tar"
          TAR_SHA="$(sha256sum "$ART/candidate.tar" | awk '{print $1}')"
          DIGESTS_SHA="$(sha256sum "$ART/candidate-digests.txt" | awk '{print $1}')"
          DELETED_SHA="$(sha256sum "$ART/candidate-deleted.txt" | awk '{print $1}')"
          jq -n \
            --arg schema 'yf-finance-candidate-artifact/v1' \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg base_sha "$BASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg tar_sha256 "$TAR_SHA" \
            --arg digests_sha256 "$DIGESTS_SHA" \
            --arg deleted_sha256 "$DELETED_SHA" \
            --argjson present "$present" \
            --argjson deleted "$deleted" \
            '{schema: $schema, artifact_name: $artifact_name, base_sha: $base_sha,
              run_id: $run_id, run_number: $run_number, run_attempt: $run_attempt,
              workflow_ref: $workflow_ref, candidate_tar_sha256: $tar_sha256,
              candidate_digests_sha256: $digests_sha256,
              candidate_deleted_sha256: $deleted_sha256,
              candidate_present: $present, candidate_deleted: $deleted}' \
            > "$ART/metadata.json"
          rm -f "$ART/candidate-paths.z" "$ART/candidate-present.z"
          echo "packed Yahoo candidate: present=$present deleted=$deleted base=$BASE_SHA"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload immutable Yahoo candidate
        id: upload
        if: ${{ always() && steps.pack.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_identity.outputs.name }}
          path: ${{ runner.temp }}/yf-artifact
          if-no-files-found: error
          retention-days: 1

  publish-yf-finance:
    needs: [clock-admission, acquire-yf-finance]
    # Runs even when acquisition failed, because the pre-split persist step ran
    # under always(): a failed fetch still persists its partial candidates and
    # its recovery state. It is skipped only when the run was plan-only, was
    # cancelled, or produced no candidate at all.
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' && (always() && needs.acquire-yf-finance.result != 'cancelled' && needs.acquire-yf-finance.outputs.plan_only != 'true' && needs.acquire-yf-finance.outputs.artifact_ready == 'true') }}
    runs-on: ubuntu-latest
    # The verified active generation is the apply base; publication owns CAS.
    timeout-minutes: 75
    permissions:
      contents: read
      actions: write
    env:
      YF_PLAN_ONLY: ${{ needs.acquire-yf-finance.outputs.plan_only }}
    outputs:
      generation: ${{ steps.publish_cloud_generation.outputs.generation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Hydrate publication base
        id: cloud_basis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          EXPECTED_GENERATION: ${{ needs.acquire-yf-finance.outputs.active_generation }}
          EXPECTED_MANIFEST: ${{ needs.acquire-yf-finance.outputs.active_manifest }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --hydrate-yahoo-finance)"
          [ "$(jq -r '.generation_id' <<< "$basis")" = "$EXPECTED_GENERATION" ]
          [ "$(jq -r '.manifest_sha256' <<< "$basis")" = "$EXPECTED_MANIFEST" ]

      - name: Download immutable Yahoo candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acquire-yf-finance.outputs.artifact_name }}
          path: ${{ runner.temp }}/yf-artifact

      - name: Validate artifact identity, base and candidate paths
        env:
          ARTIFACT_DIGEST: ${{ needs.acquire-yf-finance.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.acquire-yf-finance.outputs.artifact_name }}
          BASE_SHA: ${{ needs.acquire-yf-finance.outputs.base_sha }}
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/yf-artifact"
          for required in metadata.json candidate.tar candidate-digests.txt candidate-deleted.txt; do
            [ -f "$ART/$required" ] || { echo "::error::artifact is missing $required" >&2; exit 1; }
          done
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::GitHub artifact digest is invalid" >&2; exit 1; }
          jq -e \
            --arg schema 'yf-finance-candidate-artifact/v1' \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg base_sha "$BASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            '.schema == $schema and .artifact_name == $artifact_name
             and .base_sha == $base_sha and (.base_sha | test("^[0-9a-f]{40}$"))
             and .run_id == $run_id and .run_number == $run_number
             and .run_attempt == $run_attempt and .workflow_ref == $workflow_ref' \
            "$ART/metadata.json" > /dev/null
          ACTUAL_TAR="$(sha256sum "$ART/candidate.tar" | awk '{print $1}')"
          [ "$ACTUAL_TAR" = "$(jq -r '.candidate_tar_sha256' "$ART/metadata.json")" ] \
            || { echo "::error::candidate tar digest mismatch" >&2; exit 1; }
          ACTUAL_DIGESTS="$(sha256sum "$ART/candidate-digests.txt" | awk '{print $1}')"
          [ "$ACTUAL_DIGESTS" = "$(jq -r '.candidate_digests_sha256' "$ART/metadata.json")" ] \
            || { echo "::error::candidate digest list mismatch" >&2; exit 1; }
          ACTUAL_DELETED="$(sha256sum "$ART/candidate-deleted.txt" | awk '{print $1}')"
          [ "$ACTUAL_DELETED" = "$(jq -r '.candidate_deleted_sha256' "$ART/metadata.json")" ] \
            || { echo "::error::candidate deletion list mismatch" >&2; exit 1; }
          # The path allowlist is enforced before extraction, so a tampered or
          # mismatched artifact can never write outside the Yahoo candidate roots.
          tar -tf "$ART/candidate.tar" > "$ART/candidate-entries.txt"
          tar -tvf "$ART/candidate.tar" \
            | awk 'substr($1, 1, 1) != "-" { bad=1 } END { exit bad }' \
            || { echo "::error::artifact contains a non-regular tar entry" >&2; exit 1; }
          awk '
            length($1) == 64 && $1 !~ /[^0-9a-f]/ && substr($0, 65, 2) == "  " {
              print substr($0, 67)
              next
            }
            { bad=1 }
            END { exit bad }
          ' "$ART/candidate-digests.txt" > "$ART/candidate-digest-paths.txt" \
            || { echo "::error::candidate digest list is malformed" >&2; exit 1; }
          cat "$ART/candidate-entries.txt" "$ART/candidate-digest-paths.txt" "$ART/candidate-deleted.txt" \
            > "$ART/candidate-all-paths.txt"
          if grep -E '(^/|(^|/)\.\.?(/|$)|//)' "$ART/candidate-all-paths.txt" > "$ART/candidate-noncanonical.txt"; then
            echo "::error::artifact contains a non-canonical candidate path" >&2
            cat "$ART/candidate-noncanonical.txt" >&2
            exit 1
          fi
          if grep -vE '^(data/yf/finance/|data/yf/estimates-archive/|data/yf/_acquisition-state\.json$|data/yf/quarter_closes\.json$)' "$ART/candidate-entries.txt" > "$ART/candidate-outside.txt"; then
            echo "::error::artifact contains paths outside the Yahoo candidate allowlist" >&2
            cat "$ART/candidate-outside.txt" >&2
            exit 1
          fi
          if grep -vE '^(data/yf/finance/|data/yf/estimates-archive/|data/yf/_acquisition-state\.json$|data/yf/quarter_closes\.json$)' "$ART/candidate-deleted.txt" > "$ART/deleted-outside.txt"; then
            echo "::error::artifact deletion list contains paths outside the Yahoo candidate allowlist" >&2
            cat "$ART/deleted-outside.txt" >&2
            exit 1
          fi
          if grep -vE '^(data/yf/finance/|data/yf/estimates-archive/|data/yf/_acquisition-state\.json$|data/yf/quarter_closes\.json$)' "$ART/candidate-digest-paths.txt" > "$ART/digest-outside.txt"; then
            echo "::error::artifact digest list contains paths outside the Yahoo candidate allowlist" >&2
            cat "$ART/digest-outside.txt" >&2
            exit 1
          fi
          [ "$(wc -l < "$ART/candidate-digests.txt" | tr -d ' ')" = "$(jq -r '.candidate_present' "$ART/metadata.json")" ] \
            || { echo "::error::candidate present count mismatch" >&2; exit 1; }
          [ "$(wc -l < "$ART/candidate-entries.txt" | tr -d ' ')" = "$(jq -r '.candidate_present' "$ART/metadata.json")" ] \
            || { echo "::error::candidate tar entry count mismatch" >&2; exit 1; }
          [ "$(wc -l < "$ART/candidate-deleted.txt" | tr -d ' ')" = "$(jq -r '.candidate_deleted' "$ART/metadata.json")" ] \
            || { echo "::error::candidate deleted count mismatch" >&2; exit 1; }
          diff -u \
            <(LC_ALL=C sort "$ART/candidate-entries.txt") \
            <(LC_ALL=C sort "$ART/candidate-digest-paths.txt") \
            > "$ART/candidate-path-parity.diff" \
            || { echo "::error::candidate tar and digest paths disagree" >&2; cat "$ART/candidate-path-parity.diff" >&2; exit 1; }
          echo "artifact validated: $(wc -l < "$ART/candidate-entries.txt") entries at base $BASE_SHA"

      - name: Apply candidate onto the verified active generation
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/yf-artifact"
          tar --no-same-owner --no-same-permissions -xf "$ART/candidate.tar" -C .
          # Re-verify every extracted file against the digest recorded at pack
          # time, so transport corruption fails closed before staging.
          sha256sum -c --quiet "$ART/candidate-digests.txt"
          if [ -s "$ART/candidate-deleted.txt" ]; then
            while IFS= read -r removed; do
              [ -n "$removed" ] || continue
              rm -f -- "$removed"
            done < "$ART/candidate-deleted.txt"
          fi
          echo "Applied Yahoo candidate onto its verified active generation"

      - name: Publish Yahoo finance generation
        id: publish_cloud_generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_BINDING_ARTIFACT_DIGEST: ${{ needs.acquire-yf-finance.outputs.artifact_digest }}
          PUBLISH_EXPECTED_ACTIVE_GENERATION_ID: ${{ needs.acquire-yf-finance.outputs.active_generation }}
          PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256: ${{ needs.acquire-yf-finance.outputs.active_manifest }}
        run: |
          result="$(node scripts/publish-cloud-data-generation.mjs --family=yahoo-finance --json)"
          echo "$result"
          echo "generation=$(jq -r '.generation_id' <<< "$result")" >> "$GITHUB_OUTPUT"

      - name: Dispatch shared projection rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-manifest.yml --ref main

  price-history:
    # Reuse the existing post-close stock slot; no separate acquisition schedule.
    # Initial backfill bypasses the rolling-window producer and its UM dispatch.
    needs: [clock-admission, acquire-yf-finance, publish-yf-finance]
    if: ${{ always() && needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' && (github.event.inputs.profile == 'history-backfill' || github.event.inputs.profile == 'history-daily' || (needs.clock-admission.outputs.automatic == 'true' && needs.clock-admission.outputs.mode == 'stocks' && needs.publish-yf-finance.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
      DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
      DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
      PRICE_HISTORY_MODE: ${{ github.event.inputs.profile == 'history-backfill' && 'backfill' || 'daily' }}
    steps:
      - uses: actions/checkout@v7
      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install yfinance
        run: pip install yfinance
      - name: Read private runtime pairing and active price years
        run: |
          node --input-type=module <<'JS'
          import {mkdir,writeFile,appendFile} from 'node:fs/promises';
          import path from 'node:path';
          import {createDefaultMaterializePlane,readActiveFamilyIdentity,hydratePrivateFamily} from './scripts/materialize-cloud-data-plane-family.mjs';
          import {readGenerationAssetBytes} from './scripts/lib/cloud-data-plane-generation.mjs';
          const e=process.env;
          const plane=family=>createDefaultMaterializePlane({accountId:e.CLOUDFLARE_ACCOUNT_ID,token:e.CLOUDFLARE_API_TOKEN,
            endpoint:e.DATA_PLANE_ENDPOINT,writeKey:e.DATA_PLANE_WRITE_KEY,family});
          const selectionPlane=plane('stockanalysis-etf-detail');
          const {manifest}=await readActiveFamilyIdentity({plane:selectionPlane,family:'stockanalysis-etf-detail'});
          const selected='data/admin/data-supply-state/v1/etf-detail-selection.json';
          const asset=manifest.assets.find(a=>a.path===selected);
          if (!asset) throw new Error('Active private ETF selection is unavailable');
          await mkdir(path.dirname(selected),{recursive:true});
          await writeFile(selected,await readGenerationAssetBytes({asset,objectStore:selectionPlane.objectStore}));
          const family='yahoo-price-history', historyPlane=plane(family);
          let active=null;
          try { active=await readActiveFamilyIdentity({plane:historyPlane,family}); }
          catch(error) { if (e.PRICE_HISTORY_MODE!=='backfill'||error.code!=='ACTIVE_POINTER_UNAVAILABLE') throw error; }
          if (active) {
            const receipt=await hydratePrivateFamily(family);
            if (receipt.generation_id!==active.manifest.generation_id) throw new Error('Price-history base changed while hydrating');
            await appendFile(e.GITHUB_ENV,'PUBLISH_EXPECTED_ACTIVE_GENERATION_ID='+receipt.generation_id+'\n'
              +'PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256='+receipt.manifest_sha256+'\n');
          }
          JS
      - name: Fetch observed prices and build yearly packs
        id: history
        run: |
          status=0
          python3 scripts/fetch-yf-finance.py --price-history-mode "$PRICE_HISTORY_MODE" --sleep 0.35 --retries 2 --ticker-timeout 90 || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
      - name: Publish private price-history generation
        if: steps.history.outputs.candidate_ready == 'true'
        run: node scripts/publish-cloud-data-generation.mjs --family=yahoo-price-history --json
      - name: Enforce price-history refusal budget after publishing valid members
        if: always()
        env:
          HISTORY_EXIT_CODE: ${{ steps.history.outputs.exit_code }}
        run: test "$HISTORY_EXIT_CODE" = "0"
