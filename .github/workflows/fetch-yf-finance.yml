# yf Finance Engine v2 — bounded Yahoo Finance depth for the stock lens.
# Daily measured-stock refresh + bounded ETF refresh from the core daily basket union.
# Output: owned canonical Yahoo data. Update Manifest owns shared/public projections.

name: Fetch YF Finance Data

on:
  schedule:
    # Weekday measured-stock refresh after US close (KST Tue-Sat 08:20).
    - cron: '20 23 * * 1-5'
    # Seven minutes past, not on the hour: GitHub warns that hour-start
    # schedules may be delayed or dropped under load, and three consecutive
    # :00 slots did not fire at all.
    # Sunday-Friday, one ETF slot a day at 00:07 UTC: six runs a week on a
    # six-shard cycle. The scheduled ETF lane selects the bounded union of the
    # core daily basket (100 names, the fenok-etf-core-daily-basket.json admin
    # manifest) and the configured major/focus/RIM tracker ETF sets (155 names
    # total), so a six-way split averages about 26 regular tickers per slot.
    # The weekday is read from the clock and maps directly to the shard index
    # of that cycle, so a slot delayed past midnight lands in the next day's
    # cycle and self-corrects on the next pass.
    - cron: '7 0 * * 0-5'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Ticker limit (empty = full universe)'
        required: false
        default: ''
      shard:
        description: 'Shard i/n (e.g. 0/4, empty = no shard)'
        required: false
        default: ''
      daily_all_shards:
        description: 'Run every daily stock shard in one dispatch'
        required: false
        default: 'false'
      daily_stock_shards:
        description: 'Daily stock shard count when daily_all_shards=true'
        required: false
        default: '5'
      tickers:
        description: 'Comma-separated ticker override (e.g. TQQQ,SOXL,NVDL)'
        required: false
        default: ''
      controlled_failure_tickers:
        description: 'Owner-approved failure proof; must be a subset of tickers and is rejected on schedules'
        required: false
        default: ''
      sleep:
        description: 'Seconds between tickers'
        required: false
        default: '0.8'
      ticker_timeout:
        description: 'Seconds per ticker attempt before retry/skip (0 = disabled)'
        required: false
        default: '90'
      retries:
        description: 'Retry attempts per ticker after the first attempt'
        required: false
        default: '2'
      merge_existing:
        description: 'Merge fetched non-null fields into existing payloads'
        required: false
        default: 'false'
      profile:
        description: 'Fetch profile: daily, core, full, or etf'
        required: false
        default: 'full'
      max_age_hours:
        description: 'Skip usable local payloads newer than N hours (0 = disabled)'
        required: false
        default: '0'
      include_shares_full:
        description: 'Fetch share-count history sample'
        required: false
        default: 'false'
      stockanalysis_etfs:
        description: 'Include full StockAnalysis ETF universe in the candidate set'
        required: false
        default: 'false'
      stocks_only:
        description: 'Use only the measured stock universe, excluding ETF candidates'
        required: false
        default: 'false'
      history_gaps_only:
        description: 'Fetch only tickers missing enough local 1Y history rows'
        required: false
        default: 'false'
      history_min_rows:
        description: 'Minimum local history_1y rows before a ticker is skipped'
        required: false
        default: '200'
      plan_only:
        description: 'Resolve and print the candidate plan without Yahoo calls or data writes'
        required: false
        default: 'false'
      untracked_only:
        description: 'Bounded recovery: select pending-acquisition names before maintenance'
        required: false
        default: 'false'
      retry_limit:
        description: 'Natural retry budget for a bounded recovery dispatch'
        required: false
        default: ''
      regular_limit:
        description: 'Regular candidate budget per stable shard cycle'
        required: false
        default: ''
      untracked_limit:
        description: 'Pending-acquisition budget within the regular candidate budget'
        required: false
        default: ''
      shard_cycle_index:
        description: 'Stable shard cycle index (required for untracked recovery)'
        required: false
        default: ''
      scheduled_weekday:
        description: 'Scheduled weekday 0-5 matching the selected ETF shard'
        required: false
        default: ''
      stable_shards:
        description: 'Use deterministic hash shards (required for untracked recovery)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

# Serialize Yahoo runs against each other so an older artifact cannot publish
# after a newer acquisition. This private group does not occupy the global Git
# writer queue; only the publish job below takes fenok-data-writer.
concurrency:
  group: yf-finance-pipeline-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  acquire-yf-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      YF_PLAN_ONLY: ${{ github.event.inputs.plan_only || 'false' }}
    # Acquisition cannot commit or push: read-only token, enforced structurally
    # rather than by convention. The workflow-level write permission is retained
    # for the publish job, which inherits it.
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_name: ${{ steps.artifact_identity.outputs.name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_ready: ${{ steps.pack.outputs.ready }}
      base_sha: ${{ steps.artifact_identity.outputs.base_sha }}
      plan_only: ${{ steps.artifact_identity.outputs.plan_only }}
      fetch_outcome: ${{ steps.fetch_batch.outcome }}
      quarter_closes_outcome: ${{ steps.quarter_closes.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Expose immutable artifact identity
        id: artifact_identity
        run: |
          echo "name=yf-finance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "plan_only=$YF_PLAN_ONLY" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify lane-registry commit-shard contract
        run: node scripts/test-fetch-yf-finance-workflow.mjs

      - name: Install yfinance
        run: pip install yfinance

      - name: Run batch fetch
        id: fetch_batch
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit || '' }}
          INPUT_SHARD: ${{ github.event.inputs.shard || '' }}
          INPUT_DAILY_ALL_SHARDS: ${{ github.event.inputs.daily_all_shards || 'false' }}
          INPUT_DAILY_STOCK_SHARDS: ${{ github.event.inputs.daily_stock_shards || '5' }}
          INPUT_TICKERS: ${{ github.event.inputs.tickers || '' }}
          INPUT_CONTROLLED_FAILURE_TICKERS: ${{ github.event.inputs.controlled_failure_tickers || '' }}
          INPUT_SLEEP: ${{ github.event.inputs.sleep || '0.8' }}
          INPUT_TICKER_TIMEOUT: ${{ github.event.inputs.ticker_timeout || '90' }}
          INPUT_RETRIES: ${{ github.event.inputs.retries || '2' }}
          INPUT_MERGE_EXISTING: ${{ github.event.inputs.merge_existing || 'false' }}
          INPUT_PROFILE: ${{ github.event.inputs.profile || 'full' }}
          INPUT_MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '0' }}
          INPUT_INCLUDE_SHARES_FULL: ${{ github.event.inputs.include_shares_full || 'false' }}
          INPUT_CORE_DAILY_BASKET: 'false'
          INPUT_STOCKANALYSIS_ETFS: ${{ github.event.inputs.stockanalysis_etfs || 'false' }}
          INPUT_STOCKS_ONLY: ${{ github.event.inputs.stocks_only || 'false' }}
          INPUT_HISTORY_GAPS_ONLY: ${{ github.event.inputs.history_gaps_only || 'false' }}
          INPUT_HISTORY_MIN_ROWS: ${{ github.event.inputs.history_min_rows || '200' }}
          INPUT_UNTRACKED_ONLY: ${{ github.event.inputs.untracked_only || 'false' }}
          INPUT_PLAN_ONLY: ${{ github.event.inputs.plan_only || 'false' }}
          INPUT_RETRY_LIMIT: ${{ github.event.inputs.retry_limit || '' }}
          INPUT_REGULAR_LIMIT: ${{ github.event.inputs.regular_limit || '' }}
          INPUT_UNTRACKED_LIMIT: ${{ github.event.inputs.untracked_limit || '' }}
          INPUT_SHARD_CYCLE_INDEX: ${{ github.event.inputs.shard_cycle_index || '' }}
          INPUT_SCHEDULED_WEEKDAY: ${{ github.event.inputs.scheduled_weekday || '' }}
          INPUT_STABLE_SHARDS: ${{ github.event.inputs.stable_shards || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_UNTRACKED_ONLY" = "true" ]; then
            if [ "$INPUT_STABLE_SHARDS" != "true" ] || [ -z "$INPUT_SHARD" ] || [ -z "$INPUT_SHARD_CYCLE_INDEX" ] || [ -z "$INPUT_SCHEDULED_WEEKDAY" ]; then
              echo "::error::bounded untracked recovery requires stable_shards=true, shard=i/6, shard_cycle_index, and scheduled_weekday" >&2
              exit 2
            fi
            case "$INPUT_SHARD" in
              [0-5]/6) ;;
              *) echo "::error::bounded untracked recovery requires shard i/6 with i in 0..5" >&2; exit 2 ;;
            esac
            case "$INPUT_SCHEDULED_WEEKDAY" in
              0|1|2|3|4|5) ;;
              *) echo "::error::scheduled_weekday must be 0..5" >&2; exit 2 ;;
            esac
            if [ -z "$INPUT_LIMIT" ] || [ -z "$INPUT_RETRY_LIMIT" ] || [ -z "$INPUT_REGULAR_LIMIT" ] || [ -z "$INPUT_UNTRACKED_LIMIT" ]; then
              echo "::error::bounded untracked recovery requires limit, retry_limit, regular_limit, and untracked_limit" >&2
              exit 2
            fi
            # Bounded recovery is the same deterministic lane as the scheduled
            # ETF/core slot: bind to the core daily basket union and never
            # expand to the broad StockAnalysis ETF universe, so the fetch
            # cannot fall into the all_sources state branch.
            INPUT_CORE_DAILY_BASKET="true"
            INPUT_STOCKANALYSIS_ETFS="false"
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "20 23 * * 1-5" ]; then
              INPUT_DAILY_STOCK_SHARDS="${YF_DAILY_STOCK_SHARDS:-5}"
              INPUT_DAILY_ALL_SHARDS="${YF_DAILY_STOCK_ALL_SHARDS:-true}"
              # Default to full coverage across all daily stock shards. A cap
              # must be an explicit operator override so a larger future active
              # universe cannot silently fall outside daily freshness.
              INPUT_LIMIT="${YF_DAILY_STOCK_LIMIT:-}"
              INPUT_RETRY_LIMIT="${YF_DAILY_STOCK_RETRY_LIMIT:-40}"
              INPUT_SHARD="${YF_DAILY_STOCK_SHARD:-}"
              INPUT_SLEEP="${YF_DAILY_STOCK_SLEEP:-0.35}"
              INPUT_TICKER_TIMEOUT="${YF_DAILY_STOCK_TICKER_TIMEOUT:-45}"
              INPUT_RETRIES="${YF_DAILY_STOCK_RETRIES:-1}"
              INPUT_MERGE_EXISTING="${YF_DAILY_STOCK_MERGE_EXISTING:-true}"
              INPUT_PROFILE="${YF_DAILY_STOCK_PROFILE:-daily}"
              INPUT_MAX_AGE_HOURS="${YF_DAILY_STOCK_MAX_AGE_HOURS:-18}"
              INPUT_HISTORY_GAPS_ONLY="false"
              INPUT_HISTORY_MIN_ROWS="${YF_DAILY_STOCK_HISTORY_MIN_ROWS:-200}"
              INPUT_STOCKANALYSIS_ETFS="false"
              INPUT_STOCKS_ONLY="true"
            else
              case "$EVENT_SCHEDULE" in
                '7 0 * * 0-5') : ;;
                *) echo "::error::unrecognized scheduled ETF slot: $EVENT_SCHEDULE" >&2; exit 2 ;;
              esac
              SLOT_WEEKDAY="$(date -u +%w)"
              if [ "$SLOT_WEEKDAY" -gt 5 ]; then SLOT_WEEKDAY=5; fi
              # One slot a day, Sunday-Friday: the weekday is the shard index
              # of the six-shard weekly cycle, so no hour or slot arithmetic
              # is needed and the scheduled slot stays coherent with the
              # shard.
              DAILY_INDEX="$SLOT_WEEKDAY"
              DAILY_SHARDS=6
              echo "ETF slot: weekday=$SLOT_WEEKDAY shard=$DAILY_INDEX/$DAILY_SHARDS"
              # The scheduled lane selects the core daily basket plus the
              # configured major/focus/RIM tracker sets (155 names), not the
              # StockAnalysis universe. A six-shard split averages about 26
              # tickers per slot, so the regular cap is not binding; the outer
              # limit still has to cover the retry budget and any explicit
              # manual tickers.
              INPUT_LIMIT="${YF_WEEKLY_ETF_LIMIT:-200}"
              INPUT_RETRY_LIMIT="${YF_WEEKLY_ETF_RETRY_LIMIT:-40}"
              INPUT_REGULAR_LIMIT="${YF_WEEKLY_ETF_REGULAR_LIMIT:-140}"
              INPUT_UNTRACKED_LIMIT="${YF_WEEKLY_ETF_UNTRACKED_LIMIT:-80}"
              INPUT_SHARD_CYCLE_INDEX="${YF_WEEKLY_ETF_SHARD_CYCLE_INDEX:-}"
              # The weekday stays the real weekday, because the weekly cycle
              # index is derived from the calendar occurrence. With one slot
              # a day the slot index is the weekday itself.
              INPUT_SCHEDULED_WEEKDAY="$SLOT_WEEKDAY"
              INPUT_SCHEDULED_SLOT="$DAILY_INDEX"
              INPUT_STABLE_SHARDS="true"
              INPUT_SHARD="${DAILY_INDEX}/${DAILY_SHARDS}"
              INPUT_SLEEP="${YF_WEEKLY_ETF_SLEEP:-1.0}"
              INPUT_TICKER_TIMEOUT="${YF_WEEKLY_ETF_TICKER_TIMEOUT:-90}"
              INPUT_RETRIES="${YF_WEEKLY_ETF_RETRIES:-1}"
              INPUT_MERGE_EXISTING="${YF_WEEKLY_ETF_MERGE_EXISTING:-false}"
              INPUT_PROFILE="${YF_WEEKLY_ETF_PROFILE:-etf}"
              INPUT_MAX_AGE_HOURS="${YF_WEEKLY_ETF_MAX_AGE_HOURS:-18}"
              # A refresh pass, not an acquisition pass. history-gaps-only
              # skipped every ticker whose 1Y history was already complete, and
              # untracked-only skipped every ticker already being tracked;
              # together they meant an established ETF was never fetched again.
              INPUT_HISTORY_GAPS_ONLY="${YF_WEEKLY_ETF_HISTORY_GAPS_ONLY:-false}"
              INPUT_HISTORY_MIN_ROWS="${YF_WEEKLY_ETF_HISTORY_MIN_ROWS:-200}"
              INPUT_UNTRACKED_ONLY="${YF_WEEKLY_ETF_UNTRACKED_ONLY:-false}"
              # The scheduled lane is always bounded to the core union. Broad
              # StockAnalysis ETF acquisition remains a manual-dispatch opt-in.
              INPUT_STOCKANALYSIS_ETFS="false"
              INPUT_CORE_DAILY_BASKET="true"
              INPUT_STOCKS_ONLY="false"
            fi
            INPUT_INCLUDE_SHARES_FULL="false"
            INPUT_PLAN_ONLY="false"
          fi
          # workflow_dispatch is capped at 25 inputs, so the slot is not one of
          # them. A manual run of a multi-slot shard derives it from the shard
          # itself; the scheduled branch has already set it explicitly.
          if [ -z "${INPUT_SCHEDULED_SLOT:-}" ] && [ -n "$INPUT_SHARD" ]; then
            SHARD_COUNT="${INPUT_SHARD#*/}"
            if [ "$SHARD_COUNT" != "6" ]; then INPUT_SCHEDULED_SLOT="${INPUT_SHARD%%/*}"; fi
          fi
          echo "YF_PLAN_ONLY=${INPUT_PLAN_ONLY:-false}" >> "$GITHUB_ENV"
          echo "YF_LANE=$([ "${INPUT_STOCKS_ONLY:-false}" = "true" ] && echo stock || echo etf)" >> "$GITHUB_ENV"
          # The publish job is a separate runner, so the plan-only decision has
          # to cross the job boundary as an output; GITHUB_ENV does not.
          # Written before the provider call so a failed fetch still carries it.
          echo "plan_only=${INPUT_PLAN_ONLY:-false}" >> "$GITHUB_OUTPUT"
          ARGS="--profile ${INPUT_PROFILE:-full} --max-age-hours ${INPUT_MAX_AGE_HOURS:-0} --record-batch-state --run-id ${GITHUB_RUN_ID} --run-attempt ${GITHUB_RUN_ATTEMPT}"
          # A bounded manual recovery uses the same deterministic retry lane
          # as the scheduled ETF slot; ordinary manual dispatches keep their
          # historical non-natural behavior.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_UNTRACKED_ONLY" = "true" ]; then ARGS="$ARGS --natural-run"; fi
          if [ -n "$INPUT_LIMIT" ]; then ARGS="$ARGS --limit $INPUT_LIMIT"; fi
          if [ -n "$INPUT_RETRY_LIMIT" ]; then ARGS="$ARGS --retry-limit $INPUT_RETRY_LIMIT"; fi
          if [ -n "$INPUT_REGULAR_LIMIT" ]; then ARGS="$ARGS --regular-limit $INPUT_REGULAR_LIMIT"; fi
          if [ -n "$INPUT_UNTRACKED_LIMIT" ]; then ARGS="$ARGS --untracked-limit $INPUT_UNTRACKED_LIMIT"; fi
          if [ -n "$INPUT_SHARD_CYCLE_INDEX" ]; then ARGS="$ARGS --shard-cycle-index $INPUT_SHARD_CYCLE_INDEX"; fi
          if [ -n "$INPUT_SCHEDULED_WEEKDAY" ]; then ARGS="$ARGS --scheduled-weekday $INPUT_SCHEDULED_WEEKDAY"; fi
          if [ -n "$INPUT_SCHEDULED_SLOT" ]; then ARGS="$ARGS --scheduled-slot $INPUT_SCHEDULED_SLOT"; fi
          if [ "$INPUT_STABLE_SHARDS" = "true" ]; then ARGS="$ARGS --stable-shards"; fi
          if [ -n "$INPUT_SHARD" ]; then ARGS="$ARGS --shard $INPUT_SHARD"; fi
          if [ -n "$INPUT_TICKERS" ]; then ARGS="$ARGS --tickers $INPUT_TICKERS"; fi
          if [ -n "$INPUT_CONTROLLED_FAILURE_TICKERS" ]; then ARGS="$ARGS --controlled-failure-tickers $INPUT_CONTROLLED_FAILURE_TICKERS"; fi
          if [ "$INPUT_STOCKS_ONLY" = "true" ]; then ARGS="$ARGS --stocks-only"; fi
          if [ "$INPUT_INCLUDE_SHARES_FULL" = "true" ]; then ARGS="$ARGS --include-shares-full"; fi
          if [ "$INPUT_CORE_DAILY_BASKET" = "true" ]; then ARGS="$ARGS --core-daily-basket"; fi
          if [ "$INPUT_STOCKANALYSIS_ETFS" = "true" ]; then ARGS="$ARGS --stockanalysis-etfs"; fi
          if [ "$INPUT_HISTORY_GAPS_ONLY" = "true" ]; then ARGS="$ARGS --history-gaps-only --history-min-rows ${INPUT_HISTORY_MIN_ROWS:-200}"; fi
          if [ "$INPUT_UNTRACKED_ONLY" = "true" ]; then ARGS="$ARGS --untracked-only"; fi
          if [ "$INPUT_MERGE_EXISTING" = "true" ]; then ARGS="$ARGS --merge-existing"; fi
          if [ "$INPUT_PLAN_ONLY" = "true" ]; then ARGS="$ARGS --plan-only"; fi
          if [ "${INPUT_DAILY_ALL_SHARDS:-false}" = "true" ] && [ -z "$INPUT_SHARD" ]; then
            DAILY_STOCK_SHARDS="${INPUT_DAILY_STOCK_SHARDS:-5}"
            echo "Running all daily stock shards: ${DAILY_STOCK_SHARDS}"
            for shard_index in $(seq 0 $((DAILY_STOCK_SHARDS - 1))); do
              echo "::group::YF daily stock shard ${shard_index}/${DAILY_STOCK_SHARDS}"
              python3 scripts/fetch-yf-finance.py $ARGS --all-shards-run --shard "${shard_index}/${DAILY_STOCK_SHARDS}" --sleep "${INPUT_SLEEP:-0.8}" --ticker-timeout "${INPUT_TICKER_TIMEOUT:-90}" --retries "${INPUT_RETRIES:-2}"
              echo "::endgroup::"
            done
          else
            if [ -n "$INPUT_SHARD" ]; then ARGS="$ARGS --shard $INPUT_SHARD"; fi
            python3 scripts/fetch-yf-finance.py $ARGS --sleep "${INPUT_SLEEP:-0.8}" --ticker-timeout "${INPUT_TICKER_TIMEOUT:-90}" --retries "${INPUT_RETRIES:-2}"
          fi

      - name: Emit Yahoo batch detection attempt
        if: ${{ always() && env.YF_PLAN_ONLY != 'true' }}
        run: node scripts/emit-yahoo-batch-quote-history-attempt.mjs

      # Quarter-close calls a ~1,400-ticker universe of its own. Running it
      # after every ETF slot is what produced the repeated YFRateLimitError in
      # run 30711922590, after the fetch itself had completed cleanly. It
      # belongs to the stock lane, which owns that universe.
      - name: Refresh owned Yahoo quarter-close source
        id: quarter_closes
        if: ${{ env.YF_PLAN_ONLY != 'true' && env.YF_LANE != 'etf' }}
        run: |
          python3 scripts/build-quarter-closes.py

      # -------------------------------------------------------------------
      # Artifact boundary. Everything above this line ran without the global
      # writer lock. Nothing above commits or pushes.
      # -------------------------------------------------------------------

      - name: Pack immutable Yahoo candidate
        id: pack
        if: ${{ always() && env.YF_PLAN_ONLY != 'true' }}
        env:
          ARTIFACT_NAME: ${{ steps.artifact_identity.outputs.name }}
          BASE_SHA: ${{ steps.artifact_identity.outputs.base_sha }}
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/yf-artifact"
          rm -rf "$ART"
          mkdir -p "$ART"
          # The candidate roots are exactly the lane manifest's always_if_exists
          # declarations for this workflow plus the legacy hand list, selected
          # with the same git query the manifest stager uses, and the exclusions
          # below are read from that same manifest, so the artifact and the
          # staging step cannot disagree about the candidate set.
          git ls-files --modified --deleted --others --exclude-standard --deduplicate -z -- \
            data/yf/finance \
            data/yf/quarter_closes.json \
            data/admin/yahoo-batch-quote-history \
            data/yf/estimates-archive \
            data/admin/data-supply-state/detection-attempts/yahoo_batch_quote_history.json \
            > "$ART/candidate-paths.z"
          : > "$ART/candidate-present.z"
          : > "$ART/candidate-deleted.txt"
          : > "$ART/candidate-digests.txt"
          # The digest set must honour exactly the manifest exclusions the
          # staging step restores out of the index. A path that is digested but
          # never committed can never match the origin/main payload readback,
          # so the lane would fail on every run until a human edits that file.
          EXCLUDED="$RUNNER_TEMP/yf-candidate-excluded.txt"
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/fetch-yf-finance.yml \
            --list-excludes > "$EXCLUDED"
          present=0
          deleted=0
          while IFS= read -r -d '' candidate; do
            if grep -qxF -- "$candidate" "$EXCLUDED"; then
              continue
            fi
            if [ -e "$candidate" ]; then
              [ -f "$candidate" ] && [ ! -L "$candidate" ] \
                || { echo "::error::Yahoo candidate is not a regular file: $candidate" >&2; exit 1; }
              printf '%s\0' "$candidate" >> "$ART/candidate-present.z"
              sha256sum "$candidate" >> "$ART/candidate-digests.txt"
              present=$((present + 1))
            else
              printf '%s\n' "$candidate" >> "$ART/candidate-deleted.txt"
              deleted=$((deleted + 1))
            fi
          done < "$ART/candidate-paths.z"
          if [ "$present" -eq 0 ] && [ "$deleted" -eq 0 ]; then
            echo "No fetched Yahoo candidate changes to pack"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar --null -c -T "$ART/candidate-present.z" -f "$ART/candidate.tar"
          TAR_SHA="$(sha256sum "$ART/candidate.tar" | awk '{print $1}')"
          DIGESTS_SHA="$(sha256sum "$ART/candidate-digests.txt" | awk '{print $1}')"
          DELETED_SHA="$(sha256sum "$ART/candidate-deleted.txt" | awk '{print $1}')"
          jq -n \
            --arg schema 'yf-finance-candidate-artifact/v1' \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg base_sha "$BASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg tar_sha256 "$TAR_SHA" \
            --arg digests_sha256 "$DIGESTS_SHA" \
            --arg deleted_sha256 "$DELETED_SHA" \
            --argjson present "$present" \
            --argjson deleted "$deleted" \
            '{schema: $schema, artifact_name: $artifact_name, base_sha: $base_sha,
              run_id: $run_id, run_number: $run_number, run_attempt: $run_attempt,
              workflow_ref: $workflow_ref, candidate_tar_sha256: $tar_sha256,
              candidate_digests_sha256: $digests_sha256,
              candidate_deleted_sha256: $deleted_sha256,
              candidate_present: $present, candidate_deleted: $deleted}' \
            > "$ART/metadata.json"
          rm -f "$ART/candidate-paths.z" "$ART/candidate-present.z"
          echo "packed Yahoo candidate: present=$present deleted=$deleted base=$BASE_SHA"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload immutable Yahoo candidate
        id: upload
        if: ${{ always() && steps.pack.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_identity.outputs.name }}
          path: ${{ runner.temp }}/yf-artifact
          if-no-files-found: error
          retention-days: 1

  publish-yf-finance:
    needs: acquire-yf-finance
    # Runs even when acquisition failed, because the pre-split persist step ran
    # under always(): a failed fetch still persists its partial candidates and
    # its attempt evidence. It is skipped only when the run was plan-only, was
    # cancelled, or produced no candidate at all.
    if: ${{ always() && needs.acquire-yf-finance.result != 'cancelled' && needs.acquire-yf-finance.outputs.plan_only != 'true' && needs.acquire-yf-finance.outputs.artifact_ready == 'true' }}
    runs-on: ubuntu-latest
    # The serialized critical section is apply, stage, commit, push and
    # readback — not the provider fetch. Cap it so a stuck publish cannot hold
    # the global writer queue for the acquisition timeout.
    timeout-minutes: 45
    env:
      YF_PLAN_ONLY: ${{ needs.acquire-yf-finance.outputs.plan_only }}
    concurrency:
      group: fenok-data-writer-refs/heads/main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download immutable Yahoo candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acquire-yf-finance.outputs.artifact_name }}
          path: ${{ runner.temp }}/yf-artifact

      - name: Validate artifact identity, base and candidate paths
        env:
          ARTIFACT_DIGEST: ${{ needs.acquire-yf-finance.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.acquire-yf-finance.outputs.artifact_name }}
          BASE_SHA: ${{ needs.acquire-yf-finance.outputs.base_sha }}
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/yf-artifact"
          for required in metadata.json candidate.tar candidate-digests.txt candidate-deleted.txt; do
            [ -f "$ART/$required" ] || { echo "::error::artifact is missing $required" >&2; exit 1; }
          done
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::GitHub artifact digest is invalid" >&2; exit 1; }
          jq -e \
            --arg schema 'yf-finance-candidate-artifact/v1' \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg base_sha "$BASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            '.schema == $schema and .artifact_name == $artifact_name
             and .base_sha == $base_sha and (.base_sha | test("^[0-9a-f]{40}$"))
             and .run_id == $run_id and .run_number == $run_number
             and .run_attempt == $run_attempt and .workflow_ref == $workflow_ref' \
            "$ART/metadata.json" > /dev/null
          ACTUAL_TAR="$(sha256sum "$ART/candidate.tar" | awk '{print $1}')"
          [ "$ACTUAL_TAR" = "$(jq -r '.candidate_tar_sha256' "$ART/metadata.json")" ] \
            || { echo "::error::candidate tar digest mismatch" >&2; exit 1; }
          ACTUAL_DIGESTS="$(sha256sum "$ART/candidate-digests.txt" | awk '{print $1}')"
          [ "$ACTUAL_DIGESTS" = "$(jq -r '.candidate_digests_sha256' "$ART/metadata.json")" ] \
            || { echo "::error::candidate digest list mismatch" >&2; exit 1; }
          ACTUAL_DELETED="$(sha256sum "$ART/candidate-deleted.txt" | awk '{print $1}')"
          [ "$ACTUAL_DELETED" = "$(jq -r '.candidate_deleted_sha256' "$ART/metadata.json")" ] \
            || { echo "::error::candidate deletion list mismatch" >&2; exit 1; }
          # The path allowlist is enforced before extraction, so a tampered or
          # mismatched artifact can never write outside the Yahoo candidate roots.
          tar -tf "$ART/candidate.tar" > "$ART/candidate-entries.txt"
          tar -tvf "$ART/candidate.tar" \
            | awk 'substr($1, 1, 1) != "-" { bad=1 } END { exit bad }' \
            || { echo "::error::artifact contains a non-regular tar entry" >&2; exit 1; }
          awk '
            length($1) == 64 && $1 !~ /[^0-9a-f]/ && substr($0, 65, 2) == "  " {
              print substr($0, 67)
              next
            }
            { bad=1 }
            END { exit bad }
          ' "$ART/candidate-digests.txt" > "$ART/candidate-digest-paths.txt" \
            || { echo "::error::candidate digest list is malformed" >&2; exit 1; }
          cat "$ART/candidate-entries.txt" "$ART/candidate-digest-paths.txt" "$ART/candidate-deleted.txt" \
            > "$ART/candidate-all-paths.txt"
          if grep -E '(^/|(^|/)\.\.?(/|$)|//)' "$ART/candidate-all-paths.txt" > "$ART/candidate-noncanonical.txt"; then
            echo "::error::artifact contains a non-canonical candidate path" >&2
            cat "$ART/candidate-noncanonical.txt" >&2
            exit 1
          fi
          if grep -vE '^(data/yf/finance/|data/yf/estimates-archive/|data/admin/yahoo-batch-quote-history/|data/yf/quarter_closes\.json$|data/admin/data-supply-state/detection-attempts/yahoo_batch_quote_history\.json$)' "$ART/candidate-entries.txt" > "$ART/candidate-outside.txt"; then
            echo "::error::artifact contains paths outside the Yahoo candidate allowlist" >&2
            cat "$ART/candidate-outside.txt" >&2
            exit 1
          fi
          if grep -vE '^(data/yf/finance/|data/yf/estimates-archive/|data/admin/yahoo-batch-quote-history/|data/yf/quarter_closes\.json$|data/admin/data-supply-state/detection-attempts/yahoo_batch_quote_history\.json$)' "$ART/candidate-deleted.txt" > "$ART/deleted-outside.txt"; then
            echo "::error::artifact deletion list contains paths outside the Yahoo candidate allowlist" >&2
            cat "$ART/deleted-outside.txt" >&2
            exit 1
          fi
          if grep -vE '^(data/yf/finance/|data/yf/estimates-archive/|data/admin/yahoo-batch-quote-history/|data/yf/quarter_closes\.json$|data/admin/data-supply-state/detection-attempts/yahoo_batch_quote_history\.json$)' "$ART/candidate-digest-paths.txt" > "$ART/digest-outside.txt"; then
            echo "::error::artifact digest list contains paths outside the Yahoo candidate allowlist" >&2
            cat "$ART/digest-outside.txt" >&2
            exit 1
          fi
          [ "$(wc -l < "$ART/candidate-digests.txt" | tr -d ' ')" = "$(jq -r '.candidate_present' "$ART/metadata.json")" ] \
            || { echo "::error::candidate present count mismatch" >&2; exit 1; }
          [ "$(wc -l < "$ART/candidate-entries.txt" | tr -d ' ')" = "$(jq -r '.candidate_present' "$ART/metadata.json")" ] \
            || { echo "::error::candidate tar entry count mismatch" >&2; exit 1; }
          [ "$(wc -l < "$ART/candidate-deleted.txt" | tr -d ' ')" = "$(jq -r '.candidate_deleted' "$ART/metadata.json")" ] \
            || { echo "::error::candidate deleted count mismatch" >&2; exit 1; }
          diff -u \
            <(LC_ALL=C sort "$ART/candidate-entries.txt") \
            <(LC_ALL=C sort "$ART/candidate-digest-paths.txt") \
            > "$ART/candidate-path-parity.diff" \
            || { echo "::error::candidate tar and digest paths disagree" >&2; cat "$ART/candidate-path-parity.diff" >&2; exit 1; }
          echo "artifact validated: $(wc -l < "$ART/candidate-entries.txt") entries at base $BASE_SHA"

      - name: Apply candidate onto latest main
        env:
          BASE_SHA: ${{ needs.acquire-yf-finance.outputs.base_sha }}
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/yf-artifact"
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "$BASE_SHA"
          git fetch --deepen=50 origin main || git fetch origin main
          git merge-base --is-ancestor "$BASE_SHA" origin/main \
            || { echo "::error::Yahoo candidate base is not an ancestor of latest main" >&2; exit 1; }
          cat "$ART/candidate-entries.txt" "$ART/candidate-deleted.txt" \
            | sort -u > "$ART/candidate-all.txt"
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            if ! git diff --quiet "$BASE_SHA" origin/main -- "$candidate"; then
              echo "::error::stale Yahoo candidate path changed since acquisition: $candidate" >&2
              exit 1
            fi
          done < "$ART/candidate-all.txt"
          git checkout -B main origin/main
          tar --no-same-owner --no-same-permissions -xf "$ART/candidate.tar" -C .
          # Re-verify every extracted file against the digest recorded at pack
          # time, so transport corruption fails closed before staging.
          sha256sum -c --quiet "$ART/candidate-digests.txt"
          if [ -s "$ART/candidate-deleted.txt" ]; then
            while IFS= read -r removed; do
              [ -n "$removed" ] || continue
              rm -f -- "$removed"
            done < "$ART/candidate-deleted.txt"
          fi
          echo "applied Yahoo candidate onto $(git rev-parse HEAD)"

      - name: Persist fetched Yahoo source data
        id: persist_yahoo_state
        if: ${{ always() && env.YF_PLAN_ONLY != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Phase 1: consume the generated policy while retaining the legacy
          # hand list as parity defense until this workflow's natural proof.
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/fetch-yf-finance.yml \
            --stage always_if_exists
          git add -- \
            data/yf/finance \
            data/yf/quarter_closes.json \
            data/admin/yahoo-batch-quote-history
          git restore --staged --worktree -- data/yf/finance/_summary.json
          if git diff --staged --quiet; then
            echo "No fetched Yahoo candidate changes to persist"
            echo "persisted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: persist yf finance candidates"
          for attempt in $(seq 1 5); do
            if ! git pull --rebase --autostash origin main; then
              echo "candidate rebase failed on attempt ${attempt}; aborting and retrying"
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
              continue
            fi
            if git push; then
              echo "persisted=true" >> "$GITHUB_OUTPUT"
              echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "candidate push race on attempt ${attempt}; retrying after rebase"
            sleep 3
          done
          echo "candidate push failed after retrying concurrent main updates"
          exit 1

      - name: Read back landed commit from origin/main
        id: readback
        if: ${{ steps.persist_yahoo_state.outputs.persisted == 'true' }}
        env:
          PUSHED_SHA: ${{ steps.persist_yahoo_state.outputs.pushed_sha }}
        run: |
          set -euo pipefail
          # DEC-305: a publish is confirmed only by a landed commit read back
          # from origin/main, never by a green push step.
          git fetch --deepen=50 origin main || git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$PUSHED_SHA" = "$REMOTE_SHA" ]; then
            echo "origin/main readback confirmed at $PUSHED_SHA"
          elif git merge-base --is-ancestor "$PUSHED_SHA" origin/main; then
            echo "origin/main readback confirmed: $PUSHED_SHA is an ancestor of $REMOTE_SHA"
          else
            echo "::error::origin/main readback did not contain pushed commit $PUSHED_SHA" >&2
            exit 1
          fi
          while read -r expected path; do
            [ -n "$path" ] || continue
            actual="$(git show "origin/main:$path" | sha256sum | awk '{print $1}')"
            [ "$actual" = "$expected" ] \
              || { echo "::error::origin/main payload digest mismatch: $path" >&2; exit 1; }
          done < "$RUNNER_TEMP/yf-artifact/candidate-digests.txt"
          while IFS= read -r removed; do
            [ -n "$removed" ] || continue
            if git cat-file -e "origin/main:$removed" 2>/dev/null; then
              echo "::error::origin/main still contains deleted Yahoo candidate: $removed" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/yf-artifact/candidate-deleted.txt"
          echo "confirmed=true" >> "$GITHUB_OUTPUT"

      - name: Publish failed Yahoo attempt evidence
        if: ${{ always() && env.YF_PLAN_ONLY != 'true' && (needs.acquire-yf-finance.outputs.fetch_outcome == 'failure' || needs.acquire-yf-finance.outputs.quarter_closes_outcome == 'failure') && steps.persist_yahoo_state.outcome == 'success' && steps.persist_yahoo_state.outputs.persisted == 'true' && steps.readback.outputs.confirmed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-manifest.yml --ref main

      - name: Dispatch shared projection rebuild
        if: ${{ env.YF_PLAN_ONLY != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-manifest.yml --ref main
