# Guardrail for workflow parse errors.
#
# If a workflow YAML file is malformed, GitHub may create a failed run with
# no jobs and no downloadable logs. This separate guard parses workflow YAML
# files so syntax failures leave a normal, readable job log.
name: Validate GitHub Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ops/fixtures/workflow-actionlint/**'
      - 'scripts/ops/fixtures/workflow-concurrency/**'
      - 'scripts/ops/validate-workflow-actionlint.sh'
      - 'scripts/ops/validate-workflow-yaml.rb'
      - 'scripts/ops/check-pipeline-job-health.mjs'
      - 'scripts/ops/emit-alarm-state.mjs'
      - 'scripts/ops/test-check-pipeline-job-health.mjs'
      - 'scripts/ops/test-emit-alarm-state.mjs'
      - 'scripts/check-lane-commit-manifest-inventory.mjs'
      - 'scripts/ops/check-global-writer-queue.mjs'
      - 'scripts/ops/test-check-global-writer-queue.mjs'
      - 'scripts/fetch-sentiment.mjs'
      - 'scripts/fetch-fred-banking.mjs'
      - 'scripts/fetch-treasury-tga.mjs'
      - 'scripts/fetch-yahoo-ticker.mjs'
      - 'scripts/test-fetch-producers-public-write-fence.mjs'
      - 'scripts/test-build-producers-public-write-fence.mjs'
      - 'scripts/test-build-stocks-analyzer-manifest.mjs'
      - 'scripts/test-sec13f-source-route.mjs'
      - 'scripts/build-stocks-analyzer.mjs'
      - 'scripts/build-13f-enrichment-backfill.mjs'
      - 'scripts/build-13f-integrity-indexes.mjs'
      - 'scripts/build-13f-trades.mjs'
      - 'scripts/build-13f-portfolio-views.mjs'
      - 'scripts/build-guru-holders-index.mjs'
      - 'scripts/build-revision-movers.mjs'
      - 'scripts/build-industry-benchmarks.mjs'
      - 'scripts/build-calendar-prev.mjs'
      - 'scripts/materialize-update-manifest-routes.mjs'
      - 'scripts/stage-update-manifest-central.mjs'
      - 'scripts/test-update-manifest-central-staging.mjs'
      - 'scripts/test-lane-commit-manifest-parity.mjs'
      - 'scripts/test-build-data-supply-detection-floor.mjs'
      - 'scripts/fixtures/data_supply/detection_floor/**'
      - 'scripts/fetch-nasdaq-giw-sox-constituents.mjs'
      - 'scripts/test-fetch-nasdaq-giw-sox-constituents.mjs'
      - 'scripts/build-market-facts.py'
      - 'scripts/test_build_market_facts.py'
      - 'scripts/fetch-stockanalysis.py'
      - 'scripts/test_fetch_stockanalysis_fixtures.py'
      - 'scripts/export-computed-signals.mjs'
      - 'scripts/test-export-computed-signals.mjs'
      - 'scripts/test-coordinate-computed-signals-workflow.mjs'
      - 'scripts/stage-lane-manifest.sh'
      - 'scripts/test-pipeline-failure-alarm-manifest.mjs'
      - 'scripts/test-global-writer-queue-manifest.mjs'
      - 'scripts/test-stage-lane-manifest.mjs'
      - 'scripts/test-update-manifest-*.mjs'
      - 'scripts/update-manifest-projections.sh'
      - 'scripts/materialize-site-metadata.mjs'
      - 'scripts/test-materialize-site-metadata.mjs'
      - 'scripts/test-site-metadata-canonical-only.mjs'
      - '100x/data/metadata/**'
      - 'alpha-scout/data/metadata/**'
      - 'data/metadata/**'
      - '100xfenok-next/public/data/metadata/**'
      - 'scripts/lib/lane-registry.mjs'
      - 'scripts/build-lane-commit-manifest.mjs'
      - 'data/admin/lane-commit-manifest.json'
      - 'scripts/persist-cloud-publish-outcome.mjs'
      - 'scripts/lib/publish-outcome-shard.mjs'
      - 'scripts/test-sync-update-manifest-trigger-paths.mjs'
      - '100xfenok-next/package.json'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ops/fixtures/workflow-actionlint/**'
      - 'scripts/ops/fixtures/workflow-concurrency/**'
      - 'scripts/ops/validate-workflow-actionlint.sh'
      - 'scripts/ops/validate-workflow-yaml.rb'
      - 'scripts/ops/check-pipeline-job-health.mjs'
      - 'scripts/ops/emit-alarm-state.mjs'
      - 'scripts/ops/test-check-pipeline-job-health.mjs'
      - 'scripts/ops/test-emit-alarm-state.mjs'
      - 'scripts/check-lane-commit-manifest-inventory.mjs'
      - 'scripts/ops/check-global-writer-queue.mjs'
      - 'scripts/ops/test-check-global-writer-queue.mjs'
      - 'scripts/fetch-sentiment.mjs'
      - 'scripts/fetch-fred-banking.mjs'
      - 'scripts/fetch-treasury-tga.mjs'
      - 'scripts/fetch-yahoo-ticker.mjs'
      - 'scripts/test-fetch-producers-public-write-fence.mjs'
      - 'scripts/test-build-producers-public-write-fence.mjs'
      - 'scripts/test-build-stocks-analyzer-manifest.mjs'
      - 'scripts/test-sec13f-source-route.mjs'
      - 'scripts/build-stocks-analyzer.mjs'
      - 'scripts/build-13f-enrichment-backfill.mjs'
      - 'scripts/build-13f-integrity-indexes.mjs'
      - 'scripts/build-13f-trades.mjs'
      - 'scripts/build-13f-portfolio-views.mjs'
      - 'scripts/build-guru-holders-index.mjs'
      - 'scripts/build-revision-movers.mjs'
      - 'scripts/build-industry-benchmarks.mjs'
      - 'scripts/build-calendar-prev.mjs'
      - 'scripts/materialize-update-manifest-routes.mjs'
      - 'scripts/stage-update-manifest-central.mjs'
      - 'scripts/test-update-manifest-central-staging.mjs'
      - 'scripts/test-lane-commit-manifest-parity.mjs'
      - 'scripts/test-build-data-supply-detection-floor.mjs'
      - 'scripts/fixtures/data_supply/detection_floor/**'
      - 'scripts/fetch-nasdaq-giw-sox-constituents.mjs'
      - 'scripts/test-fetch-nasdaq-giw-sox-constituents.mjs'
      - 'scripts/build-market-facts.py'
      - 'scripts/test_build_market_facts.py'
      - 'scripts/fetch-stockanalysis.py'
      - 'scripts/test_fetch_stockanalysis_fixtures.py'
      - 'scripts/export-computed-signals.mjs'
      - 'scripts/test-export-computed-signals.mjs'
      - 'scripts/test-coordinate-computed-signals-workflow.mjs'
      - 'scripts/stage-lane-manifest.sh'
      - 'scripts/test-pipeline-failure-alarm-manifest.mjs'
      - 'scripts/test-global-writer-queue-manifest.mjs'
      - 'scripts/test-stage-lane-manifest.mjs'
      - 'scripts/test-update-manifest-*.mjs'
      - 'scripts/update-manifest-projections.sh'
      - 'scripts/materialize-site-metadata.mjs'
      - 'scripts/test-materialize-site-metadata.mjs'
      - 'scripts/test-site-metadata-canonical-only.mjs'
      - '100x/data/metadata/**'
      - 'alpha-scout/data/metadata/**'
      - 'data/metadata/**'
      - '100xfenok-next/public/data/metadata/**'
      - 'scripts/lib/lane-registry.mjs'
      - 'scripts/build-lane-commit-manifest.mjs'
      - 'data/admin/lane-commit-manifest.json'
      - 'scripts/persist-cloud-publish-outcome.mjs'
      - 'scripts/lib/publish-outcome-shard.mjs'
      - 'scripts/test-sync-update-manifest-trigger-paths.mjs'
      - '100xfenok-next/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflow-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse workflow YAML
        run: ruby scripts/ops/validate-workflow-yaml.rb

      # Prove unknown keys, invalid queue enums, and max+cancel incompatibility
      # all fail while GitHub's supported queue modes pass.
      - name: Prove the concurrency-schema guard
        run: |
          set -euo pipefail
          fixture_dir="scripts/ops/fixtures/workflow-concurrency"
          for invalid in \
            invalid-unknown-concurrency-key.yml \
            invalid-queue-value.yml \
            invalid-max-cancel.yml; do
            if ruby scripts/ops/validate-workflow-yaml.rb "$fixture_dir/$invalid" >/dev/null 2>&1; then
              echo "FAIL regression fixture unexpectedly passed: $invalid" >&2
              exit 1
            fi
          done
          ruby scripts/ops/validate-workflow-yaml.rb "$fixture_dir/valid-concurrency.yml"
          echo "PASS concurrency-schema guard enforces GitHub's queue contract"

      - name: Validate lane manifest staging
        run: npm --prefix 100xfenok-next run qa:lane-manifest-staging

      - name: Validate public-mirror coverage (frozen-mirror gate)
        run: |
          node scripts/test-materialize-site-metadata.mjs
          node scripts/test-site-metadata-canonical-only.mjs
          node scripts/check-public-mirror-coverage.mjs

      - name: Validate producer public-write fence (canonical-only batch)
        run: |
          node scripts/test-fetch-producers-public-write-fence.mjs
          node scripts/test-build-producers-public-write-fence.mjs
          node scripts/test-build-stocks-analyzer-manifest.mjs
          node scripts/test-fetch-nasdaq-giw-sox-constituents.mjs
          python3 -m unittest scripts/test_build_market_facts.py
          python3 -m unittest scripts.test_fetch_stockanalysis_fixtures.StockanalysisFetcherFixtureTest.test_default_cli_writes_canonical_only_never_public_mirror

      - name: Validate alarm workflow contracts
        run: npm --prefix 100xfenok-next run qa:alarm-state

      - name: Validate Update Manifest policy
        run: |
          node scripts/test-update-manifest-runner.mjs
          node scripts/test-update-manifest-workflow.mjs
          node scripts/test-update-manifest-materializations.mjs
          node scripts/test-update-manifest-central-staging.mjs
          node scripts/test-lane-commit-manifest-parity.mjs
          node scripts/test-build-data-supply-detection-floor.mjs
          node scripts/test-update-manifest-rebuild-policy.mjs
          node scripts/test-update-manifest-dispatch-decoupling.mjs
          node scripts/test-sync-update-manifest-trigger-paths.mjs

      - name: Validate computed-signals coordinator and exporter contracts
        run: |
          node scripts/test-export-computed-signals.mjs
          node scripts/test-coordinate-computed-signals-workflow.mjs

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
          echo "ACTIONLINT_BIN=$RUNNER_TEMP/actionlint" >> "$GITHUB_ENV"

      - name: Validate workflow expressions
        run: bash scripts/ops/validate-workflow-actionlint.sh
