name: Validate GitHub Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - '100xfenok-next/scripts/**'
      - '100xfenok-next/package.json'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - '100xfenok-next/scripts/**'
      - '100xfenok-next/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflow-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse workflow YAML
        run: ruby scripts/ops/validate-workflow-yaml.rb

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
          echo "ACTIONLINT_BIN=$RUNNER_TEMP/actionlint" >> "$GITHUB_ENV"

      - name: Validate workflow expressions
        run: bash scripts/ops/validate-workflow-actionlint.sh

      - name: Calendar and alarm decisions
        run: |
          node scripts/ops/test-probe-limits-match-cadence.mjs
          node scripts/ops/test-missed-schedule-window.mjs
          node scripts/ops/test-alarm-liveness.mjs
          node --test scripts/ops/test-sync-budget-issue.mjs
          node scripts/ops/test-data-supply-etf-telemetry-budget.mjs
          node scripts/ops/test-alarm-blindness.mjs
          node scripts/ops/test-cost-gate-rate-limit.mjs
          node scripts/ops/test-alarm-resolution-carry.mjs
          npm --prefix 100xfenok-next run qa:alarm-state
          node scripts/test-build-data-supply-detection-floor.mjs

      - name: Publication and projection behavior
        run: |
          npm --prefix 100xfenok-next run qa:lane-manifest-staging
          node scripts/test-materialize-site-metadata.mjs
          node scripts/test-site-metadata-canonical-only.mjs
          node scripts/test-manifest-halves-agree.mjs
          node scripts/ops/test-family-publish-exclusions.mjs
          node scripts/test-update-manifest-runner.mjs
          node scripts/test-update-manifest-central-staging.mjs
          node scripts/test-update-manifest-materializations.mjs
          node scripts/test-export-computed-signals.mjs
          node scripts/test-prepare-lane-commit.mjs
          node scripts/test-family-health.mjs

      - name: Producer and reader logic
        run: |
          node scripts/test-fetch-yahoo-ticker.mjs
          node scripts/test-build-stocks-analyzer-manifest.mjs
          node scripts/test-fetch-nasdaq-giw-sox-constituents.mjs
          python3 -m unittest scripts.test_stockanalysis_etf_lifecycle scripts.test_build_market_facts scripts.test_update_manifest_derived_description
