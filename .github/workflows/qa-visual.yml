name: QA Visual

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed site for the requested snapshot or journey'
        required: false
        default: 'https://100xfenok.etloveaui.workers.dev'
      suite:
        description: 'Requested snapshot scope'
        required: false
        type: choice
        default: all
        options:
          - all
          - journey

concurrency:
  group: qa-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: 100xfenok-next

jobs:
  visual:
    name: visual-${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ inputs.suite == 'all' }}
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-1440, mobile-390]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 100xfenok-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run requested visual QA
        env:
          CI: "true"
          PROJECT: ${{ matrix.project }}
          QA_BASE_URL: ${{ inputs.base_url || 'https://100xfenok.etloveaui.workers.dev' }}
          SUITE: ${{ inputs.suite || 'all' }}
          FENOK_VERIFY_TOKEN: ${{ secrets.FENOK_VERIFY_TOKEN }}
        run: |
          case "$SUITE" in
            all) npm run qa:visual -- --project="$PROJECT";;
            journey) npm run qa:visual -- tests/visual/journey.spec.ts --project="$PROJECT";;
            *) echo "unsupported visual suite" >&2; exit 64;;
          esac
