name: QA Visual

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target to photograph (defaults to the live Worker)'
        required: false
        default: 'https://100xfenok.etloveaui.workers.dev'
      responsive_routes:
        description: "Optional comma-separated routes for a focused responsive recheck"
        required: false
        default: ""
      suite:
        description: 'Interaction scope (all keeps the existing snapshot coverage)'
        required: false
        type: choice
        default: all
        options:
          - all
          - journey
          - responsive
          - investor-isolated
          - investor-evidence

concurrency:
  group: qa-visual-${{ github.ref }}${{ inputs.suite == 'investor-evidence' && '-evidence' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: 100xfenok-next

jobs:
  visual:
    name: visual-${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ inputs.suite == 'all' }}
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON((inputs.suite == 'investor-isolated' || inputs.suite == 'investor-evidence') && '["isolated"]' || inputs.suite == 'responsive' && '["mobile", "tablet"]' || '["desktop-1440", "mobile-390"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 100xfenok-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Owner-requested UI iteration must not repeatedly load production.
      # Reuse the guarded production build and serve its checked-in public data
      # inside this one runner; browser requests to other origins are blocked.
      - name: Build isolated investor preview
        if: ${{ inputs.suite == 'investor-isolated' || inputs.suite == 'investor-evidence' }}
        shell: bash
        env:
          FENOK_REMOTE_HEAVY_NESTED_EXECUTION: "1"
          FENOK_REMOTE_HEAVY_EXPECTED_REVISION: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: "1"
          QA_EVIDENCE_ONLY: ${{ inputs.suite == 'investor-evidence' && '1' || '0' }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --show-toplevel
          node scripts/build-ink4-contrast-fixture.mjs
          node --input-type=module -e 'import { emitDetectionExpectedFixture } from "../scripts/build-data-supply-detection-floor.mjs"; emitDetectionExpectedFixture();'
          npm run qa:journey-continuity
          node ../scripts/build-guru-holders-index.mjs
          repo_root="$(git rev-parse --show-toplevel)"
          floor_output="$(mktemp -d /tmp/investor-detection-floor-XXXXXX)"
          trap 'rm -rf "$floor_output"' EXIT
          mkdir -p "$repo_root/data/admin/data-supply-state/detection-attempts"
          node ../scripts/build-data-supply-detection-floor.mjs \
            --artifact-root "$repo_root" \
            --attempt-shard-root "$repo_root/data/admin/data-supply-state/detection-attempts" \
            --calendars "$repo_root/scripts/lib/data-supply-detection-calendars.json" \
            --now "$(node -e 'process.stdout.write(new Date().toISOString())')" \
            --output-root "$floor_output"
          node ../scripts/build-data-supply-detection-floor.mjs --verify-report "$floor_output/data-supply-detection-floor.json"
          install -m 0644 "$floor_output/data-supply-detection-floor.json" "$repo_root/data/admin/data-supply-detection-floor.json"
          npm run build:fenok-data-health-kpi
          if [ "$QA_EVIDENCE_ONLY" = "1" ]; then
            npm run qa:fenok-data-health-kpi:artifact
          else
            npm run cf:build
          fi

      - name: Run isolated investor UI verification
        shell: bash
        if: ${{ inputs.suite == 'investor-isolated' }}
        env:
          CI: "true"
          QA_BASE_URL: http://127.0.0.1:3107
          QA_MOBILE_UX_ISOLATED: "1"
          QA_MOBILE_UX_VIEWPORTS: narrow,mobile,tablet-portrait,tablet-mid,tablet,tablet-landscape
          QA_MOBILE_UX_ROUTES: /superinvestors,/superinvestors?tab=investors,/superinvestors?tab=stocks,/superinvestors?guru=blackrock,/superinvestors?tab=trades,/superinvestors?tab=insights,/superinvestors?tab=graph,/screener,/screener?mode=analyze
          QA_MOBILE_UX_OUTPUT_DIR: test-results/responsive
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          npm run start:qa -- --hostname 127.0.0.1 --port 3107 > /tmp/investor-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3107/superinvestors/ -o /dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/investor-preview.log; exit 1; fi
          chromium_status=0
          QA_BROWSER_NAME=chromium QA_MOBILE_UX_OUTPUT_DIR=test-results/responsive/chromium npm run qa:mobile-ux || chromium_status=$?
          webkit_status=0
          QA_BROWSER_NAME=webkit QA_MOBILE_UX_VIEWPORTS=mobile,tablet-portrait,tablet-mid QA_MOBILE_UX_OUTPUT_DIR=test-results/responsive/webkit npm run qa:mobile-ux || webkit_status=$?
          if [ "$chromium_status" -ne 0 ] || [ "$webkit_status" -ne 0 ]; then exit 1; fi

      # This workflow used to build the app itself with a raw
      # NEXT_BUILD_TARGET=cloudflare next build, a combination no real build
      # path uses: the runtime build targets runtime and the Cloudflare build
      # goes through opennextjs-cloudflare. That invocation rotted and by
      # 2026-08-20 it died in file tracing with "Encountered unexpected file in
      # NFT list", so the job produced no screenshots at all. The visual config
      # already skips its local server whenever QA_BASE_URL is set, so the
      # build and server layers are removed rather than repaired and the run
      # photographs the deployed site directly.
      - name: Run visual QA against the deployed site
        if: ${{ inputs.suite != 'investor-isolated' && inputs.suite != 'investor-evidence' }}
        env:
          CI: "true"
          PROJECT: ${{ matrix.project }}
          QA_BASE_URL: ${{ inputs.base_url || 'https://100xfenok.etloveaui.workers.dev' }}
          SUITE: ${{ inputs.suite || 'all' }}
          RESPONSIVE_ROUTES: ${{ inputs.responsive_routes }}
        run: |
          case "$SUITE" in
            all) npm run qa:visual -- --project="$PROJECT";;
            journey) npm run qa:visual -- tests/visual/journey.spec.ts --project="$PROJECT";;
            responsive)
              case "$PROJECT" in
                mobile) export QA_MOBILE_UX_VIEWPORTS="narrow,mobile";;
                tablet) export QA_MOBILE_UX_VIEWPORTS="tablet-portrait,tablet-mid,tablet,tablet-landscape";;
                *) echo "unsupported responsive viewport group" >&2; exit 64;;
              esac
              export QA_MOBILE_UX_ROUTES="/,/screener,/screener?mode=analyze,/stock/NVDA,/stock/NVDA?tab=financials,/superinvestors,/superinvestors?tab=investors,/superinvestors?guru=blackrock,/etfs,/etfs/SPY,/market-valuation,/regime,/sectors,/portfolio,/macro-chart,/superinvestors?tab=stocks"
              if [ -n "$RESPONSIVE_ROUTES" ]; then export QA_MOBILE_UX_ROUTES="$RESPONSIVE_ROUTES"; fi
              export QA_MOBILE_UX_OUTPUT_DIR="test-results/responsive"
              npm run qa:mobile-ux
              ;;
            *) echo "unsupported visual suite" >&2; exit 64;;
          esac

      - name: Upload visual report
        if: always() && inputs.suite != 'responsive' && inputs.suite != 'investor-isolated' && inputs.suite != 'investor-evidence'
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-${{ matrix.project }}
          path: 100xfenok-next/playwright-report/visual/
          retention-days: 7

      - name: Upload visual diffs
        if: always() && inputs.suite != 'responsive' && inputs.suite != 'investor-isolated' && inputs.suite != 'investor-evidence'
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-${{ matrix.project }}
          path: 100xfenok-next/test-results/visual/
          retention-days: 7

      - name: Upload responsive evidence
        if: always() && (inputs.suite == 'responsive' || inputs.suite == 'investor-isolated')
        uses: actions/upload-artifact@v4
        with:
          name: responsive-${{ matrix.project }}
          path: 100xfenok-next/test-results/responsive/
          retention-days: 7

      - name: Upload regenerated investor evidence
        if: always() && (inputs.suite == 'investor-isolated' || inputs.suite == 'investor-evidence')
        uses: actions/upload-artifact@v4
        with:
          name: investor-derived-evidence
          path: |
            100xfenok-next/scripts/fixtures/ink4-contrast-sites.json
            scripts/fixtures/data_supply/detection_floor/cases.expected.json
            100xfenok-next/public/data/admin/fenok-data-health-kpi.json
            data/sec-13f/analytics/guru_holders_index.json
            data/admin/fenok-data-health-kpi.json
            data/admin/data-supply-detection-floor.json
          retention-days: 7
