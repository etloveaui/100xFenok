name: QA Visual

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target to photograph (defaults to the live Worker)'
        required: false
        default: 'https://100xfenok.etloveaui.workers.dev'

concurrency:
  group: qa-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: 100xfenok-next

jobs:
  visual:
    name: visual-${{ matrix.project }}
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-1440, mobile-390]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 100xfenok-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      # This workflow used to build the app itself with a raw
      # NEXT_BUILD_TARGET=cloudflare next build, a combination no real build
      # path uses: the runtime build targets runtime and the Cloudflare build
      # goes through opennextjs-cloudflare. That invocation rotted and by
      # 2026-08-20 it died in file tracing with "Encountered unexpected file in
      # NFT list", so the job produced no screenshots at all. The visual config
      # already skips its local server whenever QA_BASE_URL is set, so the
      # build and server layers are removed rather than repaired and the run
      # photographs the deployed site directly.
      - name: Run visual QA against the deployed site
        env:
          CI: "true"
          PROJECT: ${{ matrix.project }}
          QA_BASE_URL: ${{ inputs.base_url || 'https://100xfenok.etloveaui.workers.dev' }}
        run: npm run qa:visual -- --project="$PROJECT"

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-${{ matrix.project }}
          path: 100xfenok-next/playwright-report/visual/
          retention-days: 7

      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-${{ matrix.project }}
          path: 100xfenok-next/test-results/visual/
          retention-days: 7
