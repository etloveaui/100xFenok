name: QA Visual

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed site for the requested snapshot or journey'
        required: false
        default: 'https://100xfenok.etloveaui.workers.dev'
      suite:
        description: 'Requested snapshot scope'
        required: false
        type: choice
        default: all
        options:
          - all
          - journey
          - live

concurrency:
  group: qa-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: 100xfenok-next

jobs:
  visual:
    name: visual-${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ inputs.suite == 'all' }}
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.suite == 'live' && '["live-observation"]' || '["desktop-1440","mobile-390"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 22
          cache: npm
          cache-dependency-path: 100xfenok-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run requested visual QA
        env:
          CI: "true"
          PROJECT: ${{ matrix.project }}
          QA_BASE_URL: ${{ inputs.base_url || 'https://100xfenok.etloveaui.workers.dev' }}
          SUITE: ${{ inputs.suite || 'all' }}
          FENOK_VERIFY_TOKEN: ${{ secrets.FENOK_VERIFY_TOKEN }}
        run: |
          case "$SUITE" in
            all) npm run qa:visual -- --project="$PROJECT";;
            live) npm run qa:visual -- --project="$PROJECT";;
            journey) npm run qa:visual -- tests/visual/journey.spec.ts --project="$PROJECT";;
            *) echo "unsupported visual suite" >&2; exit 64;;
          esac

      - name: Upload visual observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-visual-${{ matrix.project }}-${{ github.run_id }}
          path: |
            100xfenok-next/test-results/visual/
            100xfenok-next/playwright-report/visual/
          if-no-files-found: warn
          retention-days: 7
