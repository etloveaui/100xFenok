# Update Manifest rebuilds shared projections from active plane generations
# and atomically promotes one platform generation. Code/configuration stays Git.
# Manifest source descriptions and schemas remain stable across refreshes.

name: Update Manifest
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 update-manifest.yml {0}', inputs.external_clock_slot) || github.workflow }}

