# Update Manifest — single writer for shared derived/public projections
#
# Source workflows commit only their owned acquisition artifacts. This workflow
# rebuilds shared market/ETF/edge/KPI projections from committed source data,
# then publishes one conflict-free generated-data commit.
#
# Infinite loop prevention:
#   This workflow ignores data/manifest.json, data/computed/**, and the generated
#   admin usage/product coverage/KPI manifests, so its own generated-data commit can
#   still trigger deploy without retriggering itself.
#
# Manifest fields updated: file_count, updated, last_updated, generatedAt, categories, manifest_version
# Manifest fields preserved: version, update_frequency, source, description, recent_changes

name: Update Manifest

on:
  push:
    branches: [main]
    paths:
      # BEGIN GENERATED lane-commit-manifest trigger_paths
      - 'data/**'
      - '!data/yf/**'
      - '!data/admin/yahoo-batch-quote-history/**'
      - '!data/manifest.json'
      - '!data/computed/**'
      - '!data/admin/data-usage-manifest.json'
      - '!data/admin/product-surface-coverage.json'
      - '!data/admin/fenok-data-health-kpi.json'
      - '!data/admin/damodaran-shadow-parity.json'
      - '!data/admin/sec-13f-shadow-parity.json'
      - '!data/admin/fenok-s1-stock-public-promotion-dry-run.json'
      - '!data/admin/fenok-edge-coverage-index.json'
      - '!data/admin/fenok-s0-finra-occ-mapping-ledger.json'
      - '!data/admin/fenok-edge-etf-daily1y-readiness.json'
      - '!data/admin/fenok-edge-etf-daily1y-fetchable-plan.json'
      - '!data/admin/fenok-etf-core-daily-basket.json'
      - '!data/admin/fenok-edge-korea-krx-daily-index.json'
      - '!data/admin/data-supply-state/**'
      - '!data/admin/lane-registry-projection.json'
      - '!data/admin/lane-commit-manifest.json'
      - '!data/admin/alarm-state.json'
      - '!data/macro/fred-macro.json'
      - '!data/macro/tga.json'
      - '!data/macro/stablecoins.json'
      - '!data/macro/fred-banking-daily.json'
      - '!data/macro/fred-banking-weekly.json'
      - '!data/macro/fred-banking-monthly.json'
      - '!data/macro/fred-banking-quarterly.json'
      - '!data/macro/fdic-tier1.json'
      - '!data/sentiment/**'
      - '!data/admin/fred_macro/**'
      - '!data/admin/treasury_tga/**'
      - '!data/admin/defillama_stablecoins/**'
      - '!data/admin/fred_banking/**'
      - '!data/admin/fdic_tier1/**'
      - '!data/admin/sentiment/**'
      - '!data/stockanalysis/**'
      - '!data/slickcharts/discovery-summary.json'
      - '!data/slickcharts/membership-changes.json'
      - '!data/slickcharts/universe.json'
      - 'scripts/update-manifest.py'
      - 'scripts/export-computed-signals.mjs'
      - 'scripts/build-phase2-closeout-indexes.mjs'
      - 'scripts/build-fenok-signals.mjs'
      - 'scripts/build-slickcharts-discovery.mjs'
      - 'scripts/scrapers/membership-tracker.py'
      - 'scripts/write-fenok-s1-stock-public-promotion-dry-run.mjs'
      - 'scripts/build-fenok-edge-coverage-index.mjs'
      - 'scripts/audit-fenok-s0-source-gaps.mjs'
      - 'scripts/write-fenok-etf-daily1y-readiness.mjs'
      - 'scripts/audit-fenok-stock-promotion-candidates.mjs'
      - 'scripts/stock-action-score-core.mjs'
      - 'scripts/fetch-nasdaq-giw-sox-constituents.mjs'
      - 'scripts/generate-product-surface-coverage.mjs'
      - 'scripts/build-fenok-data-health-kpi.mjs'
      - 'scripts/lib/market-calendar.mjs'
      - 'scripts/lib/kpi-runtime-projection.mjs'
      - 'scripts/lib/kpi-runtime-slots.mjs'
      - 'scripts/lib/kpi-contract-constants.mjs'
      - 'tools/macro-monitor/shared/signals-core.mjs'
      # END GENERATED lane-commit-manifest trigger_paths
  schedule:
    # UTC 02:30 = KST 11:30. Morning reconciliation.
    - cron: '30 2 * * *'
    # UTC 09:30 = KST 18:30. Runs after daily FRED/SlickCharts refresh windows.
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      # KPI v2 authoritative-dispatch envelope (contract §3). Populated by the
      # edge/krx daily workflows when they dispatch this reconciliation.
      source_workflow:
        description: 'Origin workflow file that dispatched this run (allowlist)'
        required: false
        default: ''
      source_run_id:
        description: 'Origin workflow run id'
        required: false
        default: ''
      source_run_attempt:
        description: 'Origin workflow run attempt'
        required: false
        default: ''
      original_event:
        description: 'Origin trigger event (schedule for authoritative)'
        required: false
        default: ''
      slot_key:
        description: 'Origin canonical slot_key (§2)'
        required: false
        default: ''
      # Legacy compatibility input, intentionally IGNORED by the rebuild policy
      # below: legacy callers still pass -f rebuild_slickcharts=true and the
      # supplied value must never gate the rebuild. Every workflow_dispatch
      # rebuilds current SlickCharts membership regardless of this value.
      rebuild_slickcharts:
        description: 'Legacy compatibility flag (ignored): every workflow_dispatch rebuilds SlickCharts membership unconditionally'
        required: false
        default: true
        type: boolean

concurrency:
  group: fenok-data-writer-refs/heads/main
  cancel-in-progress: false
  queue: max

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # KPI v2 builder reads GITHUB_* defaults plus this origin envelope from env.
    # KPI_EVENT_SCHEDULE = the exact cron that triggered a scheduled run, so slot
    # inference uses the run's OWN cron (never latest-across-crons).
    env:
      KPI_EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
      KPI_ORIGIN_SOURCE_WORKFLOW: ${{ github.event.inputs.source_workflow || '' }}
      KPI_ORIGIN_SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '' }}
      KPI_ORIGIN_SOURCE_RUN_ATTEMPT: ${{ github.event.inputs.source_run_attempt || '' }}
      KPI_ORIGIN_ORIGINAL_EVENT: ${{ github.event.inputs.original_event || '' }}
      KPI_ORIGIN_SLOT_KEY: ${{ github.event.inputs.slot_key || '' }}
    permissions:
      contents: write  # Required for git push (manifest.json update)
      actions: write   # Required to dispatch Worker deploy after bot-authored commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history so BEFORE_SHA diff always resolves

      - name: Start from latest main
        run: |
          git fetch origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild and project shared derived state
        # S1-S14 of the projection stack live in one runner shared with the
        # push-retry loop below, so the two call sites cannot drift.
        env:
          REBUILD_SLICKCHARTS: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          VALIDATE_SLICKCHARTS_SKIP_PUBLIC: 'true'
          RESET_ETF_SNAPSHOTS: 'false'
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || 'AUTO' }}
        run: bash scripts/update-manifest-projections.sh

      - name: Check if manifest changed
        id: check
        run: |
          set +e
          node scripts/stage-update-manifest-central.mjs --check
          status=$?
          set -e
          case "$status" in
            0) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Commit and push manifest (with rebase retry)
        id: commit
        if: steps.check.outputs.changed == 'true'
        env:
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || 'AUTO' }}
          REBUILD_SLICKCHARTS: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          VALIDATE_SLICKCHARTS_SKIP_PUBLIC: 'false'
          RESET_ETF_SNAPSHOTS: 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/stage-update-manifest-central.mjs --clean-untracked-after-reset
            node scripts/stage-update-manifest-central.mjs --assert-clean-after-reset
            node scripts/materialize-update-manifest-routes.mjs --all --validate-only --assert-no-untracked
            bash scripts/update-manifest-projections.sh

            set +e
            node scripts/stage-update-manifest-central.mjs --check
            central_status=$?
            set -e
            if [ "$central_status" -eq 3 ]; then
              echo "Attempt $attempt: manifest already current on latest main — nothing to push"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$central_status" -ne 0 ]; then
              exit "$central_status"
            fi
            node scripts/stage-update-manifest-central.mjs --stage
            git commit -m "chore: update computed signals and manifest"

            if git push origin HEAD:main; then
              echo "Attempt $attempt: push succeeded"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $attempt: push rejected, retrying..."
            sleep $((attempt * 3))
          done

          echo "All 3 attempts failed"
          exit 1

      - name: No changes needed
        if: steps.check.outputs.changed == 'false'
        run: echo "manifest.json already up to date — nothing to commit"

      - name: Check SlickCharts recovery in flight
        id: recovery-gate
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          guard="$(node scripts/check-recovery-deploy-gate.mjs \
            --mode dispatch \
            --recovery-workflows slickcharts-history.yml)"
          case "$guard" in
            skip)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::SlickCharts recovery-family workflow nonterminal; deploy dispatch deferred to the recovery-completion requeue or the daily schedule."
              ;;
            proceed-uncertain)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Recovery dispatch gate uncertain (provider query unreadable); dispatching with strict KPI as the fail-close backstop."
              ;;
            proceed)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected recovery dispatch gate output: $guard"
              exit 1
              ;;
          esac

      - name: Dispatch Worker deploy for generated-data commit
        if: ${{ steps.commit.outputs.pushed == 'true' && steps.recovery-gate.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/dispatch-workflow-with-retry.sh \
            --workflow deploy-worker.yml \
            --ref main \
            --attempts 3 \
            --delay-seconds 5
