      # END GENERATED lane-commit-manifest trigger_paths
  schedule:
    # UTC 02:30 = KST 11:30. Morning reconciliation.
    - cron: '30 2 * * *'
    # UTC 09:30 = KST 18:30. Runs after daily FRED/SlickCharts refresh windows.
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string
      etf_cloud_generation:
        description: 'Compatibility marker; every projection run requires the active ETF and catalogue generations'
        required: false
        default: 'false'
      # Legacy compatibility input, intentionally IGNORED by the rebuild policy
      # below: legacy callers still pass -f rebuild_slickcharts=true and the
      # supplied value must never gate the rebuild. Every workflow_dispatch
      # rebuilds current SlickCharts membership regardless of this value.
      rebuild_slickcharts:
        description: 'Legacy compatibility flag (ignored): every workflow_dispatch rebuilds SlickCharts membership unconditionally'
        required: false
        default: true
        type: boolean

concurrency:
  group: platform-projections-publish
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs update-manifest.yml

  update-manifest:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: fenok-update-manifest
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history so BEFORE_SHA diff always resolves
          filter: blob:none  # Preserve commit/tree history; fetch historical payloads only on demand.

      - name: Start from latest main
        run: |
          git fetch origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Use installed A1 toolchain and cache
        if: runner.environment == 'self-hosted'
        run: |
          echo '/data/fenok-update/toolchain/bin' >> "$GITHUB_PATH"
          echo 'CLOUD_DATA_CACHE_ROOT=/data/fenok-update/cache' >> "$GITHUB_ENV"

      - name: Hydrate active Global Scouter owner export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          node scripts/materialize-cloud-data-plane-family.mjs --hydrate-global-scouter
          node scripts/materialize-cloud-data-plane-family.mjs --hydrate-scouter-derived
          node scripts/materialize-cloud-data-plane-family.mjs --hydrate-sec-13f

      - name: Hydrate active Yahoo finance and derive acquisition indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --hydrate-yahoo-finance)"
          echo "YAHOO_ACTIVE_PROJECTION_ROOT=$(jq -r .output_root <<< "$basis")" >> "$GITHUB_ENV"
          if [ -f data/yf/_acquisition-state.json ]; then
            python3 scripts/yahoo_batch_state.py hydrate-generation --state-root data/admin/yahoo-batch-quote-history
          fi

      - name: Rebuild and publish active platform projections
        id: publish_cloud_generation
        env:
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || 'AUTO' }}
          REBUILD_SLICKCHARTS: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          VALIDATE_SLICKCHARTS_SKIP_PUBLIC: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          bash scripts/publish-update-manifest.sh

      - name: Retain active and previous cache objects; remove run outputs
        if: always() && runner.environment == 'self-hosted' && steps.checkout.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          status=0
          node scripts/materialize-cloud-data-plane-family.mjs --prune-cache || status=$?
          git restore --worktree -- .
          git clean -q -ffdx
          exit "$status"
