name: Fetch FINRA ATS OTC Weekly Summary
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-finra-ats-weekly.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    # FINRA publishes recent delayed tranches on Monday; Wednesday adds a
    # bounded holiday buffer while avoiding the minute-0 writer cluster.
    - cron: '17 11 * * 3'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Existing A1 clock marker'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Bound UTC schedule slot'
        required: false
        default: ''
        type: string
      controlled_failure:
        description: 'Dispatch-only chaos: "transport" forces a retained-LKG failure proof'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: finra-ats-weekly-publish
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-finra-ats-weekly.yml

  fetch-finra-ats-weekly:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    # The cloud data plane's credentials live in the production environment.
    # The active private generation owns the bounded history and recovery state.
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/finra-ats
            data/computed

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Hydrate active FINRA weekly history
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --family finra-ats-weekly --manifest-prefix data/admin/finra-ats --output-root "$RUNNER_TEMP/finra-active")"
          mkdir -p data/admin/finra-ats
          cp -R "$RUNNER_TEMP/finra-active/." data/admin/finra-ats/
          echo "generation=$(jq -r .generation_id <<< "$basis")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifest_sha256 <<< "$basis")" >> "$GITHUB_OUTPUT"
      - name: Fetch FINRA ATS weekly summary
        id: fetch_finra_ats
        env:
          FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}
          FINRA_API_CLIENT_SECRET: ${{ secrets.FINRA_API_CLIENT_SECRET }}
          INPUT_CONTROLLED_FAILURE: ${{ github.event.inputs.controlled_failure || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/fetch-finra-ats-weekly.mjs

      - name: Publish FINRA ATS weekly generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ always() && !cancelled() && steps.baseline.outcome == 'success' && (steps.fetch_finra_ats.outcome == 'success' || steps.fetch_finra_ats.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_EXPECTED_ACTIVE_GENERATION_ID: ${{ steps.baseline.outputs.generation }}
          PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256: ${{ steps.baseline.outputs.manifest }}
        run: node scripts/publish-cloud-data-generation.mjs --family=finra-ats-weekly --json
