name: Pipeline Failure Alarm

on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: ['Update Manifest', 'Deploy Worker (Cloudflare)', 'Fenok Edge Daily Data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Serialize only the short detector/reporting critical section. The state
    # persistence job below has its own global writer lock, so a long writer
    # queue cannot delay the next alarm check.
    concurrency:
      group: pipeline-failure-alarm
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record alarm-state base fingerprint
        run: |
          set -euo pipefail
          mkdir -p pipeline-alarm-state-transfer
          if [ -f data/admin/alarm-state.json ]; then
            sha256sum data/admin/alarm-state.json | awk '{print $1}' > pipeline-alarm-state-transfer/base.sha256
          else
            printf '%s\n' missing > pipeline-alarm-state-transfer/base.sha256
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check pipeline job health
        id: pipeline
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PIPELINE_JOB_HEALTH_RESULT: pipeline-job-health-result.json
        run: node scripts/ops/check-pipeline-job-health.mjs

      - name: Emit alarm state
        id: alarm_state
        if: always()
        env:
          PIPELINE_JOB_HEALTH_RESULT: pipeline-job-health-result.json
        run: node scripts/ops/emit-alarm-state.mjs

      # The detector is intentionally continue-on-error so its incident result
      # can drive reporting. The emitter is directly non-best-effort: if it
      # cannot compute state or publish transition outputs, the step itself turns
      # the run red and later reporting/persistence stays skipped.

      # Comment only on a state transition. An unresolved incident is re-reported
      # on every trigger, which put 9 identical comments on the OPS issue between
      # 04:53 and 06:35 on 2026-07-22. incident_changed is false only when nothing
      # the alarm asserts has moved. A direct emitter/output failure turns this
      # run red and blocks both reporting and persistence, so the next run
      # retries from the prior canonical state.
      - name: Prepare issue body
        if: steps.pipeline.outcome == 'failure' && steps.alarm_state.outputs.incident_changed != 'false'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('pipeline-job-health-result.json', 'utf8'));
          fs.writeFileSync('pipeline-job-health-issue.md', result.issueBody || result.message || 'Pipeline job failure alarm fired.');
          fs.writeFileSync('pipeline-job-health-title.txt', result.issueTitle || '100xFenok pipeline job failure alarm');
          NODE

      - name: Open or update OPS issue
        if: steps.pipeline.outcome == 'failure' && steps.alarm_state.outputs.incident_changed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(cat pipeline-job-health-title.txt)"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file pipeline-job-health-issue.md
          else
            gh issue create --title "$title" --body-file pipeline-job-health-issue.md
          fi

      # Recovery used to be recorded and never announced: every issue step above is
      # gated on the failing path, so the OPS issue collected 136 alert comments
      # since 2026-07-18 and was never told an incident ended. A reader could not
      # separate a live outage from a finished one. This runs on the SUCCEEDING
      # path, driven only by the emitter's open -> clear transition. Notification
      # only: it never opens an issue (with nothing open there is nothing to clear)
      # and never writes to the repo.
      - name: Post all-clear on the OPS issue
        if: steps.alarm_state.outputs.incident_resolved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="100xFenok pipeline job failure alarm"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            echo "no open OPS issue; nothing to clear"
            exit 0
          fi
          gh issue comment "$existing" --body "$(printf '%s\n' \
            '[all-clear] Consecutive pipeline job failures have cleared.' \
            '' \
            'Alarm state is now `clear`. The resolution timestamp and the incident that' \
            'preceded it are in `data/admin/alarm-state.json` (`last_resolved_at`,' \
            '`last_firing`).' \
            '' \
            "Observed by: $RUN_URL")"
          # Close on all-clear so each incident owns one bounded issue. Leaving
          # the issue open made it an eternal comment sink (162 comments by
          # 2026-08-03); the next incident opens a fresh issue with a clean
          # timeline instead of appending to a finished one.
          gh issue close "$existing" --reason completed --comment "Closed by all-clear; the next incident opens a new issue."

      # Persist only after incident/recovery reporting has succeeded. The
      # artifact carries both the newly emitted public-safe state and the exact
      # canonical state fingerprint that detection started from.
      - name: Prepare alarm state for persistence
        run: |
          set -euo pipefail
          test -f pipeline-alarm-state-transfer/base.sha256
          test -f data/admin/alarm-state.json
          cp data/admin/alarm-state.json pipeline-alarm-state-transfer/alarm-state.json

      - name: Upload alarm state for persistence
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-alarm-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: pipeline-alarm-state-transfer
          if-no-files-found: error

  persist-alarm-state:
    # Issue alert/all-clear failure, emitter failure, or state-artifact failure
    # must block persistence. A successful report is already durable in the OPS
    # issue even if this bounded writer job later waits or fails.
    needs: check
    if: ${{ needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: fenok-data-writer-refs/heads/main
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download alarm state
        uses: actions/download-artifact@v4
        with:
          name: pipeline-alarm-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: pipeline-alarm-state

      - name: Commit alarm state
        id: persist
        continue-on-error: true
        run: |
          # [skip ci] keeps this ops-metadata commit from re-triggering the
          # pipeline it is reporting on.
          set -euo pipefail
          test -f pipeline-alarm-state/base.sha256
          test -f pipeline-alarm-state/alarm-state.json

          base_fingerprint="$(tr -d '\r\n' < pipeline-alarm-state/base.sha256)"
          if [ "$base_fingerprint" != missing ] \
            && ! printf '%s\n' "$base_fingerprint" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "invalid alarm-state base fingerprint artifact" >&2
            exit 1
          fi

          # Refresh after acquiring the global writer lock. A stale detector
          # artifact must never overwrite a newer alarm transition on main.
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          if [ -f data/admin/alarm-state.json ]; then
            current_fingerprint="$(sha256sum data/admin/alarm-state.json | awk '{print $1}')"
          else
            current_fingerprint=missing
          fi
          if [ "$base_fingerprint" != "$current_fingerprint" ]; then
            echo "alarm-state base changed before persistence; refusing stale overwrite" >&2
            exit 1
          fi

          cp pipeline-alarm-state/alarm-state.json data/admin/alarm-state.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/pipeline-failure-alarm.yml \
            --stage always_if_exists
          git add data/admin/alarm-state.json
          if git diff --cached --quiet; then
            echo "alarm-state unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "ops: refresh alarm-state.json [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "alarm-state persistence push failed after bounded retries" >&2
          exit 1

      # The commit is best-effort with respect to the already-reported issue,
      # but its failure remains a visible job error for operators and retries.
      - name: Surface alarm-state persistence failure
        if: steps.persist.outcome == 'failure'
        run: |
          echo "::error::alarm-state Git persistence failed after incident reporting; the OPS issue remains the primary incident record"
          exit 1
