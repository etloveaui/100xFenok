name: Pipeline Failure Alarm
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 pipeline-failure-alarm.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: ['Update Manifest', 'Deploy Worker (Cloudflare)', 'Fenok Edge Daily Data', 'SlickCharts Symbols', 'R2 Usage Report']
    types: [completed]
  workflow_dispatch:
    inputs:
      proof_phase:
        description: 'Live alarm-path proof; synthetic incidents are explicitly tagged'
        required: false
        default: none
        type: choice
        options: [none, trigger, clear]
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs pipeline-failure-alarm.yml

  check:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # Detection, reporting and promotion share one family lock.
    concurrency:
      group: pipeline-failure-alarm
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout detector inputs
        uses: actions/checkout@v7
        with:
          ref: main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /scripts/
            /ops/a1-lanes/
            /100xfenok-next/scripts/cloud-data-plane/
            /100xfenok-next/src/lib/

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 22

      - name: Hydrate active alarm transition state
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --family pipeline-alarm-state --privacy-class public --manifest-prefix public/data --output-root "$RUNNER_TEMP/alarm-state-active")"
          mkdir -p data
          cp -R "$RUNNER_TEMP/alarm-state-active/." data/
          echo "generation=$(jq -r .generation_id <<< "$basis")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifest_sha256 <<< "$basis")" >> "$GITHUB_OUTPUT"

      - name: Check pipeline job health
        id: pipeline
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PIPELINE_JOB_HEALTH_RESULT: pipeline-job-health-result.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set +e
          node scripts/ops/check-pipeline-job-health.mjs
          pipeline_status=$?
          node scripts/ops/check-a1-lane-health.mjs
          a1_status=$?
          if [ "$pipeline_status" -ne 0 ] || [ "$a1_status" -ne 0 ]; then
            exit 2
          fi

      - name: Apply dispatch-only alarm proof
        id: proof
        if: ${{ always() && steps.baseline.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.proof_phase != '' && inputs.proof_phase != 'none' }}
        env:
          PROOF_PHASE: ${{ inputs.proof_phase }}
          PIPELINE_JOB_HEALTH_RESULT: pipeline-job-health-result.json
        run: node scripts/ops/alarm-proof-lifecycle.mjs

      - name: Emit alarm state
        id: alarm_state
        if: ${{ always() && steps.baseline.outcome == 'success' && steps.proof.outcome != 'failure' }}
        env:
          PIPELINE_JOB_HEALTH_RESULT: pipeline-job-health-result.json
        run: node scripts/ops/emit-alarm-state.mjs

      # The detector is intentionally continue-on-error so its incident result
      # can drive reporting. The emitter is directly non-best-effort: if it
      # cannot compute state or publish transition outputs, the step itself turns
      # the run red and later reporting/persistence stays skipped.

      # Comment only when the operator-visible incident identities change. Full
      # state and body detail still refresh, but counters, ages, run evidence and
      # watch-policy churn do not create another comment. A direct emitter/output failure turns this
      # run red and blocks both reporting and persistence, so the next run
      # retries from the prior canonical state.
      - name: Prepare issue body
        if: ${{ steps.pipeline.outcome == 'failure' || steps.proof.outputs.alarming == 'true' || (github.event_name == 'workflow_dispatch' && inputs.proof_phase == 'clear') }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('pipeline-job-health-result.json', 'utf8'));
          fs.writeFileSync('pipeline-job-health-issue.md', result.issueBody || result.message || 'Pipeline job failure alarm fired.');
          fs.writeFileSync('pipeline-job-health-title.txt', result.issueTitle || '100xFenok pipeline job failure alarm');
          NODE

      - name: Open or update OPS issue
        if: ${{ steps.pipeline.outcome == 'failure' || steps.proof.outputs.alarming == 'true' || (github.event_name == 'workflow_dispatch' && inputs.proof_phase == 'clear') }}
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_CHANGED: ${{ steps.alarm_state.outputs.incident_changed }}
          PROOF_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.proof_phase || 'none' }}
        run: |
          set -euo pipefail
          title="$(cat pipeline-job-health-title.txt)"
          existing="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100&sort=created&direction=asc" \
            --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number" \
            | sort -n | sed -n '1p')"
          if [ -n "$existing" ]; then
            # The body is the operator's live view and is rewritten on every
            # firing. Editing a body sends no notification, so a stable incident
            # set can no longer look identical to silence: issue #88 sat on its
            # 2026-07-18 creation snapshot while nine incidents stayed open for
            # roughly a month. The comment stays gated on the transition, which
            # is what the 2026-07-22 anti-spam change actually protected.
            gh issue edit "$existing" --body-file pipeline-job-health-issue.md
            if [ "$PROOF_PHASE" != clear ] && [ "$INCIDENT_CHANGED" != "false" ]; then
              gh issue comment "$existing" --body-file pipeline-job-health-issue.md
            fi
          elif [ "$PROOF_PHASE" != clear ]; then
            gh issue create --title "$title" --body-file pipeline-job-health-issue.md
          fi

      # The OPS issue is the independent incident record. A firing and recovery
      # can both happen before main receives either state, so a stale canonical
      # clear state must not suppress closing an issue that is actually open.
      - name: Post all-clear on the OPS issue
        if: ${{ steps.pipeline.outcome == 'success' || (github.event_name == 'workflow_dispatch' && inputs.proof_phase == 'clear') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROOF_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.proof_phase || 'none' }}
          PROOF_ISSUE_TITLE: ${{ steps.proof.outputs.issue_title }}
        run: |
          set -euo pipefail
          state="$(node -p "JSON.parse(require('fs').readFileSync('data/admin/alarm-state.json', 'utf8')).status")"
          if [ "$state" != clear ] && [ "$PROOF_PHASE" != clear ]; then
            echo "detector state is $state; no all-clear"
            exit 0
          fi
          title="${PROOF_ISSUE_TITLE:-100xFenok pipeline job failure alarm}"
          existing="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100&sort=created&direction=asc" \
            --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number" \
            | sort -n | sed -n '1p')"
          if [ -z "$existing" ]; then
            echo "no open OPS issue; nothing to clear"
            exit 0
          fi
          if [ "$PROOF_PHASE" = clear ]; then
            if [ "$state" = clear ]; then
              gh issue comment "$existing" --body "[all-clear] Proof incidents cleared; the detector is clear. Observed by: $RUN_URL"
              gh issue close "$existing" --reason completed
            else
              gh issue comment "$existing" --body "[all-clear] Proof incidents cleared. Real detector state is $state; this issue remains open. Observed by: $RUN_URL"
              echo "Proof incidents removed; real detector state $state keeps the issue open." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          gh issue comment "$existing" --body "$(printf '%s\n' \
            '[all-clear] The pipeline alarm has cleared.' \
            '' \
            'The detector observed `clear`; the plane state promotion follows' \
            'reporting. This issue records the recovery now.' \
            '' \
            "Observed by: $RUN_URL")"
          # Close on all-clear so each incident owns one bounded issue. Leaving
          # the issue open made it an eternal comment sink (162 comments by
          # 2026-08-03); the next incident opens a fresh issue with a clean
          # timeline instead of appending to a finished one.
          gh issue close "$existing" --reason completed --comment "Closed by all-clear; the next incident opens a new issue."

      - name: Publish alarm transition state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_EXPECTED_ACTIVE_GENERATION_ID: ${{ steps.baseline.outputs.generation }}
          PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256: ${{ steps.baseline.outputs.manifest }}
        run: node scripts/publish-cloud-data-generation.mjs --family=pipeline-alarm-state --json
