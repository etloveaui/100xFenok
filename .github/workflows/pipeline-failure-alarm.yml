name: Pipeline Failure Alarm

on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: ['Update Manifest', 'Deploy Worker (Cloudflare)', 'Fenok Edge Daily Data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: pipeline-failure-alarm
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check pipeline job health
        id: pipeline
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PIPELINE_JOB_HEALTH_RESULT: pipeline-job-health-result.json
        run: node scripts/ops/check-pipeline-job-health.mjs

      - name: Emit alarm state
        id: alarm_state
        if: always()
        env:
          PIPELINE_JOB_HEALTH_RESULT: pipeline-job-health-result.json
        run: node scripts/ops/emit-alarm-state.mjs

      # The detector is intentionally continue-on-error so its incident result
      # can drive reporting. The emitter is directly non-best-effort: if it
      # cannot compute state or publish transition outputs, the step itself turns
      # the run red and later reporting/persistence stays skipped.

      # Comment only on a state transition. An unresolved incident is re-reported
      # on every trigger, which put 9 identical comments on the OPS issue between
      # 04:53 and 06:35 on 2026-07-22. incident_changed is false only when nothing
      # the alarm asserts has moved. A direct emitter/output failure turns this
      # run red and blocks both reporting and persistence, so the next run
      # retries from the prior canonical state.
      - name: Prepare issue body
        if: steps.pipeline.outcome == 'failure' && steps.alarm_state.outputs.incident_changed != 'false'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('pipeline-job-health-result.json', 'utf8'));
          fs.writeFileSync('pipeline-job-health-issue.md', result.issueBody || result.message || 'Pipeline job failure alarm fired.');
          fs.writeFileSync('pipeline-job-health-title.txt', result.issueTitle || '100xFenok pipeline job failure alarm');
          NODE

      - name: Open or update OPS issue
        if: steps.pipeline.outcome == 'failure' && steps.alarm_state.outputs.incident_changed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(cat pipeline-job-health-title.txt)"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file pipeline-job-health-issue.md
          else
            gh issue create --title "$title" --body-file pipeline-job-health-issue.md
          fi

      # Recovery used to be recorded and never announced: every issue step above is
      # gated on the failing path, so the OPS issue collected 136 alert comments
      # since 2026-07-18 and was never told an incident ended. A reader could not
      # separate a live outage from a finished one. This runs on the SUCCEEDING
      # path, driven only by the emitter's open -> clear transition. Notification
      # only: it never opens an issue (with nothing open there is nothing to clear)
      # and never writes to the repo.
      - name: Post all-clear on the OPS issue
        if: steps.alarm_state.outputs.incident_resolved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="100xFenok pipeline job failure alarm"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            echo "no open OPS issue; nothing to clear"
            exit 0
          fi
          gh issue comment "$existing" --body "$(printf '%s\n' \
            '[all-clear] Consecutive pipeline job failures have cleared.' \
            '' \
            'Alarm state is now `clear`. The resolution timestamp and the incident that' \
            'preceded it are in `data/admin/alarm-state.json` (`last_resolved_at`,' \
            '`last_firing`).' \
            '' \
            "Observed by: $RUN_URL")"
          # Close on all-clear so each incident owns one bounded issue. Leaving
          # the issue open made it an eternal comment sink (162 comments by
          # 2026-08-03); the next incident opens a fresh issue with a clean
          # timeline instead of appending to a finished one.
          gh issue close "$existing" --reason completed --comment "Closed by all-clear; the next incident opens a new issue."

      # Persist only after incident/recovery reporting has succeeded. The
      # default success gate means a failed emitter or issue create/comment/close
      # leaves the prior canonical state intact, so the next run retries the same
      # transition. Git persistence itself remains best-effort and can never mask
      # the issue channel.
      - name: Commit alarm state
        continue-on-error: true
        run: |
          # [skip ci] keeps this ops-metadata commit from re-triggering the
          # pipeline it is reporting on.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/pipeline-failure-alarm.yml \
            --stage always_if_exists || exit 0
          git add data/admin/alarm-state.json || exit 0
          if git diff --cached --quiet; then
            echo "alarm-state unchanged; nothing to commit"
            exit 0
          fi
          branch="${GITHUB_REF_NAME:-main}"
          git commit -m "ops: refresh alarm-state.json [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

      # The run's conclusion is alarm-machinery health, not incident state: an
      # open incident is reported through the OPS issue and the alarm-state
      # commit above, and this run stays green as long as that reporting and
      # alarm-state emission succeeded. Red is reserved for emitter/output or
      # non-best-effort issue preparation/API failure.
      # The alarm-state Git commit stays best-effort (continue-on-error) and can
      # never mask the issue channel. No incident-conditioned exit 1 exists.
