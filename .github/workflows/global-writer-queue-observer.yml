name: Global Writer Queue Observability

# This observer measures workflow-run states only. GitHub's REST response does
# not identify the concurrency group, so its metric is deliberately named
# `global-writer candidate queued runs`, not `lock wait`.
on:
  schedule:
    # One full writer-inventory scan per hour. The prior 15-minute declaration
    # was not achieved by Actions in practice and multiplied API work without
    # improving the observed incident timeline.
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  # Notification only. The observer once measured breaches and told nobody:
  # read-only permissions and no notification step meant the signal died
  # in the run log. It gains issue write and nothing else — never repo write,
  # because it watches a blocked writer queue and must not join it.
  issues: write

# Keep this observer outside the data-writer group: it must remain measurable
# while the writer queue is blocked.
concurrency:
  group: global-writer-queue-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout observer policy and checker
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # continue-on-error so a breach still reaches the state comment below; the
      # red job signal is restored by the final step, not dropped.
      - name: Observe global-writer candidate queue
        id: queue
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ops/check-global-writer-queue.mjs > queue-state.json

      # ONE upserted state comment, not an append-per-run: the failure alarm's
      # append behaviour produced 136 comments on a single issue and made a live
      # incident indistinguishable from a finished one. `--edit-last` rewrites this
      # observer's own last comment, so it must target a DEDICATED state issue —
      # pointing it at the failure-alarm issue would overwrite that alarm's alerts.
      - name: Upsert queue state comment
        id: report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QUEUE_OUTCOME: ${{ steps.queue.outcome }}
        run: |
          QUEUE_STATE_TITLE="100xFenok global-writer queue state"
          existing="$(gh issue list --state open --search "$QUEUE_STATE_TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            # `gh issue create` has no --json; it prints the issue URL, whose last
            # path segment is the number.
            created_url="$(gh issue create --title "$QUEUE_STATE_TITLE" \
              --body 'Rolling state of the global-writer candidate queue. One comment, upserted every observation; see the comment below for the current reading.' \
              )"
            existing="${created_url##*/}"
          fi
          case "$existing" in
            ''|*[!0-9]*) existing="" ;;
          esac
          if [ -z "$existing" ]; then
            echo "could not resolve the queue state issue; state not published"
            exit 1
          fi
          {
            printf '%s\n\n' "[queue-state] observer outcome: \`$QUEUE_OUTCOME\`"
            printf '%s\n' 'The watched workflow set is derived from actual writer commands; thresholds use the observer defaults or workflow environment overrides.'
            printf '\n%s\n' "Observed by: $RUN_URL"
            printf '\n```json\n'
            head -c 4000 queue-state.json 2>/dev/null || echo '{}'
            printf '\n```\n'
          } > queue-state-comment.md
          gh issue comment "$existing" --edit-last --create-if-none --body-file queue-state-comment.md

      - name: Fail on queue or report alarm
        if: always()
        env:
          QUEUE_OUTCOME: ${{ steps.queue.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          if [ "$QUEUE_OUTCOME" != "success" ] || [ "$REPORT_OUTCOME" != "success" ]; then
            echo "global-writer queue observation failed: queue=$QUEUE_OUTCOME report=$REPORT_OUTCOME"
            exit 1
          fi
