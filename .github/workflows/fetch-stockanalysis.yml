# StockAnalysis DataPack source refresh.
# Output: source-lane data only; the shared projection workflow owns public materialization.

name: Fetch StockAnalysis Data
run-name: ${{ github.event.client_payload.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-stockanalysis.yml {0}', github.event.client_payload.external_clock_slot) || github.workflow }}

on:
  repository_dispatch:
    types: [external-clock-stockanalysis, stockanalysis-plane-recovery]
  schedule:
    # Daily bounded stock overview + financial pair refresh (KST 06:20).
    - cron: '20 21 * * *'
    # Weekday core-basket ETF + surface refresh after US close (KST Tue-Sat 08:50).
    - cron: '50 23 * * 1-5'
    # 매주 일요일 23:20 UTC (한국 월요일 08:20) — Yahoo weekly refresh afterglow
    - cron: '20 23 * * 0'
  workflow_dispatch:
    inputs:
      etfs:
        description: 'Comma-separated ETF override (empty = focus ETF list)'
        required: false
        default: ''
      stocks:
        description: 'Comma-separated stock symbols'
        required: false
        default: ''
      stocks_only:
        description: 'Skip ETF payload refresh and fetch only explicit/default stocks'
        required: false
        default: 'false'
      fetch_financials:
        description: 'Fetch stock financial statements for the stock focus set'
        required: false
        default: 'true'
      discover_universe:
        description: 'Refresh the full StockAnalysis ETF universe list'
        required: false
        default: 'false'
      universe_backfill:
        description: 'Deep-fetch ETF payloads from the universe list (manual chunked runs only)'
        required: false
        default: 'false'
      incremental_etf_backfill:
        description: 'Auto-fetch new/missing/stale ETF details without a full universe run'
        required: false
        default: 'false'
      incremental_etf_limit:
        description: 'Maximum incremental ETF detail retries per run'
        required: false
        default: '0'
      incremental_etf_max_age_hours:
        description: 'Existing StockAnalysis ETF detail age before stale retry'
        required: false
        default: '720'
      reconcile_missing_etf_details:
        description: 'Classify and close missing ETF details; only provider HTTP 400/404 remains a named coverage gap'
        required: false
        default: 'false'
      reconcile_missing_etf_limit:
        description: 'Maximum missing ETF details to reconcile (0 = all selected targets)'
        required: false
        default: '100'
      history_gap_plan:
        description: 'Write a no-network ETF multi-year history gap plan only'
        required: false
        default: 'false'
      core_basket_refresh:
        description: 'Refresh exact ETF Core Daily Basket and recover guarded cloud publication (manual lineage)'
        required: false
        default: 'false'
      history_gaps_only:
        description: 'With incremental ETF backfill, fetch only ETF details missing required history periods'
        required: false
        default: 'false'
      required_history_periods:
        description: 'Comma-separated history periods required for history gap selection'
        required: false
        default: 'daily_1y'
      yf_etf_fallback:
        description: 'Use Yahoo ETF/fund fallback when StockAnalysis ETF detail endpoints are 404'
        required: false
        default: 'true'
      fetch_surfaces:
        description: 'Refresh high-value StockAnalysis public table/devalue surfaces'
        required: false
        default: 'true'
      surface_set:
        description: 'Surface bundle: core, events, movers, industry, etf'
        required: false
        default: 'core'
      surfaces:
        description: 'Comma-separated surface override'
        required: false
        default: ''
      controlled_failure_tickers:
        description: 'Dispatch-only recovery chaos targets; subset of explicit stocks'
        required: false
        default: ''
      controlled_failure_surfaces:
        description: 'Owner-approved failure proof: dispatch-only. Use etf_detail:TQQQ for StockAnalysis row6 or yahoo_etf_fallback:TQQQ for Yahoo row4; each requires that one exact explicit ETF. etf_universe remains separate (GitHub caps dispatch inputs at 25)'
        required: false
        default: ''
      offset:
        description: 'ETF offset for universe backfill chunking'
        required: false
        default: '0'
      limit_etfs:
        description: 'Maximum base ETF detail targets before incremental retries (0 = all selected targets)'
        required: false
        default: '100'
      natural_etf_weekday:
        description: 'Run the regular weekday ETF refresh now (daily selection plus 400-member rotation)'
        required: false
        type: boolean
        default: false
      sleep:
        description: 'Seconds between requests'
        required: false
        default: '0.25'

jobs:
  clock-admission:
    if: github.event.action != 'stockanalysis-plane-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
      automatic: ${{ steps.slot.outputs.automatic }}
      event_name: ${{ steps.slot.outputs.event_name }}
      mode: ${{ steps.slot.outputs.mode }}
      schedule: ${{ steps.slot.outputs.schedule }}
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-stockanalysis.yml

  acquire-stockanalysis:
    if: ${{ github.event.action != 'stockanalysis-plane-recovery' && needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    concurrency:
      group: stockanalysis-acquire-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.artifact_identity.outputs.name }}
    # Serial full-universe catch-up can exceed three hours. Allow the hosted
    # maximum without treating six hours as a completion guarantee.
    timeout-minutes: 360
    steps:
      - name: Wait for preceding StockAnalysis publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          from urllib.parse import quote

          repository = os.environ["GITHUB_REPOSITORY"]
          current_id = int(os.environ["GITHUB_RUN_ID"])
          branch = quote(os.environ["GITHUB_REF_NAME"], safe="")

          def api(path):
              for attempt in range(1, 5):
                  try:
                      return json.loads(subprocess.check_output(
                          ["gh", "api", path], text=True, stderr=subprocess.PIPE))
                  except subprocess.CalledProcessError as error:
                      detail = error.stderr or ""
                      transient = any(marker in detail.lower() for marker in (
                          "i/o timeout", "tls handshake timeout", "context deadline exceeded",
                          "connection reset", "temporary failure", "http 429",
                          "http 500", "http 502", "http 503", "http 504",
                      ))
                      if not transient or attempt == 4:
                          print(detail, end="", file=sys.stderr)
                          raise
                      delay = 2 * attempt
                      print(f"GitHub API transient failure ({attempt}/4); retrying in {delay}s: {detail.strip()}",
                            file=sys.stderr, flush=True)
                      time.sleep(delay)

          current = api(f"repos/{repository}/actions/runs/{current_id}")
          deadline = time.monotonic() + 90 * 60
          while True:
              runs = api(f"repos/{repository}/actions/workflows/fetch-stockanalysis.yml/runs"
                         f"?branch={branch}&per_page=100")["workflow_runs"]
              waiting = []
              for run in runs:
                  if run["run_number"] >= current["run_number"] or run["status"] == "completed":
                      continue
                  jobs = api(f"repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100")["jobs"]
                  acquisition = next((job for job in jobs if job["name"] == "acquire-stockanalysis"), None)
                  # Older queued acquisitions have not taken a source snapshot.
                  # Waiting on them while holding the acquisition lock deadlocks.
                  if not acquisition or acquisition.get("conclusion") != "success":
                      continue
                  publishers = [next((job for job in jobs if job["name"] == name), None)
                                for name in ("publish-stockanalysis", "publish-stockanalysis-etf-plane")]
                  if any(job is None or job["status"] != "completed" for job in publishers):
                      waiting.append(run["id"])
              if not waiting:
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit(f"preceding StockAnalysis publication has not settled: {waiting}")
              print(f"Waiting for preceding publication: {waiting}", flush=True)
              time.sleep(30)
          PY

      - uses: actions/checkout@v7

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Configure external candidate root
        run: |
          echo "STOCKANALYSIS_CANDIDATE_ROOT=$RUNNER_TEMP/stockanalysis-candidate" >> "$GITHUB_ENV"
          echo "STOCKANALYSIS_ARTIFACT_ROOT=$RUNNER_TEMP/stockanalysis-artifact" >> "$GITHUB_ENV"
          echo "STOCKANALYSIS_ARTIFACT_NAME=stockanalysis-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "STOCKANALYSIS_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Expose immutable artifact identity
        id: artifact_identity
        run: echo "name=$STOCKANALYSIS_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Install optional Yahoo fallback dependency
        run: pip install yfinance

      - name: Run StockAnalysis fetch
        env:
          ETF_ALWAYS_INCLUDE: ${{ secrets.ETF_ALWAYS_INCLUDE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          INPUT_ETFS: ${{ github.event.inputs.etfs }}
          INPUT_STOCKS: ${{ github.event.inputs.stocks }}
          INPUT_STOCKS_ONLY: ${{ github.event.inputs.stocks_only }}
          INPUT_FETCH_FINANCIALS: ${{ github.event.inputs.fetch_financials }}
          INPUT_DISCOVER_UNIVERSE: ${{ github.event.inputs.discover_universe }}
          INPUT_UNIVERSE_BACKFILL: ${{ github.event.inputs.universe_backfill }}
          INPUT_INCREMENTAL_ETF_BACKFILL: ${{ github.event.inputs.incremental_etf_backfill }}
          INPUT_INCREMENTAL_ETF_LIMIT: ${{ github.event.inputs.incremental_etf_limit }}
          INPUT_INCREMENTAL_ETF_MAX_AGE_HOURS: ${{ github.event.inputs.incremental_etf_max_age_hours }}
          INPUT_RECONCILE_MISSING_ETF_DETAILS: ${{ github.event.inputs.reconcile_missing_etf_details }}
          INPUT_RECONCILE_MISSING_ETF_LIMIT: ${{ github.event.inputs.reconcile_missing_etf_limit }}
          INPUT_HISTORY_GAP_PLAN: ${{ github.event.inputs.history_gap_plan }}
          INPUT_CORE_BASKET_REFRESH: ${{ github.event.inputs.core_basket_refresh }}
          INPUT_HISTORY_GAPS_ONLY: ${{ github.event.inputs.history_gaps_only }}
          INPUT_REQUIRED_HISTORY_PERIODS: ${{ github.event.inputs.required_history_periods }}
          INPUT_YF_ETF_FALLBACK: ${{ github.event.inputs.yf_etf_fallback }}
          INPUT_FETCH_SURFACES: ${{ github.event.inputs.fetch_surfaces }}
          INPUT_SURFACE_SET: ${{ github.event.inputs.surface_set }}
          INPUT_SURFACES: ${{ github.event.inputs.surfaces }}
          INPUT_CONTROLLED_FAILURE_TICKERS: ${{ github.event.inputs.controlled_failure_tickers }}
          INPUT_CONTROLLED_FAILURE_SURFACES: ${{ github.event.inputs.controlled_failure_surfaces }}
          INPUT_OFFSET: ${{ github.event.inputs.offset }}
          INPUT_LIMIT_ETFS: ${{ github.event.inputs.limit_etfs }}
          INPUT_MAX_UNIVERSE_PAGES: '100'
          INPUT_NATURAL_ETF_WEEKDAY: ${{ inputs.natural_etf_weekday && 'true' || 'false' }}
          INPUT_SLEEP: ${{ github.event.inputs.sleep }}
          EVENT_NAME: ${{ needs.clock-admission.outputs.event_name }}
          EVENT_SCHEDULE: ${{ needs.clock-admission.outputs.schedule }}
          CLOCK_MODE: ${{ needs.clock-admission.outputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_NATURAL_ETF_WEEKDAY" = "true" ]; then
            # Select only the collector path. Clock admission, the GitHub event
            # and the artifact event stay manual, so no scheduled slot is covered.
            EVENT_NAME="schedule"
            CLOCK_MODE="etf_weekday"
            INPUT_ETFS=""
            INPUT_STOCKS=""
            INPUT_STOCKS_ONLY="false"
            INPUT_RECONCILE_MISSING_ETF_DETAILS="false"
            INPUT_HISTORY_GAP_PLAN="false"
            INPUT_SURFACES=""
            INPUT_CONTROLLED_FAILURE_TICKERS=""
            INPUT_CONTROLLED_FAILURE_SURFACES=""
            INPUT_OFFSET="0"
            INPUT_LIMIT_ETFS="100"
          fi
          NATURAL_RECOVERY_KINDS="all"
          INPUT_STOCK_LIMIT="0"
          INPUT_REQUIRE_STOCK_FINANCIAL_PAIR="false"
          INPUT_ISOLATED_STOCK_SCHEDULE="false"
          UNIVERSE_FAILURE_PROOF="false"
          ETF_DETAIL_FAILURE_PROOF="false"
          YAHOO_ETF_FAILURE_PROOF="false"
          if [ "$EVENT_NAME" = "schedule" ]; then
            INPUT_FETCH_FINANCIALS="false"
            INPUT_DISCOVER_UNIVERSE="false"
            INPUT_UNIVERSE_BACKFILL="false"
            INPUT_INCREMENTAL_ETF_BACKFILL="false"
            INPUT_YF_ETF_FALLBACK="true"
            INPUT_SLEEP="${STOCKANALYSIS_DAILY_SLEEP:-0.5}"
            INPUT_MAX_UNIVERSE_PAGES="${STOCKANALYSIS_DAILY_MAX_UNIVERSE_PAGES:-5}"
            if [ "$CLOCK_MODE" = "stock_daily" ]; then
              INPUT_ETFS=""
              INPUT_STOCKS="AAPL,NVDA,MSFT,AMZN,GOOGL,META,TSLA,JPM"
              INPUT_STOCKS_ONLY="true"
              INPUT_FETCH_FINANCIALS="true"
              INPUT_DISCOVER_UNIVERSE="true"
              INPUT_MAX_UNIVERSE_PAGES="100"
              INPUT_UNIVERSE_BACKFILL="false"
              INPUT_INCREMENTAL_ETF_BACKFILL="false"
              INPUT_HISTORY_GAPS_ONLY="false"
              INPUT_REQUIRED_HISTORY_PERIODS=""
              INPUT_FETCH_SURFACES="false"
              INPUT_SURFACE_SET=""
              INPUT_CORE_BASKET_REFRESH="false"
              INPUT_STOCK_LIMIT="8"
              INPUT_REQUIRE_STOCK_FINANCIAL_PAIR="true"
              INPUT_ISOLATED_STOCK_SCHEDULE="true"
              NATURAL_RECOVERY_KINDS="stock,financial,universe"
            elif [ "$CLOCK_MODE" = "etf_weekday" ] || [ "$CLOCK_MODE" = "etf_general" ]; then
              INPUT_HISTORY_GAPS_ONLY="false"
              INPUT_REQUIRED_HISTORY_PERIODS=""
              INPUT_FETCH_SURFACES="true"
              INPUT_SURFACE_SET="${STOCKANALYSIS_DAILY_SURFACE_SET:-core}"
              INPUT_CORE_BASKET_REFRESH="${STOCKANALYSIS_DAILY_CORE_BASKET_REFRESH:-true}"
              INPUT_INCREMENTAL_ETF_BACKFILL="true"
              INPUT_INCREMENTAL_ETF_LIMIT="400"
              INPUT_INCREMENTAL_ETF_MAX_AGE_HOURS="144"
              INPUT_DISCOVER_UNIVERSE="false"
              INPUT_MAX_UNIVERSE_PAGES="100"
              NATURAL_RECOVERY_KINDS="etf,surface"
              if [ "$CLOCK_MODE" = "etf_general" ]; then
                INPUT_SLEEP="2"
                # BACKLOG #331: one complete weekly universe collection. Current
                # measured universe is 11 pages; 100 preserves headroom without
                # turning weekday bounded runs into broad discovery. StockAnalysis
                # publishes no membership source date, so the fetcher emits the
                # KPI freshness attempt only for this exact natural schedule;
                # manual dispatch may refresh the payload but cannot impersonate it.
                INPUT_DISCOVER_UNIVERSE="true"
                INPUT_MAX_UNIVERSE_PAGES="100"
                INPUT_LIMIT_ETFS="0"
                NATURAL_RECOVERY_KINDS="etf,surface,universe"
              fi
            else
              echo "unknown StockAnalysis schedule: $EVENT_SCHEDULE" >&2
              exit 64
            fi
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_STOCKS:-}" ] && [ "${INPUT_FETCH_FINANCIALS:-true}" != "true" ]; then
              echo "manual stock dispatch requires fetch_financials=true" >&2
              exit 64
            fi
            if [ "${INPUT_FETCH_FINANCIALS:-true}" = "true" ]; then
              INPUT_REQUIRE_STOCK_FINANCIAL_PAIR="true"
            fi
            if [ "${INPUT_CONTROLLED_FAILURE_SURFACES:-}" = "etf_universe" ]; then
              UNIVERSE_FAILURE_PROOF="true"
            fi
            case "${INPUT_CONTROLLED_FAILURE_SURFACES:-}" in
              *[eE][tT][fF]_[dD][eE][tT][aA][iI][lL]:*)
                ETF_DETAIL_FAILURE_PROOF="true"
                ;;
            esac
            case "${INPUT_CONTROLLED_FAILURE_SURFACES:-}" in
              *[yY][aA][hH][oO][oO]_[eE][tT][fF]_[fF][aA][lL][lL][bB][aA][cC][kK]:*)
                YAHOO_ETF_FAILURE_PROOF="true"
                ;;
            esac
            if [ "$ETF_DETAIL_FAILURE_PROOF" = "true" ] || [ "$YAHOO_ETF_FAILURE_PROOF" = "true" ]; then
              INPUT_STOCKS=""
              INPUT_STOCKS_ONLY="false"
              INPUT_FETCH_FINANCIALS="false"
              INPUT_DISCOVER_UNIVERSE="false"
              INPUT_UNIVERSE_BACKFILL="false"
              INPUT_INCREMENTAL_ETF_BACKFILL="false"
              INPUT_INCREMENTAL_ETF_LIMIT="0"
              INPUT_RECONCILE_MISSING_ETF_DETAILS="false"
              INPUT_HISTORY_GAP_PLAN="false"
              INPUT_CORE_BASKET_REFRESH="false"
              INPUT_HISTORY_GAPS_ONLY="false"
              INPUT_REQUIRED_HISTORY_PERIODS=""
              INPUT_FETCH_SURFACES="false"
              INPUT_SURFACE_SET=""
              INPUT_SURFACES=""
              INPUT_OFFSET="0"
              INPUT_LIMIT_ETFS="1"
            fi
          fi
          {
            echo "EFFECTIVE_HISTORY_GAPS_ONLY=${INPUT_HISTORY_GAPS_ONLY:-false}"
            echo "EFFECTIVE_REQUIRED_HISTORY_PERIODS=${INPUT_REQUIRED_HISTORY_PERIODS:-}"
            echo "EFFECTIVE_INCREMENTAL_ETF_MAX_AGE_HOURS=${INPUT_INCREMENTAL_ETF_MAX_AGE_HOURS:-}"
            echo "EFFECTIVE_CORE_BASKET_DELTA_PASS=$(
              if [ "${INPUT_CORE_BASKET_REFRESH:-false}" = "true" ] || [ "${INPUT_DISCOVER_UNIVERSE:-false}" = "true" ]; then
                echo true
              else
                echo false
              fi
            )"
            echo "EFFECTIVE_STOCKANALYSIS_SLEEP=${INPUT_SLEEP:-0.25}"
            echo "EFFECTIVE_YF_ETF_FALLBACK=${INPUT_YF_ETF_FALLBACK:-true}"
          } >> "$GITHUB_ENV"
          if [ "${INPUT_CORE_BASKET_REFRESH:-false}" = "true" ]; then
            INPUT_ETFS="$(node --input-type=module <<'NODE'
          import { mkdtemp, readFile, realpath, rm } from "node:fs/promises";
          import path from "node:path";
          import { createDefaultMaterializePlane, materializeCloudDataPlaneFamily } from "./scripts/materialize-cloud-data-plane-family.mjs";
          const family = "platform-projections", relative = "admin/fenok-etf-core-daily-basket.json";
          const env = process.env, repoRoot = process.cwd();
          const temporary = await mkdtemp(path.join(await realpath(env.RUNNER_TEMP), "core-basket-"));
          try {
            const plane = createDefaultMaterializePlane({ accountId: env.CLOUDFLARE_ACCOUNT_ID,
              token: env.CLOUDFLARE_API_TOKEN, endpoint: env.DATA_PLANE_ENDPOINT,
              writeKey: env.DATA_PLANE_WRITE_KEY, family });
            const receipt = await materializeCloudDataPlaneFamily({ plane, family, repoRoot, env,
              manifestPrefix: "public/data", privateManifestPrefix: "data", privacyClass: "public",
              outputRoot: path.join(temporary, "active"), canonicalReuseRoot: repoRoot,
              includeAsset: asset => asset.path === `data/${relative}` && asset.privacy_class === "private" });
            const payload = JSON.parse(await readFile(path.join(receipt.output_root, relative), "utf8"));
            const tickers = Array.isArray(payload.daily_refresh_universe?.tickers)
              ? payload.daily_refresh_universe.tickers
              : Array.isArray(payload.rows) ? payload.rows.map(row => row && row.ticker) : [];
            const selected = [...new Set(tickers.map(raw => String(raw || "").trim().toUpperCase()).filter(Boolean))];
            if (!selected.length) throw new Error("Core Basket refresh requested, but no tickers were found");
            process.stdout.write(selected.join(","));
          } finally { await rm(temporary, { recursive: true, force: true }); }
          NODE
          )"
          fi
          if [ "$UNIVERSE_FAILURE_PROOF" = "true" ]; then
            ARGS="--sleep ${INPUT_SLEEP:-0.25} --discover-etf-universe --universe-only --stocks-only --controlled-failure-surfaces etf_universe --limit-etfs 0"
          elif [ "$ETF_DETAIL_FAILURE_PROOF" = "true" ] || [ "$YAHOO_ETF_FAILURE_PROOF" = "true" ]; then
            ARGS="--sleep ${INPUT_SLEEP:-0.25} --etfs=${INPUT_ETFS} --controlled-failure-surfaces $INPUT_CONTROLLED_FAILURE_SURFACES --limit-etfs 1"
            if [ "${INPUT_YF_ETF_FALLBACK:-true}" = "true" ]; then
              ARGS="$ARGS --yf-etf-fallback"
            else
              ARGS="$ARGS --fail-on-error"
            fi
          elif [ "${INPUT_RECONCILE_MISSING_ETF_DETAILS:-false}" = "true" ]; then
            ARGS="--sleep ${INPUT_SLEEP:-0.25} --endpoint-canary --reconcile-missing-etf-details --incremental-etf-limit ${INPUT_RECONCILE_MISSING_ETF_LIMIT:-0}"
            if [ -n "$INPUT_ETFS" ]; then ARGS="$ARGS --etfs $INPUT_ETFS"; fi
            if [ -n "$INPUT_OFFSET" ]; then ARGS="$ARGS --offset $INPUT_OFFSET"; fi
          elif [ "${INPUT_HISTORY_GAP_PLAN:-false}" = "true" ]; then
            ARGS="--sleep ${INPUT_SLEEP:-0.25} --incremental-etf-backfill --incremental-etf-only --history-gaps-only --plan-only"
            PLAN_LIMIT="${INPUT_INCREMENTAL_ETF_LIMIT:-0}"
            ARGS="$ARGS --incremental-etf-limit $PLAN_LIMIT"
            if [ -n "$INPUT_INCREMENTAL_ETF_MAX_AGE_HOURS" ]; then ARGS="$ARGS --incremental-etf-max-age-hours $INPUT_INCREMENTAL_ETF_MAX_AGE_HOURS"; fi
            if [ -n "$INPUT_REQUIRED_HISTORY_PERIODS" ]; then ARGS="$ARGS --required-history-periods $INPUT_REQUIRED_HISTORY_PERIODS"; fi
            if [ "$INPUT_REQUIRED_HISTORY_PERIODS" = "daily_1y" ]; then ARGS="$ARGS --write-plan"; fi
            if [ -n "$INPUT_OFFSET" ]; then ARGS="$ARGS --offset $INPUT_OFFSET"; fi
          elif [ "${INPUT_HISTORY_GAPS_ONLY:-false}" = "true" ]; then
            ARGS="--sleep ${INPUT_SLEEP:-0.25} --endpoint-canary --incremental-etf-backfill --incremental-etf-only --history-gaps-only"
            if [ -n "$INPUT_ETFS" ]; then ARGS="$ARGS --etfs $INPUT_ETFS"; fi
            if [ -n "$INPUT_REQUIRED_HISTORY_PERIODS" ]; then ARGS="$ARGS --required-history-periods $INPUT_REQUIRED_HISTORY_PERIODS"; fi
            if [ -n "$INPUT_INCREMENTAL_ETF_LIMIT" ]; then ARGS="$ARGS --incremental-etf-limit $INPUT_INCREMENTAL_ETF_LIMIT"; fi
            if [ -n "$INPUT_INCREMENTAL_ETF_MAX_AGE_HOURS" ]; then ARGS="$ARGS --incremental-etf-max-age-hours $INPUT_INCREMENTAL_ETF_MAX_AGE_HOURS"; fi
            if [ -n "$INPUT_OFFSET" ]; then ARGS="$ARGS --offset $INPUT_OFFSET"; fi
            if [ "${INPUT_YF_ETF_FALLBACK:-true}" = "true" ]; then ARGS="$ARGS --yf-etf-fallback"; fi
          else
            if [ "${INPUT_ISOLATED_STOCK_SCHEDULE:-false}" = "true" ]; then
              ARGS="--sleep ${INPUT_SLEEP:-0.25}"
            else
              ARGS="--sleep ${INPUT_SLEEP:-0.25} --endpoint-canary --classify-etf-catalogs"
            fi
            if [ "${INPUT_DISCOVER_UNIVERSE:-false}" = "true" ]; then ARGS="$ARGS --discover-etf-universe"; fi
            if [ "${INPUT_UNIVERSE_BACKFILL:-false}" = "true" ]; then ARGS="$ARGS --universe-backfill"; fi
            if [ "${INPUT_INCREMENTAL_ETF_BACKFILL:-false}" = "true" ]; then ARGS="$ARGS --incremental-etf-backfill"; fi
            if [ "${INPUT_YF_ETF_FALLBACK:-true}" = "true" ]; then ARGS="$ARGS --yf-etf-fallback"; fi
            if [ -n "$INPUT_INCREMENTAL_ETF_LIMIT" ]; then ARGS="$ARGS --incremental-etf-limit $INPUT_INCREMENTAL_ETF_LIMIT"; fi
            if [ -n "$INPUT_INCREMENTAL_ETF_MAX_AGE_HOURS" ]; then ARGS="$ARGS --incremental-etf-max-age-hours $INPUT_INCREMENTAL_ETF_MAX_AGE_HOURS"; fi
            if [ "${INPUT_FETCH_SURFACES:-true}" = "true" ]; then ARGS="$ARGS --fetch-surfaces"; fi
            if [ -n "$INPUT_SURFACE_SET" ]; then ARGS="$ARGS --surface-set $INPUT_SURFACE_SET"; fi
            if [ -n "$INPUT_SURFACES" ]; then ARGS="$ARGS --surfaces $INPUT_SURFACES"; fi
            if [ -n "$INPUT_ETFS" ]; then ARGS="$ARGS --etfs $INPUT_ETFS"; fi
            if [ -n "$INPUT_STOCKS" ]; then ARGS="$ARGS --stocks $INPUT_STOCKS"; fi
            if [ "${INPUT_STOCKS_ONLY:-false}" = "true" ]; then ARGS="$ARGS --stocks-only"; fi
            if [ "${INPUT_FETCH_FINANCIALS:-true}" = "true" ]; then ARGS="$ARGS --fetch-financials"; fi
            if [ "${INPUT_REQUIRE_STOCK_FINANCIAL_PAIR:-false}" = "true" ]; then ARGS="$ARGS --require-stock-financial-pair"; fi
            if [ -n "$INPUT_STOCK_LIMIT" ]; then ARGS="$ARGS --stock-limit $INPUT_STOCK_LIMIT"; fi
            if [ -n "$INPUT_CONTROLLED_FAILURE_TICKERS" ]; then ARGS="$ARGS --controlled-failure-tickers $INPUT_CONTROLLED_FAILURE_TICKERS"; fi
            if [ -n "$INPUT_CONTROLLED_FAILURE_SURFACES" ]; then ARGS="$ARGS --controlled-failure-surfaces $INPUT_CONTROLLED_FAILURE_SURFACES"; fi
            if [ -n "$INPUT_OFFSET" ]; then ARGS="$ARGS --offset $INPUT_OFFSET"; fi
            if [ -n "$INPUT_LIMIT_ETFS" ]; then ARGS="$ARGS --limit-etfs $INPUT_LIMIT_ETFS"; fi
            if [ -n "$INPUT_MAX_UNIVERSE_PAGES" ]; then ARGS="$ARGS --max-universe-pages $INPUT_MAX_UNIVERSE_PAGES"; fi
          fi
          # Avoid prefetched ETF request bursts; preserve dispatch sleep.
          ARGS="$ARGS --etf-workers 1"
          if [ "$EVENT_NAME" = "schedule" ]; then
            ARGS="$ARGS --natural-run --natural-recovery-kinds $NATURAL_RECOVERY_KINDS"
          fi
          set -o pipefail
          PRIMARY_FETCH_LOG="$RUNNER_TEMP/stockanalysis-primary-fetch.log"
          PRIMARY_FETCHED_TICKERS="$RUNNER_TEMP/stockanalysis-primary-fetched-tickers.txt"
          # Validate the requested collection mode and authorized fault inputs
          # before creating the candidate tree or opening provider endpoints.
          python3 scripts/fetch-stockanalysis.py $ARGS \
            --event-name "$EVENT_NAME" \
            --preflight-only \
            --no-public-mirror
          python3 scripts/stockanalysis_artifact.py seed \
            --candidate-root "$STOCKANALYSIS_CANDIDATE_ROOT"
          node --input-type=module -e '
            import { hydrateYahooFinance, hydratePrivateFamily, hydratePublicCloudData, hydrateStockanalysisCatalogue } from "./scripts/materialize-cloud-data-plane-family.mjs";
            const repoRoot = process.env.STOCKANALYSIS_CANDIDATE_ROOT;
            const etf = await hydratePrivateFamily("stockanalysis-etf-detail", { repoRoot });
            const catalogue = await hydrateStockanalysisCatalogue({ repoRoot });
            const identity = ({ generation_id, manifest_sha256 }) => ({ generation_id, manifest_sha256 });
            const { writeFile } = await import("node:fs/promises");
            await writeFile(`${process.env.RUNNER_TEMP}/stockanalysis-plane-basis.json`, JSON.stringify({
              "stockanalysis-etf-detail": identity(etf), "stockanalysis-catalogue": identity(catalogue) }));
            await hydrateYahooFinance({ repoRoot, financeOnly: true });
            await hydratePublicCloudData({ relative: "yf/finance/_index.json", family: "yahoo-finance", repoRoot });
            await hydratePublicCloudData({ relative: "global-scouter/core/stocks_analyzer.json", family: "scouter-derived", repoRoot });
          '
          # Compare acquisition to the hydrated generation, not retired Git blobs.
          python3 - <<'PYBASE'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from stockanalysis_artifact import candidate_files, sha256_file
          root = Path(os.environ['STOCKANALYSIS_CANDIDATE_ROOT'])
          baseline = {rel: sha256_file(path) for rel, path in candidate_files(root).items()}
          basis = json.loads((Path(os.environ['RUNNER_TEMP']) / 'stockanalysis-plane-basis.json').read_text())
          (Path(os.environ['RUNNER_TEMP']) / 'stockanalysis-baseline.json').write_text(json.dumps({'files': baseline, 'plane_basis': basis}))
          PYBASE
          python3 scripts/stockanalysis_etf_plane.py --source-root "$STOCKANALYSIS_CANDIDATE_ROOT" --select-only
          python3 scripts/fetch-stockanalysis.py $ARGS \
            --event-name "$EVENT_NAME" \
            --candidate-root "$STOCKANALYSIS_CANDIDATE_ROOT" \
            --no-public-mirror | tee "$PRIMARY_FETCH_LOG"
          awk '/^\[etf [0-9]+\/[0-9]+\]/ && $4 != "FAIL" { print $3 }' "$PRIMARY_FETCH_LOG" \
            | sort -u > "$PRIMARY_FETCHED_TICKERS"

      - name: Refresh history-gap plan after live backfill
        if: ${{ github.event.inputs.history_gaps_only == 'true' && !inputs.natural_etf_weekday }}
        env:
          INPUT_REQUIRED_HISTORY_PERIODS: ${{ github.event.inputs.required_history_periods }}
          INPUT_INCREMENTAL_ETF_MAX_AGE_HOURS: ${{ github.event.inputs.incremental_etf_max_age_hours }}
        run: |
          REQUIRED_HISTORY_PERIODS="${EFFECTIVE_REQUIRED_HISTORY_PERIODS:-${INPUT_REQUIRED_HISTORY_PERIODS:-}}"
          MAX_AGE_HOURS="${EFFECTIVE_INCREMENTAL_ETF_MAX_AGE_HOURS:-${INPUT_INCREMENTAL_ETF_MAX_AGE_HOURS:-}}"
          ARGS="--incremental-etf-backfill --incremental-etf-only --history-gaps-only --plan-only --incremental-etf-limit 0"
          if [ -n "$REQUIRED_HISTORY_PERIODS" ]; then ARGS="$ARGS --required-history-periods $REQUIRED_HISTORY_PERIODS"; fi
          if [ "$REQUIRED_HISTORY_PERIODS" = "daily_1y" ]; then ARGS="$ARGS --write-plan"; fi
          if [ -n "$MAX_AGE_HOURS" ]; then ARGS="$ARGS --incremental-etf-max-age-hours $MAX_AGE_HOURS"; fi
          python3 scripts/fetch-stockanalysis.py $ARGS \
            --event-name "${{ needs.clock-admission.outputs.event_name }}" \
            --candidate-root "$STOCKANALYSIS_CANDIDATE_ROOT" \
            --no-public-mirror

      - name: Assert acquisition checkout stayed byte-clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          if [ -n "$(git status --porcelain=v1 --untracked-files=all --ignored)" ]; then
            git status --short --untracked-files=all --ignored
            exit 1
          fi

      - name: Pack immutable StockAnalysis candidate
        run: |
          python3 scripts/stockanalysis_artifact.py pack \
            --candidate-root "$STOCKANALYSIS_CANDIDATE_ROOT" \
            --artifact-root "$STOCKANALYSIS_ARTIFACT_ROOT" \
            --baseline-manifest "$RUNNER_TEMP/stockanalysis-baseline.json" \
            --base-sha "$STOCKANALYSIS_BASE_SHA" \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --artifact-name "$STOCKANALYSIS_ARTIFACT_NAME"

      - name: Upload immutable StockAnalysis candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: stockanalysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stockanalysis-artifact
          if-no-files-found: error
          retention-days: 1

  publish-stockanalysis:
    if: ${{ github.event.action != 'stockanalysis-plane-recovery' && needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: [clock-admission, acquire-stockanalysis]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    concurrency:
      group: stockanalysis-catalogue-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acquire-stockanalysis.outputs.artifact_name }}
          path: ${{ runner.temp }}/stockanalysis-artifact
      - name: Publish catalogue and stock recovery atomically
        env:
          ARTIFACT_DIGEST: ${{ needs.acquire-stockanalysis.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.acquire-stockanalysis.outputs.artifact_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/stockanalysis_artifact.py validate-plane \
            --artifact-root "$RUNNER_TEMP/stockanalysis-artifact" \
            --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}" --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST"
          node --input-type=module - <<'JS'
          import path from "node:path";
          import { readFile, mkdir, cp } from "node:fs/promises";
          import { hydrateStockanalysisCatalogue } from "./scripts/materialize-cloud-data-plane-family.mjs";
          import { runPublisherCli } from "./scripts/publish-cloud-data-generation.mjs";
          const artifact = path.join(process.env.RUNNER_TEMP, "stockanalysis-artifact");
          const manifest = JSON.parse(await readFile(path.join(artifact, "manifest.json"), "utf8"));
          const basis = manifest.plane_basis?.["stockanalysis-catalogue"];
          if (!basis) throw new Error("CATALOGUE_ACQUISITION_BASIS_MISSING");
          const root = path.join(process.env.RUNNER_TEMP, "stockanalysis-catalogue");
          await mkdir(root, { recursive: true });
          const receipt = await hydrateStockanalysisCatalogue({ repoRoot: root });
          if (basis.generation_id !== receipt.generation_id || basis.manifest_sha256 !== receipt.manifest_sha256) {
            throw new Error("CATALOGUE_ACQUISITION_BASIS_CHANGED");
          }
          for (const { path: relative } of manifest.files) {
            const target = path.join(root, relative);
            await mkdir(path.dirname(target), { recursive: true });
            await cp(path.join(artifact, "files", relative), target);
          }
          process.env.PUBLISH_EXPECTED_ACTIVE_GENERATION_ID = basis.generation_id;
          process.env.PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256 = basis.manifest_sha256;
          process.exitCode = await runPublisherCli({ argv: ["--family=stockanalysis-catalogue",
            `--input-root=${root}/data/stockanalysis`, "--json"] });
          JS

  publish-stockanalysis-etf-plane:
    needs: [clock-admission, acquire-stockanalysis, publish-stockanalysis]
    if: >-
      !cancelled() &&
      ((github.event_name == 'repository_dispatch' && github.event.action == 'stockanalysis-plane-recovery') ||
       (needs.acquire-stockanalysis.result == 'success' && needs.publish-stockanalysis.result == 'success' &&
        needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' &&
        ((needs.clock-admission.outputs.event_name == 'schedule' &&
          (needs.clock-admission.outputs.mode == 'etf_weekday' || needs.clock-admission.outputs.mode == 'etf_general')) ||
         (needs.clock-admission.outputs.event_name == 'workflow_dispatch' &&
          (inputs.natural_etf_weekday ||
           ((inputs.core_basket_refresh == 'true' || inputs.etfs != '') &&
            inputs.stocks_only != 'true' && inputs.history_gap_plan != 'true' &&
            inputs.controlled_failure_tickers == '' && inputs.controlled_failure_surfaces == ''))))))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    concurrency:
      group: stockanalysis-etf-detail-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Verify the reused artifact identity from the GitHub API
        if: github.event.action == 'stockanalysis-plane-recovery'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.client_payload.source_run_attempt }}
        run: |
          set -euo pipefail
          python3 - "${{ github.repository }}" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" <<'PY'
          import hashlib, json, os, re, stat, subprocess, sys, zipfile
          from pathlib import Path, PurePosixPath
          repository, run_id, attempt = sys.argv[1:]
          if not re.fullmatch(r"[1-9][0-9]*", run_id) or not re.fullmatch(r"[1-9][0-9]*", attempt):
              raise SystemExit("recovery requires positive source_run_id and source_run_attempt")
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))
          run = api(f"repos/{repository}/actions/runs/{run_id}")
          if str(run.get("id")) != run_id or run.get("repository", {}).get("full_name") != repository:
              raise SystemExit("source run identity/repository mismatch")
          if run.get("path") != ".github/workflows/fetch-stockanalysis.yml":
              raise SystemExit("source run is not this workflow")
          if run.get("status") != "completed" or run.get("head_branch") != "main":
              raise SystemExit("recovery requires a completed main-branch source run")
          if str(run.get("run_attempt")) != attempt:
              raise SystemExit("source run attempt mismatch")
          artifacts = [item for item in api(
              f"repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]
              if item["name"] == f"stockanalysis-{run_id}-{attempt}"]
          if len(artifacts) != 1:
              raise SystemExit("expected exactly one source artifact")
          artifact = artifacts[0]
          digest_match = re.fullmatch(r"sha256:([0-9a-f]{64})", str(artifact.get("digest", "")))
          if not digest_match or artifact.get("expired") is not False:
              raise SystemExit("source artifact expired or lacks its API SHA256 digest")
          identity = artifact.get("workflow_run", {})
          if (str(identity.get("id")) != run_id
                  or identity.get("head_sha") != run.get("head_sha")
                  or identity.get("repository_id") != run.get("repository", {}).get("id")
                  or identity.get("head_repository_id") != identity.get("repository_id")):
              raise SystemExit("artifact source run/repository/revision mismatch")
          digest = digest_match.group(1)
          # Verify the actual ZIP, not only a caller-supplied digest string. The normal
          # acquisition download remains unchanged; recovery is read-only to source runs.
          archive = Path(os.environ["RUNNER_TEMP"]) / "stockanalysis-reuse.zip"
          root = Path(os.environ["RUNNER_TEMP"]) / "stockanalysis-artifact"
          if archive.exists() or root.exists():
              raise SystemExit("recovery scratch already exists")
          with archive.open("xb") as handle:
              subprocess.run(["gh", "api", f"repos/{repository}/actions/artifacts/{artifact['id']}/zip"],
                             stdout=handle, check=True)
          with archive.open("rb") as handle:
              actual_digest = hashlib.file_digest(handle, "sha256").hexdigest()
          if actual_digest != digest:
              raise SystemExit("downloaded artifact SHA256 does not match GitHub API")
          with zipfile.ZipFile(archive) as source:
              seen = set()
              for item in source.infolist():
                  name = PurePosixPath(item.filename)
                  if (name.is_absolute() or ".." in name.parts or "\\" in item.filename
                          or stat.S_ISLNK(item.external_attr >> 16) or item.filename in seen):
                      raise SystemExit("unsafe or duplicate artifact ZIP member")
                  seen.add(item.filename)
              root.mkdir()
              source.extractall(root)
          outputs = {
              "artifact_name": artifact["name"], "artifact_digest": digest,
              "run_id": run_id, "run_number": str(run["run_number"]), "run_attempt": attempt,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Download immutable StockAnalysis candidate
        if: github.event.action != 'stockanalysis-plane-recovery'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acquire-stockanalysis.outputs.artifact_name }}
          path: ${{ runner.temp }}/stockanalysis-artifact

      - name: Validate the immutable candidate without modifying canonical Git files
        env:
          ARTIFACT_DIGEST: ${{ github.event.action == 'stockanalysis-plane-recovery' && steps.reuse.outputs.artifact_digest || needs.acquire-stockanalysis.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ github.event.action == 'stockanalysis-plane-recovery' && steps.reuse.outputs.artifact_name || needs.acquire-stockanalysis.outputs.artifact_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -f -B main origin/main
          ARTIFACT_ROOT="$RUNNER_TEMP/stockanalysis-artifact"
          APPLY_JSON="$(
            python3 scripts/stockanalysis_artifact.py validate-plane \
              --artifact-root "$ARTIFACT_ROOT" \
              --run-id "${{ github.event.action == 'stockanalysis-plane-recovery' && steps.reuse.outputs.run_id || github.run_id }}" \
              --run-number "${{ github.event.action == 'stockanalysis-plane-recovery' && steps.reuse.outputs.run_number || github.run_number }}" \
              --run-attempt "${{ github.event.action == 'stockanalysis-plane-recovery' && steps.reuse.outputs.run_attempt || github.run_attempt }}" \
              --artifact-name "$ARTIFACT_NAME" \
              --artifact-digest "$ARTIFACT_DIGEST" \
              --github-output "$RUNNER_TEMP/stockanalysis-plane-apply-output"
          )"
          APPLY_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$APPLY_JSON")"
          if [ "$APPLY_STATUS" != "validated" ]; then
            echo "::error::ETF plane publication requires a validated immutable candidate; got $APPLY_STATUS" >&2
            exit 75
          fi
          printf '%s\n' "$APPLY_JSON" > "$RUNNER_TEMP/stockanalysis-plane-apply.json"

      - name: Build ETF candidate from the verified active generation
        env:
          ETF_ADMISSION_REPORT: ${{ runner.temp }}/stockanalysis-etf-admission.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          ACTIVE_BASE_ROOT="$RUNNER_TEMP/stockanalysis-etf-active"
          ACTIVE_ROOT="$ACTIVE_BASE_ROOT/stockanalysis/etfs"
          CANDIDATE_ROOT="$RUNNER_TEMP/stockanalysis-etf-candidate"
          RECEIPT="$RUNNER_TEMP/stockanalysis-etf-active-receipt.json"
          if [ -e "$ACTIVE_BASE_ROOT" ] || [ -e "$CANDIDATE_ROOT" ] || [ -e "$RECEIPT" ]; then
            echo "::error::ETF active/candidate scratch path already exists" >&2
            exit 2
          fi
          node scripts/materialize-cloud-data-plane-family.mjs \
            --family stockanalysis-etf-detail \
            --manifest-prefix data \
            --reuse-root "$GITHUB_WORKSPACE" \
            --output-root "$ACTIVE_BASE_ROOT" | tee "$RECEIPT"
          # Hard links avoid a second 1GB download or copy. The overlay below
          # replaces candidate links atomically, leaving the verified base intact.
          cp -al "$ACTIVE_ROOT" "$CANDIDATE_ROOT"
          python3 - "$RUNNER_TEMP/stockanalysis-artifact" \
            "$RUNNER_TEMP/stockanalysis-plane-apply.json" "$CANDIDATE_ROOT" \
            "$ACTIVE_ROOT" "scripts/fetch-stockanalysis.py" <<'PYEOF'
          from datetime import datetime, timezone
          import hashlib
          from importlib.util import module_from_spec, spec_from_file_location
          import json
          import math
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile

          artifact, applied_path, candidate, active_root, fetcher_path = map(Path, sys.argv[1:])
          spec = spec_from_file_location("etf_overlay_contract", fetcher_path.resolve(strict=True))
          fetcher = module_from_spec(spec)
          sys.modules[spec.name] = fetcher
          spec.loader.exec_module(fetcher)
          sys.path.insert(0, str(fetcher_path.resolve().parent))
          from yahoo_batch_state import YAHOO_RUN_REFUSAL_BUDGET

          class MemberRefusal(Exception):
              pass
          manifest = json.loads((artifact / "manifest.json").read_text(encoding="utf-8"))
          applied = json.loads(applied_path.read_text(encoding="utf-8"))
          if applied.get("status") != "validated" or applied.get("paths") != manifest.get("paths"):
              raise SystemExit("ETF candidate artifact paths differ from the validated immutable artifact")
          prefix = "data/stockanalysis/etfs/"
          rows = [row for row in manifest["files"] if row["path"].startswith(prefix)]
          overlay_names = {row["path"][len(prefix):] for row in rows}
          name_pattern = re.compile(r"[A-Z0-9][A-Z0-9._-]*\.json")
          if any(not path.is_file() or path.is_symlink() or not name_pattern.fullmatch(path.name)
                 for path in candidate.iterdir()):
              raise SystemExit("verified ETF active generation is not a flat ticker JSON tree")
          active_names = {path.name for path in candidate.iterdir() if path.is_file()}
          git_root = Path(prefix)
          if any(not path.is_file() or path.is_symlink() or not name_pattern.fullmatch(path.name)
                 for path in (git_root.iterdir() if git_root.exists() else [])):
              raise SystemExit("Git ETF LKG is not a flat ticker JSON tree")
          selection = json.loads((active_root.parents[1] / "admin/data-supply-state/v1/etf-detail-selection.json").read_text())
          selected_tickers = set(selection["selected"])
          git_names = {path.name for path in git_root.iterdir() if path.stem in selected_tickers} if git_root.exists() else set()
          git_only = sorted(git_names - active_names - overlay_names)
          def checked_payload(body, ticker, label, *, legacy_baseline=False):
              try:
                  payload = json.loads(body)
                  if not isinstance(payload, dict):
                      raise ValueError("payload is not an object")
                  legacy_unclassified = (legacy_baseline and "source_as_of" not in payload
                                         and "detail_status" not in payload)
                  # Earlier active generations predate the explicit source stamp.
                  # Derive their floor from the same provider fields as acquisition;
                  # incoming artifacts still require their own verified stamp.
                  if legacy_baseline and "source_as_of" not in payload:
                      payload["source_as_of"] = fetcher.stockanalysis_detail_source_timestamp(payload)
                  fetcher.validate_stockanalysis_etf_payload(ticker, payload)
              except (ValueError, TypeError) as error:
                  raise MemberRefusal(f"ETF {label} contract invalid for {ticker}: {error}") from error
              source = fetcher.parse_iso_timestamp(payload.get("source_as_of"))
              fetched = fetcher.parse_iso_timestamp(payload.get("fetched_at"))
              if fetched is None or fetched > datetime.now(timezone.utc) or (source and source > fetched):
                  raise MemberRefusal(f"ETF {label} source/fetch clock invalid for {ticker}")
              complete = fetcher.is_complete_stockanalysis_etf_payload(ticker, payload)
              return payload, source, complete, legacy_unclassified

          def enforce_floor(ticker, candidate_payload, candidate_source, candidate_complete, baseline_bytes, label):
              if baseline_bytes is None:
                  return
              baseline, baseline_source, baseline_complete, legacy_unclassified = checked_payload(
                  baseline_bytes, ticker, label, legacy_baseline=True)
              if fetcher.issuer_holdings_snapshot(candidate_payload) is not None:
                  # Native aggregates may represent the latest quote, whereas
                  # issuer composites use the oldest required component. Compare
                  # the same components before applying the detail-loss checks.
                  before = fetcher._etf_component_clocks(baseline)
                  after = fetcher._etf_component_clocks(candidate_payload)
                  if (not before or not after or not before.keys() <= after.keys()
                          or any(after[key] < before[key] for key in before)):
                      raise MemberRefusal(f"ETF {ticker} artifact component date regresses {label}")
              elif baseline_source and (candidate_source is None or candidate_source < baseline_source):
                  raise MemberRefusal(f"ETF {ticker} artifact source date regresses {label}")
              old_normalized = baseline.get("normalized") or {}
              new_normalized = candidate_payload.get("normalized") or {}
              old_holdings = (baseline.get("raw") or {}).get("holdings")
              new_holdings = (candidate_payload.get("raw") or {}).get("holdings")
              new_count = new_normalized.get("holding_count")
              detail_loss = fetcher.etf_detail_regression(candidate_payload, baseline)
              # A legacy row with no country surface was never country-complete.
              # Admit only that same gap's new explicit label; every existing
              # complete-baseline quote/history/date floor still runs below.
              same_legacy_country_gap = (
                  baseline_complete and legacy_unclassified
                  and candidate_payload.get("detail_status") == "stockanalysis_partial"
                  and candidate_payload.get("partial_reason_codes") == ["holdings_countries_unavailable"]
                  and isinstance(old_holdings, dict) and isinstance(new_holdings, dict)
                  and old_holdings.get("countries") is None and new_holdings.get("countries") is None
                  and isinstance(old_holdings.get("allocationChartData"), (dict, type(None)))
                  and isinstance(new_holdings.get("allocationChartData"), (dict, type(None)))
                  and not (old_holdings.get("allocationChartData") or {}).get("countries")
                  and not (new_holdings.get("allocationChartData") or {}).get("countries")
                  and old_normalized.get("countries") is None and new_normalized.get("countries") is None
                  and isinstance(new_normalized.get("holdings"), list) and bool(new_normalized["holdings"])
                  and detail_loss is None
                  and isinstance(new_count, (int, float)) and not isinstance(new_count, bool)
                  and math.isfinite(new_count)
                  and new_count >= len(new_normalized["holdings"])
                  and all(new_normalized.get(field) is not None
                          and (not value or bool(new_normalized[field]))
                          for field, value in old_normalized.items() if value is not None)
                  and (not old_holdings.get("sectors") or bool(new_holdings.get("sectors")))
              )
              if baseline_complete and not candidate_complete and not same_legacy_country_gap:
                  raise MemberRefusal(f"ETF {ticker} artifact loses complete {label} detail")
              if baseline_complete:
                  old_normalized = baseline.get("normalized") or {}
                  new_normalized = candidate_payload.get("normalized") or {}
                  for field in ("holding_count", "holdings_updated"):
                      if old_normalized.get(field) is not None and new_normalized.get(field) is None:
                          raise MemberRefusal(f"ETF {ticker} artifact loses {label} {field}")
                  old_quote = (baseline.get("raw") or {}).get("quote")
                  new_quote = (candidate_payload.get("raw") or {}).get("quote")
                  if isinstance(old_quote, dict):
                      old_price = old_quote.get("p")
                      old_clock = fetcher.quote_source_timestamp(old_quote)
                      if (isinstance(old_price, (int, float)) and not isinstance(old_price, bool)
                              and math.isfinite(old_price) and old_price > 0 and old_clock):
                          new_price = new_quote.get("p") if isinstance(new_quote, dict) else None
                          new_clock = fetcher.quote_source_timestamp(new_quote)
                          if (not isinstance(new_price, (int, float)) or isinstance(new_price, bool)
                                  or not math.isfinite(new_price) or new_price <= 0 or not new_clock
                                  or fetcher.parse_iso_timestamp(new_clock) < fetcher.parse_iso_timestamp(old_clock)):
                              raise MemberRefusal(f"ETF {ticker} artifact loses {label} usable quote")
                  old_periods = old_normalized.get("history_periods") or {}
                  new_periods = new_normalized.get("history_periods") or {}
                  for period, rows in old_periods.items():
                      old_count = fetcher.valid_unique_history_date_count(rows)
                      required_count = min(old_count, fetcher.history_period_min_rows(period) or old_count)
                      if old_count > 0 and fetcher.valid_unique_history_date_count(
                              new_periods.get(period)) < required_count:
                          raise MemberRefusal(f"ETF {ticker} artifact loses {label} {period} history")
              if detail_loss:
                  raise MemberRefusal(f"ETF {ticker} artifact loses {label} {detail_loss}")

          def retain_active_holdings(ticker, payload, baseline_bytes):
              reasons = payload.get("partial_reason_codes") or []
              # A countries-only partial keeps the verified primary holdings list
              # but loses the country surface. The active generation may still hold
              # that surface as one bound component, so it is retained exactly like
              # the other missing-surface reasons instead of refusing the member.
              missing_surface = any(reason in ("holdings_unavailable", "holdings_countries_unavailable")
                                    or reason.startswith("holdings_surface_")
                                    for reason in reasons)
              if not baseline_bytes:
                  return False
              baseline, _, _, _ = checked_payload(baseline_bytes, ticker, "active", legacy_baseline=True)
              old = baseline.get("normalized") or {}
              if not old.get("holdings"):
                  return False
              issuer_date = fetcher.issuer_holdings_snapshot(payload)
              if issuer_date is not None:
                  old_date = fetcher.parse_stockanalysis_date(old.get("holdings_updated"))
                  if old_date is not None and issuer_date < old_date:
                      return False
                  # Git and the active plane can hold different prior portfolios.
                  # Preserve the exact active snapshot before the detail-loss gate.
                  snapshot = fetcher.etf_holdings_snapshot(baseline)
                  history = payload["normalized"].setdefault("holdings_history", [])
                  if snapshot not in history:
                      history.append(snapshot)
                      return True
                  return False
              if not missing_surface:
                  return False
              # The overview is a sample when the holdings endpoint is absent.
              # Keep the verified portfolio and its dates as one bound component.
              for key in ("holdings", "holding_count", "holdings_updated", "countries", "sectors", "asset_allocation"):
                  payload["normalized"].pop(key, None)
                  if key in old:
                      payload["normalized"][key] = old[key]
              for section, keys in (("raw", ("holdings", "official_holdings")),
                                    ("endpoints", ("holdings",)), ("endpoint_contracts", ("holdings",))):
                  target = payload.setdefault(section, {})
                  for key in keys:
                      target.pop(key, None)
                      if key in (baseline.get(section) or {}):
                          target[key] = baseline[section][key]
              payload.pop("holdings_source", None)
              if "holdings_source" in baseline:
                  payload["holdings_source"] = baseline["holdings_source"]
              payload["retained_holdings"] = {
                  "provider": "stockanalysis", "payload_sha256": hashlib.sha256(baseline_bytes).hexdigest(),
                  "source_as_of": baseline.get("source_as_of"), "fetched_at": baseline.get("fetched_at"),
                  "holdings_updated": old.get("holdings_updated"),
              }
              remaining = [reason for reason in reasons if not reason.startswith("holdings_")]
              remaining += [reason for reason in baseline.get("partial_reason_codes", []) if reason.startswith("holdings_")]
              if remaining:
                  payload["partial_reason_codes"] = sorted(set(remaining))
              else:
                  payload.pop("partial_reason_codes", None)
                  payload.pop("detail_status", None)
              payload["source_as_of"] = fetcher.stockanalysis_detail_source_timestamp(payload)
              return True

          def retain_history_archives(ticker, payload, baseline_bytes, label):
              if baseline_bytes is None:
                  return False
              baseline, _, _, _ = checked_payload(baseline_bytes, ticker, label, legacy_baseline=True)
              archives = (baseline.get("normalized") or {}).get("history_archive") or []
              if not archives:
                  return False
              # Acquisition can precede another successful publication. Carry
              # forward its exact archives before the unchanged regression gate;
              # do not replace native prices, provider clocks or provenance.
              target = payload["normalized"].setdefault("history_archive", [])
              existing = {record["payload_sha256"]: record for record in target}
              changed = False
              for record in archives:
                  digest = record["payload_sha256"]
                  if digest in existing:
                      if existing[digest] != record:
                          raise MemberRefusal(f"ETF {ticker} conflicting {label} history archive")
                      continue
                  target.append(record)
                  existing[digest] = record
                  changed = True
              return changed

          retained_names = []
          refused_members = []
          deferred_names = set()
          accepted_names = []
          for name in git_only:
              body = (git_root / name).read_bytes()
              digest = hashlib.sha256(body).hexdigest()
              with tempfile.NamedTemporaryFile(dir=candidate, prefix=f".{name}.", delete=False) as handle:
                  temporary = Path(handle.name)
                  handle.write(body)
              os.replace(temporary, candidate / name)
              if hashlib.sha256((candidate / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"Git-only ETF addition readback failed: {name}")
          for row in rows:
              rel = row["path"]
              name = rel[len(prefix):]
              if not name_pattern.fullmatch(name):
                  raise SystemExit(f"ETF candidate path is not a top-level ticker JSON: {rel}")
              source = artifact / "files" / rel
              body = source.read_bytes()
              if len(body) != row["size"] or hashlib.sha256(body).hexdigest() != row["sha256"]:
                  raise SystemExit(f"ETF candidate artifact changed after apply: {rel}")
              ticker = name[:-5]
              active_file = active_root / name
              active_bytes = active_file.read_bytes() if active_file.exists() else None
              lkg = subprocess.run(["git", "show", f"HEAD:{rel}"], capture_output=True, check=False)
              if lkg.returncode != 0:
                  tracked = subprocess.run(["git", "ls-files", "--error-unmatch", "--", rel],
                                           capture_output=True, check=False)
                  if tracked.returncode == 0:
                      raise SystemExit(f"ETF {ticker} Git LKG is unreadable")
              try:
                  payload, source_as_of, complete, _ = checked_payload(body, ticker, "artifact")
                  held_components = retain_active_holdings(ticker, payload, active_bytes)
                  held_archives = retain_history_archives(ticker, payload, active_bytes, "active")
                  if lkg.returncode == 0:
                      held_archives = retain_history_archives(ticker, payload, lkg.stdout, "Git LKG") or held_archives
                  if held_components or held_archives:
                      body = (json.dumps(payload, ensure_ascii=False, indent=2) + "\n").encode()
                      payload, source_as_of, complete, _ = checked_payload(body, ticker, "assembled candidate")
                  enforce_floor(ticker, payload, source_as_of, complete, active_bytes, "active")
                  if lkg.returncode == 0:
                      enforce_floor(ticker, payload, source_as_of, complete, lkg.stdout, "Git LKG")
              except MemberRefusal as error:
                  # Never replace a verified prior object with a refused member.
                  # A new member may use verified canonical LKG, or be explicitly
                  # deferred when no previous object exists. Every refusal counts.
                  prior_bytes = active_bytes if active_bytes is not None else (lkg.stdout if lkg.returncode == 0 else None)
                  prior_kind = "active" if active_bytes is not None else "Git LKG"
                  prior_date = None
                  if prior_bytes is not None:
                      if active_bytes is None:
                          try:
                              checked_payload(prior_bytes, ticker, prior_kind, legacy_baseline=True)
                          except MemberRefusal:
                              prior_bytes = None
                              deferred_names.add(name)
                          else:
                              (candidate / name).write_bytes(prior_bytes)
                      if prior_bytes is not None:
                          # Active bytes were already verified against the plane
                          # manifest. Do not reclassify retained data as newly
                          # acquired, or stamp the refusal time onto its source.
                          prior = json.loads(prior_bytes)
                          prior_date = prior.get("source_as_of") or fetcher.stockanalysis_detail_source_timestamp(prior)
                  else:
                      deferred_names.add(name)
                  refused_members.append({"ticker": ticker, "reason": str(error),
                                          "disposition": "retained" if prior_bytes is not None else "deferred",
                                          "retained_from": prior_kind if prior_bytes is not None else None,
                                          "source_as_of": prior_date,
                                          "sha256": hashlib.sha256(prior_bytes).hexdigest() if prior_bytes is not None else None})
                  continue
              if held_components:
                  retained_names.append(ticker)
              accepted_names.append(ticker)
              target = candidate / name
              with tempfile.NamedTemporaryFile(dir=candidate, prefix=f".{name}.", delete=False) as handle:
                  temporary = Path(handle.name)
                  handle.write(body)
              os.replace(temporary, target)
              if hashlib.sha256(target.read_bytes()).hexdigest() != hashlib.sha256(body).hexdigest():
                  raise SystemExit(f"ETF candidate overlay readback failed: {rel}")
          budget = max(YAHOO_RUN_REFUSAL_BUDGET[1], int(len(rows) * YAHOO_RUN_REFUSAL_BUDGET[0]))
          report = {"attempted_members": len(rows), "accepted_members": len(accepted_names),
                    "refused_members": refused_members, "refusal_budget": budget,
                    "retained_active_holdings": retained_names}
          if os.environ.get("ETF_ADMISSION_REPORT"):
              Path(os.environ["ETF_ADMISSION_REPORT"]).write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          if len(refused_members) > budget:
              print(json.dumps(report))
              raise SystemExit(f"ETF member refusals exceed budget: {len(refused_members)} > {budget}")
          expected_names = (active_names | git_names | overlay_names) - deferred_names
          if {path.name for path in candidate.iterdir()} != expected_names:
              raise SystemExit("ETF candidate membership differs from active/Git/artifact union")
          print(json.dumps({"active_etf_files": len(active_names), "git_only_additions": len(git_only),
                            "artifact_etf_overlays": len(rows), "candidate_etf_files": len(expected_names),
                            **report}))
          PYEOF
          # The base tree and pointer must still match the receipt after the
          # hard-link overlay; publisher also checks the same pointer identity.
          node scripts/materialize-cloud-data-plane-family.mjs \
            --family stockanalysis-etf-detail \
            --verify-receipt "$RECEIPT" >/dev/null
          python3 - "$RECEIPT" "$CANDIDATE_ROOT" "$GITHUB_ENV" "$RUNNER_TEMP/stockanalysis-artifact/manifest.json" <<'PYEOF'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          candidate = Path(sys.argv[2])
          manifest = json.loads(Path(sys.argv[4]).read_text(encoding="utf-8"))
          if receipt.get("family") != "stockanalysis-etf-detail" or not candidate.is_dir():
              raise SystemExit("ETF active receipt/candidate is invalid")
          with Path(sys.argv[3]).open("a", encoding="utf-8") as env:
              env.write(f"ETF_CANDIDATE_ROOT={candidate}\n")
              basis = manifest.get('plane_basis', {}).get('stockanalysis-etf-detail')
              if not basis or any(receipt[key] != basis.get(key) for key in ('generation_id', 'manifest_sha256')):
                  raise SystemExit('ETF_ACQUISITION_BASIS_CHANGED')
              env.write(f"PUBLISH_EXPECTED_ACTIVE_GENERATION_ID={receipt['generation_id']}\n")
              env.write(f"PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256={receipt['manifest_sha256']}\n")
          PYEOF

      - name: Upload ETF member admission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockanalysis-etf-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stockanalysis-etf-admission.json
          if-no-files-found: ignore

      - name: Build selected projection and provider state in one bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          SOURCE_ROOT="$RUNNER_TEMP/stockanalysis-etf-resolution"
          BUNDLE_ROOT="$RUNNER_TEMP/stockanalysis-etf-bundle"
          mkdir "$SOURCE_ROOT"
          cp -a "$RUNNER_TEMP/stockanalysis-etf-active" "$SOURCE_ROOT/data"
          SOURCE_ROOT="$SOURCE_ROOT" node --input-type=module -e '
            import { hydratePublicCloudData, hydrateStockanalysisCatalogue } from "./scripts/materialize-cloud-data-plane-family.mjs";
            const repoRoot = process.env.SOURCE_ROOT;
            await hydrateStockanalysisCatalogue({ repoRoot });
            await hydratePublicCloudData({ relative: "admin/data-usage-manifest.json", family: "platform-projections", repoRoot });
            await hydratePublicCloudData({ relative: "yf/finance/_index.json", family: "yahoo-finance", repoRoot });
            await hydratePublicCloudData({ relative: "global-scouter/core/stocks_analyzer.json", family: "scouter-derived", repoRoot });
          '
          python3 - "$RUNNER_TEMP/stockanalysis-artifact" "$SOURCE_ROOT" "$ETF_CANDIDATE_ROOT" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          artifact, source, admitted = map(Path, sys.argv[1:])
          for row in json.loads((artifact / 'manifest.json').read_text())['files']:
              rel = row['path']
              target = source / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(artifact / 'files' / rel, target)
          for payload in admitted.glob('*.json'):
              shutil.copy2(payload, source / 'data/stockanalysis/etfs' / payload.name)
          PY
          python3 scripts/resolve_etf_detail_candidates.py \
            --state-root "$SOURCE_ROOT/data/admin/data-supply-state/v1" \
            --provider-truth-root "$SOURCE_ROOT" \
            --artifact-manifest "$RUNNER_TEMP/stockanalysis-artifact/manifest.json"
          python3 scripts/stockanalysis_etf_plane.py --source-root "$SOURCE_ROOT" --output-root "$BUNDLE_ROOT"
          echo "ETF_CANDIDATE_ROOT=$BUNDLE_ROOT/data/stockanalysis/etfs" >> "$GITHUB_ENV"

      - name: Publish guarded stockanalysis-etf-detail generation
        id: publish_cloud_generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          # Bind publication to the immutable acquisition artifact; this job
          # follows the catalogue publisher to serialize bulk R2 operations.
          PUBLISH_BINDING_ARTIFACT_DIGEST: ${{ github.event.action == 'stockanalysis-plane-recovery' && steps.reuse.outputs.artifact_digest || needs.acquire-stockanalysis.outputs.artifact_digest }}
        run: |
          node --input-type=module -e '
            import { buildFamilyManifest, runPublisherCli } from "./scripts/publish-cloud-data-generation.mjs";
            process.exitCode = await runPublisherCli({
              argv: ["--family=stockanalysis-etf-detail", "--json"],
              buildFamilyManifestImpl: (options) => buildFamilyManifest({
                ...options, absRoot: process.env.ETF_CANDIDATE_ROOT,
              }),
            });
          '

  refresh-etf-health:
    needs: [clock-admission, publish-stockanalysis, publish-stockanalysis-etf-plane]
    if: >-
      !cancelled() && needs.publish-stockanalysis-etf-plane.result == 'success' &&
      ((github.event_name == 'repository_dispatch' && github.event.action == 'stockanalysis-plane-recovery') ||
       (needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true'))
    uses: ./.github/workflows/refresh-family-health.yml
    with:
      publication_cycle: ${{ needs.clock-admission.outputs.event_name == 'schedule' && format('{0}', github.run_id) || '' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}

  # Rebuild the shared projection after catalogue and required ETF generation
  # publication both succeed. Source-only runs publish the catalogue family.
  # This job stages no Git commit and holds no shared writer lock.
  dispatch-stockanalysis-projection:
    needs:
      - clock-admission
      - publish-stockanalysis
      - publish-stockanalysis-etf-plane
    if: >-
      needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' &&
      (always() &&
      needs.publish-stockanalysis.result == 'success' &&
      (
        needs.publish-stockanalysis-etf-plane.result == 'success' ||
        (
          !inputs.natural_etf_weekday &&
          (needs.clock-admission.outputs.event_name != 'schedule' ||
            (needs.clock-admission.outputs.mode != 'etf_weekday' && needs.clock-admission.outputs.mode != 'etf_general')) &&
          needs.publish-stockanalysis-etf-plane.result == 'skipped'
        )
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Dispatch shared projection rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This job intentionally has no checkout, so gh cannot infer the
          # repository from a local git remote. Name it explicitly.
          gh workflow run update-manifest.yml --repo ${{ github.repository }} --ref main

  # The daily stock overview schedule also starts the SEC earnings refresh, but
  # this job has no dependency on acquire-stockanalysis or its provider result.
  # The reusable workflow owns its own writer lock and cloud publication.
  refresh-earnings-overview:
    needs: clock-admission
    if: >-
      needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' &&
      (needs.clock-admission.outputs.event_name == 'schedule' &&
      needs.clock-admission.outputs.mode == 'stock_daily')
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/refresh-earnings-overview.yml
    secrets: inherit
