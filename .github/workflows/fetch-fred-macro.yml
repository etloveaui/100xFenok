# FRED publishes only to the existing cloud generation plane.
# The prior promoted generation remains available on acquisition failure.

name: Fetch FRED Macro Data
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-fred-macro.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string
      controlled_failure_key:
        description: 'Dispatch-only chaos key (one configured FRED series id)'
        required: false
        default: ''
        type: string

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

permissions:
  contents: read

concurrency:
  group: fenok-data-writer-refs/heads/main
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-fred-macro.yml

  fetch-fred-macro:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    # The cloud data plane's credentials live in the production environment.
    # Publication advances the active generation only after acquisition succeeds.
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/macro

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Fetch macro FRED data
        id: fetch_macro
        env:
          INPUT_CONTROLLED_FAILURE_KEY: ${{ github.event.inputs.controlled_failure_key || '' }}
        run: node scripts/fetch-fred-macro.mjs

      - name: Verify output
        if: ${{ steps.fetch_macro.outcome == 'success' }}
        run: |
          head -20 data/macro/fred-macro.json
          echo "Total lines: $(wc -l < data/macro/fred-macro.json)"

      - name: Publish FRED macro generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ steps.fetch_macro.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/publish-cloud-data-generation.mjs --family=fred-macro --json
