# Macro FRED data collection with current-attempt evidence.
# Outputs: data/macro/fred-macro.json + public mirror + one lane shard.

name: Fetch FRED Macro Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      controlled_failure_key:
        description: 'Dispatch-only chaos key (one configured FRED series id)'
        required: false
        default: ''
        type: string

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

permissions:
  contents: write

concurrency:
  group: fenok-data-writer-refs/heads/main
  cancel-in-progress: false
  queue: max

jobs:
  fetch-fred-macro:
    runs-on: ubuntu-latest
    # The cloud data plane's credentials live in the production environment.
    # This lane publishes a generation after its git write; git stays
    # authoritative either way.
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/data-supply-state/detection-attempts
            data/admin/data-supply-state/publish-outcomes
            data/admin/fred_macro
            data/macro

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test FRED macro producer contracts
        run: node scripts/test-fetch-fred-macro.mjs

      - name: Fetch macro FRED data and persist attempt evidence
        id: fetch_macro
        env:
          INPUT_CONTROLLED_FAILURE_KEY: ${{ github.event.inputs.controlled_failure_key || '' }}
        run: node scripts/fetch-fred-macro.mjs

      - name: Verify output
        if: ${{ steps.fetch_macro.outcome == 'success' }}
        run: |
          head -20 data/macro/fred-macro.json
          echo "Total lines: $(wc -l < data/macro/fred-macro.json)"

      - name: Commit and push macro FRED data
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_OUTCOME: ${{ steps.fetch_macro.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHARD="data/admin/data-supply-state/detection-attempts/fred_macro.json"
          # Phase 1: consume the generated policy while retaining the legacy
          # hand list as parity defense until this workflow's natural proof.
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/fetch-fred-macro.yml \
            --stage always_if_exists
          if [[ -f "$SHARD" ]]; then
            git add -- "$SHARD"
          fi
          if [[ -f data/admin/fred_macro/index.json ]]; then
            git add -- data/admin/fred_macro/index.json
          fi
          if [[ -f data/admin/fred_macro/lkg/fred_macro.json ]]; then
            git add -- data/admin/fred_macro/lkg/fred_macro.json
          fi
          if [[ "$FETCH_OUTCOME" == "success" ]]; then
            scripts/stage-lane-manifest.sh \
              --workflow .github/workflows/fetch-fred-macro.yml \
              --stage success_if_exists
            git add -- data/macro/fred-macro.json
          fi
          if git diff --staged --quiet; then
            echo "No FRED macro changes to publish"
            exit 0
          fi
          git commit -m "chore: update FRED macro data"
          for attempt in $(seq 1 5); do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
              continue
            fi
            if git push; then
              # Decoupled: a successful completion of this workflow runs the
              # coordinate-computed-signals workflow_run (serialized rebuild +
              # plane publish); the scheduled update-manifest.yml remains the
              # reconciliation fallback for shared projections.
              exit 0
            fi
            sleep 3
          done
          echo "git push failed after retrying concurrent main updates"
          exit 1
      # Publish the same public payload this run just committed. Unlike the OECD
      # pilot this family is served through the Worker, so the generation is
      # read as well as written — and the Worker falls back to the bundled copy
      # whenever the generation does not resolve cleanly, which keeps git
      # authoritative here too.
      - name: Publish FRED macro generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ steps.fetch_macro.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/publish-cloud-data-generation.mjs --family=fred-macro --tolerate-gate-block --json

      - name: Persist FRED macro publish outcome
        if: ${{ always() }}
        run: node scripts/persist-cloud-publish-outcome.mjs --family=fred-macro --workflow=.github/workflows/fetch-fred-macro.yml --publisher-outcome=${{ steps.publish_cloud_generation.outcome }}
