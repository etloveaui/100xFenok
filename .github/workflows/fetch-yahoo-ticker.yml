name: Fetch Yahoo Finance Ticker Snapshot
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-yahoo-ticker.yml {0}', inputs.external_clock_slot) || github.workflow }}

# DEC-196 — cron pre-fetch for admin design-lab calculators (TQQQ/SOXL).
# Output: data/macro/yahoo-ticker.json (same-origin, 1h stale tolerance).
# No untrusted input is used in run: blocks (schedule + workflow_dispatch only).

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string
      controlled_failure_tickers:
        description: 'Dispatch-only comma-separated chaos targets (TQQQ,SOXL)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

# Acquisition and atomic generation publication share one family queue.

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-yahoo-ticker.yml

  fetch-yahoo-ticker:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read

    concurrency:
      group: yahoo-ticker-macro-publish
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/yahoo-hourly-ticker
            data/macro

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Hydrate active Yahoo ticker payload and recovery state
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --family yahoo-ticker-macro --manifest-prefix public/data --private-manifest-prefix data --privacy-class public --output-root "$RUNNER_TEMP/yahoo-ticker-active")"
          mkdir -p data
          cp -R "$RUNNER_TEMP/yahoo-ticker-active/." data/
          echo "generation=$(jq -r .generation_id <<< "$basis")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifest_sha256 <<< "$basis")" >> "$GITHUB_OUTPUT"

      - name: Fetch Yahoo Finance chart snapshot
        id: fetch_yahoo
        env:
          INPUT_CONTROLLED_FAILURE_TICKERS: ${{ inputs.controlled_failure_tickers || '' }}
        run: node scripts/fetch-yahoo-ticker.mjs

      - name: Publish Yahoo ticker generation
        id: publish_cloud_generation
        if: ${{ steps.fetch_yahoo.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_EXPECTED_ACTIVE_GENERATION_ID: ${{ steps.baseline.outputs.generation }}
          PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256: ${{ steps.baseline.outputs.manifest }}
        run: node scripts/publish-cloud-data-generation.mjs --family=yahoo-ticker-macro --json
