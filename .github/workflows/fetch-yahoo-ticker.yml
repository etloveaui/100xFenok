name: Fetch Yahoo Finance Ticker Snapshot
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-yahoo-ticker.yml {0}', inputs.external_clock_slot) || github.workflow }}

# DEC-196 — cron pre-fetch for admin design-lab calculators (TQQQ/SOXL).
# Output: data/macro/yahoo-ticker.json (same-origin, 1h stale tolerance).
# No untrusted input is used in run: blocks (schedule + workflow_dispatch only).

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string
      controlled_failure_tickers:
        description: 'Dispatch-only comma-separated chaos targets (TQQQ,SOXL)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

# Acquisition and cloud publication run outside the global Git writer queue.
# Only a prepared canonical/recovery difference enters the short commit job.

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-yahoo-ticker.yml

  fetch-yahoo-ticker:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      fetch_outcome: ${{ steps.fetch_yahoo.outcome }}

    concurrency:
      group: yahoo-ticker-prepare
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/yahoo-hourly-ticker
            data/macro

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Fetch Yahoo Finance chart snapshot
        id: fetch_yahoo
        env:
          INPUT_CONTROLLED_FAILURE_TICKERS: ${{ inputs.controlled_failure_tickers || '' }}
        run: node scripts/fetch-yahoo-ticker.mjs

      - name: Verify output
        if: ${{ steps.fetch_yahoo.outcome == 'success' }}
        run: |
          echo "=== Generated JSON ==="
          head -40 data/macro/yahoo-ticker.json
          echo "..."
          echo "Total lines: $(wc -l < data/macro/yahoo-ticker.json)"

      - name: Prepare immutable lane candidate
        id: candidate
        if: ${{ always() && !cancelled() }}
        env:
          FETCH_OUTCOME: ${{ steps.fetch_yahoo.outcome }}
        run: |
          set -euo pipefail
          mkdir -p lane-commit-transfer
          candidate_outcome=failure
          scripts/stage-lane-manifest.sh --workflow .github/workflows/fetch-yahoo-ticker.yml --stage always_if_exists
          if [ "$FETCH_OUTCOME" = success ]; then
            candidate_outcome=success
            scripts/stage-lane-manifest.sh --workflow .github/workflows/fetch-yahoo-ticker.yml --stage success_if_exists
          fi
          node scripts/prepare-lane-commit.mjs prepare fetch-yahoo-ticker.yml lane-commit-transfer/candidate.json "$candidate_outcome"

      - name: Upload lane candidate
        if: ${{ always() && steps.candidate.outcome == 'success' && steps.candidate.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-ticker-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane-commit-transfer/candidate.json
          if-no-files-found: error
          retention-days: 1

  commit-yahoo-ticker:
    needs: [clock-admission, fetch-yahoo-ticker]
    if: ${{ always() && !cancelled() && needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' && needs.fetch-yahoo-ticker.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: write
    concurrency:
      group: fenok-data-writer-refs/heads/main
      cancel-in-progress: false
      queue: max
    outputs:
      status: ${{ steps.commit.outputs.status }}
    steps:
      - name: Skip superseded prepared writer
        id: freshness
        timeout-minutes: 1
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('skip', 'false');
            const repo = context.repo;
            const api = github.rest.actions;
            const request = { timeout: 10000 };
            try {
              const { data: current } = await api.getWorkflowRun({ ...repo, run_id: context.runId, request });
              const { data: currentJobs } = await api.listJobsForWorkflowRun({ ...repo, run_id: context.runId, per_page: 100, request });
              const preparedAt = currentJobs.jobs.find(job => job.name === 'fetch-yahoo-ticker')?.completed_at;
              if (!preparedAt) return;
              const { data } = await api.listWorkflowRuns({ ...repo, workflow_id: current.workflow_id,
                branch: current.head_branch, per_page: 100, request });
              for (const run of data.workflow_runs) {
                if (run.run_number <= current.run_number || run.conclusion === 'cancelled') continue;
                const { data: newer } = await api.listJobsForWorkflowRun({ ...repo, run_id: run.id, per_page: 100, request });
                const prepared = newer.jobs.find(job => job.name === 'fetch-yahoo-ticker');
                const writer = newer.jobs.find(job => job.name === 'commit-yahoo-ticker');
                const ready = writer && (['queued', 'waiting', 'pending', 'in_progress'].includes(writer.status)
                  || writer.conclusion === 'success');
                if (prepared?.conclusion === 'success' && prepared.completed_at > preparedAt && ready) {
                  core.setOutput('skip', 'true');
                  core.notice(`Prepared input from run ${run.id} supersedes this writer; no checkout needed.`);
                  return;
                }
              }
            } catch (error) {
              // Supersession is an optimization. Existing candidate/source
              // checks still protect a writer when the API is unavailable.
              core.warning(`Could not check newer prepared input (${error.status ?? 'network'}); retaining this writer.`);
            }
      - name: Checkout writer helpers
        if: steps.freshness.outputs.skip != 'true'
        timeout-minutes: 2
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/prepare-lane-commit.mjs
            /scripts/lib/lane-registry.mjs
            /scripts/lib/slickcharts-composite-recovery.mjs
            /scripts/lib/json-canonical.mjs
            /100xfenok-next/scripts/cloud-data-plane/json-canonical.mjs
      - name: Download current-run candidate
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: yahoo-ticker-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane-commit-transfer
      - name: Commit and push
        if: steps.freshness.outputs.skip != 'true'
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            timeout 60s git fetch --filter=blob:none --depth=1 origin +main:refs/remotes/origin/main
            timeout 30s git checkout -B main origin/main
            node scripts/prepare-lane-commit.mjs apply fetch-yahoo-ticker.yml lane-commit-transfer/candidate.json
            if git diff --cached --quiet; then exit 0; fi
            timeout 30s git commit -m 'data: refresh yahoo-ticker snapshot (TQQQ/SOXL)'
            if timeout 60s git push origin HEAD:main; then
              echo 'status=published' >> "$GITHUB_OUTPUT"
              timeout 30s gh workflow run update-manifest.yml --ref main
              exit 0
            fi
            echo "Git push race on attempt ${attempt}; refreshing main and rechecking candidate"
            sleep 2
          done
          echo '::error::lane commit push failed after bounded retries'
          exit 1
  # No Git write happens here, so this job deliberately does not take the global
  # writer group. Its own group still serialises two publications of this family
  # against each other, because they contend for one R2 keyspace and pointer.
  publish:
    needs: [clock-admission, fetch-yahoo-ticker, commit-yahoo-ticker]
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' && (always() && needs.fetch-yahoo-ticker.result == 'success' && (needs.fetch-yahoo-ticker.outputs.changed == 'false' || (needs.commit-yahoo-ticker.result == 'success' && (needs.commit-yahoo-ticker.outputs.status == 'published' || needs.commit-yahoo-ticker.outputs.status == 'unchanged')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: yahoo-ticker-macro-publish
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/macro

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: '22'

      # The job gate requires a successful acquisition and landed/unchanged
      # canonical bytes. A failed or stale Git candidate publishes no plane data.
      - name: Publish yahoo-ticker-macro generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ needs.fetch-yahoo-ticker.outputs.fetch_outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/publish-cloud-data-generation.mjs --family=yahoo-ticker-macro --tolerate-gate-block --json
