name: Fetch Yahoo Finance Ticker Snapshot

# DEC-196 — cron pre-fetch for admin design-lab calculators (TQQQ/SOXL).
# Output: data/macro/yahoo-ticker.json (same-origin, 1h stale tolerance).
# No untrusted input is used in run: blocks (schedule + workflow_dispatch only).

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      controlled_failure_tickers:
        description: 'Dispatch-only comma-separated chaos targets (TQQQ,SOXL)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

# The global Git writer lock is taken per JOB rather than per workflow, so the
# cloud publication - which writes to R2 and the coordinator and never to Git -
# no longer occupies the lock every other lane queues behind. Measured on the
# worst observed run (DEC-383): 53s occupancy, 30s of it publication.

jobs:
  fetch-yahoo-ticker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    concurrency:
      group: fenok-data-writer-refs/heads/main
      cancel-in-progress: false
      queue: max
    outputs:
      fetch_outcome: ${{ steps.fetch_yahoo.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/data-supply-state/detection-attempts
            data/admin/data-supply-state/publish-outcomes
            data/admin/yahoo-hourly-ticker
            data/macro

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '20'

      - name: Test Yahoo ticker producer contracts
        run: node scripts/test-fetch-yahoo-ticker.mjs

      - name: Fetch Yahoo Finance chart snapshot and persist attempt evidence
        id: fetch_yahoo
        env:
          INPUT_CONTROLLED_FAILURE_TICKERS: ${{ inputs.controlled_failure_tickers || '' }}
        run: node scripts/fetch-yahoo-ticker.mjs

      - name: Verify output
        if: ${{ steps.fetch_yahoo.outcome == 'success' }}
        run: |
          echo "=== Generated JSON ==="
          head -40 data/macro/yahoo-ticker.json
          echo "..."
          echo "Total lines: $(wc -l < data/macro/yahoo-ticker.json)"

      - name: Commit and push
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_OUTCOME: ${{ steps.fetch_yahoo.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHARD="data/admin/data-supply-state/detection-attempts/yahoo_ticker_macro.json"
          STATE_ROOT="data/admin/yahoo-hourly-ticker"
          RECOVERY_EXIT=0
          if [[ "$FETCH_OUTCOME" != "success" ]]; then
            RECOVERY_EXIT=2
          fi
          # Phase 1: consume the generated policy while retaining the legacy
          # hand list as parity defense until this workflow's natural proof.
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/fetch-yahoo-ticker.yml \
            --stage always_if_exists
          if [[ -f "$SHARD" ]]; then
            git add -- "$SHARD"
          fi
          if [[ -d "$STATE_ROOT" ]]; then
            git add -- "$STATE_ROOT"
          fi
          if [[ "$FETCH_OUTCOME" == "success" ]]; then
            scripts/stage-lane-manifest.sh \
              --workflow .github/workflows/fetch-yahoo-ticker.yml \
              --stage success_if_exists
            git add -- data/macro/yahoo-ticker.json
          fi
          if git diff --staged --quiet; then
            echo "No Yahoo ticker changes to publish"
            exit "$RECOVERY_EXIT"
          fi
          git commit -m "data: refresh yahoo-ticker snapshot (TQQQ/SOXL)"
          for attempt in $(seq 1 5); do
            if ! git pull --rebase --autostash origin main; then
              echo "git rebase failed on attempt ${attempt}; aborting and retrying"
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
              continue
            fi
            if git push; then
              gh workflow run update-manifest.yml --ref main
              exit "$RECOVERY_EXIT"
            fi
            echo "git push race on attempt ${attempt}; retrying after rebase"
            sleep 3
          done
          echo "git push failed after retrying concurrent main updates"
          exit 1
  # No Git write happens here, so this job deliberately does not take the global
  # writer group. Its own group still serialises two publications of this family
  # against each other, because they contend for one R2 keyspace and pointer.
  publish:
    needs: fetch-yahoo-ticker
    if: ${{ always() && needs.fetch-yahoo-ticker.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: yahoo-ticker-macro-publish
      cancel-in-progress: false
      queue: max
    outputs:
      publisher_outcome: ${{ steps.publish_cloud_generation.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/data-supply-state/publish-outcomes
            data/macro

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '20'

      # Both legs of the previous single-job condition are preserved: the fetch
      # step succeeded AND its job (which includes the Git publication) did too.
      # A failed push therefore still publishes nothing, and a skipped
      # publication still reports "skipped" to persistence exactly as before.
      - name: Publish yahoo-ticker-macro generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ needs.fetch-yahoo-ticker.result == 'success' && needs.fetch-yahoo-ticker.outputs.fetch_outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/publish-cloud-data-generation.mjs --family=yahoo-ticker-macro --tolerate-gate-block --json

      # The shard is the one thing persistence cannot recompute, so it crosses
      # the job boundary as an artifact.
      - name: Upload yahoo-ticker-macro outcome shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-ticker-macro-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/admin/data-supply-state/publish-outcomes/yahoo-ticker-macro.json
          if-no-files-found: error
          retention-days: 1

  # The second and last holder of the global Git writer lock in this workflow.
  persist:
    needs: [fetch-yahoo-ticker, publish]
    if: ${{ always() && needs.publish.result != 'cancelled' && needs.publish.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: fenok-data-writer-refs/heads/main
      cancel-in-progress: false
      queue: max
    steps:
      # Measured 2026-08-19: a full checkout here cost 86s INSIDE the writer lock
      # to support 2s of persistence, which doubled this lane's total occupancy
      # rather than reducing it. Persistence reads the lane manifest, rebuilds
      # the canonical one from the registry and workflows, and writes one shard,
      # so it needs those paths and not the multi-gigabyte producer trees.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '20'

      - name: Download yahoo-ticker-macro outcome shard
        uses: actions/download-artifact@v4
        with:
          name: yahoo-ticker-macro-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/admin/data-supply-state/publish-outcomes

      - name: Assert the outcome shard arrived
        run: |
          set -euo pipefail
          shard=data/admin/data-supply-state/publish-outcomes/yahoo-ticker-macro.json
          if [ ! -s "$shard" ]; then
            echo "::error::outcome shard $shard is missing or empty; evidence would be lost" >&2
            exit 1
          fi

      - name: Persist yahoo-ticker-macro publish outcome
        if: ${{ always() }}
        run: node scripts/persist-cloud-publish-outcome.mjs --family=yahoo-ticker-macro --workflow=.github/workflows/fetch-yahoo-ticker.yml --publisher-outcome=${{ needs.publish.outputs.publisher_outcome }}
