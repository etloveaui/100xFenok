# SEC EDGAR filing timeline refresh.
# Every published ticker is refreshed on each run; `limit` only bounds how many
# universe rows may join. The fetcher fails when the universe file is absent.

name: Fetch EDGAR Filing Timeline
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-edgar-filings.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    # 매주 월요일 00:40 UTC (한국 월요일 09:40) — StockAnalysis refresh 이후 공시 목록만 보강
    - cron: '40 0 * * 1'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Existing A1 clock marker'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Bound UTC schedule slot'
        required: false
        default: ''
        type: string
      tickers:
        description: 'Comma-separated ticker override (e.g. NVDA,AAPL,MSFT)'
        required: false
        default: ''
      limit:
        description: 'Max universe rows that may join; published tickers always refresh'
        required: false
        default: '50'
      full_universe:
        description: 'Scan the full stock universe instead of the phase-1 limit'
        required: false
        default: 'false'
      filings_per_ticker:
        description: 'Latest matching SEC filings per ticker'
        required: false
        default: '12'
      forms:
        description: 'Comma-separated SEC forms'
        required: false
        default: '10-K,10-Q,8-K,20-F,40-F,6-K'
      sleep:
        description: 'Seconds between SEC submission requests'
        required: false
        default: '0.6'
      plan_only:
        description: 'Resolve/fetch candidates without data artifacts; publish attempt telemetry'
        required: false
        default: 'false'
      controlled_failure_key:
        description: 'Dispatch-only chaos key (edgar_filings or bootstrap)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  # Serialize the complete acquisition and atomic family promotion.
  group: edgar-korean-summaries-pipeline-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-edgar-filings.yml

  fetch-edgar-filings:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/edgar_filings
            data/edgar
            data/edgar-korean-summaries
            data/global-scouter/core

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 22

      - name: Hydrate active EDGAR filings and recovery state
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --family edgar-korean-summaries --manifest-prefix public/data --private-manifest-prefix data --privacy-class public --output-root "$RUNNER_TEMP/edgar-active")"
          mkdir -p data
          cp -R "$RUNNER_TEMP/edgar-active/." data/
          echo "generation=$(jq -r .generation_id <<< "$basis")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifest_sha256 <<< "$basis")" >> "$GITHUB_OUTPUT"

      - name: Hydrate active Scouter analyzer input
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/materialize-cloud-data-plane-family.mjs --hydrate-scouter-derived

      - name: Build EDGAR filing timeline
        id: fetch_edgar
        env:
          INPUT_TICKERS: ${{ github.event.inputs.tickers || '' }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '50' }}
          INPUT_FULL_UNIVERSE: ${{ github.event.inputs.full_universe || 'false' }}
          INPUT_FILINGS_PER_TICKER: ${{ github.event.inputs.filings_per_ticker || '12' }}
          INPUT_FORMS: ${{ github.event.inputs.forms || '10-K,10-Q,8-K,20-F,40-F,6-K' }}
          INPUT_SLEEP: ${{ github.event.inputs.sleep || '0.6' }}
          INPUT_PLAN_ONLY: ${{ github.event.inputs.plan_only || 'false' }}
          INPUT_CONTROLLED_FAILURE_KEY: ${{ github.event.inputs.controlled_failure_key || '' }}
        run: |
          echo "EDGAR_PLAN_ONLY=${INPUT_PLAN_ONLY:-false}" >> "$GITHUB_ENV"
          echo "plan_only=${INPUT_PLAN_ONLY:-false}" >> "$GITHUB_OUTPUT"
          ARGS=(--filings-per-ticker "${INPUT_FILINGS_PER_TICKER:-12}" --forms "${INPUT_FORMS:-10-K,10-Q,8-K,20-F,40-F,6-K}" --sleep "${INPUT_SLEEP:-0.6}")
          if [ -n "$INPUT_TICKERS" ]; then ARGS+=(--tickers "$INPUT_TICKERS"); fi
          if [ "$INPUT_FULL_UNIVERSE" = "true" ]; then
            ARGS+=(--full-universe)
          elif [ -n "$INPUT_LIMIT" ]; then
            ARGS+=(--limit "$INPUT_LIMIT")
          fi
          if [ "$INPUT_PLAN_ONLY" = "true" ]; then ARGS+=(--plan-only); fi
          node scripts/build-edgar-filing-timeline.mjs "${ARGS[@]}"

      - name: Materialize EDGAR summary mirror for contract checks
        if: ${{ env.EDGAR_PLAN_ONLY != 'true' && steps.fetch_edgar.outcome == 'success' }}
        run: |
          mkdir -p 100xfenok-next/public/data/edgar-korean-summaries
          rsync -a --delete data/edgar-korean-summaries/ 100xfenok-next/public/data/edgar-korean-summaries/

      - name: Validate EDGAR translation contract
        id: verify_edgar
        if: ${{ env.EDGAR_PLAN_ONLY != 'true' && steps.fetch_edgar.outcome == 'success' }}
        run: |
          npm --prefix 100xfenok-next run qa:edgar-translations

      - name: Publish EDGAR generation
        id: publish_cloud_generation
        if: ${{ env.EDGAR_PLAN_ONLY != 'true' && steps.fetch_edgar.outcome == 'success' && steps.verify_edgar.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_EXPECTED_ACTIVE_GENERATION_ID: ${{ steps.baseline.outputs.generation }}
          PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256: ${{ steps.baseline.outputs.manifest }}
        run: node scripts/publish-cloud-data-generation.mjs --family=edgar-korean-summaries --json
