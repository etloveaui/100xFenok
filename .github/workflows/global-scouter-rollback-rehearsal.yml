# Manual-only live rollback-and-restore proof for Global Scouter.
#
# The first rollback validates the complete previous generation before moving
# the pointer. A second rollback restores the generation that was active when
# the rehearsal began. The restore step runs even when the intermediate live
# read fails, so a proof assertion cannot strand production on the older
# generation.

name: Global Scouter Rollback Rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROLLBACK_AND_RESTORE to move the live pointer twice.'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  rollback-and-restore:
    if: github.event.inputs.confirm == 'ROLLBACK_AND_RESTORE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: global-scouter-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Roll back to the previous Global Scouter generation
        id: rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          RESULT="$(node scripts/publish-cloud-data-generation.mjs --family=global-scouter --rollback --json)"
          echo "$RESULT"
          node --input-type=module - "$RESULT" "$GITHUB_OUTPUT" <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(process.argv[2]);
          if (result.result !== "rolled_back") throw new Error(`unexpected rollback result ${result.result}`);
          for (const key of ["active_generation_before", "active_generation_after", "pointer_sequence_before", "pointer_sequence_after"]) {
            const value = result[key];
            if (value === null || value === undefined || value === "") throw new Error(`missing ${key}`);
            fs.appendFileSync(process.argv[3], `${key}=${value}\n`);
          }
          NODE

      - name: Prove the previous generation is serving
        env:
          EXPECTED_GENERATION: ${{ steps.rollback.outputs.active_generation_after }}
        run: |
          set -euo pipefail
          HEADERS="$RUNNER_TEMP/global-scouter-previous.headers"
          curl --silent --show-error --fail --max-time 30 \
            --dump-header "$HEADERS" --output "$RUNNER_TEMP/global-scouter-previous.json" \
            "https://100xfenok.etloveaui.workers.dev/data/global-scouter/etfs/index.json?rollback-proof=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-previous"
          OBSERVED="$(tr -d '\r' < "$HEADERS" | awk -F': ' 'tolower($1) == "x-data-plane-generation" { print $2 }')"
          test "$OBSERVED" = "$EXPECTED_GENERATION"
          echo "previous generation served: $OBSERVED"

      - name: Restore the generation active at rehearsal start
        id: restore
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          EXPECTED_GENERATION: ${{ steps.rollback.outputs.active_generation_before }}
        run: |
          set -euo pipefail
          RESULT="$(node scripts/publish-cloud-data-generation.mjs --family=global-scouter --rollback --json)"
          echo "$RESULT"
          node --input-type=module - "$RESULT" "$EXPECTED_GENERATION" <<'NODE'
          const result = JSON.parse(process.argv[2]);
          if (result.result !== "rolled_back") throw new Error(`unexpected restore result ${result.result}`);
          if (result.active_generation_after !== process.argv[3]) {
            throw new Error(`restore mismatch: ${result.active_generation_after} != ${process.argv[3]}`);
          }
          if (result.objects_written !== 0) throw new Error(`restore wrote ${result.objects_written} objects`);
          NODE

      - name: Prove the starting generation is serving again
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          EXPECTED_GENERATION: ${{ steps.rollback.outputs.active_generation_before }}
        run: |
          set -euo pipefail
          HEADERS="$RUNNER_TEMP/global-scouter-restored.headers"
          curl --silent --show-error --fail --max-time 30 \
            --dump-header "$HEADERS" --output "$RUNNER_TEMP/global-scouter-restored.json" \
            "https://100xfenok.etloveaui.workers.dev/data/global-scouter/etfs/index.json?rollback-proof=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-restored"
          OBSERVED="$(tr -d '\r' < "$HEADERS" | awk -F': ' 'tolower($1) == "x-data-plane-generation" { print $2 }')"
          test "$OBSERVED" = "$EXPECTED_GENERATION"
          echo "starting generation restored: $OBSERVED"
