# Dedicated manual publisher for the private StockAnalysis ETF detail shadow
# family. It publishes the canonical data/stockanalysis/etfs payload to the
# cloud data plane and nothing else: no acquisition, no Worker enrolment, no
# public surface. The 1,025-asset public shard projection is untouched and
# continues to be built by sync-public-data and served from static.
#
# Two jobs on purpose. Publication is long and does not need the global Git
# writer lock; only the persistence job takes it, so a slow publish cannot hold
# the queue for every other lane.

name: StockAnalysis ETF Shadow Publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH-SHADOW to confirm a real cloud publication'
        required: true
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    # One constant group for the family, deliberately NOT keyed on github.ref.
    # Two shadow publications must never overlap even when dispatched from
    # different refs, because they contend for the same R2 keyspace and the same
    # pointer — a ref-scoped group would let a branch dispatch run beside main.
    # It still does not occupy the global Git writer queue; nothing here writes
    # to Git.
    concurrency:
      group: stockanalysis-etf-shadow-publish
      cancel-in-progress: false
      queue: max
    outputs:
      publisher_outcome: ${{ steps.publish_cloud_generation.outcome }}
    steps:
      - name: Refuse an unconfirmed dispatch
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PUBLISH-SHADOW" ]; then
            echo "::error::confirm must be exactly PUBLISH-SHADOW; refusing to publish" >&2
            exit 2
          fi

      - uses: actions/checkout@v4

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No continue-on-error, and deliberately NO --tolerate-gate-block. That
      # flag turns an unknown or over-threshold cost verdict into exit 0, which
      # would make an explicitly requested first shadow run report green while
      # publishing nothing. The gate-block outcome shard is still written and
      # still uploaded below; only the exit code differs, and this run goes red.
      - name: Publish stockanalysis-etf-detail generation to the cloud data plane
        id: publish_cloud_generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/publish-cloud-data-generation.mjs --family=stockanalysis-etf-detail --json

      # always(): a failed publish still produces an outcome shard, and losing
      # that evidence is the failure mode this upload exists to prevent.
      - name: Upload stockanalysis-etf-detail outcome shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stockanalysis-etf-detail-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/admin/data-supply-state/publish-outcomes/stockanalysis-etf-detail.json
          if-no-files-found: error
          retention-days: 1

  persist:
    needs: publish
    if: ${{ always() && needs.publish.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # The only holder of the global Git writer lock in this workflow.
    concurrency:
      group: fenok-data-writer-refs/heads/main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download stockanalysis-etf-detail outcome shard
        uses: actions/download-artifact@v4
        with:
          name: stockanalysis-etf-detail-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/admin/data-supply-state/publish-outcomes

      - name: Assert the outcome shard arrived
        run: |
          set -euo pipefail
          shard=data/admin/data-supply-state/publish-outcomes/stockanalysis-etf-detail.json
          if [ ! -s "$shard" ]; then
            echo "::error::outcome shard $shard is missing or empty; evidence would be lost" >&2
            exit 1
          fi

      # Mandatory. A helper failure fails this job: an unlanded outcome is not
      # an outcome, per DEC-305.
      - name: Persist stockanalysis-etf-detail publish outcome
        if: ${{ always() }}
        run: node scripts/persist-cloud-publish-outcome.mjs --family=stockanalysis-etf-detail --workflow=.github/workflows/stockanalysis-etf-shadow-publish.yml --publisher-outcome=${{ needs.publish.outputs.publisher_outcome }}
