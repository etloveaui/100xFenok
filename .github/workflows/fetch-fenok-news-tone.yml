name: Fetch Fenok GDELT News Tone Proxy
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-fenok-news-tone.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    # Spread the same daily request budget over three recovery opportunities.
    # A completed basket skips the remaining slots; no immediate retry burst.
    - cron: '43 6,14,22 * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string
      controlled_failure:
        description: 'Dispatch-only chaos: set to "transport" to force an honest provider failure shard'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: gdelt-news-tone-publish
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-fenok-news-tone.yml

  fetch-news-tone:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    # The cloud data plane's credentials live in the production environment.
    # The private generation carries source history and the daily retry budget.
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/gdelt_news_tone
            data/computed

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Hydrate active GDELT payload and retry state
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --family gdelt-news-tone --manifest-prefix data --output-root "$RUNNER_TEMP/gdelt-active")"
          cp -R "$RUNNER_TEMP/gdelt-active/." data/
          echo "generation=$(jq -r .generation_id <<< "$basis")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifest_sha256 <<< "$basis")" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'JS'
          import { cp, mkdir } from 'node:fs/promises';
          import path from 'node:path';
          import { createDefaultMaterializePlane, materializeCloudDataPlaneFamily } from './scripts/materialize-cloud-data-plane-family.mjs';
          const env = process.env, repoRoot = process.cwd(), family = 'platform-projections';
          const wanted = new Set(['data/computed/fenok_signals.json']);
          const plane = createDefaultMaterializePlane({ accountId: env.CLOUDFLARE_ACCOUNT_ID,
            token: env.CLOUDFLARE_API_TOKEN, endpoint: env.DATA_PLANE_ENDPOINT,
            writeKey: env.DATA_PLANE_WRITE_KEY, family });
          const receipt = await materializeCloudDataPlaneFamily({ plane, family, repoRoot, env,
            manifestPrefix: 'public/data', privateManifestPrefix: 'data', privacyClass: 'public',
            outputRoot: path.join(env.RUNNER_TEMP, 'gdelt-signal-universe'), canonicalReuseRoot: repoRoot,
            includeAsset: asset => wanted.has(asset.path) });
          for (const assetPath of wanted) {
            const relative = assetPath.replace(/^(public\/)?data\//, '');
            const target = path.join(repoRoot, 'data', relative);
            await mkdir(path.dirname(target), { recursive: true });
            await cp(path.join(receipt.output_root, relative), target);
          }

          JS

      - name: Fetch GDELT news tone proxy
        id: fetch_news_tone
        env:
          INPUT_CONTROLLED_FAILURE: ${{ github.event.inputs.controlled_failure || '' }}
        # Bounded reference universe keeps the single-writer queue polite; the
        # full universe with per-ticker GDELT throttling would jam the queue.
        run: node scripts/fetch-fenok-news-tone-proxy.mjs --reference-only --retries 2 --retry-backoff-ms 6500 --spread-daily-retries

      - name: Publish GDELT news tone generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ steps.fetch_news_tone.outcome == 'success' && steps.fetch_news_tone.outputs.promoted == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_EXPECTED_ACTIVE_GENERATION_ID: ${{ steps.baseline.outputs.generation }}
          PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256: ${{ steps.baseline.outputs.manifest }}
        run: node scripts/publish-cloud-data-generation.mjs --family=gdelt-news-tone --json
