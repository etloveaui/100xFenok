name: Fetch Fenok GDELT News Tone Proxy
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-fenok-news-tone.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    # Spread the same daily request budget over three recovery opportunities.
    # A completed basket skips the remaining slots; no immediate retry burst.
    - cron: '43 6,14,22 * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string
      controlled_failure:
        description: 'Dispatch-only chaos: set to "transport" to force an honest provider failure shard'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: fenok-data-writer-refs/heads/main
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-fenok-news-tone.yml

  fetch-news-tone:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    # The cloud data plane's credentials live in the production environment.
    # This lane publishes a generation after its git write; git stays
    # authoritative either way.
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/gdelt_news_tone
            data/computed

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test GDELT news tone producer contracts
        run: node scripts/test-fetch-fenok-news-tone-proxy.mjs

      - name: Fetch GDELT news tone proxy
        id: fetch_news_tone
        env:
          INPUT_CONTROLLED_FAILURE: ${{ github.event.inputs.controlled_failure || '' }}
        # Bounded reference universe keeps the single-writer queue polite; the
        # full universe with per-ticker GDELT throttling would jam the queue.
        run: node scripts/fetch-fenok-news-tone-proxy.mjs --reference-only --retries 2 --retry-backoff-ms 6500 --spread-daily-retries

      - name: Commit and push
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_OUTCOME: ${{ steps.fetch_news_tone.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Keep LKG recovery state on every run; publish the computed proxy
          # only when the producer step reported success.
          # Manifest-owned LKG state: data/admin/gdelt_news_tone/index.json
          # Manifest-owned LKG payload: data/admin/gdelt_news_tone/lkg/news_tone_proxy.json
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/fetch-fenok-news-tone.yml \
            --stage always_if_exists
          if [[ "$FETCH_OUTCOME" == "success" ]]; then
            scripts/stage-lane-manifest.sh \
              --workflow .github/workflows/fetch-fenok-news-tone.yml \
              --stage success_if_exists
          fi
          if git diff --staged --quiet; then
            echo "No GDELT news tone changes to publish"
            exit 0
          fi
          git commit -m "data: update fenok gdelt news tone proxy"
          for attempt in $(seq 1 5); do
            if ! git pull --rebase --autostash origin main; then
              echo "git rebase failed on attempt ${attempt}; aborting and retrying"
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
              continue
            fi
            if git push; then
              exit 0
            fi
            echo "git push race on attempt ${attempt}; retrying after rebase"
            sleep 3
          done
          echo "git push failed after retrying concurrent main updates"
          exit 1
      # Publish the same news-tone proxy this run just committed as an
      # immutable generation in the cloud data plane. Nothing switches and no
      # consumer reads it (private, non-servable family): git remains
      # authoritative, so a blocked cost gate or a failed publish is loud but
      # never fatal to the lane.
      - name: Publish GDELT news tone generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ steps.fetch_news_tone.outcome == 'success' && steps.fetch_news_tone.outputs.promoted == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/publish-cloud-data-generation.mjs --family=gdelt-news-tone --tolerate-gate-block --json
