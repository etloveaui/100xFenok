# SlickCharts Individual Symbols Pipeline
# Scrapes P/E, EPS, Dividend for all S&P 500 stocks
#
# Uses matrix builds for parallel execution:
# - Batch A-D: ~125 stocks
# - Batch E-L: ~125 stocks
# - Batch M-R: ~125 stocks
# - Batch S-Z: ~125 stocks
#
# Created: 2026-01-10
# Reference: docs/planning/slickcharts-data-pipeline.md
# The Weekly completion trigger waits for its published S&P 500 membership.

name: SlickCharts Symbols

on:
  workflow_run:
    workflows: [SlickCharts Weekly]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      batch:
        description: 'Which batch to scrape'
        required: false
        default: 'ALL'
        type: choice
        options:
          - ALL
          - A-D
          - E-L
          - M-R
          - S-Z
          - single
      symbol:
        description: 'Single symbol (only if batch=single)'
        required: false
        type: string
      controlled_failure_after_fetch:
        description: 'Dispatch-only composite recovery exercise after a complete merge'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  # Matrix build for parallel batch execution
  scrape-batch:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.batch != 'single') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || (github.event.workflow_run.event == 'workflow_dispatch' && (github.event.workflow_run.display_title == 'SlickCharts Weekly (all)' || startsWith(github.event.workflow_run.display_title, 'external-clock/a1/v1 slickcharts-weekly.yml '))))) }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        batch: [A-D, E-L, M-R, S-Z]

    steps:
      - name: Configure batch attempt telemetry path
        run: echo "SLICKCHARTS_ATTEMPT_EVENTS_PATH=$RUNNER_TEMP/slickcharts-symbols-${{ matrix.batch }}.jsonl" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Hydrate active SlickCharts inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          node scripts/materialize-cloud-data-plane-family.mjs --family slickcharts --privacy-class public --manifest-prefix public/data --private-manifest-prefix data --output-root "$RUNNER_TEMP/slickcharts-inputs"
          mkdir -p data
          cp -R "$RUNNER_TEMP/slickcharts-inputs/." data/

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Symbol scraper (batch ${{ matrix.batch }})
        if: ${{ github.event_name == 'workflow_run' || github.event.inputs.batch == 'ALL' || github.event.inputs.batch == matrix.batch }}
        run: |
          python scripts/scrapers/symbol-scraper.py \
            --batch ${{ matrix.batch }} \
            --output data/slickcharts/symbols-${{ matrix.batch }}.json \
            --pretty

      - name: Upload batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.batch }}
          path: data/slickcharts/symbols-${{ matrix.batch }}.json
          retention-days: 1

      - name: Upload symbol attempt telemetry
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: attempt-symbols-${{ matrix.batch }}
          path: ${{ env.SLICKCHARTS_ATTEMPT_EVENTS_PATH }}
          if-no-files-found: ignore
          retention-days: 1

  # Merge all batches into single file
  merge-batches:
    needs: scrape-batch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ always() && needs.scrape-batch.result != 'skipped' && (github.event_name == 'workflow_run' || github.event.inputs.batch == 'ALL') }}
    concurrency:
      group: slickcharts-plane-publish
      cancel-in-progress: false
      queue: max

    environment: production
    steps:
      - name: Capture cloud acceptance run start
        run: echo "CLOUD_ACCEPTANCE_MIN_OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Configure composite recovery paths
        run: |
          echo "SLICKCHARTS_COMPOSITE_SNAPSHOT_DIR=$RUNNER_TEMP/slickcharts-composite-symbols-baseline" >> "$GITHUB_ENV"
          echo "SLICKCHARTS_COMPOSITE_STATUS_PATH=$RUNNER_TEMP/slickcharts-composite-symbols-status.json" >> "$GITHUB_ENV"

      - name: Hydrate active public data and shared recovery state
        id: plane_baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --family slickcharts --privacy-class public --manifest-prefix public/data --private-manifest-prefix data --output-root "$RUNNER_TEMP/slickcharts-active")"
          echo "generation=$(jq -r .generation_id <<< "$basis")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifest_sha256 <<< "$basis")" >> "$GITHUB_OUTPUT"
          mkdir -p data
          cp -R "$RUNNER_TEMP/slickcharts-active/." data/

      - name: Prepare composite member baseline
        run: |
          node scripts/slickcharts-composite-recovery.mjs prepare \
            --member symbols \
            --snapshot "$SLICKCHARTS_COMPOSITE_SNAPSHOT_DIR"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to data folder
        run: |
          mkdir -p data/slickcharts
          mv artifacts/symbols-A-D/symbols-A-D.json data/slickcharts/
          mv artifacts/symbols-E-L/symbols-E-L.json data/slickcharts/
          mv artifacts/symbols-M-R/symbols-M-R.json data/slickcharts/
          mv artifacts/symbols-S-Z/symbols-S-Z.json data/slickcharts/

      - name: Merge batch files (cumulative)
        run: |
          python scripts/scrapers/symbol-scraper.py \
            --merge \
            data/slickcharts/symbols-A-D.json \
            data/slickcharts/symbols-E-L.json \
            data/slickcharts/symbols-M-R.json \
            data/slickcharts/symbols-S-Z.json \
            --output data/slickcharts/symbols.json \
            --cumulative
          python scripts/scrapers/symbol-scraper.py \
            --merge \
            data/slickcharts/symbols-A-D.json \
            data/slickcharts/symbols-E-L.json \
            data/slickcharts/symbols-M-R.json \
            data/slickcharts/symbols-S-Z.json \
            --output data/slickcharts/symbols-all.json

      - name: Clean up batch files
        run: |
          rm -f data/slickcharts/symbols-A-D.json
          rm -f data/slickcharts/symbols-E-L.json
          rm -f data/slickcharts/symbols-M-R.json
          rm -f data/slickcharts/symbols-S-Z.json

      - name: Exercise controlled composite degradation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.controlled_failure_after_fetch }}
        run: |
          echo "::error::Controlled SlickCharts symbols composite failure"
          exit 1

      - name: Build SlickCharts symbols run row
        if: ${{ always() }}
        run: |
          node scripts/build-slickcharts-run-row.mjs \
            --member symbols \
            --events-root artifacts \
            --outcome "${{ needs.scrape-batch.result }}" \
            --outcome "${{ job.status }}" \
            --row "$RUNNER_TEMP/slickcharts-symbols-row.json"

      - name: Finalize SlickCharts composite recovery
        if: ${{ always() }}
        run: |
          node scripts/slickcharts-composite-recovery.mjs finalize \
            --member symbols \
            --snapshot "$SLICKCHARTS_COMPOSITE_SNAPSHOT_DIR" \
            --row "$RUNNER_TEMP/slickcharts-symbols-row.json" \
            --receipts artifacts \
            --status "$SLICKCHARTS_COMPOSITE_STATUS_PATH" \
            --full-run "${{ (github.event_name == 'workflow_run' || github.event.inputs.batch == 'ALL') && 'true' || 'false' }}"

      - name: Check candidate publication eligibility
        if: ${{ always() && steps.plane_baseline.outcome == 'success' }}
        run: scripts/publish-slickcharts-attempt.sh symbols "$RUNNER_TEMP/slickcharts-symbols-row.json"
      - name: Publish atomic SlickCharts generation
        id: publish_cloud_generation
        if: ${{ needs.scrape-batch.result == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_EXPECTED_ACTIVE_GENERATION_ID: ${{ steps.plane_baseline.outputs.generation }}
          PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256: ${{ steps.plane_baseline.outputs.manifest }}
        run: |
          set -euo pipefail
          result="$(node scripts/publish-cloud-data-generation.mjs --family=slickcharts --json)"
          echo "$result"
          echo "promoted=$(jq -r '.receipt_state == "promoted"' <<< "$result")" >> "$GITHUB_OUTPUT"

      - name: Refresh shared projections after promotion
        if: ${{ steps.publish_cloud_generation.outputs.promoted == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-manifest.yml --ref main -f rebuild_slickcharts=true

  scrape-single:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.batch == 'single' && github.event.inputs.symbol != '' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    concurrency:
      group: slickcharts-plane-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Configure single-symbol attempt telemetry path
        run: echo "SLICKCHARTS_ATTEMPT_EVENTS_PATH=$RUNNER_TEMP/slickcharts-symbols-single.jsonl" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Hydrate active SlickCharts inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          node scripts/materialize-cloud-data-plane-family.mjs --family slickcharts --privacy-class public --manifest-prefix public/data --private-manifest-prefix data --output-root "$RUNNER_TEMP/slickcharts-inputs"
          mkdir -p data
          cp -R "$RUNNER_TEMP/slickcharts-inputs/." data/

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: "Run Symbol scraper (single: ${{ github.event.inputs.symbol }})"
        run: |
          python scripts/scrapers/symbol-scraper.py \
            --symbol ${{ github.event.inputs.symbol }} \
            --pretty

      - name: Build SlickCharts symbols run row
        if: ${{ always() }}
        run: |
          node scripts/build-slickcharts-run-row.mjs \
            --member symbols \
            --events "$SLICKCHARTS_ATTEMPT_EVENTS_PATH" \
            --outcome "${{ job.status }}" \
            --row "$RUNNER_TEMP/slickcharts-symbols-row.json"
