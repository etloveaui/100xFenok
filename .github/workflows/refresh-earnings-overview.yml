# Bounded SEC quarterly earnings refresh and public cloud publication.
# This is reusable/manual only. The StockAnalysis schedule calls it as an
# independent job so a failure in the unrelated StockAnalysis provider cannot
# suppress this four-document data family.

name: Refresh Earnings Overview

on:
  workflow_call:
    secrets:
      SEC_USER_AGENT:
        required: false
  workflow_dispatch:

jobs:
  refresh-earnings-overview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    concurrency:
      group: fenok-data-writer-refs/heads/main
      cancel-in-progress: false
      queue: max
    outputs:
      producer_outcome: ${{ steps.producer.outcome }}
      published_commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Start from latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build official quarterly earnings documents
        id: producer
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          python3 scripts/build-earnings-overview.py
          --refresh
          --output-dir data/earnings-overview
          --report-path data/admin/earnings_overview/refresh-summary.json

      - name: Copy canonical documents to the static LKG mirror
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'data/earnings-overview/*.json' > /dev/null; then
            mkdir -p 100xfenok-next/public/data/earnings-overview
            cp data/earnings-overview/*.json 100xfenok-next/public/data/earnings-overview/
          fi

      - name: Stage earnings overview lane evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/refresh-earnings-overview.yml \
            --stage always_if_exists
          if compgen -G 'data/earnings-overview/*.json' > /dev/null; then
            scripts/stage-lane-manifest.sh \
              --workflow .github/workflows/refresh-earnings-overview.yml \
              --stage success_if_exists
          fi

      - name: Commit and push earnings overview data
        id: commit
        if: ${{ always() }}
        shell: bash
        env:
          PRODUCER_OUTCOME: ${{ steps.producer.outcome }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh earnings overview data [skip ci]"
          for attempt in $(seq 1 5); do
            git fetch origin main
            if git rebase origin/main; then
              published_commit="$(git rev-parse HEAD)"
              if git push origin HEAD:main; then
                echo "commit=$published_commit" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git rebase --abort >/dev/null 2>&1 || true
            else
              git rebase --abort >/dev/null 2>&1 || true
            fi
            echo "earnings overview Git push race on attempt ${attempt}; retrying" >&2
            sleep 3
          done
          echo 'earnings overview Git push failed after bounded retries' >&2
          exit 1

  publish-earnings-overview:
    needs: refresh-earnings-overview
    if: >-
      always() && needs.refresh-earnings-overview.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      publisher_outcome: ${{ steps.publish_cloud_generation.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start from latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Capture exact published checkout
        id: source_identity
        run: echo "git_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish earnings overview generation to the cloud data plane
        id: publish_cloud_generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_BINDING_GIT_COMMIT: ${{ steps.source_identity.outputs.git_commit }}
        run: node scripts/publish-cloud-data-generation.mjs --family=earnings-overview --json

      - name: Report source refresh failure
        if: needs.refresh-earnings-overview.outputs.producer_outcome != 'success'
        run: |
          echo 'Source refresh failed for at least one ticker; prior validated values were retained.' >&2
          exit 1

      - name: Upload earnings overview publish outcome shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: earnings-overview-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/admin/data-supply-state/publish-outcomes/earnings-overview.json
          if-no-files-found: ignore
          retention-days: 1

  persist-earnings-overview:
    needs:
      - refresh-earnings-overview
      - publish-earnings-overview
    if: >-
      always() &&
      needs.publish-earnings-overview.result != 'skipped' &&
      needs.publish-earnings-overview.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: fenok-data-writer-refs/heads/main
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Start from latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download earnings overview publish outcome
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: earnings-overview-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/admin/data-supply-state/publish-outcomes

      - name: Confirm published checkout from current origin
        id: origin_readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shard=data/admin/data-supply-state/publish-outcomes/earnings-overview.json
          BINDING_GIT_COMMIT="$(
            node --input-type=module - "$shard" <<'NODE'
          import fs from "node:fs";
          const shard = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const commit = shard.records?.at(-1)?.binding?.git_commit ?? "";
          if (!/^[0-9a-f]{40}$/u.test(commit)) {
            throw new Error("latest earnings overview outcome has no exact git binding");
          }
          process.stdout.write(commit);
          NODE
          )"
          ORIGIN_READBACK=not_confirmed
          for compare_attempt in 1 2 3; do
            COMPARE_STATUS="$(
              gh api "repos/$GITHUB_REPOSITORY/compare/$BINDING_GIT_COMMIT...main" --jq '.status' 2>/dev/null
            )" || COMPARE_STATUS=""
            case "$COMPARE_STATUS" in
              identical|ahead)
                ORIGIN_READBACK=confirmed
                break
                ;;
              behind|diverged)
                break
                ;;
              *)
                if [ "$compare_attempt" -lt 3 ]; then sleep $((compare_attempt * 2)); fi
                ;;
            esac
          done
          echo "git_commit=$BINDING_GIT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "origin_readback=$ORIGIN_READBACK" >> "$GITHUB_OUTPUT"

      - name: Persist earnings overview publish outcome
        if: ${{ always() }}
        env:
          BINDING_GIT_COMMIT: ${{ steps.origin_readback.outputs.git_commit }}
          BINDING_ORIGIN_READBACK: ${{ steps.origin_readback.outputs.origin_readback }}
        run: >-
          node scripts/persist-cloud-publish-outcome.mjs
          --family=earnings-overview
          --workflow=.github/workflows/refresh-earnings-overview.yml
          --publisher-outcome=${{ needs.publish-earnings-overview.outputs.publisher_outcome }}
          --binding-git-commit="$BINDING_GIT_COMMIT"
          --binding-origin-readback="$BINDING_ORIGIN_READBACK"

      - name: Enforce confirmed earnings overview origin binding
        if: ${{ always() }}
        env:
          BINDING_ORIGIN_READBACK: ${{ steps.origin_readback.outputs.origin_readback }}
        run: |
          if [ "$BINDING_ORIGIN_READBACK" != "confirmed" ]; then
            echo "::error::earnings overview origin readback was not confirmed" >&2
            exit 75
          fi
