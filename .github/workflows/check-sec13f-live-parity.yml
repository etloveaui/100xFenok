name: Check SEC 13F Live Semantic Parity
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 check-sec13f-live-parity.yml {0}', inputs.external_clock_slot) || github.workflow }}

# Read-only observation of the canonical SEC 13F projection. This is deliberately
# separate from deployment, publication, freshness credit and graph expansion.

on:
  schedule:
    # 19:15 KST, after the 09:30 UTC materialization window plus settle time.
    - cron: '15 10 * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: sec13f-live-semantic-parity
  cancel-in-progress: false

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs check-sec13f-live-parity.yml

  probe:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      FENOK_VERIFY_TOKEN: ${{ secrets.FENOK_VERIFY_TOKEN }}

    steps:
      - name: Checkout probe and materializer scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            /scripts/ops/
            /scripts/materialize-cloud-data-plane-family.mjs
            /scripts/lib/
            /scripts/test-sec13f-live-privacy.mjs
            /100xfenok-next/scripts/cloud-data-plane/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Hydrate active SEC comparison inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { cp, mkdir, appendFile } from 'node:fs/promises';
          import path from 'node:path';
          import { createDefaultMaterializePlane, materializeCloudDataPlaneFamily } from './scripts/materialize-cloud-data-plane-family.mjs';
          const env = process.env, repoRoot = process.cwd(), family = 'sec-13f';
          const wanted = new Set(['summary.json', 'analytics/consensus.json', 'by_ticker.json']);
          const plane = createDefaultMaterializePlane({ accountId: env.CLOUDFLARE_ACCOUNT_ID,
            token: env.CLOUDFLARE_API_TOKEN, endpoint: env.DATA_PLANE_ENDPOINT,
            writeKey: env.DATA_PLANE_WRITE_KEY, family });
          const receipt = await materializeCloudDataPlaneFamily({ plane, family, repoRoot, env,
            manifestPrefix: 'public/data/sec-13f', privateManifestPrefix: 'data/sec-13f', privacyClass: 'public',
            outputRoot: path.join(env.RUNNER_TEMP, 'sec13f-parity-inputs'), canonicalReuseRoot: repoRoot,
            includeAsset: asset => asset.privacy_class === 'public' && wanted.has(asset.path.slice('public/data/sec-13f/'.length)) });
          for (const relative of wanted) {
            const target = path.join(repoRoot, 'data/sec-13f', relative);
            await mkdir(path.dirname(target), { recursive: true });
            await cp(path.join(receipt.output_root, relative), target);
          }
          await appendFile(env.GITHUB_ENV, `SEC13F_PARITY_CANONICAL_GENERATION=${receipt.generation_id}\n`);
          JS

      - name: Run semantic parity probe
        id: semantic
        continue-on-error: true
        env:
          SEC13F_PARITY_BASE_URL: https://100xfenok.etloveaui.workers.dev
          SEC13F_PARITY_REPORT_PATH: ${{ runner.temp }}/sec13f-semantic-parity.md
        run: node scripts/ops/check-sec13f-live-parity.mjs

      - name: Run separate serving-scope smoke
        id: privacy
        continue-on-error: true
        env:
          SEC13F_PRIVACY_LOG_PATH: ${{ runner.temp }}/sec13f-privacy.log
        run: |
          set -o pipefail
          node scripts/test-sec13f-live-privacy.mjs \
            --base-url https://100xfenok.etloveaui.workers.dev \
            2>&1 | tee "$SEC13F_PRIVACY_LOG_PATH"

      - name: Publish probe summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sec13f-semantic-parity.md" ]; then
            cat "$RUNNER_TEMP/sec13f-semantic-parity.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/sec13f-privacy.log" ]; then
            {
              echo
              echo 'SEC 13F serving-scope smoke (tracked data remains public on GitHub)'
              cat "$RUNNER_TEMP/sec13f-privacy.log"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update parity alarm
        if: steps.semantic.outcome == 'failure' || steps.privacy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="100xFenok SEC 13F live semantic parity alarm"
          {
            printf '%s\n\n' '[alert] SEC 13F live semantic parity or serving-scope smoke failed.'
            if [ -f "$RUNNER_TEMP/sec13f-semantic-parity.md" ]; then cat "$RUNNER_TEMP/sec13f-semantic-parity.md"; fi
            if [ -f "$RUNNER_TEMP/sec13f-privacy.log" ]; then cat "$RUNNER_TEMP/sec13f-privacy.log"; fi
            printf '\nObserved by: %s\n' "$RUN_URL"
          } > "$RUNNER_TEMP/sec13f-parity-issue.md"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/sec13f-parity-issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/sec13f-parity-issue.md"
          fi

      - name: Close parity alarm on recovery
        if: steps.semantic.outcome == 'success' && steps.privacy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="100xFenok SEC 13F live semantic parity alarm"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          [ -n "$existing" ] || exit 0
          gh issue comment "$existing" --body "[all-clear] SEC 13F semantic parity and private-route smoke recovered. Observed by: $RUN_URL"
          gh issue close "$existing" --reason completed
