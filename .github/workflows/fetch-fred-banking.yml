name: Fetch FRED Banking Data
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-fred-banking.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string
      data_type:
        description: 'Data type to fetch'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - daily
          - weekly
          - monthly
          - quarterly
      controlled_failure_key:
        description: 'Dispatch-only chaos key (one configured FRED series id)'
        required: false
        default: ''
        type: string

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

permissions:
  contents: write

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-fred-banking.yml

  fetch-fred-data:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: fenok-data-writer-refs/heads/main
      cancel-in-progress: false
      queue: max
    outputs:
      pushed_sha: ${{ steps.persist_banking_state.outputs.pushed_sha }}
      readback_confirmed: ${{ steps.readback.outputs.confirmed }}
      fetch_outcome: ${{ steps.fetch_banking.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/fred_banking
            data/macro

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Fetch FRED banking data and persist one attempt
        id: fetch_banking
        env:
          DATA_TYPE: ${{ github.event.inputs.data_type || 'all' }}
          INPUT_CONTROLLED_FAILURE_KEY: ${{ github.event.inputs.controlled_failure_key || '' }}
        run: node scripts/fetch-fred-banking.mjs --type "$DATA_TYPE"

      - name: Commit and push owned FRED banking data
        id: persist_banking_state
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_OUTCOME: ${{ steps.fetch_banking.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/fetch-fred-banking.yml \
            --stage always_if_exists
          if [[ "$FETCH_OUTCOME" == "success" ]]; then
            scripts/stage-lane-manifest.sh \
              --workflow .github/workflows/fetch-fred-banking.yml \
              --stage success_if_exists
          fi
          if git diff --staged --quiet; then
            echo "No FRED banking changes to publish"
            echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update FRED banking data"
          for attempt in $(seq 1 5); do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
              continue
            fi
            if git push; then
              echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              # Decoupled: a successful completion of this workflow runs the
              # coordinate-computed-signals workflow_run (serialized rebuild +
              # plane publish); the scheduled update-manifest.yml remains the
              # reconciliation fallback for shared projections.
              exit 0
            fi
            sleep 3
          done
          echo "git push failed after retrying concurrent main updates"
          exit 1

      - name: Read back FRED banking commit from origin/main
        id: readback
        if: ${{ steps.persist_banking_state.outcome == 'success' && steps.persist_banking_state.outputs.pushed_sha != '' }}
        env:
          PUSHED_SHA: ${{ steps.persist_banking_state.outputs.pushed_sha }}
        run: |
          set -euo pipefail
          git fetch --deepen=50 origin main || git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$PUSHED_SHA" = "$REMOTE_SHA" ]; then
            echo "origin/main readback confirmed at $PUSHED_SHA"
          elif git merge-base --is-ancestor "$PUSHED_SHA" origin/main; then
            echo "origin/main readback confirmed: $PUSHED_SHA is an ancestor of $REMOTE_SHA"
          else
            echo "::error::origin/main readback did not contain FRED banking commit $PUSHED_SHA" >&2
            exit 1
          fi
          echo "confirmed=true" >> "$GITHUB_OUTPUT"

  publish-fred-banking-cloud:
    needs: [clock-admission, fetch-fred-data]
    if: >-
      needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' &&
      (always() &&
      needs.fetch-fred-data.result == 'success' &&
      needs.fetch-fred-data.outputs.fetch_outcome == 'success' &&
      needs.fetch-fred-data.outputs.readback_confirmed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: fred-banking-cloud-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.fetch-fred-data.outputs.pushed_sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/fred_banking
            data/macro

      - name: Confirm exact FRED banking source checkout
        env:
          EXPECTED_SHA: ${{ needs.fetch-fred-data.outputs.pushed_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] \
            || { echo "::error::FRED banking cloud checkout is not the confirmed source commit" >&2; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Publish fred-banking generation to the cloud data plane
        id: publish_cloud_generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_BINDING_GIT_COMMIT: ${{ needs.fetch-fred-data.outputs.pushed_sha }}
        run: node scripts/publish-cloud-data-generation.mjs --family=fred-banking --tolerate-gate-block --json
