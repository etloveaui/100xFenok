name: Fetch FRED Banking Data

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      data_type:
        description: 'Data type to fetch'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - daily
          - weekly
          - monthly
          - quarterly
      controlled_failure_key:
        description: 'Dispatch-only chaos key (one configured FRED series id)'
        required: false
        default: ''
        type: string

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

permissions:
  contents: write

concurrency:
  group: fenok-data-writer-refs/heads/main
  cancel-in-progress: false
  queue: max

jobs:
  fetch-fred-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/data-supply-state/detection-attempts
            data/admin/data-supply-state/publish-outcomes
            data/admin/fred_banking
            data/macro

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test FRED banking producer contracts
        run: node scripts/test-fetch-fred-banking.mjs

      - name: Fetch FRED banking data and persist one attempt
        id: fetch_banking
        env:
          DATA_TYPE: ${{ github.event.inputs.data_type || 'all' }}
          INPUT_CONTROLLED_FAILURE_KEY: ${{ github.event.inputs.controlled_failure_key || '' }}
        run: node scripts/fetch-fred-banking.mjs --type "$DATA_TYPE"

      - name: Commit and push owned FRED banking data
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_OUTCOME: ${{ steps.fetch_banking.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHARD="data/admin/data-supply-state/detection-attempts/fred_banking.json"
          # Phase 1: consume the generated policy while retaining the legacy
          # hand list as parity defense until this workflow's natural proof.
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/fetch-fred-banking.yml \
            --stage always_if_exists
          if [[ -f "$SHARD" ]]; then
            git add -- "$SHARD"
          fi
          if [[ -f data/admin/fred_banking/index.json ]]; then
            git add -- data/admin/fred_banking/index.json
          fi
          for LKG_FILE in \
            data/admin/fred_banking/lkg/daily.json \
            data/admin/fred_banking/lkg/weekly.json \
            data/admin/fred_banking/lkg/monthly.json \
            data/admin/fred_banking/lkg/quarterly.json; do
            if [[ -f "$LKG_FILE" ]]; then
              git add -- "$LKG_FILE"
            fi
          done
          if [[ "$FETCH_OUTCOME" == "success" ]]; then
            scripts/stage-lane-manifest.sh \
              --workflow .github/workflows/fetch-fred-banking.yml \
              --stage success_if_exists
            for CANONICAL_FILE in \
              data/macro/fred-banking-daily.json \
              data/macro/fred-banking-weekly.json \
              data/macro/fred-banking-monthly.json \
              data/macro/fred-banking-quarterly.json; do
              if [[ -f "$CANONICAL_FILE" ]]; then
                git add -- "$CANONICAL_FILE"
              fi
            done
          fi
          if git diff --staged --quiet; then
            echo "No FRED banking changes to publish"
            exit 0
          fi
          git commit -m "chore: update FRED banking data"
          for attempt in $(seq 1 5); do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
              continue
            fi
            if git push; then
              # Decoupled: a successful completion of this workflow runs the
              # coordinate-computed-signals workflow_run (serialized rebuild +
              # plane publish); the scheduled update-manifest.yml remains the
              # reconciliation fallback for shared projections.
              exit 0
            fi
            sleep 3
          done
          echo "git push failed after retrying concurrent main updates"
          exit 1
      - name: Publish fred-banking generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ steps.fetch_banking.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/publish-cloud-data-generation.mjs --family=fred-banking --tolerate-gate-block --json

      - name: Persist fred-banking publish outcome
        if: ${{ always() }}
        run: node scripts/persist-cloud-publish-outcome.mjs --family=fred-banking --workflow=.github/workflows/fetch-fred-banking.yml --publisher-outcome=${{ steps.publish_cloud_generation.outcome }}
