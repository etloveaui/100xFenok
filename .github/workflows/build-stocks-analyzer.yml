name: Build Stocks Analyzer
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 build-stocks-analyzer.yml {0}', inputs.external_clock_slot) || github.workflow }}

# Merge Global Scouter + SlickCharts with bounded Yahoo forward-metric fallbacks
# into a single native-ready stocks_analyzer.json for the stock-analyzer feature.
# Runs daily after the global-scouter raw export window. SEC 13F ingestion is
# owned by the external CCH converter; this workflow only enriches and derives
# from the canonical SEC payload after the provenance guard passes.

on:
  # DEC-360 added a push filter here over seven input families so the
  # review-only SEC 13F bridge would re-seal when those inputs advanced. It was
  # removed on 2026-08-21 (B-384) because it could never fire: GitHub does not
  # start a workflow from a push made with the default GITHUB_TOKEN, and every
  # producer pushes that way. Measured, this workflow has three push runs in its
  # entire history, all on 2026-08-16 and all authored by a human.
  #
  # It was also wrong by construction rather than merely dead - the push path
  # ran the bridge builder without the S2/S5 regeneration whose ordering the
  # test's pinned counts encode, which is the 69-versus-67 disagreement recorded
  # on B-384. Update Manifest owns both the rebuild and the git copies of all
  # three sealed inputs, from a full non-sparse checkout; its own script says so
  # at scripts/update-manifest-projections.sh:343-345.
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: scouter-derived-publish
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs build-stocks-analyzer.yml

  build-stocks-analyzer:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Hydrate active Global Scouter owner export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          node scripts/materialize-cloud-data-plane-family.mjs --hydrate-global-scouter
          node scripts/materialize-cloud-data-plane-family.mjs --hydrate-sec-13f
          node scripts/materialize-cloud-data-plane-family.mjs --hydrate-scouter-derived
          node scripts/materialize-cloud-data-plane-family.mjs --hydrate-public-family damodaran

      - name: Hydrate active Yahoo finance and derive acquisition indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          node scripts/materialize-cloud-data-plane-family.mjs --hydrate-yahoo-finance
          if [ -f data/yf/_acquisition-state.json ]; then
            python3 scripts/yahoo_batch_state.py hydrate-generation --state-root data/admin/yahoo-batch-quote-history
          fi
          python3 scripts/rebuild-yf-finance-summary.py

      - name: Build stocks_analyzer.json
        if: github.event_name != 'push'
        run: |
          node scripts/build-stocks-analyzer.mjs

      - name: Verify SEC 13F source provenance
        if: github.event_name != 'push'
        run: node scripts/test-sec13f-source-route.mjs --candidate-only

      - name: Build the SEC 13F bridge index from the regenerated tree
        run: node scripts/build-sec13f-bridge-index.mjs

      - name: Build revision movers + industry benchmarks
        if: github.event_name != 'push'
        run: |
          node scripts/build-revision-movers.mjs
          node scripts/build-industry-benchmarks.mjs

      # Fenok RIM was retired under DEC-302. Its build and verification steps
      # are removed from this active pipeline so a retired gate can no longer
      # block the stocks-analyzer publication. Research artifacts under
      # data/computed/fenok-rim/ and the public quarantine are preserved; the
      # scripts remain runnable on demand for archived research.

      - name: Build calendar previous-release values (FRED)
        if: github.event_name != 'push'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/build-calendar-prev.mjs

      - name: Verify output
        if: github.event_name != 'push'
        run: |
          echo "=== stocks_analyzer.json header ==="
          head -20 data/global-scouter/core/stocks_analyzer.json
          echo "..."
          echo "Total stocks: $(node -e "console.log(JSON.parse(require('fs').readFileSync('data/global-scouter/core/stocks_analyzer.json','utf8')).count)")"

      - name: Publish derived Scouter generation
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/publish-cloud-data-generation.mjs --family=scouter-derived --json

      - name: Verify the SEC 13F bridge index against the regenerated tree
        if: ${{ steps.publish.outcome == 'success' }}
        run: node scripts/test-sec13f-bridge-index.mjs
