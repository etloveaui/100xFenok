name: Build Stocks Analyzer

# Merge Global Scouter + SlickCharts with bounded Yahoo forward-metric fallbacks
# into a single native-ready stocks_analyzer.json for the stock-analyzer feature.
# Runs daily after the global-scouter raw export window. SEC 13F ingestion is
# owned by the external CCH converter; this workflow only enriches and derives
# from the canonical SEC payload after the provenance guard passes.

on:
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fenok-data-writer-refs/heads/main
  cancel-in-progress: false
  queue: max

jobs:
  build-stocks-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '22'

      - name: Build stocks_analyzer.json
        run: |
          node scripts/test-yf-screener-enrichment.mjs
          node scripts/build-stocks-analyzer.mjs

      - name: Verify SEC 13F source provenance
        run: node scripts/test-sec13f-source-route.mjs

      - name: Build 13F downstream analytics (SEC ingestion is external)
        run: |
          node scripts/build-13f-enrichment-backfill.mjs
          node scripts/build-13f-integrity-indexes.mjs
          node scripts/build-13f-trades.mjs
          node scripts/build-13f-portfolio-views.mjs
          node scripts/build-guru-holders-index.mjs

      - name: Build revision movers + industry benchmarks
        run: |
          node scripts/build-revision-movers.mjs
          node scripts/build-industry-benchmarks.mjs

      # Fenok RIM was retired under DEC-302. Its build and verification steps
      # are removed from this active pipeline so a retired gate can no longer
      # block the stocks-analyzer publication. Research artifacts under
      # data/computed/fenok-rim/ and the public quarantine are preserved; the
      # scripts remain runnable on demand for archived research.

      - name: Build calendar previous-release values (FRED)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        # non-fatal: calendar context is an enhancement, not a build gate
        run: node scripts/build-calendar-prev.mjs || echo "calendar prev-values skipped"

      - name: Verify output
        run: |
          echo "=== stocks_analyzer.json header ==="
          head -20 data/global-scouter/core/stocks_analyzer.json
          echo "..."
          echo "Total stocks: $(node -e "console.log(JSON.parse(require('fs').readFileSync('data/global-scouter/core/stocks_analyzer.json','utf8')).count)")"

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/build-stocks-analyzer.yml \
            --stage always_if_exists
          git add \
            data/global-scouter/core/stocks_analyzer.json \
            data/global-scouter/core/per_bands_index.json \
            data/global-scouter/core/slick_index.json \
            data/sec-13f/by_ticker.json \
            data/sec-13f/by_sector.json \
            data/sec-13f/summary.json \
            data/sec-13f/investors/*.json \
            data/sec-13f/analytics/consensus.json \
            data/sec-13f/analytics/ticker_aliases.json \
            data/sec-13f/analytics/trades_ranking.json \
            data/sec-13f/analytics/portfolio_views.json \
            data/sec-13f/analytics/guru_holders_index.json \
            data/global-scouter/core/revision_movers.json \
            data/damodaran/industry_benchmarks.json \
            data/computed/fenok-rim/fair-values.json \
            data/computed/fenok-rim/identification-receipt.json \
            data/computed/fenok-rim/index-residual-roe-diagnostic.json \
            data/computed/fenok-rim/input-diagnostics.json \
            data/computed/fenok-rim/membership-sensitivity-2026.json \
            data/computed/fenok-rim/payout-history.json \
            data/calendar/prev-values.json
          if git diff --staged --quiet; then
            echo "No stocks analyzer or 13F analytics changes to publish"
            exit 0
          fi
          git commit -m "data: refresh stocks_analyzer.json + 13f analytics"
          for attempt in $(seq 1 5); do
            if ! git pull --rebase --autostash origin main; then
              echo "git rebase failed on attempt ${attempt}; aborting and retrying"
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
              continue
            fi
            if git push; then
              gh workflow run update-manifest.yml --ref main -f rebuild_slickcharts=true
              exit 0
            fi
            echo "git push race on attempt ${attempt}; retrying after rebase"
            sleep 3
          done
          echo "git push failed after retrying concurrent main updates"
          exit 1
