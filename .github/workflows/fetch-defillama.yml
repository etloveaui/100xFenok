name: Fetch DefiLlama Stablecoins Data
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-defillama.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string
      controlled_failure_endpoint:
        description: 'Dispatch-only LKG chaos endpoint (chart or stablecoins)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-defillama.yml

  fetch-defillama:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      fetch_outcome: ${{ steps.fetch_defillama.outcome }}
    concurrency:
      group: defillama-prepare
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/defillama_stablecoins
            data/macro

      - name: Start from latest main
        run: |
          timeout 90s git fetch --depth=1 origin +main:refs/remotes/origin/main
          timeout 30s git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create data directory
        run: mkdir -p data data/macro

      - name: Test DefiLlama producer contracts
        run: node scripts/test-fetch-defillama.mjs

      - name: Fetch stablecoins JSON
        id: fetch_defillama
        env:
          INPUT_CONTROLLED_FAILURE_ENDPOINT: ${{ github.event.inputs.controlled_failure_endpoint || '' }}
        run: node scripts/fetch-defillama.mjs

      - name: Verify output
        if: ${{ steps.fetch_defillama.outcome == 'success' }}
        run: |
          echo "=== Generated JSON ==="
          head -20 data/macro/stablecoins.json
          echo "..."
          echo "Total lines: $(wc -l < data/macro/stablecoins.json)"

      - name: Prepare immutable lane candidate
        id: candidate
        if: ${{ always() && !cancelled() }}
        env:
          FETCH_OUTCOME: ${{ steps.fetch_defillama.outcome }}
        run: |
          set -euo pipefail
          mkdir -p lane-commit-transfer
          candidate_outcome=failure
          scripts/stage-lane-manifest.sh --workflow .github/workflows/fetch-defillama.yml --stage always_if_exists
          if [ "$FETCH_OUTCOME" = success ]; then
            candidate_outcome=success
            scripts/stage-lane-manifest.sh --workflow .github/workflows/fetch-defillama.yml --stage success_if_exists
          fi
          node scripts/prepare-lane-commit.mjs prepare fetch-defillama.yml lane-commit-transfer/candidate.json "$candidate_outcome"

      - name: Upload lane candidate
        if: ${{ always() && steps.candidate.outcome == 'success' && steps.candidate.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: defillama-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane-commit-transfer/candidate.json
          if-no-files-found: error
          retention-days: 1

  commit-defillama:
    needs: [clock-admission, fetch-defillama]
    if: ${{ always() && !cancelled() && needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' && needs.fetch-defillama.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: fenok-data-writer-refs/heads/main
      cancel-in-progress: false
      queue: max
    outputs:
      status: ${{ steps.commit.outputs.status }}
    steps:
      - name: Checkout writer helpers
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/prepare-lane-commit.mjs
            /scripts/lib/lane-registry.mjs
            /scripts/lib/slickcharts-composite-recovery.mjs
            /scripts/lib/json-canonical.mjs
            /100xfenok-next/scripts/cloud-data-plane/json-canonical.mjs
      - name: Download current-run candidate
        uses: actions/download-artifact@v4
        with:
          name: defillama-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane-commit-transfer
      - name: Commit and push
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            timeout 60s git fetch --filter=blob:none --depth=1 origin +main:refs/remotes/origin/main
            timeout 30s git checkout -B main origin/main
            node scripts/prepare-lane-commit.mjs apply fetch-defillama.yml lane-commit-transfer/candidate.json
            if git diff --cached --quiet; then exit 0; fi
            timeout 30s git commit -m 'chore: update DefiLlama stablecoins data'
            if timeout 60s git push origin HEAD:main; then
              echo 'status=published' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Git push race on attempt ${attempt}; refreshing main and rechecking candidate"
            sleep 2
          done
          echo '::error::lane commit push failed after bounded retries'
          exit 1

  # A successful completion drives coordinate-computed-signals workflow_run;
  # scheduled update-manifest.yml remains the reconciliation fallback.
  publish:
    needs: [clock-admission, fetch-defillama, commit-defillama]
    if: ${{ always() && !cancelled() && needs.clock-admission.outputs.skip != 'true' && needs.fetch-defillama.result == 'success' && (needs.fetch-defillama.outputs.changed == 'false' || (needs.commit-defillama.result == 'success' && (needs.commit-defillama.outputs.status == 'published' || needs.commit-defillama.outputs.status == 'unchanged'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: defillama-stablecoins-publish
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout committed sources
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/defillama_stablecoins
            data/macro
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publish defillama-stablecoins generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ needs.fetch-defillama.outputs.fetch_outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/publish-cloud-data-generation.mjs --family=defillama-stablecoins --tolerate-gate-block --json
