name: R2 Usage Report

# The cost gate that blocks publication prints a verdict and nothing else, so
# "warn" carries no number and the owner cannot tell whether the estate is at
# 71% or 89% of the free allowance. This workflow runs the same measurement in
# report mode and prints it. It never blocks anything: the gate's exit code is
# captured and echoed rather than failing the run.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-usage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Measure R2 free-tier usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
        run: |
          set +e
          node scripts/check-r2-free-tier-usage.mjs --json > usage.json
          code=$?
          set -e
          echo "gate exit code: $code (0=ok 1=warn 2=fail/unreadable)"
          cat usage.json
          {
            echo "### R2 free-tier usage"
            echo ""
            echo "gate exit code: \`$code\` (0=ok 1=warn 2=fail/unreadable)"
            echo ""
            echo '```json'
            cat usage.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
