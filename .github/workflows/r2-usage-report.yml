name: R2 Usage Report

# Owner decision 2026-10-23: UNVERIFIED publication is allowed, but a sustained
# measurement outage must reach the existing pipeline alarm. This existing
# report exposes failed measurements as failed report runs; it never gates a
# data publication. The hourly cadence uses the detector's two-run noise bound.

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-usage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 22

      - name: Measure R2 free-tier usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
        run: |
          set +e
          node scripts/check-r2-free-tier-usage.mjs --json > usage.json
          code=$?
          set -e
          echo "gate exit code: $code (0=ok 1=warn 2=measured-breach 3=unverified)"
          cat usage.json
          {
            echo "### R2 free-tier usage"
            echo ""
            echo "gate exit code: \`$code\` (0=ok 1=warn 2=measured-breach 3=unverified)"
            echo ""
            echo '```json'
            cat usage.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            0|1) exit 0 ;;
            3)
              echo "::warning::R2 measurement UNVERIFIED; publication remains allowed. Repeated failed reports reach the pipeline alarm."
              exit 3 ;;
            *) exit "$code" ;;
          esac
