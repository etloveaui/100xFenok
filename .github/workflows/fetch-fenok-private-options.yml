name: Fetch Fenok Private Options Availability
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-fenok-private-options.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    # Weekdays after the US close. The producer enforces this exact allowlist.
    - cron: '10 1 * * 2-6'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string
      controlled_failure_key:
        description: 'Owner-approved failure proof: target exactly one options key (availability)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: fenok-data-writer-refs/heads/main
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-fenok-private-options.yml

  fetch-private-options:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCHEDULED_TICKERS: DASH,UNH,PYPL,RDDT,COIN,MU,PLTR,NVDA

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/yahoo_private_options
            data/computed

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install bounded provider client
        run: pip install yfinance

      - name: Test private options contracts
        run: |
          python3 -m unittest scripts/test_fetch_fenok_private_options.py
          node scripts/test-run-fenok-private-options.mjs
          node scripts/test-fetch-fenok-private-options-workflow.mjs

      - name: Fetch private raw and build public-safe marker
        id: fetch
        env:
          INPUT_CONTROLLED_FAILURE_KEY: ${{ github.event.inputs.controlled_failure_key || '' }}
        run: |
          set -euo pipefail
          RAW_DIR="$RUNNER_TEMP/yf-options"
          SUMMARY_PATH="$RUNNER_TEMP/yf-options-summary.json"
          mkdir -p "$RAW_DIR"
          node scripts/run-fenok-private-options.mjs \
            --output-dir "$RAW_DIR" \
            --summary-path "$SUMMARY_PATH"

      - name: Persist safe marker and recovery state
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The generated manifest owns private admin and public-safe marker staging.
          scripts/stage-lane-manifest.sh \
            --workflow .github/workflows/fetch-fenok-private-options.yml \
            --stage always_if_exists
          if [[ "$FETCH_OUTCOME" == "success" ]]; then
            scripts/stage-lane-manifest.sh \
              --workflow .github/workflows/fetch-fenok-private-options.yml \
              --stage success_if_exists
          fi
          if git diff --staged --quiet; then
            echo "No safe Yahoo private options changes to publish"
            exit 0
          fi
          git commit -m "data: update Yahoo private options availability"
          for attempt in $(seq 1 5); do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
              continue
            fi
            if git push; then
              gh workflow run update-manifest.yml --ref main
              exit 0
            fi
            sleep 3
          done
          echo "Yahoo private options push failed after retrying concurrent main updates"
          exit 1
