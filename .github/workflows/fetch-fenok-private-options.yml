name: Fetch Fenok Private Options Availability
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-fenok-private-options.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    # Weekdays after the US close. The producer enforces this exact allowlist.
    - cron: '10 1 * * 2-6'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string
      controlled_failure_key:
        description: 'Owner-approved failure proof: target exactly one options key (availability)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: yahoo-private-options-publish
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-fenok-private-options.yml

  fetch-private-options:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SCHEDULED_TICKERS: DASH,UNH,PYPL,RDDT,COIN,MU,PLTR,NVDA

    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
            data/admin/yahoo_private_options
            data/computed

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install bounded provider client
        run: pip install yfinance

      - name: Hydrate active Yahoo options payload and recovery state
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --family yahoo-private-options --manifest-prefix public/data --private-manifest-prefix data --privacy-class public --output-root "$RUNNER_TEMP/yahoo-private-options-active")"
          mkdir -p data
          cp -R "$RUNNER_TEMP/yahoo-private-options-active/." data/
          echo "generation=$(jq -r .generation_id <<< "$basis")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifest_sha256 <<< "$basis")" >> "$GITHUB_OUTPUT"

      - name: Fetch private raw and build public-safe marker
        id: fetch
        env:
          INPUT_CONTROLLED_FAILURE_KEY: ${{ github.event.inputs.controlled_failure_key || '' }}
        run: |
          set -euo pipefail
          RAW_DIR="$RUNNER_TEMP/yf-options"
          SUMMARY_PATH="$RUNNER_TEMP/yf-options-summary.json"
          mkdir -p "$RAW_DIR"
          node scripts/run-fenok-private-options.mjs \
            --output-dir "$RAW_DIR" \
            --summary-path "$SUMMARY_PATH"

      - name: Publish yahoo-private-options generation
        id: publish_cloud_generation
        if: ${{ steps.fetch.outcome == 'success' && steps.fetch.outputs.promoted == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_EXPECTED_ACTIVE_GENERATION_ID: ${{ steps.baseline.outputs.generation }}
          PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256: ${{ steps.baseline.outputs.manifest }}
        run: node scripts/publish-cloud-data-generation.mjs --family=yahoo-private-options --json
