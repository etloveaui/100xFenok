# R2 retention restore watchdog (fh-598 correction #6).
#
# The independent restore path for a sweep runner that died (SIGKILL, outage, cancel):
# every 15 minutes this reads the durable journal issue and — only when the advisory
# lease is not live — restores exactly the recorded originally-active publisher states,
# confirms them against fresh state, and keeps anything unconfirmed in the journal.
#
# It performs no deletion, touches no Cloudflare credential and needs no secret beyond
# the repository token. It exists because a crashed sweep cannot restore itself; if the
# parent rejects a second workflow, the smallest alternative decision is an equivalent
# scheduled host for `retention-window.mjs restore` (or accepting delayed manual restore).
name: R2 Retention Restore Watchdog
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 retention-restore.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: retention-restore
  cancel-in-progress: false

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs retention-restore.yml

  restore:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Restore journaled states (no-op unless needed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/retention-window.mjs restore --repo="${{ github.repository }}"
