# Publisher for the owner-run 100x briefing editions (data/briefing/**).
# It publishes the committed editions to the cloud data plane and nothing
# else: no acquisition and no Git write. Until a generation is active the
# Worker serves the same files from the static asset fallback.

name: Publish Briefing

on:
  # Source-change driven, deliberately NOT scheduled: editions are written by
  # the owner-run briefing desk, so the push that lands an edition IS the event.
  push:
    branches:
      - main
    paths:
      - 'data/briefing/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH-BRIEFING to confirm a real cloud publication'
        required: true
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    # One constant family group deliberately does not use github.ref. Two
    # publications must never overlap across refs because they contend for the
    # same R2 keyspace and pointer. This job performs no Git write.
    concurrency:
      group: publish-briefing
      cancel-in-progress: false
      queue: max
    steps:
      # Only a manual run needs the typed confirmation; a push is confirmed by
      # the commit that moved the tree.
      - name: Refuse an unconfirmed dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PUBLISH-BRIEFING" ]; then
            echo "::error::confirm must be exactly PUBLISH-BRIEFING; refusing to publish" >&2
            exit 2
          fi

      - uses: actions/checkout@v4

      - name: Start from latest main
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main
          git checkout -B main origin/main

      # Bind the generation to the exact clean checkout it will publish. Do
      # not use github.sha here: a queued job deliberately refreshes to latest
      # main above, so ambient event metadata can name an older tree.
      - name: Capture exact published checkout
        id: source_identity
        run: echo "git_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Strict by design: no --tolerate-gate-block. A run that publishes
      # nothing must be red.
      - name: Publish briefing generation to the cloud data plane
        id: publish_cloud_generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_BINDING_GIT_COMMIT: ${{ steps.source_identity.outputs.git_commit }}
        run: node scripts/publish-cloud-data-generation.mjs --family=briefing --json
