name: Fetch OECD CLI Shadow
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-oecd-cli.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    - cron: '0 8 1 * *'
    # OECD skips the August release; July+August data publish 2026-09-07
    # 12:00 CET. The 1st-of-month probe misses that release, so add an
    # 8th-of-month probe (day after OECD's ~7th). Both crons expect the same
    # payload; the detection floor's freshness is aware of the August gap.
    - cron: '0 8 8 * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Existing A1 clock marker'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Bound UTC schedule slot'
        required: false
        default: ''
        type: string
      controlled_failure:
        description: 'Dispatch-only OECD LKG chaos injection'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: oecd-cli-publish
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-oecd-cli.yml

  fetch-oecd-cli:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    # The cloud data plane's credentials live in the production environment.
    # The active private generation carries payload and recovery state.
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            100xfenok-next/scripts/cloud-data-plane
            100xfenok-next/src/lib
            .github/workflows
            data/macro
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Hydrate active OECD payload and recovery state
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          basis="$(node scripts/materialize-cloud-data-plane-family.mjs --family oecd-cli --manifest-prefix data/admin/oecd_cli --output-root "$RUNNER_TEMP/oecd-active")"
          mkdir -p data/admin/oecd_cli
          cp -R "$RUNNER_TEMP/oecd-active/." data/admin/oecd_cli/
          echo "generation=$(jq -r .generation_id <<< "$basis")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifest_sha256 <<< "$basis")" >> "$GITHUB_OUTPUT"
      - name: Fetch OECD CLI shadow
        id: fetch_oecd
        env:
          INPUT_CONTROLLED_FAILURE: ${{ github.event.inputs.controlled_failure || 'false' }}
        run: node scripts/fetch-oecd-cli.mjs
      - name: Publish OECD generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ always() && !cancelled() && steps.baseline.outcome == 'success' && (steps.fetch_oecd.outcome == 'success' || steps.fetch_oecd.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          PUBLISH_EXPECTED_ACTIVE_GENERATION_ID: ${{ steps.baseline.outputs.generation }}
          PUBLISH_EXPECTED_ACTIVE_MANIFEST_SHA256: ${{ steps.baseline.outputs.manifest }}
        run: node scripts/publish-cloud-data-generation.mjs --family=oecd-cli --json
