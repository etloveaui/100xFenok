name: Fetch OECD CLI Shadow
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 fetch-oecd-cli.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    - cron: '0 8 1 * *'
    # OECD skips the August release; July+August data publish 2026-09-07
    # 12:00 CET. The 1st-of-month probe misses that release, so add an
    # 8th-of-month probe (day after OECD's ~7th). Both crons expect the same
    # payload; the detection floor's freshness is aware of the August gap.
    - cron: '0 8 8 * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Existing A1 clock marker'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Bound UTC schedule slot'
        required: false
        default: ''
        type: string
      controlled_failure:
        description: 'Dispatch-only OECD LKG chaos injection'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: fenok-data-writer-refs/heads/main
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
            /.github/workflows/
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs fetch-oecd-cli.yml

  fetch-oecd-cli:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    # The cloud data plane's credentials live in the production environment.
    # This lane publishes a generation after its git write; git stays
    # authoritative either way.
    environment: production
    timeout-minutes: 15
    steps:
      # Measured on this repo: a plain shallow checkout costs ~66s, of which
      # ~53s is fetching blob content for 49,082 files and ~13s is writing them
      # out — to do 2 seconds of actual work. `filter: blob:none` stops the
      # blob transfer and cone-mode sparse-checkout stops materialising the
      # tree, so only this lane's own paths are ever fetched.
      #
      # The cone must cover everything this lane reads or stages. If it does
      # not, the failure is loud rather than silent: git refuses `git add` on a
      # path outside the cone, stage-lane-manifest.sh exits non-zero when a
      # required path is absent, and fetch-oecd-cli.mjs exits non-zero when
      # the parity canonical data/macro/activity-surveys.json is absent. That
      # file was outside the cone until 2026-10-11, so every parity report
      # since the lane went sparse compared 0 values.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            100xfenok-next/scripts/cloud-data-plane
            100xfenok-next/src/lib
            .github/workflows
            data/admin/oecd_cli
            data/macro
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Test OECD CLI producer
        run: node scripts/test-fetch-oecd-cli.mjs
      - name: Fetch OECD CLI shadow
        id: fetch_oecd
        env:
          INPUT_CONTROLLED_FAILURE: ${{ github.event.inputs.controlled_failure || 'false' }}
        run: node scripts/fetch-oecd-cli.mjs
      - name: Commit OECD evidence
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_OUTCOME: ${{ steps.fetch_oecd.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RECOVERY_EXIT=0
          if [[ "$FETCH_OUTCOME" != "success" ]]; then RECOVERY_EXIT=2; fi
          scripts/stage-lane-manifest.sh --workflow .github/workflows/fetch-oecd-cli.yml --stage always_if_exists
          if [[ "$FETCH_OUTCOME" == "success" ]]; then
            scripts/stage-lane-manifest.sh --workflow .github/workflows/fetch-oecd-cli.yml --stage success_if_exists
          fi
          if git diff --staged --quiet; then exit "$RECOVERY_EXIT"; fi
          git commit -m "data: refresh OECD CLI shadow"
          for attempt in $(seq 1 5); do
            if ! git pull --rebase --autostash origin main; then git rebase --abort >/dev/null 2>&1 || true; sleep 3; continue; fi
            # No Update Manifest dispatch: OECD CLI is a private, non-servable
            # family with no manifest consumer; scheduled update-manifest.yml
            # reconciliation (daily 02:30/09:30 UTC) remains the fallback.
            if git push; then exit "$RECOVERY_EXIT"; fi
            sleep 3
          done
          exit 1
      # Publish the same artifact this run just committed as an immutable
      # generation in the cloud data plane. Nothing switches and no consumer
      # reads it: git remains authoritative, so a blocked cost gate or a failed
      # publish is loud but never fatal to the lane.
      - name: Publish OECD generation to the cloud data plane
        id: publish_cloud_generation
        if: ${{ steps.fetch_oecd.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: node scripts/publish-cloud-data-generation.mjs --family=oecd-cli --tolerate-gate-block --json
