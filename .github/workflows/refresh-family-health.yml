name: Refresh ETF Family Health

on:
  # Manual reconciliation refreshes the same record without natural-cycle credit.
  workflow_dispatch: {}
  workflow_call:
    inputs:
      once_daily:
        type: boolean
        default: false
      publication_cycle:
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      DATA_PLANE_WRITE_KEY:
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prepared: ${{ steps.prepare.outputs.prepared }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /ops/
            /.github/workflows/
            /100xfenok-next/scripts/
            /100xfenok-next/src/lib/
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Check daily refresh admission
        id: admission
        if: inputs.once_daily
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
        run: node scripts/refresh-family-health.mjs needed
      - name: Prepare pinned health metadata outside the family lock
        id: prepare
        if: ${{ !inputs.once_daily || steps.admission.outputs.needed == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
        run: |
          set -euo pipefail
          node scripts/refresh-family-health.mjs prepare "$RUNNER_TEMP/family-health/prepared.json"
          printf '%s\n' 'prepared=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.prepared == 'true'
        with:
          name: etf-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/family-health/prepared.json
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: prepare
    if: needs.prepare.outputs.prepared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: stockanalysis-etf-detail-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            ops
            .github/workflows
            100xfenok-next/scripts
            100xfenok-next/src/lib
      - uses: actions/download-artifact@v4
        with:
          name: etf-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/family-health
      - name: Recheck pointer, re-prepare if changed, and write health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aeeb5ea3affe55a2219d08ea02dad9e1
          DATA_PLANE_ENDPOINT: https://100xfenok.etloveaui.workers.dev/internal/cloud-data-plane
          DATA_PLANE_WRITE_KEY: ${{ secrets.DATA_PLANE_WRITE_KEY }}
          HEALTH_PUBLICATION_CYCLE: ${{ inputs.publication_cycle }}
        run: node scripts/refresh-family-health.mjs commit "$RUNNER_TEMP/family-health/prepared.json"
