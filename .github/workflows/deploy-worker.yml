# Deploy the Next.js app to Cloudflare Workers via OpenNext.
#
# Triggers:
#   - push to main affecting source/UI/legacy paths -> immediate deploy
#     (generic nested data is excluded, but app-served /data assets are
#     re-included so Worker bundles do not lag behind Pages)
#   - daily schedule -> picks up bot-authored data refreshes into the bundle
#   - workflow_dispatch -> manual deploy
#
# Cancellation safety (BACKLOG #361, incident 2026-07-16: cancelled run
# 29502469123 uploaded its bundle and was superseded before its smokes ran —
# the live Worker served an UNVERIFIED bundle for ~15h while CI recorded no
# green):
#   - build-verify is supersession-friendly (cancel-in-progress: true): a newer
#     push cancels a stale build cheaply, before anything can ship.
#   - deploy is cancellation-atomic (cancel-in-progress: false): once a run
#     reaches upload, it always finishes its smokes. Newer runs queue, and a
#     queued deploy skips itself BEFORE upload if a newer run is already active
#     (scripts/check-deploy-supersession.mjs) — skipping never happens after
#     an upload, so a deploy is never interrupted mid-flight.
#   - every bundle carries deploy-provenance.json declaring the run
#     that shipped it; the deploy job asserts the CURRENT live bundle's
#     provenance before (loud, non-blocking) and after (blocking) upload
#     (scripts/check-live-deploy-provenance.mjs).
name: Deploy Worker (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - '100xfenok-next/**'
      - '100x/**'
      - 'alpha-scout/**'
      - 'tools/**'
      - 'ib/**'
      - 'admin/**'
      - 'posts/**'
      - '!**/data/**'
      - '100xfenok-next/public/data/**'
      - '.github/workflows/deploy-worker.yml'
  schedule:
    - cron: '30 3 * * *'  # 12:30 KST, after update-manifest data refresh
  workflow_dispatch:
    inputs:
      remediate_unprovenanced_live:
        description: 'One-time owner authorization to replace a live bundle with no provenance stamp'
        required: false
        default: false
        type: boolean
  # Requeue path: a successful recovery-family completion must eventually cause
  # a deploy even if every data push during the recovery window was gated. The
  # recovery-gate job still skips when a SIBLING recovery remains nonterminal.
  # NOTE: workflow_run.workflows matches the workflows' DISPLAY names (name:),
  # not their file names.
  workflow_run:
    workflows: ["SlickCharts History"]
    types: [completed]

jobs:
  recovery-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recovery deploy gate (skip data-serving deploys while SlickCharts recovery is in flight)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          guard="$(node scripts/check-recovery-deploy-gate.mjs \
            --mode push \
            --event-name "${{ github.event_name }}" \
            --event-json "$GITHUB_EVENT_PATH" \
            --recovery-workflows slickcharts-history.yml)"
          case "$guard" in
            skip)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::SlickCharts recovery-family workflow nonterminal and this push/workflow_run touches data-serving state; deploy deferred to the recovery-completion requeue or the daily schedule."
              ;;
            proceed-uncertain)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Recovery deploy gate uncertain (provider query or payload unreadable); proceeding with strict KPI as the fail-close backstop."
              ;;
            proceed)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected recovery deploy gate output: $guard"
              exit 1
              ;;
          esac

  build-verify:
    needs: [recovery-gate]
    if: ${{ needs.recovery-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: workers-100xfenok-main-build
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: 100xfenok-next
        run: npm ci

      - name: Build data supply detection floor
        run: |
          set -euo pipefail

          repo_root="$(pwd -P)"
          shard_root="$repo_root/data/admin/data-supply-state/detection-attempts"
          output_root="$(mktemp -d "/tmp/fenok-data-supply-detection-floor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          report_path="$output_root/data-supply-detection-floor.json"
          installed_path="$repo_root/data/admin/data-supply-detection-floor.json"
          trap 'rm -rf "$output_root"' EXIT

          mkdir -p "$shard_root"
          chmod 0700 "$output_root"
          now="$(node -e 'process.stdout.write(new Date().toISOString())')"

          node scripts/build-data-supply-detection-floor.mjs \
            --artifact-root "$repo_root" \
            --attempt-shard-root "$shard_root" \
            --calendars "$repo_root/scripts/lib/data-supply-detection-calendars.json" \
            --now "$now" \
            --output-root "$output_root"
          node scripts/build-data-supply-detection-floor.mjs --verify-report "$report_path"

          install -m 0644 "$report_path" "$installed_path"

      # cf:build rebuilds derived data from the freshly installed detection
      # floor, then verifies the KPI artifact before the OpenNext bundler.
      - name: Build (OpenNext Cloudflare)
        working-directory: 100xfenok-next
        run: npm run cf:build

      - name: Verify Worker bundle budget
        working-directory: 100xfenok-next
        run: npm run qa:worker-bundle-budget

      - name: Verify build manifest routes presence
        run: node scripts/check-source-paths.mjs

      - name: Stamp deploy provenance
        run: node scripts/write-deploy-provenance.mjs --assets-dir 100xfenok-next/.open-next/assets

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: open-next-bundle-${{ github.run_id }}
          path: 100xfenok-next/.open-next
          include-hidden-files: true
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [build-verify]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    concurrency:
      group: workers-100xfenok-main-deploy
      cancel-in-progress: false
    env:
      QA_ADMIN_SMOKE_AVAILABLE: ${{ (secrets.QA_ADMIN_PASSWORD != '' || secrets.QA_ADMIN_SESSION_COOKIE != '') && 'true' || 'false' }}
      GITHUB_WORKFLOW_FILE_NAME: deploy-worker.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: 100xfenok-next
        run: npm ci

      - name: Download built bundle
        uses: actions/download-artifact@v4
        with:
          name: open-next-bundle-${{ github.run_id }}
          path: 100xfenok-next/.open-next

      - name: Resolve expected bundle identity
        working-directory: 100xfenok-next
        run: |
          set -euo pipefail
          expected_build_id_path=".open-next/assets/BUILD_ID"
          expected_kpi_path=".open-next/assets/data/admin/fenok-data-health-kpi.json"
          if [ ! -s "$expected_build_id_path" ] || [ ! -f "$expected_kpi_path" ]; then
            echo "::error::Cannot establish deploy identity from the downloaded artifact."
            exit 1
          fi
          {
            echo "EXPECTED_BUILD_ID=$(tr -d '\r\n' < "$expected_build_id_path")"
            echo "EXPECTED_KPI_SHA256=$(sha256sum "$expected_kpi_path" | awk '{print $1}')"
          } >> "$GITHUB_ENV"

      - name: Skip deploy if superseded by a newer run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-deploy-supersession.mjs

      - name: Re-check recovery gate (check-then-start race)
        # A recovery may have become nonterminal after the recovery-gate job
        # ran. Reuse the existing SUPERSEDED semantics so every downstream step
        # already keyed on it skips without new cancellation logic. The gate is
        # fail-open on provider uncertainty (warning), matching the job gate.
        if: ${{ env.SUPERSEDED != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          guard="$(node scripts/check-recovery-deploy-gate.mjs \
            --mode push \
            --event-name "${{ github.event_name }}" \
            --event-json "$GITHUB_EVENT_PATH" \
            --recovery-workflows slickcharts-history.yml)"
          case "$guard" in
            skip)
              echo "SUPERSEDED=true" >> "$GITHUB_ENV"
              echo "::notice::Recovery became nonterminal after the gate job; deploy deferred (same semantics as supersession)."
              ;;
            proceed-uncertain)
              echo "::warning::Recovery re-check uncertain; proceeding with strict KPI as the fail-close backstop."
              ;;
            proceed) ;;
            *)
              echo "::error::Unexpected recovery deploy gate output: $guard"
              exit 1
              ;;
          esac

      - name: Verify Cloudflare token presence
        if: ${{ env.SUPERSEDED != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN secret is missing or empty. Deploy cannot proceed."
            exit 1
          fi

      - name: Check live deploy provenance (pre-deploy)
        if: ${{ env.SUPERSEDED != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-live-deploy-provenance.mjs --pre

      - name: Deploy to Cloudflare Workers
        if: ${{ env.SUPERSEDED != 'true' }}
        working-directory: 100xfenok-next
        run: |
          set -euo pipefail

          base_url="https://100xfenok.etloveaui.workers.dev"
          expected_build_id_path=".open-next/assets/BUILD_ID"
          expected_kpi_path=".open-next/assets/data/admin/fenok-data-health-kpi.json"
          if [ ! -s "$expected_build_id_path" ] || [ ! -f "$expected_kpi_path" ]; then
            echo "::error::Cannot establish deploy identity from the built artifact."
            exit 1
          fi
          expected_build_id="$(tr -d '\r\n' < "$expected_build_id_path")"
          expected_kpi_sha256="$(sha256sum "$expected_kpi_path" | awk '{print $1}')"
          if [ -z "$expected_build_id" ]; then
            echo "::error::Built artifact has an empty BUILD_ID."
            exit 1
          fi

          predeploy_build_id="unavailable"
          predeploy_kpi_sha256="unavailable"
          predeploy_kpi_path="$RUNNER_TEMP/predeploy-fenok-data-health-kpi.json"
          cache_bust="predeploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          if predeploy_build_id="$(curl -fsS --retry 3 --retry-all-errors --retry-delay 2 \
            -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' \
            "$base_url/BUILD_ID?cb=$cache_bust" | tr -d '\r\n')" \
            && curl -fsS --retry 3 --retry-all-errors --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' \
              "$base_url/data/admin/fenok-data-health-kpi.json?cb=$cache_bust" \
              -o "$predeploy_kpi_path"; then
            predeploy_kpi_sha256="$(sha256sum "$predeploy_kpi_path" | awk '{print $1}')"
          else
            echo "::warning::Pre-deploy bundle identity was unavailable; post-deploy identity verification remains mandatory."
          fi

          if [ "$predeploy_build_id" = "$expected_build_id" ]; then
            echo "::error::The new build reused the currently live BUILD_ID; deployment identity would be ambiguous."
            exit 1
          fi

          # Re-read main and live provenance at the last safe point before
          # upload. Main may advance during a build; the candidate may still
          # publish only when it is on main and is not older than what is live.
          # HTTP 404 is nonfatal only when BOTH recognized provenance surfaces
          # are absent and /BUILD_ID is live; every other fetch failure is fatal.
          fetch_http_status() {
            local url="$1"
            local output_path="$2"
            local status
            rm -f "$output_path"
            if ! status="$(curl -sS --retry 3 --retry-all-errors --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' \
              --output "$output_path" --write-out '%{http_code}' "$url")"; then
              printf '%s' "transport"
              return 0
            fi
            printf '%s' "$status"
          }

          source_fence_cache_bust="source-fence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          live_build_id_path="$RUNNER_TEMP/live-BUILD_ID-source-fence"
          live_build_id_status="$(fetch_http_status \
            "$base_url/BUILD_ID?cb=$source_fence_cache_bust" "$live_build_id_path")"
          if [ "$live_build_id_status" != "200" ]; then
            echo "::error::Live BUILD_ID fetch failed before the source fence: HTTP $live_build_id_status"
            exit 1
          fi
          live_build_id="$(tr -d '\r\n' < "$live_build_id_path")"
          if [ -z "$live_build_id" ]; then
            echo "::error::Live BUILD_ID is empty; remediation state cannot be established."
            exit 1
          fi
          if [ "$live_build_id" = "$expected_build_id" ]; then
            echo "::error::The new build reused the currently live BUILD_ID; deployment identity would be ambiguous."
            exit 1
          fi

          live_provenance_path="$RUNNER_TEMP/live-deploy-provenance-source-fence.json"
          live_provenance_fresh_path="$RUNNER_TEMP/live-deploy-provenance-source-fence-fresh.json"
          live_provenance_legacy_path="$RUNNER_TEMP/live-deploy-provenance-source-fence-legacy.json"
          live_provenance_surface="fresh-no-store"
          live_provenance_state="present"
          fresh_provenance_status="$(fetch_http_status \
            "$base_url/deploy-provenance.json?cb=$source_fence_cache_bust" \
            "$live_provenance_fresh_path")"
          case "$fresh_provenance_status" in
            200)
              live_provenance_path="$live_provenance_fresh_path"
              ;;
            404)
              # Transition/rollback compatibility: bundles deployed before the
              # no-store cutover expose the same stamp under the cached data path.
              live_provenance_surface="legacy-cached-fallback"
              legacy_provenance_status="$(fetch_http_status \
                "$base_url/data/admin/deploy-provenance.json?cb=$source_fence_cache_bust" \
                "$live_provenance_legacy_path")"
              case "$legacy_provenance_status" in
                200)
                  live_provenance_path="$live_provenance_legacy_path"
                  ;;
                404)
                  live_provenance_state="legacy-unprovenanced"
                  live_provenance_surface="legacy-unprovenanced-404"
                  live_provenance_path="$RUNNER_TEMP/live-deploy-provenance-source-fence-absent.json"
                  rm -f "$live_provenance_path"
                  ;;
                transport|*)
                  echo "::error::Legacy deploy provenance surface fetch failed: HTTP $legacy_provenance_status"
                  exit 1
                  ;;
              esac
              ;;
            transport|*)
              echo "::error::Fresh deploy provenance surface fetch failed: HTTP $fresh_provenance_status"
              exit 1
              ;;
          esac
          echo "::notice::Deploy source fence provenance surface: $live_provenance_surface"

          source_fence_mode="strict"
          if [ "$DEPLOY_EVENT_NAME" = "workflow_dispatch" ] \
            && [ "$DEPLOY_REMEDIATION_INPUT" = "true" ] \
            && [ "$live_provenance_state" = "legacy-unprovenanced" ]; then
            source_fence_mode="remediate-unprovenanced-live"
            echo "::warning::ONE-TIME owner remediation authorized for exact legacy live state: both provenance surfaces returned HTTP 404 with live BUILD_ID=$live_build_id"
          fi
          echo "::notice::Deploy source fence mode: $source_fence_mode"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse --verify refs/remotes/origin/main)"
          node ../scripts/check-deploy-source-fence.mjs \
            --provenance ".open-next/assets/deploy-provenance.json" \
            --expected-build-id "$expected_build_id" \
            --live-provenance "$live_provenance_path" \
            --live-build-id "$live_build_id" \
            --mode "$source_fence_mode" \
            --current-main "$current_main_sha"

          deploy_log="$RUNNER_TEMP/wrangler-deploy.log"
          wrangler_output="$RUNNER_TEMP/wrangler-output.jsonl"
          rm -f "$wrangler_output"
          WRANGLER_OUTPUT_FILE_PATH="$wrangler_output" npx wrangler deploy 2>&1 | tee "$deploy_log"
          if [ ! -s "$wrangler_output" ]; then
            echo "::error::Wrangler deploy produced no structured output."
            exit 1
          fi
          deploy_version_id="$(node -e '
            const fs = require("fs");
            const records = fs.readFileSync(process.argv[1], "utf8")
              .split(/\r?\n/)
              .filter(Boolean)
              .map((line) => JSON.parse(line));
            const deploy = records.reverse().find((record) => record.type === "deploy");
            process.stdout.write(deploy?.version_id ?? "");
          ' "$wrangler_output")"
          if [ -z "$deploy_version_id" ]; then
            echo "::error::Wrangler deploy succeeded without a parseable Version ID."
            exit 1
          fi

          {
            echo "EXPECTED_BUILD_ID=$expected_build_id"
            echo "EXPECTED_KPI_SHA256=$expected_kpi_sha256"
            echo "PREDEPLOY_BUILD_ID=$predeploy_build_id"
            echo "PREDEPLOY_KPI_SHA256=$predeploy_kpi_sha256"
            echo "DEPLOY_VERSION_ID=$deploy_version_id"
          } >> "$GITHUB_ENV"
          echo "::notice::Deployed artifact identity: wrangler_version_id=$deploy_version_id build_id=$expected_build_id kpi_sha256=$expected_kpi_sha256"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_REMEDIATION_INPUT: ${{ inputs.remediate_unprovenanced_live || false }}

      - name: Smoke data health KPI
        if: ${{ env.SUPERSEDED != 'true' }}
        working-directory: 100xfenok-next
        run: |
          set -euo pipefail

          base_url="https://100xfenok.etloveaui.workers.dev"
          timeout_seconds="${SMOKE_PROPAGATION_TIMEOUT_SECONDS:-180}"
          interval_seconds="${SMOKE_PROPAGATION_INTERVAL_SECONDS:-5}"
          live_build_id_path="$RUNNER_TEMP/live-BUILD_ID"
          live_kpi_path="$RUNNER_TEMP/live-fenok-data-health-kpi.json"

          bundle_identity_matches() {
            [ "$1" = "$EXPECTED_BUILD_ID" ] && [ "$2" = "$EXPECTED_KPI_SHA256" ]
          }

          if bundle_identity_matches "$PREDEPLOY_BUILD_ID" "$PREDEPLOY_KPI_SHA256"; then
            echo "::error::Stale-bundle rejection guard accepted the pre-deploy artifact."
            exit 1
          fi
          echo "::notice::STALE BUNDLE REJECTED: build_id=$PREDEPLOY_BUILD_ID kpi_sha256=$PREDEPLOY_KPI_SHA256"

          deadline=$((SECONDS + timeout_seconds))
          attempt=0
          matched=false
          observed_build_id="unavailable"
          observed_kpi_sha256="unavailable"
          while [ "$SECONDS" -le "$deadline" ]; do
            attempt=$((attempt + 1))
            cache_bust="postdeploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-${GITHUB_SHA}"
            rm -f "$live_build_id_path" "$live_kpi_path"
            if curl -fsS --connect-timeout 5 --max-time 15 \
              -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' \
              "$base_url/BUILD_ID?cb=$cache_bust" -o "$live_build_id_path" \
              && curl -fsS --connect-timeout 5 --max-time 15 \
                -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' \
                "$base_url/data/admin/fenok-data-health-kpi.json?cb=$cache_bust" \
                -o "$live_kpi_path"; then
              observed_build_id="$(tr -d '\r\n' < "$live_build_id_path")"
              observed_kpi_sha256="$(sha256sum "$live_kpi_path" | awk '{print $1}')"
              if bundle_identity_matches "$observed_build_id" "$observed_kpi_sha256"; then
                matched=true
                break
              fi
            else
              observed_build_id="unavailable"
              observed_kpi_sha256="unavailable"
            fi

            echo "::warning::Propagation attempt $attempt rejected stale or unavailable bundle: observed_build_id=$observed_build_id observed_kpi_sha256=$observed_kpi_sha256 expected_build_id=$EXPECTED_BUILD_ID expected_kpi_sha256=$EXPECTED_KPI_SHA256"
            if [ $((SECONDS + interval_seconds)) -gt "$deadline" ]; then
              break
            fi
            sleep "$interval_seconds"
          done

          if [ "$matched" != "true" ]; then
            echo "::error::Timed out after ${timeout_seconds}s waiting for this deploy's bundle: wrangler_version_id=$DEPLOY_VERSION_ID expected_build_id=$EXPECTED_BUILD_ID observed_build_id=$observed_build_id expected_kpi_sha256=$EXPECTED_KPI_SHA256 observed_kpi_sha256=$observed_kpi_sha256"
            exit 1
          fi

          echo "::notice::DEPLOYMENT IDENTITY MATCH: wrangler_version_id=$DEPLOY_VERSION_ID expected_build_id=$EXPECTED_BUILD_ID live_build_id=$observed_build_id expected_kpi_sha256=$EXPECTED_KPI_SHA256 live_kpi_sha256=$observed_kpi_sha256 attempts=$attempt"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(0,"utf8")); const okSchema = p.schema_version === "fenok-data-health-kpi/v1" || p.schema_version === "fenok-data-health-kpi/v2"; if (!okSchema || typeof p.generated_at !== "string" || !Array.isArray(p.lanes)) { console.error(JSON.stringify({schema_version:p.schema_version,generated_at:p.generated_at,lanes:Array.isArray(p.lanes)})); process.exit(1); } const r=p.runtime||{}; if (p.status !== "ready") console.warn("::warning:: KPI data state: " + (p.status_message||p.status)); if (r.verdict && r.verdict !== "ready") console.warn("::warning:: KPI runtime state: " + (r.status_message||r.verdict)); console.log(JSON.stringify({ok:true,schema:p.schema_version,status:p.status,status_message:p.status_message,built_at:r.built_at||null,verdict:r.verdict||null,fresh:r.fresh??null,hard_age_ok:r.hard_age_ok??null},null,2));' < "$live_kpi_path"

          node ../scripts/check-live-deploy-provenance.mjs --post
