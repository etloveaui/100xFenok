# Pins Autosync — bounded self-healing for the generated projection pins.
#
# Regenerate the remaining registry, lane-dashboard and detection projections.
# The lane shares the global writer queue and stages its direct registry policy.

name: Pins Autosync
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 pins-autosync.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    # Every 30 minutes, off the herd marks (UTC).
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: fenok-data-writer-refs/heads/main
  cancel-in-progress: false
  queue: max

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs pins-autosync.yml

  pins-autosync:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Start from latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate pins
        run: npm --prefix 100xfenok-next run regen:pins

      - name: Stage refreshed pins
        run: scripts/stage-lane-manifest.sh --workflow .github/workflows/pins-autosync.yml --stage success_if_exists

      - name: Commit refreshed pins
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            if git diff --quiet; then
              echo 'pins autosync: nothing to refresh'
              exit 0
            fi
            echo 'pins autosync: regenerated files were not staged via the lane manifest' >&2
            exit 1
          fi
          git commit -m "chore(pins): autosync generated projections [skip ci]"
          for attempt in $(seq 1 5); do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "pins autosync pushed $(git rev-parse HEAD)"
                exit 0
              fi
              git rebase --abort >/dev/null 2>&1 || true
            else
              git rebase --abort >/dev/null 2>&1 || true
            fi
            echo "pins autosync Git push race on attempt ${attempt}; retrying" >&2
            sleep 3
          done
          echo 'pins autosync Git push failed after bounded retries' >&2
          exit 1
