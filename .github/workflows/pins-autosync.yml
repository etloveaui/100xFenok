# Pins Autosync — bounded self-healing for the generated projection pins.
#
# Regenerate the remaining registry, lane-dashboard and detection projections.
# Regeneration uses the lane policy outside the writer queue; only a prepared
# difference enters its short commit job.

name: Pins Autosync
run-name: ${{ inputs.external_clock == 'a1-v1' && format('external-clock/a1/v1 pins-autosync.yml {0}', inputs.external_clock_slot) || github.workflow }}

on:
  schedule:
    # Every 30 minutes, off the herd marks (UTC).
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      external_clock:
        description: 'Automatic clock marker; leave empty for human dispatch'
        required: false
        default: ''
        type: string
      external_clock_slot:
        description: 'Declared UTC slot from the A1 clock'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  clock-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-external-clock-slot.mjs
            /ops/a1-lanes/external-clock.mjs
      - name: Admit uncovered automatic slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-clock-slot.mjs pins-autosync.yml

  pins-autosync:
    if: ${{ needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' }}
    needs: clock-admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 24
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
    concurrency:
      group: pins-prepare
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Start from latest main
        run: |
          set -euo pipefail
          timeout 90s git fetch --depth=1 origin +main:refs/remotes/origin/main
          timeout 30s git checkout -B main origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate pins
        run: npm --prefix 100xfenok-next run regen:pins

      - name: Prepare immutable lane candidate
        id: candidate
        run: |
          set -euo pipefail
          mkdir -p lane-commit-transfer
          candidate_outcome=success
          scripts/stage-lane-manifest.sh --workflow .github/workflows/pins-autosync.yml --stage success_if_exists
          node scripts/prepare-lane-commit.mjs prepare pins-autosync.yml lane-commit-transfer/candidate.json "$candidate_outcome"

      - name: Upload lane candidate
        if: ${{ always() && steps.candidate.outcome == 'success' && steps.candidate.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pins-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane-commit-transfer/candidate.json
          if-no-files-found: error
          retention-days: 1

  commit-pins:
    needs: [clock-admission, pins-autosync]
    if: ${{ always() && !cancelled() && needs.clock-admission.result == 'success' && needs.clock-admission.outputs.skip != 'true' && needs.pins-autosync.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: write
    concurrency:
      group: fenok-data-writer-refs/heads/main
      cancel-in-progress: false
      queue: max
    outputs:
      status: ${{ steps.commit.outputs.status }}
    steps:
      - name: Checkout writer helpers
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/prepare-lane-commit.mjs
            /scripts/lib/lane-registry.mjs
            /scripts/lib/slickcharts-composite-recovery.mjs
            /scripts/lib/json-canonical.mjs
            /100xfenok-next/scripts/cloud-data-plane/json-canonical.mjs
      - name: Download current-run candidate
        uses: actions/download-artifact@v4
        with:
          name: pins-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane-commit-transfer
      - name: Commit and push
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            timeout 60s git fetch --filter=blob:none --depth=1 origin +main:refs/remotes/origin/main
            timeout 30s git checkout -B main origin/main
            node scripts/prepare-lane-commit.mjs apply pins-autosync.yml lane-commit-transfer/candidate.json
            if git diff --cached --quiet; then exit 0; fi
            timeout 30s git commit -m 'chore(pins): autosync generated projections [skip ci]'
            if timeout 60s git push origin HEAD:main; then
              echo 'status=published' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Git push race on attempt ${attempt}; refreshing main and rechecking candidate"
            sleep 2
          done
          echo '::error::lane commit push failed after bounded retries'
          exit 1
