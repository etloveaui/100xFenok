# Control fixture: the two keys GitHub Actions actually defines, at both the
# top level and job level. This must keep passing, so the guard cannot be
# satisfied by rejecting concurrency blocks outright.
name: Valid Concurrency

on:
  workflow_dispatch:

concurrency:
  group: fixture-writer
  cancel-in-progress: false

jobs:
  noop:
    runs-on: ubuntu-latest
    concurrency:
      group: fixture-writer-job
      cancel-in-progress: true
    steps:
      - name: Noop
        run: echo noop
