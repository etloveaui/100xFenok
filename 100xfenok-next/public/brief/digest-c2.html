<style>
/* 100x site layer */
:root{
  --font-display:"Pretendard Variable",Pretendard,system-ui,sans-serif;
  --font-body:"Pretendard Variable",Pretendard,system-ui,sans-serif;
  --font-mono:"JetBrains Mono","Pretendard Variable",Pretendard,ui-monospace,monospace;
  --up:var(--success);--dn:var(--danger);
  --up-t:color-mix(in oklab,var(--up) 70%,#fff);--dn-t:color-mix(in oklab,var(--dn) 70%,#fff);
  --acc:#3b82f6;--acc-soft:rgba(59,130,246,.15);
  --page:#e9edf2;--ease:cubic-bezier(.2,0,0,1);
  --wrap:1252px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;margin:-1px;padding:0;border:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--container-gutter-desktop)}
.band{background:#fff;margin-bottom:12px}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:2px}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:#fff;padding:8px 12px;font-size:14px;font-weight:700;border-radius:4px;box-shadow:var(--elev-ring)}
.skip:focus{top:8px}

/* site bar */
.site{background:#fff;border-bottom:1px solid var(--border-soft)}
.embed .site{display:none} /* ?embed: inside the 100x site, whose own top bar names the product */
.site .wrap{display:flex;align-items:center;justify-content:space-between;height:52px;gap:12px}
.logo{font:800 18px var(--font-mono);letter-spacing:-.04em;text-decoration:none}
.logo span{font:700 14px var(--font-body);letter-spacing:0;margin-left:10px;color:var(--fg-2)}
.ed{font:500 12px/1.4 var(--font-mono);color:var(--muted);text-align:right}

/* hero */
.hero{padding:28px 0 40px}
.hk{font:600 12px var(--font-mono);color:var(--muted);letter-spacing:.02em;margin:0 0 8px}
.pre{font-weight:800;font-size:clamp(26px,4.2vw,52px);line-height:1.1;letter-spacing:-.025em;margin:0 0 6px}
.plainh{font-size:clamp(26px,3.6vw,44px);line-height:1.2;letter-spacing:-.025em;font-weight:800;margin:0 0 20px;max-width:24em;text-wrap:pretty}
.hfig{margin:0}
#heroBox{position:relative;width:100%;min-height:240px}
#heroBox svg{display:block;overflow:visible}
.big{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em}
.big.wt{fill:#fff}.big.dk{fill:var(--fg)}
.hb .b.up{fill:var(--up)}.hb .b.dn{fill:var(--dn)}
.hb,.dkg{transition:opacity .2s}
.hb.off,.dkg.off{opacity:.22}
.hl{font-family:var(--font-mono);font-weight:600;fill:var(--fg-2)}
.hl.ins{fill:#fff}
.ht{font-family:var(--font-mono);font-weight:600;fill:var(--muted)}
.hz{font-family:var(--font-mono);font-weight:800;fill:var(--fg)}
.cap{font-size:12px;line-height:1.5;color:var(--muted);margin:10px 0 0}
.lead{max-width:40rem;margin:28px 0 0;font-size:18px;line-height:1.8;text-wrap:pretty}
.prov{display:flex;align-items:flex-start;margin:28px 0 0;max-width:40rem;font-size:13px;line-height:1.5}
.pn{flex:none;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s var(--ease)}
.pn b{display:block;font:700 13px var(--font-mono)}
.pn span{color:var(--muted);display:block;max-width:16rem}
.pn:last-child{text-align:right;transition-delay:1.3s}
.pl2{flex:1;height:2px;background:var(--fg);margin:9px 14px 0;transform-origin:left;transform:scaleX(0);transition:transform 1s var(--ease) .35s;min-width:24px;position:relative}
.pl2::before,.pl2::after{content:"";position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--fg)}
.pl2::before{left:-12px}.pl2::after{right:-12px}
.go .pl2{transform:none}.go .pn{opacity:1;transform:none}

/* inline numbers */
.n{font-family:var(--font-mono);font-weight:600;font-size:.93em;font-variant-numeric:tabular-nums;white-space:nowrap}

/* sentences */
.s{border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .2s,box-shadow .2s,color .2s;color:var(--fg-2)}

/* sections */
.sec{padding:64px 0 56px;scroll-margin-top:120px}
.sh{display:flex;align-items:baseline;gap:16px;margin-bottom:28px}
.no{font:700 13px var(--font-mono);color:var(--muted)}
h2{font-size:clamp(22px,3vw,32px);line-height:1.3;letter-spacing:-.02em;font-weight:800;margin:0;max-width:30em;text-wrap:pretty}
.fig{margin:0 0 36px}
.fc{display:flex;flex-wrap:wrap;gap:2px 16px;align-items:baseline;margin-bottom:12px}
.fc b{font-size:14px;font-weight:700}
.fc span{font-size:12px;color:var(--muted)}
.fn{font-size:12px;line-height:1.55;color:var(--muted);margin:10px 0 0}
.fn b{font-weight:700;color:var(--fg-2)}
.prose{max-width:40rem}
.prose p{margin:0 0 1.1em;text-wrap:pretty}

/* bars */
.axis{display:flex;height:22px;font:600 11px var(--font-mono);color:var(--muted)}
.pl{position:relative;flex:1}
.zt{position:absolute;top:2px;transform:translateX(-50%);color:var(--fg);font-weight:800}
.lvh{width:84px;text-align:right}
.row{display:flex;align-items:center;height:var(--rh,52px);transition:opacity .2s}
.plot{position:relative;flex:1;height:100%}
.zl{position:absolute;top:0;bottom:0;width:1.5px;background:var(--fg);transform:translateX(-.75px)}
.bar{position:absolute;top:14%;bottom:14%;transform:scaleX(0);transform-origin:var(--o);transition:transform .9s var(--ease) calc(var(--i)*90ms)}
.bar.up{background:var(--up-t)}.bar.dn{background:var(--dn-t)}
.hb-plain .bar.up{background:var(--up)}.hb-plain .bar.dn{background:var(--dn)}
.in .bar{transform:none}
.lb{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;font:600 13px/1 var(--font-mono);color:var(--fg);opacity:0;transition:opacity .4s calc(.6s + var(--i,0)*90ms)}
.in .lb,.in .lv{opacity:1}
.lb.ins{color:#fff}
.nm{font-family:var(--font-body);font-weight:700;margin-right:.55em}
.tk{opacity:.72;margin-right:.5em}
.sm .nm,.mini .nm{display:none}
.lv{width:84px;text-align:right;font:600 14px var(--font-mono);opacity:0;transition:opacity .4s .8s}
.bars.yl .row{--rh:64px}
.off{opacity:.26}
.nt,.nt *{transition:none!important}

/* line */
.lc{position:relative;border-radius:2px;touch-action:pan-y}
.lc svg{display:block;overflow:visible}
.lc .gr{stroke:#e8ebef;stroke-width:1}
.lc .bl{stroke:var(--fg);stroke-width:1}
.lc .yt,.lc .xt{font-family:var(--font-mono);font-weight:500;font-size:11px;fill:var(--muted)}
.lc .ln0{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lc .hd circle{fill:var(--fg)}
.lc .hd text{font-family:var(--font-mono);font-weight:700;font-size:13px;fill:var(--fg);paint-order:stroke;stroke:#fff;stroke-width:4px}
.lend{opacity:0;transition:opacity .35s}
.lend.vis{opacity:1}
.lend circle{fill:var(--fg)}
.lend .bx{fill:transparent;transition:fill .2s}
.lend.on .bx{fill:var(--acc-soft)}
.lend .ev{font-family:var(--font-mono);font-weight:700;fill:var(--fg)}
.lend .eu{font-family:var(--font-mono);font-weight:600;fill:var(--fg-2)}
.lend .ed2{font-family:var(--font-mono);font-weight:500;font-size:11px;fill:var(--muted)}
.tip{pointer-events:none;opacity:0}
.tip.vis{opacity:1}
.tip line{stroke:var(--acc);stroke-width:1}
.tip circle{fill:#fff;stroke:var(--acc);stroke-width:2}
.tip text{font-family:var(--font-mono);font-weight:600;font-size:12px;fill:var(--fg);paint-order:stroke;stroke:#fff;stroke-width:4px}
.lhint{font-size:12px;color:var(--muted);margin:6px 0 0}

/* timeline */
.tl{position:relative}
.ax{position:relative;height:42px}
.dy{position:absolute;top:18px;transform:translateX(-50%);font:500 12px var(--font-mono);color:var(--muted)}
.dy.kd{color:var(--fg);font-weight:700}
.mo{position:absolute;top:0;font:700 11px var(--font-mono);color:var(--muted)}
.axl{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--fg);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease)}
.in .axl{transform:none}
.lanes{position:relative;padding-top:8px}
.now{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--muted);transform:translateX(-.75px)}
.nowt{position:absolute;bottom:-20px;transform:translateX(-50%);font:600 11px var(--font-mono);color:var(--muted);white-space:nowrap}
.ln{position:relative;height:46px;transition:opacity .2s}
.sp{position:absolute;top:10px;height:26px;background:color-mix(in oklab,var(--fg) 82%,#fff);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease) calc(.4s + var(--i)*.22s)}
.in .sp{transform:none}
.mk{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--fg);transform:translate(-50%,-50%) scale(0);transition:transform .35s var(--ease) calc(.5s + var(--i)*.22s)}
.in .mk{transform:translate(-50%,-50%) scale(1)}
.tx{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;font:700 13px var(--font-body);opacity:0;transition:opacity .4s calc(.8s + var(--i)*.22s)}
.tx .dd{font:600 12px var(--font-mono);color:var(--muted);margin-left:.4em}
.tx.w{color:#fff}.tx.w .dd{color:rgba(255,255,255,.75)}
.tx.tr{overflow:hidden;text-overflow:ellipsis}
.in .tx{opacity:1}
.tlf{margin-bottom:56px}

/* mini (sticky strip) */
.mini .row{height:13px}.mini .bar{top:2px;bottom:2px}.mini .lb{font-size:10px;opacity:1}
.mini .zl{width:1px}
.mini .lanes{padding-top:0}.mini .ln{height:14px}.mini .sp{top:3px;height:8px}.mini .mk{width:8px;height:8px}.mini .tx{font-size:10px;opacity:1}
.mini .tx .dd{font-size:9.5px}
.mini .now{border-left-width:1px}

/* strip */
.strip{position:fixed;top:0;left:0;right:0;z-index:30;background:#fff;border-bottom:1px solid var(--border);transform:translateY(-102%);transition:transform .24s var(--ease),visibility 0s .24s;visibility:hidden}
.strip.on{transform:none;visibility:visible;transition:transform .24s var(--ease)}
.prog{height:2px;background:var(--border-soft)}
.prog i{display:block;height:100%;background:var(--fg);transform:scaleX(0);transform-origin:left}
.si{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:28px;align-items:center;padding-block:8px}
.sl{min-width:0}
.idx{display:flex;gap:2px}
.idx a{font:700 12px var(--font-mono);text-decoration:none;color:var(--muted);padding:2px 6px;border-bottom:2px solid transparent}
.idx a.on{color:var(--fg);border-bottom-color:var(--fg)}
.cur{margin:4px 0 0;font-size:13px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.minis{position:relative;height:72px;max-width:680px;overflow:hidden}
.mf{position:absolute;inset:0;opacity:0;transition:opacity .25s;pointer-events:none}
.mf.on{opacity:1}

/* market */
.sub{font-size:13px;font-weight:700;margin:0 0 6px}
.ms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));border-top:2px solid var(--fg);margin:0}
.mi{padding:14px 12px 14px 0;border-bottom:1px solid var(--border-soft)}
.mi .l{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.mi .l em{font:500 11px var(--font-body);font-style:normal;color:var(--muted)}
.mi .v{font:700 20px/1.3 var(--font-mono);font-variant-numeric:tabular-nums}
.mi .c{font:600 13px var(--font-mono)}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--muted)}
.mv{display:grid;grid-template-columns:repeat(4,1fr);margin:0 0 36px;border-top:2px solid var(--fg)}
.mv div{padding:14px 12px 14px 0;border-bottom:1px solid var(--border-soft)}
.mv b{font:800 20px var(--font-mono);display:block;letter-spacing:-.02em}
.mv small{display:block;font-size:12px;color:var(--muted)}
.mv .v{font:700 24px/1.3 var(--font-mono);display:block}
.mv .c{font:600 13px var(--font-mono)}
.src{list-style:none;margin:0;padding:0;columns:2;column-gap:40px;border-top:2px solid var(--fg)}
.src li{break-inside:avoid;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:15px;line-height:1.5;display:flex;gap:12px}
.src li i{font:600 11px var(--font-mono);color:var(--muted);font-style:normal;padding-top:3px}
footer{padding:28px 0 56px;font-size:12px;color:var(--muted)}

@media (max-width:900px){
  .wrap{padding-inline:var(--container-gutter-tablet)}
  .sec{padding:48px 0 40px}
}
@media (max-width:600px){
  .wrap{padding-inline:var(--container-gutter-phone)}
  .hero{padding:18px 0 32px}
  .site .wrap{height:48px}.site .ed{font-size:11px}
  .lead{font-size:17px}
  .prov{font-size:12px}
  .si{grid-template-columns:1fr;gap:4px;padding-block:6px}
  .sl{display:flex;align-items:center;gap:8px}
  .cur{margin:0;font-size:12px;-webkit-line-clamp:1}
  .minis{max-width:none;height:66px}
  .mv{grid-template-columns:repeat(2,1fr)}
  .src{columns:1}
  .lb{font-size:11.5px}
  .lv{width:64px;font-size:12px}.lvh{width:64px}
  .bars.yl .row{--rh:56px}
  .tx{font-size:12px}
  .sh{flex-direction:column;gap:4px}
  .sec{scroll-margin-top:110px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>

<script>
(()=>{
if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');
const C=JSON.parse(document.getElementById('feno-pack-content').textContent);
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MINUS='\u2212',NS='http://www.w3.org/2000/svg',DAY=864e5;
const fmt=(v,d)=>{const a=Math.abs(v).toFixed(d);return (v>0?'+':v<0?MINUS:'')+a};
const ease=t=>1-Math.pow(1-t,3),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const pad2=n=>String(n).padStart(2,'0');
const utc=d=>Date.parse(d+'T00:00:00Z');
const md=t=>{const d=new Date(t);return (d.getUTCMonth()+1)+'/'+pad2(d.getUTCDate())};
const decs=v=>(String(v).split('.')[1]||'').length;

/* ===== models from content ===== */
const movers=C.movers||[],mstrip=C.market_strip||[];
const ALL=[C.lead,...C.sections.flatMap(s=>s.paragraphs)].join(' ');

function barModel(f,g){
  let items=f.items.map((it,i)=>{
    const mv=movers.find(m=>m.name===it.label);
    const ms=mstrip.find(m=>/^[A-Z]{2,6}$/.test(m.label)&&m.change_pct===it.value);

}
function lineModel(f,g){
  const terms=[...(f.title.match(/[A-Z]{2,}/g)||[])];if(f.title.includes('회사채'))terms.push('회사채');

function tlModel(f,g,sec){

/* ===== headline rule ===== */
function partition(words,k){
  k=Math.max(1,Math.min(k,words.length));let best=null;
  (function rec(i,parts){
    if(parts.length===k-1){const p=[...parts,words.slice(i).join(' ')],m=Math.max(...p.map(s=>s.length));if(!best||m<best.m)best={m,p};return}
    for(let j=i+1;j<=words.length-(k-1-parts.length);j++)rec(j,[...parts,words.slice(i,j).join(' ')]);
  })(0,[]);
  return best.p;
}
function splitHeadline(h,F){
  const pos=F.items.filter(i=>i.v>0),neg=F.items.filter(i=>i.v<0);
  if(!pos.length||!neg.length)return null;
  const w=h.trim().split(/\s+/),SUF=['지만','는데','나','도'];
  for(let i=1;i<w.length-1;i++){
    if(SUF.some(s=>w[i].endsWith(s)&&w[i].length>s.length)){
      let st=0;for(let j=i-1;j>=0;j--){if(/[은는이가]$/.test(w[j])){st=j;break}}
      const a=w.slice(st,i+1),b=w.slice(i+1);
      return {pre:w.slice(0,st).join(' '),R:partition(a,pos.length),L:partition(b,neg.length)};
    }
  }
  return null;
}

/* ===== sentences ===== */
const NUM=/\d[\d,]*(?:\.\d+)?(?:~\d[\d,]*(?:\.\d+)?)?(?:%p|%|bp|억\s?달러|달러)/g;
const UPV=/^\s*(오른|오르|올라|올랐|뛰었|뛰어|상승)/,DNV=/^\s*(내린|내렸|내려|하락)/;
function markNums(t){
  const ms=[...t.matchAll(NUM)];
  const tone=new Array(ms.length).fill('');
  for(let i=ms.length-1;i>=0;i--){
    const m=ms[i];if(m[0].endsWith('%p'))continue;
    const after=t.slice(m.index+m[0].length);
    if(UPV.test(after))tone[i]='u';else if(DNV.test(after))tone[i]='d';
    else if(i<ms.length-1){const gap=t.slice(m.index+m[0].length,ms[i+1].index);if(/^,\s*\S+는\s*$/.test(gap))tone[i]=tone[i+1]}
  }
  let out='',p=0;
  ms.forEach((m,i)=>{out+=esc(t.slice(p,m.index))+`<b class="n${tone[i]?' '+tone[i]:''}">${esc(m[0])}</b>`;p=m.index+m[0].length});
  return out+esc(t.slice(p));
}
function keysFor(t){
  const ks=[];
  MODELS.forEach(M=>{
    if(M.kind==='line'){if(M.res.some(r=>r.test(t)))ks.push(M.k)}
    else M.items.forEach(it=>{if(it.res.some(r=>r.test(t)))ks.push(it.k)});
  });
  return [...new Set(ks)];
}
function sentHTML(p,sec){

    return parts.map((c,j)=>{let ks=keysFor(c);if(!ks.length&&j>0)ks=prev;prev=ks;
      return `<span class="s" data-sec="${sec}" data-ks="${ks.join(' ')}">${markNums(c)}</span>`}).join(' ');
  }).join(' ');
}

/* ===== line ===== */
function renderLine(box,M,o={}){
  const W=box.clientWidth||340,phone=W<560,H=phone?240:320;
  const intra=/^\d{1,2}:\d{2}$/.test(M.points[0][0]);   /* a 5-minute path: 'HH:MM' on the session's own clock */
  const tOf=d=>intra?(+d.slice(0,d.indexOf(':'))*60+ +d.slice(d.indexOf(':')+1))*6e4:utc(d);
  const P=M.points.map(([d,v])=>({d,v,t:tOf(d)})),n=P.length,t0=P[0].t,t1=P[n-1].t;
  const vs=P.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs);
  const raw=(mx-mn||Math.abs(mx)*.01||1)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),stp=[1,2,2.5,5,10].map(m=>m*mag).find(x=>x>=raw);
  const sdec=Math.max(0,-Math.floor(Math.log10(stp)+1e-9)),lo=Math.floor(mn/stp)*stp,hi=Math.ceil(mx/stp)*stp;
  const L=phone?40:44,R=phone?74:112,T=20,B=28;   /* room for the '14%p' axis label */
  const X=t=>L+(t-t0)/(t1-t0)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  P.forEach(p=>{p.x=X(p.t);p.y=Y(p.v)});

  for(let v=lo;v<=hi+stp/2;v+=stp)g+=`<line class="gr" x1="${L}" x2="${W-R+6}" y1="${Y(v)}" y2="${Y(v)}"/><text class="yt" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(sdec)}${v+stp>hi+stp/2?M.unit:''}</text>`;
  if(intra){   /* hour ticks on the 5-minute path */
    for(let m=Math.ceil(t0/36e5)*60;m*6e4<=t1;m+=60){const xx=X(m*6e4);
      g+=`<line class="bl" x1="${xx}" x2="${xx}" y1="${H-B}" y2="${H-B+4}"/><text class="xt" x="${xx}" y="${H-8}" text-anchor="middle">${pad2(m/60)}:00</text>`}
  }

  const svg=$('svg',box),path=$('.ln0',svg),hd=$('.hd',svg),lend=$('.lend',svg),tip=$('.tip',svg);
  const bb=$('.ev',lend).getBBox(),bb2=$('.ed2',lend).getBBox(),bx=$('.bx',lend);
  bx.setAttribute('x',bb.x-4);bx.setAttribute('y',bb.y-2);bx.setAttribute('width',Math.max(bb.width,bb2.width)+8);bx.setAttribute('height',bb2.y+bb2.height-bb.y+4);
  const st={P,n,path,hd,lend,drawn:false,idx:n-1};
  st.draw=p=>{const i=Math.round(p*(n-1));
    path.setAttribute('d','M'+P.slice(0,i+1).map(q=>q.x.toFixed(1)+','+q.y.toFixed(1)).join('L'));
    if(p<1){hd.setAttribute('opacity',1);hd.setAttribute('transform',`translate(${P[i].x},${P[i].y})`);$('text',hd).textContent=P[i].v.toFixed(2)}
    else{hd.setAttribute('opacity',0);lend.classList.add('vis');st.drawn=true}};
  const show=i=>{const p=P[i];st.idx=i;tip.classList.add('vis');
    $('line',tip).setAttribute('x1',p.x);$('line',tip).setAttribute('x2',p.x);

    const tt=$('text',tip),right=p.x>W*.6;tt.setAttribute('x',p.x+(right?-8:8));tt.setAttribute('text-anchor',right?'end':'start');

    const live=box.parentElement.querySelector('[aria-live]');if(live)live.textContent=tt.textContent};

  const near=cx=>{let a=0,b=n-1;while(b-a>1){const m=(a+b)>>1;if(P[m].x<cx)a=m;else b=m}return cx-P[a].x<P[b].x-cx?a:b};
  box.onpointermove=e=>{if(!st.drawn)return;const r=svg.getBoundingClientRect();show(near(e.clientX-r.left))};
  box.onpointerleave=hide;
  box.onkeydown=e=>{if(!st.drawn)return;let i=st.idx;
    if(e.key==='ArrowLeft')i=Math.max(0,i-1);else if(e.key==='ArrowRight')i=Math.min(n-1,i+1);
    else if(e.key==='Home')i=0;else if(e.key==='End')i=n-1;else if(e.key==='PageUp')i=Math.max(0,i-20);else if(e.key==='PageDown')i=Math.min(n-1,i+20);else return;
    e.preventDefault();show(i)};
  box.onfocus=()=>{if(st.drawn)show(st.idx)};box.onblur=hide;
  box._st=st;st.draw(o.done?1:0);
}
function animateLine(box){
  const st=box._st;if(!st)return;if(RM){st.draw(1);return}
  const t0=performance.now();
  (function f(t){const p=clamp((t-t0-200)/1800,0,1);st.draw(ease(p));if(p<1)requestAnimationFrame(f)})(t0);
}

/* ===== registry ===== */
const REG=[];
function render(entry,done){
  const {box,M,mini,g}=entry;
  if(M.kind==='bars')renderBars(box,M,{mini,g});
  else if(M.kind==='timeline')renderTL(box,M,{mini,g});
  else if(M.kind==='line')renderLine(box,M,{g,done});
}
SEC.forEach(S=>{
  const box=$(`[data-fig="${S.i}"]`);
  if(box&&S.fig)REG.push({box,M:S.fig,mini:false,g:S.fig===HERO?'hs':S.fig.g});
  const mb=$(`.mf[data-sec="${S.i+1}"]`);
  if(mb&&S.mini)REG.push({box:mb,M:S.mini,mini:true,g:'m'+(S.i+1)});
});

function reveal(fig){
  if(fig.dataset.done)return;fig.dataset.done=1;fig.classList.add('in');
  $$('.cnt',fig).forEach(count);
  const lc=$('.lc',fig);if(lc)animateLine(lc);
}

/* ===== hero ===== */
let H=null;
function measure(str,fs,cls){
  const t=document.createElementNS(NS,'text');t.setAttribute('class',cls);t.setAttribute('font-size',fs);t.textContent=str;
  $('#msr').appendChild(t);const w=t.getComputedTextLength();t.remove();return w;
}
function buildHero(animate){
  const box=$('#heroBox'),W=box.clientWidth||340,phone=W<560,M=HERO,d=M.dec;
  if(M.kind!=='bars'){   /* a hero that is not bars is drawn like a section figure under a plain heading */
    box.className=M.kind==='line'?'lc':'';render({box,M,mini:false,g:'hero'},!animate||RM);
    if(M.kind==='line'&&animate&&!RM)animateLine(box);
    box.classList.add('in');return;
  }
  if(!HS){
    box.className='bars hb-plain';renderBars(box,M,{g:'hero'});
    if(animate&&!RM){requestAnimationFrame(()=>requestAnimationFrame(()=>{box.classList.add('in');$$('.cnt',box).forEach(count)}))}
    else{box.classList.add('in','nt');requestAnimationFrame(()=>box.classList.remove('nt'))}
    return;
  }
  const pos=M.items.filter(i=>i.v>0),neg=M.items.filter(i=>i.v<0);
  const wR=Math.max(...HS.R.map(s=>measure(s,100,'big'))),wL=Math.max(...HS.L.map(s=>measure(s,100,'big')));
  const pE=phone?6:12,pIn=phone?8:16,pOut=phone?8:14,rEnd=W-pE;
  const maxFs=Math.min(phone?56:104,Math.max(34,innerHeight*(phone?.075:.105)));
  const fs=Math.max(18,Math.min(maxFs,(rEnd-pOut-2*pIn)*100/(wL+wR)));
  const maxP=Math.max(...pos.map(i=>i.v)),maxN=Math.max(...neg.map(i=>-i.v));
  const z=Math.round(wL*fs/100+pOut),k=Math.min((rEnd-z)/maxP,(z-4)/maxN);
  const lfs=phone?11:12,strip=phone?20:24,thin=phone?28:34,top=24;
  const rows=[...pos.map((it,j)=>({it,side:1,txt:HS.R[j]||null})),...neg.map((it,j)=>({it,side:-1,txt:HS.L[j]||null}))];
  let y=top;rows.forEach(r=>{r.h=r.txt?Math.round(fs+strip):thin;r.y=y;y+=r.h});
  const Ht=y+4;
  let defs='',body='',maskR='',dark='';
  rows.forEach((r,i)=>{
    const it=r.it;r.len=Math.abs(it.v)*k;r.v=it.v;r.by=r.y+1.5;r.bh=r.h-3;
    r.pre=(phone?(it.tk?'':it.nm+' '):it.nm+' ')+(it.tk?it.tk+' ':'');
    const lw=measure(r.pre+fmt(it.v,d)+'%',lfs,'hl');
    r.inside=r.len>lw+22;
    r.ly=r.txt?r.y+r.h-7:r.y+r.h/2+4;
    defs+=`<clipPath id="hc${i}"><rect class="rc" y="${r.by}" height="${r.bh}" x="${z}" width="0"/></clipPath>`;
    maskR+=`<rect class="rm" y="${r.by}" height="${r.bh}" x="${z}" width="0" fill="#000"/>`;
    const tx=r.side>0?z+pIn:z-pOut,anc=r.side>0?'start':'end',ty=r.y+1.5+fs*.84;
    if(r.txt)dark+=`<g class="dkg" data-k="${it.k}" data-g="hero"><text class="big dk lt" x="${tx}" y="${ty}" font-size="${fs}" text-anchor="${anc}">${esc(r.txt)}</text></g>`;
    body+=`<g class="hb" data-k="${it.k}" data-g="hero"><rect class="b ${r.side>0?'up':'dn'} rb" y="${r.by}" height="${r.bh}" x="${z}" width="0"/>`+
      (r.txt?`<g clip-path="url(#hc${i})"><text class="big wt lt" x="${tx}" y="${ty}" font-size="${fs}" text-anchor="${anc}">${esc(r.txt)}</text></g>`:'')+
      `<text class="hl lb2${r.inside?' ins':''}" y="${r.ly}" font-size="${lfs}" text-anchor="${r.inside?(r.side>0?'end':'start'):(r.side>0?'start':'end')}" opacity="0"></text></g>`;
  });
  const tm=M.title.match(/^(.+?)[와과]\s(.+?)의\s/);
  const head=(tm?`<text class="ht" font-size="11" x="${z-16}" y="12" text-anchor="end">← ${esc(tm[2])}</text><text class="ht" font-size="11" x="${z+16}" y="12">${esc(tm[1])} →</text>`:'')+`<text class="hz" font-size="11" x="${z}" y="12" text-anchor="middle">0${esc(M.unit)}</text>`;
  box.innerHTML=`<svg width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}" aria-hidden="true"><defs>${defs}<mask id="hm" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${Ht}"><rect x="0" y="0" width="${W}" height="${Ht}" fill="#fff"/>${maskR}</mask></defs>${head}${body}<g mask="url(#hm)">${dark}</g><line x1="${z}" x2="${z}" y1="18" y2="${Ht}" stroke="#111" stroke-width="1.5"/></svg>`;
  const svg=$('svg',box),rb=$$('.rb',svg),rc=$$('.rc',svg),rm=$$('.rm',svg),lb=$$('.lb2',svg);
  rows.forEach((r,i)=>{r.rb=rb[i];r.rc=rc[i];r.rm=rm[i];r.lb=lb[i];
    r.tx=$$(`[data-k="${r.it.k}"] .lt`,svg)});
  H={rows,z,fs,d};
  if(!animate||RM){draw(1e9);return}
  const t0=performance.now();
  (function f(t){const e=t-t0;draw(e);if(e<1700)requestAnimationFrame(f);else draw(1e9)})(t0);
}
function draw(t){
  if(!H)return;const z=H.z;
  H.rows.forEach((r,i)=>{
    const p=ease(clamp((t-i*110)/1000,0,1)),w=r.len*p,x=r.side>0?z:z-w;
    [r.rb,r.rc,r.rm].forEach(e=>{e.setAttribute('x',x);e.setAttribute('width',w)});
    r.lb.textContent=r.pre+fmt(r.v*p,H.d)+'%';
    r.lb.setAttribute('x',r.inside?(r.side>0?z+w-8:z-w+8):(r.side>0?z+w+6:z-w-6));
    r.lb.setAttribute('opacity',clamp((p-.35)/.65,0,1));
    r.tx.forEach(tx=>{tx.setAttribute('opacity',clamp(p*2.4,0,1));tx.setAttribute('transform',`translate(0 ${((1-p)*H.fs*.2).toFixed(2)})`)});
  });
}

/* ===== market / sources ===== */
const UNIT={points:'포인트','%':'수익률','KRW per USD':'원/달러','USD per barrel':'달러/배럴'};
const num=(v,u)=>u==='%'?v.toFixed(2)+'%':v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
$('#mvh').textContent=`주요 종목 · 미국장 ${US.slice(5)} 종가`;
$('#msh').textContent=`시장 지표 · 미국장 ${US.slice(5)}`;
$('#ms').innerHTML=mstrip.map(m=>{
  let c='<span class="c fl" aria-label="변화 자료 없음">–</span>';
  if(m.change_pct!==null)c=`<span class="c ${m.change_pct>0?'up':m.change_pct<0?'dn':'fl'}">${fmt(m.change_pct,2)}%</span>`;
  else if(m.change_bp!==null)c=`<span class="c ${m.change_bp>0?'up':m.change_bp<0?'dn':'fl'}">${fmt(m.change_bp,0)}bp</span>`;
  return `<div class="mi"><div class="l">${esc(m.label)}<em>${esc(UNIT[m.unit]||m.unit)}</em></div><div class="v">${num(m.value,m.unit)}</div>${c}</div>`;
}).join('');
$('#mv').innerHTML=movers.map(m=>`<div><b>${esc(m.ticker)}</b><small>${esc(m.name)}</small><span class="v">${m.close.toFixed(2)}</span><span class="c ${m.chg_pct>0?'up':m.chg_pct<0?'dn':'fl'}">${fmt(m.chg_pct,2)}%</span></div>`).join('');
$('#t-src').textContent=`인용한 자료 ${C.sources.length}건`;
$('#srcl').innerHTML=C.sources.map((s,i)=>`<li><i>${pad2(i+1)}</i><span>${esc(s)}</span></li>`).join('');
$('#foot').textContent=`${C.product} · ${ED} ${PUB} KST 발행 · ${fbName} ${fbTime} 후속`;

/* ===== sentence tracking ===== */
const SENT=$$('.s'),strip=$('#strip'),mfs=$$('.mf'),idxA=$$('#idx a');
let cur=null;
function applyAct(keys){
  const groups={};
  $$('[data-k][data-g]').forEach(el=>{(groups[el.dataset.g]=groups[el.dataset.g]||[]).push(el)});
  for(const g in groups){const els=groups[g],hit=keys.length&&els.some(e=>keys.includes(e.dataset.k));
    els.forEach(e=>{const on=hit&&keys.includes(e.dataset.k);e.classList.toggle('on',!!on);e.classList.toggle('off',!!hit&&!on)})}
}
function setSec(sec){
  const s=sec==='0'?'1':sec;
  mfs.forEach(m=>m.classList.toggle('on',m.dataset.sec===s));
  idxA.forEach(a=>{const on=a.dataset.i===s;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')});
  const S=SEC[+s-1];$('#cur').textContent=S?S.title:'';
}
function tick(){
  const y=innerHeight*(innerWidth<700?.58:.46);
  let best=null,bd=1e9;
  for(const s of SENT){let d=1e9;
    for(const r of s.getClientRects()){const dd=y<r.top?r.top-y:y>r.bottom?y-r.bottom:0;if(dd<d)d=dd}
    if(d<bd){bd=d;best=s}}
  if(bd>innerHeight*.3)best=null;
  if(best!==cur){cur=best;SENT.forEach(s=>s.classList.toggle('act',s===best));
    if(best){applyAct((best.dataset.ks||'').split(' ').filter(Boolean));setSec(best.dataset.sec)}
    else applyAct([])}
  const h=document.documentElement.scrollHeight-innerHeight;
  $('#prog').style.transform=`scaleX(${h>0?clamp(scrollY/h,0,1):0})`;
}
let raf=0;
addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;tick()})},{passive:true});
setSec('1');
new IntersectionObserver(([e])=>{strip.classList.toggle('on',!e.isIntersecting&&e.boundingClientRect.bottom<0)}).observe($('#heroBox'));

/* ===== resize ===== */
let lastW=innerWidth,rt;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if(innerWidth===lastW)return;lastW=innerWidth;
  buildHero(false);
  REG.forEach(en=>{const fig=en.box.closest('.fig'),done=en.mini||(fig&&fig.dataset.done);
    render(en,!!done);
    if(done){const t=en.mini?en.box:fig;t.classList.add('nt','in');requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!en.mini)t.classList.remove('nt')}))}});
  cur=undefined;tick();
},150)});

/* ===== start ===== */
const fontsReady=Promise.race([
  Promise.all([
    document.fonts.load('800 60px "Pretendard Variable"',C.headline),
    document.fonts.load('600 12px "JetBrains Mono"','SMCI 0123456789'),
    document.fonts.load('700 12px "Pretendard Variable"',(HERO.items||[]).map(i=>i.nm||i.label||'').join('')||'가')
  ]),
  new Promise(r=>setTimeout(r,2500))
]);
fontsReady.then(()=>{
  buildHero(true);
  REG.forEach(en=>{render(en,RM);if(en.mini)en.box.classList.add('in','nt')});
  const figs=$$('.fig');
  if(RM)figs.forEach(reveal);
  else{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){reveal(e.target);io.unobserve(e.target)}}),{threshold:.3});figs.forEach(f=>io.observe(f))}
  const prov=$('#prov');
  if(RM)prov.classList.add('go');
  else new IntersectionObserver((es,o)=>{if(es[0].isIntersecting){prov.classList.add('go');o.disconnect()}},{threshold:.5}).observe(prov);
  tick();
});
})();
</script>
<script type="application/json" id="artifact-state">{"lane":"online","job_tags":["추이 설명","한눈 요약"],"domain_tags":["market","daily-digest"]}</script>
