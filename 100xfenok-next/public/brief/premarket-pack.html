<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{feno:headline}} · 100x {{feno:product}} {{feno:date}}</title>
<meta name="feno-pack-schema" content="daily-digest/v1"><meta name="feno-pack-required" content="date,headline,lead,sections">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">


<style>
:root{--ink:#111827;--i2:#566171;--ln:#d9dfe7;--border-soft:#edf0f4;--pg:#f5f6f8;--up:#c62832;--dn:#2451b2;--now:#1677ff;--font-body:"Pretendard Variable",Pretendard,Arial,sans-serif;--font-mono:ui-monospace,"SF Mono","Pretendard Variable",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--pg);color:var(--ink);font:16px/1.75 var(--font-body);word-break:keep-all}a{color:inherit}button,summary{font:inherit}:focus-visible{outline:3px solid #1677ff;outline-offset:3px}.wrap{max-width:1840px;margin:auto;padding:0 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:58px;border-bottom:1px solid var(--ln);font-size:14px}.top span{font-size:12px;color:var(--i2)}.top span,.mono,time,.cg,td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}.pn{background:#fff;border:1px solid var(--ln);border-radius:8px}.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(420px,1fr);gap:64px;align-items:start;padding:32px 0}.hero h1{max-width:850px;font-size:36px;line-height:1.3;letter-spacing:-.025em;margin:0 0 16px}.lead{max-width:920px;margin:0;color:var(--i2);line-height:1.85}.bars{padding:16px 20px}.bars h2,.fig h3{font-size:14px;margin:0 0 6px}.market-strip-note,.nt{font-size:12px;color:var(--i2)}.br{display:grid;grid-template-columns:116px 1fr 92px;gap:12px;align-items:center;min-height:29px;font-size:13px}.br .t{position:relative;height:12px;background:linear-gradient(90deg,transparent 49.8%,#9aa4b3 0 50.2%,transparent 0)}.br .t i{position:absolute;height:100%}.cg{font-size:12px;font-weight:600;white-space:nowrap}.br .cg{text-align:right}.up{color:var(--up)}.dn{color:var(--dn)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:stretch;margin-bottom:48px}.flow-column{background:white;border-top:3px solid #9aa5b4;padding:18px 16px;min-width:0}.flow-column.current{border-top-color:var(--ink)}.flow-head{min-height:104px}.step{display:block;font:600 12px var(--font-mono);color:var(--i2);margin-bottom:6px}.flow-head h2{font-size:20px;line-height:1.35;margin:0 0 6px;letter-spacing:-.02em}.flow-head p{font-size:12px;line-height:1.6;margin:0;color:var(--i2)}.flow-head .period{color:var(--ink);margin-bottom:3px}.quote-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;line-height:1.5}.quote-table col:nth-child(1){width:42px}.quote-table col:nth-child(2){width:auto}.quote-table col:nth-child(3){width:100px}.quote-table col:nth-child(4){width:74px}.quote-table th{font-size:12px;font-weight:400;color:var(--i2);padding:8px 0;text-align:left;border-bottom:1px solid var(--ln)}.quote-table th:nth-child(n+3){text-align:right}.quote-table td{padding:12px 0;border-bottom:1px solid var(--border-soft);vertical-align:middle}.quote-table td.name{padding:12px 6px;font-size:13px}.quote-table td.num{text-align:right;white-space:nowrap;font-size:14px;font-weight:600}.quote-table td.change{text-align:right;white-space:nowrap}.quote-table td small{font-size:12px;font-weight:400;color:var(--i2);margin-left:2px}.quote-table .featured td{background:#f4f6f9}.quote-table .featured td.name{font-weight:700}.quote-table .featured td.num{font-size:18px;letter-spacing:-.5px}.quote-table time{font-size:12px;color:var(--i2)}
.wti-mini{margin:20px 0 0}.wti-mini figcaption{font-size:12px;font-weight:600;margin-bottom:4px}.wti-mini figcaption span{float:right;color:var(--i2);font-weight:400}.wti-mini svg{display:block;width:100%;height:auto}.wti-mini .path{fill:none;stroke:var(--ink);stroke-width:1.8;vector-effect:non-scaling-stroke}.wti-mini text{font:11px var(--font-mono);fill:var(--i2)}.wti-mini .peak{fill:var(--ink);font-weight:600}.wti-mini .threshold{stroke:#9aa5b4;stroke-dasharray:4 4;stroke-width:1}.event-list{list-style:none;padding:0;margin:0}.event-item{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--border-soft);font-size:14px;line-height:1.55}.event-item time{font-size:14px;font-weight:600}.event-item time small{display:block;font:11px var(--font-body);font-weight:400;color:var(--i2)}.event-item p{margin:0}.event-item .next-label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:5px}.event-item.next{border-top:1px solid var(--ink)}.event-item .note{display:block;font-size:12px;color:var(--i2);margin-top:4px}.event-item a{text-decoration:none}
.sec{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:48px;padding:48px 0;border-top:1px solid var(--ln);align-items:start}.sec h2{font-size:26px;line-height:1.4;margin:0 0 16px}.sec .n{font:600 12px var(--font-mono);color:var(--i2);display:block;margin-bottom:8px}.sec p{margin:0 0 16px;color:var(--i2)}.fig{padding:20px;min-width:0}.fig .nt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.tg{font-size:12px}.ro{font-size:13px;min-height:24px}.ch{width:100%;height:auto;display:block;touch-action:pan-y}.ch .gl{stroke:var(--border-soft)}.ch .ax{font:12px var(--font-mono);fill:var(--i2)}.ch path{fill:none;stroke:var(--ink);stroke-width:1.6}.ch .cl{stroke:var(--now);stroke-width:1.5}.ch .cd{fill:#fff;stroke:var(--now);stroke-width:2}.tw{overflow:auto;max-height:260px;margin-top:12px}.fig table{border-collapse:collapse;width:100%;font:12px var(--font-mono)}.fig td,.fig th{padding:8px;text-align:left;border-bottom:1px solid var(--border-soft)}details{font-size:13px;margin-top:10px}summary{cursor:pointer;color:var(--i2)}footer{border-top:1px solid var(--ln);padding:32px 0 48px;font-size:13px;color:var(--i2)}footer ul{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0;list-style:none}section[id]{scroll-margin-top:24px}
@media(max-width:1399px){.wrap{padding:0 24px}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{gap:32px;grid-template-columns:minmax(0,1fr) minmax(340px,1fr)}.hero h1{font-size:30px}.flow-head{min-height:96px}.sec{grid-template-columns:1fr;gap:20px}}
@media(max-width:600px){.wrap{padding:0 16px}.top{flex-wrap:wrap;padding:10px 0;gap:4px}.hero{grid-template-columns:1fr;gap:24px;padding:24px 0}.hero h1{font-size:28px}.lead{font-size:15px}.bars{padding:14px}.br{grid-template-columns:100px 1fr 80px;gap:8px;font-size:12px}.flow{grid-template-columns:1fr;gap:20px;margin-bottom:32px}.flow-column{padding:16px 12px}.flow-head{min-height:0;padding-bottom:18px}.flow-head h2{font-size:21px}.quote-table td.name{font-size:12px}.quote-table col:nth-child(3){width:96px}.quote-table col:nth-child(4){width:70px}.quote-table .featured td.num{font-size:17px}.quote-table td.num{font-size:14px}.quote-table td small{font-size:12px}.quote-table time{font-size:12px}.sec{padding:32px 0}.fig{padding:12px}.ch .ax{font-size:24px}.event-item{grid-template-columns:82px 1fr;font-size:14px}}
@media print{section,figure,table,li,.card,.panel{break-inside:avoid}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body><div class="wrap"><header class="top"><b id="brand"></b><span id="edition"></span></header><main>
<section class="hero"><div><h1 id="headline"></h1><p class="lead" id="lead"></p></div><div class="pn bars"><h2 id="hero-title"></h2><div class="market-strip-note" id="hero-note"></div><div id="bars"></div></div></section>
<section class="flow" id="flow" aria-label="아시아 마감부터 오늘 밤까지 네 단계"></section>
<div id="sections"></div></main><footer><b>출처</b><ul id="sources"></ul><a id="follows"></a></footer></div>
<script type="application/json" id="feno-pack-content">{}</script>
<script>
const D=JSON.parse(document.getElementById('feno-pack-content').textContent);
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const cg=p=>Number.isFinite(p)?`<span class="cg ${p>0?'up':p<0?'dn':''}">${p>0?'▲ +':p<0?'▼ ':''}${p.toFixed(2)}%</span>`:'';
const minutes=t=>{const a=String(t).match(/(\d{2}):(\d{2})/);return a?+a[1]*60+ +a[2]:null};
const hh=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const now=minutes(D.published_kst)??1080;
const timeline=(D.sections||[]).find(s=>s.figure?.kind==='timeline');
const events=(timeline?.figure.items||D.tonight||[]).map(e=>{let m=minutes(e.time||e.time_kst);if(m===null)return null;if((e.date&&e.date>D.date)||m<now)m+=1440;return {...e,m};}).filter(Boolean).sort((a,b)=>a.m-b.m);
$('#brand').textContent=D.product||'100x 프리마켓 브리프';$('#edition').textContent=D.date+' · '+hh(now)+' KST';$('#headline').textContent=D.headline;$('#lead').textContent=D.lead;
const market=D.market_strip||[];
// Regular exchange closing times are defaults; the caller can supply actual time_kst/as_of_kst.
const asia={'코스피':'15:30','닛케이225':'15:30','대만 가권':'14:30','항셍':'17:00','상하이종합':'16:00'};
const group=r=>r.lane||(asia[r.label]?'a':/유로|DAX|FTSE|CAC/.test(r.label)?'e':/선물/.test(r.label)&&!/WTI|금|은|브렌트/.test(r.label)?'f':'m');
const observed=r=>minutes(r.time_kst||r.as_of_kst)??minutes(asia[r.label])??now;
const laneWTI=(D.sections||[]).map(s=>s.figure).find(f=>/WTI/.test(f?.title)&&f.points?.length);
function sparkline(){const pts=(laneWTI?.points||[]).filter(p=>minutes(p[0])!==null&&Number.isFinite(+p[1]));if(!pts.length)return '';const vals=pts.map(p=>+p[1]),lo=Math.min(100,...vals),hi=Math.max(100,...vals),span=hi-lo||1,x0=minutes(pts[0][0]),x1=minutes(pts.at(-1)[0]),X=t=>12+(t-x0)/(x1-x0||1)*296,Y=v=>34+(hi-v)/span*70;let d='';pts.forEach((p,i)=>{d+=(i===0||minutes(p[0])-minutes(pts[i-1][0])>10?'M':'L')+X(minutes(p[0])).toFixed(2)+' '+Y(+p[1]).toFixed(2)});const peak=pts[vals.indexOf(Math.max(...vals))];return `<figure class="wti-mini"><figcaption>WTI 5분 경로 <span>달러 · KST</span></figcaption><svg viewBox="0 0 320 136" role="img" aria-label="WTI 5분 경로, 최고 ${nf(+peak[1])}달러 ${esc(peak[0])}"><line class="threshold" x1="12" x2="308" y1="${Y(100)}" y2="${Y(100)}"/><text x="12" y="${Y(100)-5}">100</text><text class="peak" x="308" y="16" text-anchor="end">최고 ${nf(+peak[1])} · ${esc(peak[0])}</text><path class="path" d="${d}"/><text x="12" y="130">${esc(pts[0][0])}</text><text x="308" y="130" text-anchor="end">${esc(pts.at(-1)[0])}</text></svg></figure>`}
const quoteTable=rows=>`<table class="quote-table"><colgroup><col><col><col><col></colgroup><thead><tr><th>시각</th><th>항목</th><th>시세</th><th>등락</th></tr></thead><tbody>${rows.map(r=>`<tr class="${/나스닥.*100|WTI/.test(r.label)?'featured':''}"><td><time>${hh(observed(r))}</time></td><td class="name">${esc(r.label)}</td><td class="num">${nf(r.value)}<small>${esc(r.unit)}</small></td><td class="change">${cg(r.change_pct)}</td></tr>`).join('')}</tbody></table>`;
const nextEvent=events.find(e=>e.m>=now);
const eventHTML=()=>`<ol class="event-list">${events.map(e=>`<li class="event-item ${e===nextEvent?'next':''}"><time>${e.m>=1440?'<small>다음 날</small>':''}${hh(e.m)}</time><p>${e===nextEvent?'<span class="next-label">다음 일정</span>':''}<a href="#night">${esc(e.label||e.what)}</a>${e.note?`<small class="note">${esc(e.note)}</small>`:''}</p></li>`).join('')}</ol>`;
const columns=[['아시아 마감','14:30–17:00 KST','직전 종가 대비',market.filter(r=>group(r)==='a').sort((a,b)=>observed(a)-observed(b))],['유럽 첫 1시간',hh(now)+' KST 관측','직전 종가 대비',market.filter(r=>group(r)==='e')],['18:00 지금','미국 선물·원자재','05:00 KST 대비',market.filter(r=>['f','m'].includes(group(r)))],['오늘 밤',events.length?hh(events[0].m)+'–'+(events.at(-1).m>=1440?'다음 날 ':'')+hh(events.at(-1).m)+' KST':'KST','예정 일정',null]];
$('#flow').innerHTML=columns.map(([title,period,basis,rows],i)=>`<article class="flow-column ${i===2?'current':''}"><header class="flow-head"><span class="step">${String(i+1).padStart(2,'0')} / 04</span><h2>${i===2?hh(now)+' 지금':title}</h2><p class="period">${period}</p><p>${basis}</p></header>${rows?quoteTable(rows)+(i===2?sparkline():''):eventHTML()}</article>`).join('');
const hero=D.hero||{};$('#hero-title').textContent=hero.title||'';$('#hero-note').textContent=hero.note||hero.basis||'';
const items=hero.items||[];const span=Math.max(1,...items.map(r=>Math.abs(r.value)));
$('#bars').innerHTML=items.map(r=>`<div class="br"><span>${esc(r.label)}</span><div class="t"><i style="left:${r.value>=0?50:50-Math.abs(r.value)/span*50}%;width:${Math.abs(r.value)/span*50}%;background:var(${r.value>=0?'--up':'--dn'})"></i></div>${cg(r.value)}</div>`).join('');
$('#sections').innerHTML=(D.sections||[]).map((s,i)=>`<section class="sec ${s.figure?.kind==='timeline'?'last':''}" ${s.figure?.kind==='timeline'?'id="night"':''}><div><span class="n">${String(i+1).padStart(2,'0')}</span><h2>${esc(s.title)}</h2>${(s.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div><div class="pn fig" id="fig-${i}"></div></section>`).join('');
const tbl=(h,r)=>`<table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${r.map(a=>`<tr>${a.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function chart(el,xs,ys,lb,o){
 const W=640,H=250,L=86,R=96,T=16,Bm=26,mn=Math.min(...ys),mx=Math.max(...ys),pd=(mx-mn)*.12,lo=mn-pd,hi=mx+pd,x0=xs[0],x1=xs[xs.length-1];
 const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-Bm),n=ys.length;
 let g='',d='';
 [mn,(mn+mx)/2,mx].forEach(v=>g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(o.dg)}</text>`);
 o.xt.forEach(([x,t],k)=>g+=`<text class="ax" x="${X(x)}" y="${H-6}" text-anchor="${k==0?'start':x==x1?'end':'middle'}">${esc(t)}</text>`);
 xs.forEach((x,i)=>d+=(i==0||x-xs[i-1]>o.brk?'M':'L')+X(x).toFixed(1)+' '+Y(ys[i]).toFixed(1));
 const pi=ys.indexOf(mx);
 el.innerHTML=`<h3>${o.title}</h3><div class="nt"><span class="tg c">${o.basis}</span><span>${o.prov}</span></div><div class="ro" aria-live="polite"></div><svg class="ch" viewBox="0 0 ${W} ${H}" tabindex="0" role="slider" aria-label="${o.title}, 좌우 화살표로 이동" aria-valuemin="0" aria-valuemax="${n-1}">${g}<path d="${d}"/>${o.peak?`<circle cx="${X(xs[pi])}" cy="${Y(mx)}" r="3" fill="var(--ink)"/><text class="ax" x="${X(xs[pi])}" y="${Y(mx)-8}" text-anchor="middle" style="font-weight:700;fill:var(--ink)">최고 ${mx.toFixed(2)} · ${esc(lb[pi])}</text>`:''}<text class="ax" x="${W-R+6}" y="${Y(ys[n-1])+4}" style="font-weight:700;fill:var(--ink)">${ys[n-1].toFixed(2)}</text><line class="cl" y1="${T}" y2="${H-Bm}"/><circle class="cd" r="4"/></svg><details><summary>데이터 표</summary><div class="tw">${tbl([o.xh,o.title+' ('+o.unit+')'],lb.map((t,i)=>[t,ys[i].toFixed(o.dg)]))}</div></details>`;
 const s=$('svg',el),cl=$('.cl',s),cd=$('.cd',s),ro=$('.ro',el);let ix=n-1;
 const up=i=>{ix=Math.max(0,Math.min(n-1,i));cl.setAttribute('x1',X(xs[ix]));cl.setAttribute('x2',X(xs[ix]));cd.setAttribute('cx',X(xs[ix]));cd.setAttribute('cy',Y(ys[ix]));s.setAttribute('aria-valuenow',ix);s.setAttribute('aria-valuetext',o.ro(ix).replace(/<[^>]+>/g,''));ro.innerHTML=o.ro(ix)};
 const pt=e=>{const r=s.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;let b=0;xs.forEach((v,i)=>{if(Math.abs(X(v)-x)<Math.abs(X(xs[b])-x))b=i});up(b)};
 s.addEventListener('pointermove',pt);s.addEventListener('pointerdown',pt);
 s.addEventListener('keydown',e=>{const k={ArrowLeft:-1,ArrowRight:1,PageDown:-12,PageUp:12,Home:-n,End:n}[e.key];if(k){e.preventDefault();up(ix+k)}});
 up(n-1)}

function renderFigure(f,el){if(!f){el.hidden=true;return}if(f.kind==='timeline'){el.innerHTML=`<h3>${esc(f.title||'오늘 밤 일정')}</h3>${eventHTML()}`;return}
if(f.kind==='bars'){el.innerHTML=`<h3>${esc(f.title)}</h3><p class="market-strip-note">${esc(f.note||f.basis||'')}</p>`+tbl(['항목',f.unit||'값'],(f.items||[]).map(x=>[x.label,nf(x.value)]));return}
const series=f.series?.length?f.series:[f];el.innerHTML='';series.forEach(s=>{const pts=s.points||[];if(!pts.length)return;const box=document.createElement('div');el.appendChild(box);const lb=pts.map(p=>String(p[0])),isTime=/^\d{2}:\d{2}$/.test(lb[0]),xs=lb.map((v,i)=>isTime?minutes(v):Number.isFinite(Date.parse(v))?Date.parse(v)/864e5:i),ys=pts.map(p=>+p[1]);const ix=[0,Math.floor((pts.length-1)/2),pts.length-1];chart(box,xs,ys,lb,{title:esc(s.label||s.title||f.title),unit:esc(s.unit||f.unit||''),prov:esc(s.provider||f.provider||''),basis:esc(f.basis||f.note||''),xh:isTime?'KST':'날짜',dg:2,brk:isTime?10:Infinity,xt:ix.map(i=>[xs[i],lb[i]]),ro:i=>`<b>${esc(lb[i])}</b> · <b>${nf(ys[i])}</b> ${esc(s.unit||f.unit||'')}`})})}
(D.sections||[]).forEach((s,i)=>renderFigure(s.figure,$('#fig-'+i)));
if(!items.length&&hero.points)renderFigure(hero,$('#bars'));
if(D.movers?.length){const host=$('#fig-1')||$('#bars');const box=document.createElement('div');box.className='tw';box.innerHTML=tbl(['종목','종가 (달러)','등락'],D.movers.map(m=>[m.ticker+' '+(m.name||''),nf(m.close??m.stats?.close),String(m.chg_pct??m.stats?.chg_pct??'—')+'%']));host.appendChild(box);}
const sources=Array.isArray(D.sources)?D.sources:D.sources?.upstream_attribution||[];$('#sources').innerHTML=sources.map(x=>`<li>${esc(typeof x==='string'?x:x.name||x.label||'')}</li>`).join('');
if(D.follows){$('#follows').textContent='← '+D.follows.product+' · '+D.follows.headline;const u=D.follows.url||'';if(/^https?:\/\//.test(u))$('#follows').href=u;}
</script></body></html>
