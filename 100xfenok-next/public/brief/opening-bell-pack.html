<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{feno:headline}} · 100x 오프닝 벨 {{feno:date}}</title>
<meta name="feno-pack-schema" content="daily-digest/v1">
<meta name="feno-pack-required" content="date,market_date,headline,lead,hero,sections">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
/* tokens.css (openai) */
:root{--bg:#fff;--surface:#f5f5f5;--surface-warm:#fafafa;--fg:#0d0d0d;--fg-2:#1a1a1a;--muted:#6e6e6e;--meta:#9b9b9b;--border:#e5e5e5;--border-soft:#ededed;--accent:#10a37f;--accent-on:#fff;--accent-hover:#0a7a5e;--success:#10a37f;--warn:#f5a623;--danger:#ef4146;
--font-display:"Signifier","Source Serif Pro",Georgia,ui-serif,serif;--font-body:"Söhne","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"Söhne Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
--text-xs:12px;--text-sm:13px;--text-base:16px;--text-lg:18px;--text-xl:20px;--text-2xl:28px;--text-3xl:40px;--text-4xl:56px;--leading-body:1.65;--leading-tight:1.08;--tracking-display:-.02em;
--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;--radius-sm:12px;--radius-md:16px;--radius-pill:9999px;--focus-ring:0 0 0 3px rgba(16,163,127,.12);--motion-fast:150ms;--motion-base:220ms;--ease-standard:cubic-bezier(.16,1,.3,1);--container-max:1200px}
</style>
<style>
/* ko.css (openai) */
:root{--font-display:"Signifier","Source Serif Pro",Georgia,"Nanum Myeongjo",ui-serif,serif;--font-body:"Söhne","Inter","Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"Söhne Mono","Pretendard Variable",Pretendard,ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
:root:lang(ko),[lang="ko"]{word-break:keep-all;overflow-wrap:anywhere}
</style>
<style>
:root{
  --ink:#0d1a1a;--ink2:#38494a;--mut:#60706f;
  --obs:#0b6b63;--obs-soft:#e3f1ef;
  --con:#7d68c4;--con-soft:#f1eefb;
  --pen:#6d7c7b;
  --mark:#c0e7df;
  --serif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --sans:"Pretendard Variable",Pretendard,Inter,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --hatch:repeating-linear-gradient(135deg,var(--con) 0 1.5px,transparent 1.5px 5px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.65 var(--sans);font-variant-numeric:tabular-nums;padding-bottom:84px;text-wrap:pretty}
p{margin:0}
a{color:var(--obs)}
:focus-visible{outline:2px solid var(--obs);outline-offset:3px;border-radius:4px}
.wrap{max-width:1360px;margin:0 auto;padding:0 48px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.01em}
mark{background:linear-gradient(transparent 52%,var(--mark) 52% 92%,transparent 92%);color:inherit;padding:0 .08em}

/* top bar */
.top{border-bottom:1px solid var(--border)}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding-top:14px;padding-bottom:14px}
.brand{font:700 15px var(--sans);letter-spacing:-.01em}
.brand b{color:var(--obs)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 11.5px var(--mono);border:1px solid var(--ink);padding:2px 9px;border-radius:99px}
.chip.s{border-color:var(--border);color:var(--mut)}
.top .tb{margin-left:auto;color:var(--mut);font:400 12px var(--mono)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:96px;padding:72px 0 88px}
.eyebrow{font:500 12px var(--mono);color:var(--obs);letter-spacing:.04em;margin-bottom:20px}
h1{font:700 clamp(34px,3.5vw,58px)/1.28 var(--serif);letter-spacing:-.02em;margin:0 0 36px}
.lead{font:400 19px/1.85 var(--serif);color:var(--ink)}
.follow{margin-top:36px;padding-top:16px;border-top:1px solid var(--border);font-size:14px;color:var(--mut)}
.follow a{font-weight:600}

/* lanes */
.lanes{position:relative}
.lh{display:grid;grid-template-columns:1fr 56px 1fr;margin-bottom:22px}
.lh>div{font:600 14px var(--sans);padding-bottom:10px;border-bottom:2px solid var(--ink)}
.lh small{display:block;font:400 11.5px var(--mono);color:var(--mut);margin-top:2px}
.lh .c{border-bottom:2px dotted transparent}
.lh .lc{border-bottom-color:var(--con)}
.lh .lo{border-bottom-color:var(--obs)}
.pairs{list-style:none;margin:0;padding:0;display:grid;gap:26px}
.pair{position:relative;display:grid;grid-template-columns:1fr 56px 1fr;grid-template-areas:"a . b"}
.pair>.cl{grid-area:a}.pair>.ob{grid-area:b}
.cell{position:relative;padding:16px 18px 16px 22px;background:#fff;transition:background var(--motion-base)}
.cell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.cl::before{background:var(--hatch);opacity:.85}
.cl{background:var(--con-soft)}
.ob::before{background:var(--obs);width:4px}
.ob{background:var(--obs-soft)}
.ob.pend{background:#fff;border:1.5px dashed var(--pen);border-left:0}
.ob.pend::before{background:none;border-left:2px dashed var(--pen);width:0}
.tg{font:500 11.5px var(--mono);color:var(--mut);margin-bottom:6px;letter-spacing:.01em}
.cl .tg{color:#5c48a8}.ob .tg{color:var(--obs)}
.cell p.t{font:400 16px/1.7 var(--serif)}
.big{font:600 24px/1.2 var(--sans);letter-spacing:-.01em;margin:10px 0 2px}
.big small{font:400 12px var(--mono);color:var(--mut);letter-spacing:0;margin-left:6px}
.src{margin-top:10px;font:400 11.5px var(--mono);color:var(--mut)}
.stamp{display:inline-block;margin-top:8px;border:1.5px dashed var(--pen);padding:5px 10px;font:500 12px var(--mono);color:#3f4f4e;transform:rotate(-1.2deg);background:#fff}
.pair:hover .cell,.pair:focus-within .cell{background-image:none}
.pair.on .cl{background:#e9e3fa}.pair.on .ob{background:#cfe8e4}.pair.on .ob.pend{background:#f7f9f9}
.cn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.cn path{fill:none;stroke:var(--obs);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s var(--ease-standard),stroke-width .15s,stroke .15s;vector-effect:non-scaling-stroke}
.cn.in path{stroke-dashoffset:0}
.cn.pn path{stroke:var(--pen);stroke-dasharray:.015 .02;stroke-dashoffset:0;opacity:0;transition:opacity .8s}
.cn.pn.in path{opacity:1}
.cn circle{fill:var(--obs)}.cn.pn circle{fill:var(--pen)}
.pair.on .cn path{stroke:var(--ink);stroke-width:3.5}
.pair.on .cn circle{fill:var(--ink)}

/* snippets */
.snip{margin-top:12px}
.rail{position:relative;height:30px}
.rail .ax{position:absolute;left:0;right:0;top:14px;height:1px;background:var(--ink2);opacity:.35}
.rail .lnk{position:absolute;top:12px;height:5px;background:var(--obs);opacity:.35;border-radius:3px}
.rail .z{position:absolute;top:6px;height:17px;border-left:1px solid var(--ink)}
.rail .dt{position:absolute;top:8px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--obs)}
.rail .dt.q{border-radius:2px;transform:rotate(45deg) scale(.85);background:var(--ink)}
.rail .dt.h{background:#fff;border:2px dashed var(--pen)}
.rail .tk{position:absolute;top:2px;height:26px;width:5px;margin-left:-2.5px;background:var(--hatch)}
.rl{display:flex;flex-wrap:wrap;gap:2px 14px;font:400 11.5px var(--mono);color:var(--ink2);margin-top:4px}
.rl i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--obs);margin-right:5px;vertical-align:-1px}
.rl i.q{border-radius:2px;background:var(--ink);transform:rotate(45deg) scale(.8)}
.rl i.h{background:#fff;border:1.5px dashed var(--pen)}
.rl i.k{background:var(--hatch);border-radius:0;width:5px;height:11px}

svg.ln{display:block;width:100%;height:auto;overflow:visible}
svg.ln polyline{fill:none;stroke:var(--obs);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
svg.ln .base{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.35}
svg.ln .cv{stroke:var(--ink);stroke-width:1}
svg.ln circle{fill:var(--obs);stroke:#fff;stroke-width:2}

/* sections */
section.part{padding:88px 0;border-top:1px solid var(--border)}
.ph{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:96px;margin-bottom:40px}
.ph .n{font:500 12px var(--mono);color:var(--obs);letter-spacing:.04em;margin-bottom:10px}
h2{font:700 clamp(26px,2.4vw,38px)/1.32 var(--serif);letter-spacing:-.015em;margin:0}
.sub{font:400 17px/1.8 var(--serif);color:var(--ink2);align-self:end}

.gx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:96px;align-items:start}
.card{background:#fff}
.cap{font:600 14px var(--sans);margin-bottom:2px}
.cap small{font:400 12px var(--mono);color:var(--mut);margin-left:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font:400 12px var(--mono);color:var(--ink2);margin:10px 0 18px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--obs);margin-right:6px;vertical-align:-1px}
.legend i.q{border-radius:2px;background:var(--ink);transform:rotate(45deg) scale(.8)}
.legend i.h{background:#fff;border:1.5px dashed var(--pen)}
.grp{font:500 11.5px var(--mono);color:var(--mut);margin:22px 0 6px;letter-spacing:.02em}
.row{padding:10px 0 12px;border-top:1px solid var(--border);display:grid;grid-template-columns:150px 1fr;gap:4px 20px;transition:background .2s}
.row.on,.mini.on{background:linear-gradient(90deg,rgba(11,107,99,.14),transparent)}
.row .nm{font:600 14px/1.4 var(--sans)}
.row .rl{grid-column:2;margin-top:2px}
.axl{display:grid;grid-template-columns:150px 1fr;gap:20px;font:400 11px var(--mono);color:var(--mut);margin-top:6px}
.axl div{position:relative;height:14px}.axl span{position:absolute;transform:translateX(-50%)}
.ann{position:relative;margin-top:26px;padding:14px 18px;border-left:3px solid var(--ink);font:400 16px/1.8 var(--serif)}
.note{font:400 12px/1.6 var(--mono);color:var(--mut);margin-top:10px}

.big-ln{position:relative}
.lb{position:absolute;font:500 11.5px var(--mono);white-space:nowrap;transform:translate(-50%,-135%);background:#fff;padding:0 4px;border:1px solid var(--border);border-radius:4px}
.lb.e{transform:translate(-100%,-50%);margin-left:-10px}
.rd{font:600 22px/1.2 var(--sans);margin:10px 0 6px}
.rd small{font:400 12px var(--mono);color:var(--mut);margin-left:8px}
details{margin-top:12px;font-size:13px}
summary{cursor:pointer;font:500 12px var(--mono);color:var(--obs)}
table{border-collapse:collapse;width:100%;font:400 13px var(--sans)}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
th{font:500 11.5px var(--mono);color:var(--mut)}
caption{text-align:left;font:400 12px var(--mono);color:var(--mut);padding-bottom:8px}

/* articles */
.art{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:96px;padding:48px 0;border-top:1px solid var(--border)}
.art:first-of-type{border-top:0;padding-top:0}
.art h3{font:700 24px/1.4 var(--serif);margin:0 0 20px;letter-spacing:-.01em}
.art .body p{font:400 18px/1.85 var(--serif);margin-bottom:18px}
.art .num{font:500 12px var(--mono);color:var(--obs);margin-bottom:8px}
.fig{align-self:start;position:sticky;top:24px;padding:18px 0 0}
.bars .b{display:grid;grid-template-columns:104px 1fr 62px;gap:12px;align-items:center;padding:7px 0}
.bars .tr{position:relative;height:18px;background:var(--surface-warm)}
.bars .fl{position:absolute;left:0;top:0;bottom:0;background:var(--obs)}
.bars .tk{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;background:var(--hatch)}
.bars .v{font:600 14px var(--sans);text-align:right}
.bars .l{font:500 13px var(--sans)}

.open{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:8px}
.slot{border:1.5px dashed var(--pen);padding:16px 18px;background:#fff}
.slot .tg{color:var(--pen)}
.slot p.t{font:400 15.5px/1.7 var(--serif)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:96px;align-items:start}
.strip td.n{font-weight:600}
.pos{color:var(--obs)}.neg{color:#a23a3a}
.srcs{columns:2;gap:32px;padding:0;margin:0;list-style:none;font-size:14.5px;color:var(--ink2)}
.srcs li{padding:5px 0;border-bottom:1px solid var(--border);break-inside:avoid}
.foot{padding:48px 0 32px;border-top:1px solid var(--border);font:400 13px/1.8 var(--sans);color:var(--mut)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flags span{font:400 11.5px var(--mono);border:1px dashed var(--pen);padding:2px 8px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--ink);z-index:9;backdrop-filter:blur(6px)}
.dock .wrap{display:flex;align-items:center;gap:20px;padding-top:12px;padding-bottom:12px}
.dock label{font:600 13px var(--sans);white-space:nowrap}
.dock label small{display:block;font:400 11px var(--mono);color:var(--mut)}
.dock input{flex:1;accent-color:var(--obs);min-width:0;height:28px}
.dock output{font:600 18px var(--mono);min-width:64px;text-align:right}
.ticks{display:flex;justify-content:space-between;font:400 10.5px var(--mono);color:var(--mut);padding:0 8px}
.dock .mid{flex:1;min-width:0}

@media (max-width:1100px){
  .wrap{padding:0 24px}
  .hero,.ph,.gx,.art,.two{grid-template-columns:1fr;gap:40px}
  .fig{position:static}
  .hero{padding:48px 0 56px}
  section.part{padding:56px 0}
  .open{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{padding-bottom:96px}
  .lead{font-size:17.5px}
  .lh{display:none}
  .pair{grid-template-columns:1fr;grid-template-areas:"a" "b";row-gap:30px;padding-left:0}
  .pair>.ob{margin-left:26px}
  .pair>.cl::after,.lane-tag{display:none}
  .row{grid-template-columns:1fr}.row .rl{grid-column:1}
  .axl{grid-template-columns:1fr}.axl>span{display:none}
  .srcs{columns:1}
  .top .tb{margin-left:0}
  .dock .wrap{gap:10px}.dock label small{display:none}
  .bars .b{grid-template-columns:84px 1fr 54px;gap:8px}
  .art .body p{font-size:17px}
  .m-lane{display:block}
}
.m-lane{display:none;font:600 12px var(--mono);margin:0 0 8px}
@media (max-width:640px){.pair .tg::before{content:attr(data-l) " · ";}}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .cn path{stroke-dashoffset:0!important}.cn.pn path{opacity:1!important}
}
</style>
<style>
.embed .top{display:none}.cell,.slot,.art>*,.lanes{min-width:0;overflow-wrap:anywhere}.open{grid-template-columns:repeat(3,minmax(0,1fr))}.slot .stamp{max-width:100%}.chart{margin:18px 0}.chart svg{display:block;width:100%;height:auto;overflow:visible}.chart .legend{margin:12px 0}.chart .legend span{display:flex;align-items:center;gap:6px}.chart .legend i{width:24px;height:3px;border-radius:0}.readout{display:flex;flex-wrap:wrap;gap:8px 20px;font:12px var(--mono);min-height:36px}.table-wrap{overflow:auto}.dock input{width:100%}.cell .t{margin-bottom:8px}.slot{height:auto;overflow:visible}.pairs .pair{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr)}.pairs .pair:after{content:'→';position:absolute;left:50%;top:36px;transform:translateX(-50%);color:var(--obs)}
@media(max-width:1100px){.open{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.pairs .pair{grid-template-columns:minmax(0,1fr)}.pairs .pair:after{content:'↓';left:12px;top:50%}.wrap{padding-inline:24px}.pair>.ob{margin-left:20px}.dock .wrap{padding-inline:16px}.dock output{font-size:14px;min-width:50px}.dock label{font-size:11px}.ticks{font-size:9px}}
</style></head><body>
<header class="top"><div class="wrap"><span class="brand"><b>100x</b> 오프닝 벨</span><span class="tb" id="dateline"></span></div></header>
<main><div class="wrap"><section class="hero"><div><p class="eyebrow" id="eyebrow"></p><h1 id="headline"></h1><p class="lead" id="lead"></p><p class="follow" id="follow"></p></div><div class="lanes"><div class="lh"><div class="lc">프리마켓 판단<small>앞선 판 · 빗금</small></div><div class="c"></div><div class="lo">개장 후 판정<small>이번 판 · 실선</small></div></div><ol class="pairs" id="pairs"></ol><div class="chart" id="hero-chart"></div></div></section></div>
<section class="part"><div class="wrap"><div class="ph"><div><p class="n">02 · 본문과 관측</p><h2>첫 30분이 보여준 것</h2></div><p class="sub">프리마켓의 조건과 개장 뒤 관측을 함께 읽습니다. 시각 커서로 같은 시점의 값을 비교할 수 있습니다.</p></div><div id="arts"></div><div id="open-area"><h3 class="grp">열린 칸 · 아직 확인할 것</h3><div class="open" id="open"></div></div><div class="two" style="margin-top:64px"><div class="strip"><p class="cap" id="market-title"></p><div class="table-wrap"><table><caption id="market-basis"></caption><thead><tr><th>종목</th><th>값</th><th>등락</th></tr></thead><tbody id="market"></tbody></table></div></div><div><p class="cap">출처</p><ul class="srcs" id="sources"></ul></div></div></div></section></main>
<footer class="foot"><div class="wrap">100x 오프닝 벨 · 미국 정규장 개장 30분</div></footer>
<div class="dock" id="dock"><div class="wrap"><label for="cur">시각 커서<small>미 동부시간</small></label><div class="mid"><input id="cur" type="range" min="0" max="6" step="1" value="6" aria-label="미 동부시간 시각 커서"><div class="ticks" id="ticks"></div></div><output id="curo" for="cur"></output></div></div>
<script type="application/json" id="feno-pack-content">{}</script>
<script>
(()=>{
const C=JSON.parse(document.getElementById('feno-pack-content').textContent);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colors=['#0b6b63','#7d68c4','#b65333','#246bb0','#987014'];
const charts=[],times=[];
const sign=v=>(v>0?'+':'')+v.toLocaleString('ko-KR',{maximumFractionDigits:3});
$('#dateline').textContent=C.date+' · '+C.published_kst+' KST';$('#eyebrow').textContent='오프닝 벨 · '+C.date+' · 미국 개장+30분';$('#headline').textContent=C.headline;$('#lead').textContent=C.lead;
const F=C.follows;
if(F){const a=document.createElement('a');a.href=/^https?:\/\//.test(F.url)?F.url:'#';a.textContent=F.product+' · '+F.headline;$('#follow').append('앞선 판: ',a);}
$('#pairs').innerHTML=`<li class="pair"><article class="cell cl"><p class="tg">프리마켓 · 앞선 판</p><p class="t">${esc(F?.headline||'앞선 판 없음')}</p></article><article class="cell ob"><p class="tg">개장 후 · 이번 판</p><p class="t">${esc(C.headline)}</p></article></li>`;
function chart(f,el){
 if(!f)return;
 const cap=document.createElement('p');cap.className='cap';cap.textContent=f.title;el.append(cap);
 if(f.kind==='line'){
 const ss=f.series?.length?f.series:[{label:f.title,points:f.points,unit:f.unit}];
 const vals=ss.flatMap(s=>s.points.map(p=>p[1]));let lo=Math.min(...vals),hi=Math.max(...vals);const pad=Math.max((hi-lo)*.15,.02);lo-=pad;hi+=pad;
 const W=560,H=250,L=48,R=18,T=18,B=30;
 const labels=[...new Set(ss.flatMap(s=>s.points.map(p=>p[0])))].sort();labels.forEach(t=>{if(/^\d\d:\d\d$/.test(t)&&!times.includes(t))times.push(t)});
 const X=t=>L+labels.indexOf(t)*(W-L-R)/Math.max(1,labels.length-1),Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
 let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(f.title)}"><title>${esc(f.title+' · '+f.unit)}</title>`;
 for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3,y=Y(v);svg+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e5e5e5"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#60706f">${v.toFixed(2)}</text>`;}
 ss.forEach((s,i)=>{svg+=`<polyline fill="none" stroke="${colors[i%colors.length]}" stroke-width="2.5" ${i?'stroke-dasharray="'+(i===1?'7 3':'2 3')+'"':''} points="${s.points.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`});
 labels.forEach((t,i)=>{if(i===0||i===labels.length-1||i===Math.floor(labels.length/2))svg+=`<text x="${X(t)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#60706f">${esc(t)}</text>`});
 svg+='<line class="cursor" y1="18" y2="220" stroke="#0d1a1a" stroke-dasharray="3 3"/></svg>';
 const box=document.createElement('div');box.innerHTML=svg;el.append(box);
 const legend=document.createElement('div');legend.className='legend';legend.innerHTML=ss.map((s,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${esc(s.label)}</span>`).join('');el.append(legend);
 const rd=document.createElement('div');rd.className='readout';el.append(rd);charts.push({el:box,rd,ss,X,labels,unit:f.unit});
 const details=document.createElement('details');details.innerHTML='<summary>표로 보기</summary><div class="table-wrap"><table><thead><tr><th>시각</th>'+ss.map(s=>'<th>'+esc(s.label)+'</th>').join('')+'</tr></thead><tbody>'+labels.map(t=>'<tr><th>'+esc(t)+'</th>'+ss.map(s=>'<td>'+esc(s.points.find(p=>p[0]===t)?.[1]??'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';el.append(details);
 }else if(f.kind==='bars'){
 const max=Math.max(...f.items.map(x=>Math.abs(x.value)),.01);const bars=document.createElement('div');bars.className='bars';bars.innerHTML=f.items.map(it=>`<div class="b"><span class="l">${esc(it.label)}</span><div class="tr"><span class="fl" style="width:${Math.abs(it.value)/max*100}%;background:${it.value<0?'#a23a3a':'#0b6b63'}"></span></div><span class="v">${esc(it.value)}</span></div>`).join('');el.append(bars);
 }else{const ul=document.createElement('ul');ul.innerHTML=(f.items||[]).map(it=>'<li>'+esc([it.time||it.date,it.label].filter(Boolean).join(' · '))+'</li>').join('');el.append(ul);}
 const note=document.createElement('p');note.className='note';note.textContent=[f.unit,f.provider,f.basis,f.note].filter(Boolean).join(' · ');el.append(note);
}
chart(C.hero,$('#hero-chart'));
C.sections.forEach((s,i)=>{const a=document.createElement('article');a.className='art';a.innerHTML=`<div class="body"><p class="num">${String(i+1).padStart(2,'0')}</p><h3>${esc(s.title)}</h3>${s.paragraphs.map(p=>'<p>'+esc(p)+'</p>').join('')}</div><div class="fig chart"></div>`;$('#arts').append(a);chart(s.figure,a.querySelector('.fig'));});
const pending=[...new Set([C.lead,...C.sections.flatMap(s=>s.paragraphs)].flatMap(p=>p.split(/(?<=다\.)\s+/)).map(s=>s.trim()).filter(s=>/아직|자료 마감|마감 시각에|이후 일정:/.test(s)))];
$('#open').innerHTML=pending.map(p=>'<article class="slot"><p class="tg">마감 뒤 확인</p><p class="t">'+esc(p)+'</p></article>').join('');if(!pending.length)$('#open-area').hidden=true;
$('#market-title').textContent=C.market_title||'시세';$('#market-basis').textContent=C.market_strip_title||'';
$('#market').innerHTML=(C.market_strip||[]).map(m=>`<tr><td>${esc(m.label)}</td><td>${esc(m.value?.toLocaleString('ko-KR',{maximumFractionDigits:3}))} ${esc(m.unit)}</td><td class="${m.change_pct<0?'neg':'pos'}">${m.change_pct==null?'—':sign(m.change_pct)+'%'}</td></tr>`).join('');$('#sources').innerHTML=(C.sources||[]).map(s=>'<li>'+esc(s)+'</li>').join('');
times.sort();if(!times.length){$('#dock').hidden=true;document.body.style.paddingBottom='0'}else{
const cur=$('#cur');cur.max=times.length-1;cur.value=times.length-1;$('#ticks').innerHTML=times.map(t=>'<span>'+esc(t)+'</span>').join('');
const update=()=>{const t=times[+cur.value];$('#curo').textContent=t;charts.forEach(c=>{const line=c.el.querySelector('.cursor');const x=c.X(t);line.setAttribute('x1',x);line.setAttribute('x2',x);line.style.display=c.labels.includes(t)?'':'none';c.rd.innerHTML=c.ss.map((s,i)=>{const p=s.points.find(p=>p[0]===t);return '<span style="color:'+colors[i%colors.length]+'">'+esc(s.label)+' <b>'+esc(p?p[1]:'—')+'</b></span>'}).join('')})};cur.addEventListener('input',update);update();}
})();
</script></body></html>
